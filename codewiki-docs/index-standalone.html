)/Journal_Module.md": "# Journal Module\n\nThe Journal Module (`crates/journal`, crate `mnemora-journal`) is the backend for the diary feature. A **Page** is one calendar date. An **Entry** is one untitled piece of Markdown writing on a Page. The crate owns the rules, SQLite storage, full-text search, sync merge rules and read-only AI tools for Entries. The Tauri app crate only exposes these as commands; see [Journal_Domain_Service](../Tauri_Host_and_Command_Layer/Journal_Domain_Service.md). The UI side is in [Journal_Frontend](../Journal_Frontend.md).\n\nThe crate is `#![forbid(unsafe_code)]`. It depends on `mnemora-core`, `rusqlite`, `rusqlite_migration`, `serde`, `serde_json`, `thiserror`, `tracing` and `specta` (`crates/journal/Cargo.toml`).\n\nOnly some source files were provided for this page: `entry.rs`, `error.rs`, `lib.rs`, `migrations.rs`, `repo.rs`, `search.rs`, `sync.rs` and `tools.rs`. `lib.rs` also declares `service.rs`, `snippet.rs`, `today.rs` and `upgrade.rs`. This page describes those four only through how the provided code uses them.\n\n## Architecture\n\n```mermaid\ngraph TD\n    Host[\"Tauri commands (src-tauri/src/journal.rs)\"] --> Lib[\"lib.rs: JournalModule + re-exports\"]\n    Lib --> Service[\"service.rs: create/update/move/delete/restore, list_pages\"]\n    Lib --> Search[\"search.rs: exact + similar\"]\n    Lib --> Sync[\"sync.rs: ENTRY entity, apply, backfill\"]\n    Lib --> Tools[\"tools.rs: journal_list/read/search\"]\n    Service --> Entry[\"entry.rs: types + validation\"]\n    Service --> Repo[\"repo.rs: SQL\"]\n    Search --> Repo\n    Sync --> Repo\n    Tools --> SQL[(journal_entries + FTS5)]\n    Repo --> SQL\n    Mig[\"migrations.rs\"] --> SQL\n    Entry --> Err[\"error.rs: JournalError\"]\n    Lib -. implements .-> Core[\"mnemora-core Module trait\"]\n    Sync -. uses .-> CL[\"core changelog / syncable\"]\n```\n\nThe layering is deliberate. `entry.rs` holds types and validation, `repo.rs` holds SQL with no rules (\"No rules here\"), and `service.rs` combines the two.\n\n## Module registration (`lib.rs`)\n\n`JournalModule` implements the `Module` trait from `mnemora-core` (see [Core_Foundation](../Core_Foundation.md)). `MODULE_ID` is `\"journal\"`. It is the migration namespace and the change-log module name.\n\n| Hook | What Journal does |\n|---|---|\n| `migrations` | Returns `migrations::all()`. |\n| `register_settings` | Registers `font` (`serif` or `sans`, default `serif`), `width` (`narrow`, `default` or `wide`, default `default`) and `page_summary` (boolean, default `true`). |\n| `sync_entities` | Returns `sync::ENTITIES`. |\n| `holdings` | Counts live Entries (`deleted_at IS NULL`). |\n| `backfill_log` | Calls `sync::backfill`. |\n| `tools` | Returns `tools::all()`. |\n| `apply_remote` | Routes the Entry entity to `sync::apply`. Any other entity is a validation error. |\n| `on_startup` | Calls `upgrade::keep_existing_phone_tabs(device, report)`. |\n\nThe public API re-exports `Entry`, `NewEntry`, `Page`, `PageDirection`, `JournalError`, `Span`, `Hit`, `SearchResults` and `search`. It also re-exports the service functions `create_entry`, `delete_entry`, `list_pages`, `month_days`, `move_entry`, `restore_entry`, `toggle_task_line` and `update_entry`, plus `today`, `TodaySummary` and `TodayLatest`.\n\n## Data model and rules (`entry.rs`)\n\nAn `Entry` has the following fields:\n\n- `id`: a UUIDv7.\n- `page_date`: `YYYY-MM-DD`.\n- `body`: Markdown text.\n- `written_at`, `written_offset_min`, `written_tz`: the moment and place of writing. They never change after creation.\n- `edited_at`: set only on a meaningful edit.\n- `word_count`, `created_at`, `updated_at`.\n\nMillisecond instants are `i64` in Rust. They are typed `u32` for specta so the generated TypeScript sees a plain `number`.\n\nOther types:\n- **`NewEntry`** is the UI input: page date, text, writer's zone and offset, and the composer `session_id`. The session id groups autosaves in the change log.\n- **`Page`** is one date with its entry count, word count and Entries, oldest first.\n- **`PageDirection`** is `Older`, `From` or `Newer` relative to a cursor date. Results are always newest first.\n\nValidation functions:\n- `validate_text` rejects blank text.\n- `validate_page_date` accepts only real calendar dates. It checks leap years and month lengths by hand.\n- `validate_written_zone` checks that the zone name is non-empty and at most 64 characters, and that the offset is within ±14h.\n- `toggle_task(body, line)` flips `[ ]` or `[x]` on one 0-based line and leaves every other byte alone. It accepts the same task syntax the Markdown parser does: optional quote and indent, a bullet or `1.` / `1)`, then the box. Anything else is a validation error.\n\n## Errors (`error.rs`)\n\n`JournalError` has three variants. They map to the IPC `AppError` as follows:\n\n| Variant | `ErrorCode` |\n|---|---|\n| `Validation(&'static str)` (message shown to the user) | `Validation` |\n| `EntryNotFound` | `NotFound` |\n| `Snapshot(serde_json::Error)` | `Internal` (source kept in `details`) |\n\n## Storage (`migrations.rs`, `repo.rs`)\n\nMigrations are append-only:\n1. Creates the `journal_entries` table (STRICT) and a partial index on `(page_date, written_at)` for live rows. Deletion is soft, through `deleted_at`.\n2. Creates the `journal_fts` FTS5 table. It uses external content, `unicode61 remove_diacritics 2`, and prefix indexes of 2 and 3 characters. It also creates an `fts5vocab` table and insert, delete and update triggers, then runs a rebuild so older Entries are indexed. Deleted Entries stay indexed so Undo works. Queries filter on `deleted_at`.\n\nThe FTS index is keyed on the implicit `rowid`. A `VACUUM` may renumber it, so never `VACUUM` without rebuilding `journal_fts`.\n\n`repo.rs` provides:\n- Basic access: `insert`, `get` (live only), `get_any` (with `deleted_at`), `every`, `get_deleted`.\n- Updates: `update_columns` (column names come from code, never from input), `update_body`, `update_page_date`, `set_deleted_at`.\n- Reads: `dates_between`, `day_summary` (count plus the latest Entry), `vocabulary`.\n- `pages(conn, Window, limit)`. `Window` is `Newest`, `Before`, `AtOrBefore` or `After`. It first picks the dates, then loads their Entries in one range query and groups them. Order is newest date first and oldest Entry first within a date. The `After` window picks the nearest dates ascending and then reverses them.\n- `search`, which builds the SQL dynamically. `matching` adds `rowid IN (FTS MATCH ?1)`. `excluding` adds `rowid NOT IN (FTS MATCH ?2)`. It also applies the date range and a limit.\n\n## Search (`search.rs`)\n\n```mermaid\nflowchart TD\n    Q[query + optional from/to] --> V[validate_range]\n    V --> P[query::parse -> terms]\n    P -->|no words, no range| E[empty results]\n    P -->|no words, range| R[all Entries in range]\n    P --> X[exact FTS match, limit 501]\n    X --> N[near_for: vocabulary words within tolerance]\n    N --> S[expanded FTS match, excluding exact, limit 101]\n    X --> Out[SearchResults]\n    S --> Out\n```\n\n- **Exact results** come first and are capped at 500. Every word is required and matches by prefix. Quoted text is a phrase.\n- **Similar results** allow typos. They are capped at 100 and never repeat an exact hit. The vocabulary is read only for words whose length is within 2 characters of a query word, since 2 is the widest typo tolerance.\n- The result sets `truncated` or `similar_truncated` when a cap is hit. The code fetches one extra row to detect this.\n- Each `Hit` carries a `snippet: Vec<Span>` built by `snippet.rs` with a `Matcher`. Query text never reaches a log line.\n- A range with no words lists every Entry in that range.\n\nQuery parsing, tolerance and matching live in `mnemora_core::search` ([Core_Foundation](../Core_Foundation.md)). The Todo module has its own equivalent, see [Todo_Tasks_and_Lists](Todo_Tasks_and_Lists.md).\n\n## Sync (`sync.rs`)\n\nThe Journal declares one sync entity, the Entry, according to ADR 0017. Merge strategy by field:\n\n| Field(s) | Kind |\n|---|---|\n| `body` | Text (newest wins for now; the engine decides) |\n| `page_date`, `created_at`, `deleted_at` | Independent values |\n| `written_at`, `written_offset_min`, `written_tz` | Atomic group `written` |\n| `edited_at`, `word_count`, `updated_at` | Derived; never sent and recomputed on receipt |\n\nMoving an Entry on one device and editing it on another both stand. The `written` group travels whole, so a creation always arrives complete.\n\n**`apply`** writes the winning fields received from another device:\n1. `Patch::read` validates each unit separately. A bad unit (a blank body, an impossible date or zone) is dropped whole and the good ones still apply.\n2. If the Entry is unknown here, it can only be created from a record carrying body, page date, written group and `created_at`. Otherwise the record is kept for relay only, with `changed: false`.\n3. `write` updates the columns and recomputes `word_count` and `edited_at` when the body actually changed.\n4. `edited_by` sets the edited time to the time of the origin's change. It leaves the value alone for a checklist tick, or for a change within `EDIT_GRACE_MS` of writing (a typo fix). Devices that took the same text therefore show the same edited time.\n5. `changed` is computed by comparing snapshots without `updated_at`. `updated_at` is set to this device's time only if something changed.\n6. If a live Entry became deleted, the result carries `SyncEvent::EntryDeleted`, so an open editor can react.\n\n**`backfill`** logs every Entry that has no change-log state yet, deleted ones included. It uses an `Unlogged` change stamped with the row's `updated_at` and calls `changelog::backfill`.\n\nSee [Sync_Replication_Engine](../Sync_Replication_Engine.md) for the engine, and [Journal_Frontend](../Journal_Frontend.md) for how editors handle remote deletes. Entry text must never reach a log line.\n\n```mermaid\nsequenceDiagram\n    participant Eng as Sync engine\n    participant J as JournalModule.apply_remote\n    participant S as sync::apply\n    participant DB as journal_entries\n    Eng->>J: RemoteChange(entity, id, fields, at)\n    J->>S: entity == \"entry\"\n    S->>S: Patch::read (validate units)\n    S->>DB: insert (new) / update_columns\n    S-->>Eng: Applied{snapshot, changed, events}\n```\n\n## AI tools (`tools.rs`)\n\n`tools::all()` offers three read-only tools to the AI assistant (ADR 0002 amendment, ADR 0018). They never write, skip deleted Entries, and return refusals as data via `Output::error`. See [AI_Module](../AI_Assistant_Backend/AI_Module.md).\n\n| Tool | Behaviour |\n|---|---|\n| `journal_list` | Lists Entries by Page date, newest first. Params: `from`, `to`, `offset`, `limit` (default 30, max 100). Rows hold id, date, written time, word count and a 120-character preview. Output is trimmed by `fit_rows`, with `next_offset` for continuation. |\n| `journal_read` | Reads one Entry in 8 KiB pages of body text. `offset` is a byte offset and is advanced to a UTF-8 boundary. It returns `next_offset` if more remains. |\n| `journal_search` | Calls the app's own `search`. Exact hits come first, then similar ones, tagged `match`. It uses snippets of up to 200 characters, a default limit of 10 and a max of 25. |\n\nEach tool returns `Item`s (id, module, title, date) so the AI can cite what it read.\n\n## Related pages\n\n- [Domain_Modules_(Todo_and_Journal)](../Domain_Modules_(Todo_and_Journal).md): parent overview.\n- [Journal_Domain_Service](../Tauri_Host_and_Command_Layer/Journal_Domain_Service.md): command layer.\n- [Journal_Frontend](../Journal_Frontend.md): UI.\n- [Core_Foundation](../Core_Foundation.md): `Module`, change log, settings, search primitives.\n- [Sync_Replication_Engine](../Sync_Replication_Engine.md): replication.\n", "Domain_Modules_(Todo_and_Journal)/Todo_Comments.md": "# Todo_Comments\n\nTodo_Comments is the part of the `todo` crate that stores and synchronises **Comments**: short notes (up to 5,000 characters, line breaks allowed) attached to a Task. It has two files:\n\n| File | Role |\n|---|---|\n| `crates/todo/src/comment_repo.rs` | Pure SQL over the `todo_comments` table. It holds no rules. |\n| `crates/todo/src/comment_sync.rs` | Todo's side of the sync contract for Comments (ADR 0017). It declares the merge rules and applies the winning field values received from other devices. |\n\nThe rules (validation, change-log records, undo) live in `comment_service.rs`, which exposes `comments`, `add_comment`, `edit_comment`, `delete_comment` and `restore_comment`. That file is not one of this module's core components. The Tauri commands that call it (`todo_comment_add`, `todo_comment_edit`, `todo_comment_delete`, `todo_comment_restore`, `todo_comments`) are in [Todo_Domain_Service](../Tauri_Host_and_Command_Layer/Todo_Domain_Service.md). For the parent task and list logic see [Todo_Tasks_and_Lists](Todo_Tasks_and_Lists.md). For the engine that calls `apply` see [Sync_Replication_Engine](../Sync_Replication_Engine.md).\n\n## Architecture\n\n```mermaid\ngraph TD\n    UI[Todo frontend] --> Cmd[Tauri todo_comment_* commands]\n    Cmd --> Svc[comment_service.rs<br/>rules, change-log records]\n    Svc --> Repo[comment_repo.rs<br/>SQL]\n    Engine[Sync engine] --> CS[comment_sync.rs<br/>COMMENT entity, apply]\n    CS --> Repo\n    CS --> TaskRepo[repo::get_any<br/>Task lookup]\n    CS --> Svc\n    Repo --> DB[(todo_comments)]\n```\n\n## Data model\n\n`COLUMNS = id, task_id, body, edited, created_at, updated_at`. `deleted_at` is a separate column read only by `get_any` and `every`.\n\n- **Soft delete**: a deleted Comment has a non-null `deleted_at`. This supports Undo and sync.\n- **`edited`** is its own flag. Only `update_body` sets it. Deleting and restoring never make a Comment look edited.\n- The Comment count on a Task is never stored. It is recomputed.\n\n## comment_repo.rs\n\n| Function | Behaviour |\n|---|---|\n| `insert` | Inserts a full `Comment` row. |\n| `get` | Returns a live Comment only (`deleted_at IS NULL`). |\n| `get_any` | Returns `(Comment, Option<deleted_at>)` whether or not the Comment is deleted. |\n| `every` | Returns every Comment with its `deleted_at`, ordered by id. Used for snapshots and backfill. |\n| `for_task` | A Task's live Comments, oldest first (`created_at, id`). |\n| `update_body` | Sets `body`, forces `edited = 1`, and stamps `updated_at`. |\n| `set_deleted` | Sets or clears `deleted_at` and stamps `updated_at`, so a sync sees the newer state. |\n| `update_columns` | Writes arbitrary named columns of a Comment, deleted or not. Used to apply remote values. Column names come from the caller's constants, never from user input. An empty set does nothing. |\n\n## comment_sync.rs\n\n### Merge rules (`COMMENT: SyncEntity`)\n\n```mermaid\ngraph LR\n    subgraph group body\n      B[body: Text]\n      E[edited: Value]\n    end\n    T[task_id: Value]\n    C[created_at: Value]\n    D[deleted_at: Value]\n    U[updated_at: derived]\n```\n\n- `body` is Text. Newest wins for now, and a three-way merge is planned (see the conflict tests in [Sync_Conflicts_and_Activity](../Tauri_Host_and_Command_Layer/Sync_Conflicts_and_Activity.md)). `edited` is in the same group, so the \"edited\" flag always comes from the same device as the text.\n- `task_id`, `created_at` and `deleted_at` are plain Values.\n- `updated_at` is derived and recomputed locally.\n\n### `apply` flow\n\n```mermaid\nflowchart TD\n    A[RemoteChange] --> R[Patch::read<br/>validate each unit]\n    R --> TK{task_id known<br/>deleted ok?}\n    TK -- no --> DROP[drop task_id from patch]\n    TK -- yes --> EX\n    DROP --> EX{Comment exists?}\n    EX -- no --> CR{body, task_id,<br/>created_at present?}\n    CR -- no --> RELAY[Applied changed=false<br/>kept for relay only]\n    CR -- yes --> INS[INSERT hidden:<br/>deleted_at = now]\n    EX -- yes --> W\n    INS --> W[write via update_columns]\n    W --> CMP{snapshot differs<br/>ignoring updated_at?}\n    CMP -- yes --> BUMP[updated_at = MAX now, updated_at+1]\n    CMP -- no --> OUT\n    BUMP --> OUT[Applied snapshot, changed]\n```\n\nKey behaviours:\n\n1. **Validation**: `Patch::read` accepts a body only if `validate_body` passes. The body is applied only together with a boolean `edited`. Invalid units are skipped rather than failing the batch.\n2. **Orphan guard**: if the referenced Task has never been heard of (`repo::get_any` returns none), `task_id` is dropped. A deleted Task is fine. A Comment stays on its Task in every state, and returns with the Task when it is restored.\n3. **Creation**: a new Comment needs `body`, `edited`, `task_id` and `created_at`, all of which the first record carries. Otherwise the record is kept for relay only and nothing is applied. The row is inserted hidden, with `deleted_at` set to now, until the winning `deleted_at` is written. This stops a half-applied Comment from flashing into view.\n4. **Change detection**: the before and after snapshots (`snapshot_of`, with `strip_updated`) are compared without `updated_at`. Only a real change moves `updated_at`, to `MAX(now, updated_at + 1)`, so it only moves forward.\n5. **Events**: `apply` returns no events. Refreshing the UI is handled by the Todo-level apply in `sync.rs`.\n\n### Privacy\n\nComment text must never reach a log line. The only log is a `debug` line on the `sync` target that carries the Comment id and no text.\n\n## Integration points\n\n- `crate::sync::{Set, number, strip_updated}` are the shared helpers for the Todo sync glue.\n- `core::syncable` supplies `SyncEntity`, `SyncField`, `RemoteChange` and `Applied`. See [Core_Foundation](../Core_Foundation.md).\n- The sync scenarios `comments_sync_edits_deletes_and_the_count_is_recomputed` and `a_comment_added_to_a_task_deleted_elsewhere_stays_attached_and_returns_with_it` are in the [Sync_Replication_Engine](../Sync_Replication_Engine.md) tests. The user-facing behaviour tests are in [todo_sheet_tests](../Backend_Integration_Test_Suites/todo_sheet_tests.md).\n", "Domain_Modules_(Todo_and_Journal)/Todo_Tasks_and_Lists.md": "# Todo Tasks and Lists\n\nThe `mnemora-todo` crate (`crates/todo`) holds the rules and storage for **Tasks** and **Lists**. It also holds the capture parser, the date views, History, search, AI tools and the sync contract for these records. The Tauri app crate only exposes it as commands; see [Todo_Domain_Service](../Tauri_Host_and_Command_Layer/Todo_Domain_Service.md).\n\nThis page covers the core of the crate. Two parts have their own pages:\n\n- [Todo_Comments](Todo_Comments.md): `comment_repo.rs` and `comment_sync.rs`.\n- [Todo_Widget](Todo_Widget.md): `widget.rs` and `widget_text.rs`.\n\nRelated pages:\n\n- [Core_Foundation](../Core_Foundation.md): change log, `Module` trait, settings, text folding, ordering keys.\n- [Sync_Replication_Engine](../Sync_Replication_Engine.md): the engine that applies the merge rules declared here.\n- [Todo_Frontend](../Todo_Frontend.md): the UI over these commands.\n- [AI_Assistant_Backend](../AI_Assistant_Backend.md): the consumer of the read-only tools.\n- [Journal_Module](Journal_Module.md): the sibling domain crate, built on the same `Module` trait.\n\n## Architecture\n\n`TodoModule` (`lib.rs`) implements `mnemora_core::module::Module`. Its `MODULE_ID` is `\"todo\"`, and it also serves as the migration namespace and the change-log module name. Code is split into layers:\n\n- Pure rules and types: `task.rs`, `list.rs`, `parse.rs`.\n- SQL only: `repo.rs`, `list_repo.rs`, `search_repo.rs`. The comment repo is in [Todo_Comments](Todo_Comments.md).\n- Operations that combine rules, SQL and a change-log record in one transaction: `service.rs` and the sibling services re-exported from `lib.rs`. These are `task_service`, `list_service`, `schedule.rs`, `repeat`, `reorder`, `quick_add` and `capture.rs`.\n- Read models: `history.rs`, `search.rs`, `tools.rs`.\n- Sync: `sync.rs` (Tasks), `list_sync.rs` (Lists), `backfill.rs`.\n\n```mermaid\ngraph TD\n    Host[src-tauri todo.rs commands] --> Svc[service / task_service / list_service / schedule / capture]\n    Svc --> Rules[task.rs, list.rs, parse.rs]\n    Svc --> Repo[repo.rs, list_repo.rs]\n    Svc --> CL[mnemora_core::changelog]\n    Repo --> DB[(SQLite: todo_lists, todo_tasks, todo_comments + FTS5)]\n    Search[search.rs] --> SRepo[search_repo.rs] --> DB\n    Hist[history.rs] --> CL\n    Tools[tools.rs] --> Repo\n    Tools --> Search\n    Tools --> Hist\n    Sync[sync.rs, list_sync.rs, comment_sync.rs] --> Repo\n    Backfill[backfill.rs] --> CL\n    Engine[Sync engine] -->|apply_remote / settle_remote| Sync\n```\n\n## Module contract (`TodoModule`)\n\n| `Module` method | What Todo does |\n|---|---|\n| `migrations` | `migrations::all()` (see below). |\n| `register_settings` | Registers `parse_dates` (boolean, default true). Also registers the grouping, sort and done-in-lists preferences from `arrange`; the first allowed value of each is its default. |\n| `sync_entities` | `sync::ENTITIES`: Task, List and Comment. |\n| `tools` | `tools::all()`: three AI tools. |\n| `holdings` | Counts live Tasks and lists live List names, for the merge preview shown when pairing. |\n| `backfill_log` | `backfill::run`. |\n| `apply_remote` | Dispatches by entity to `sync::apply`, `list_sync::apply` or `comment_sync::apply`. Any other entity is a validation error. |\n| `settle_remote` | `sync::settle` or `list_sync::settle`. Comments settle to the default. |\n| `on_startup` | `upgrade::append_todo_tab`. |\n\n## Data model and storage\n\n`migrations.rs` is append-only. It creates the full shape in the first migrations, then adds FTS indexes, a key-trimming fix, a search vocabulary and a Comment `edited` flag.\n\n- `todo_lists`: `name_key` is the name folded for case and accents. A unique partial index on `name_key` where `deleted_at IS NULL` makes live names unique. `task_sort` defaults to `manual`, and `group_by` NULL means none.\n- `todo_tasks`: `list_id` NULL is the Inbox. Dates are `YYYY-MM-DD` and times `HH:MM`, both floating local. `repeat_*` columns hold the Repeat. `state` is `open`, `done` or `wont`, with `closed_at` set exactly when the state is not open. `repeat_of` points an occurrence copy at its Task. `understood` is parser JSON. `sort_key` is a fractional-index key.\n- Deletes are soft (`deleted_at`), which is what makes Undo possible.\n- `todo_tasks_fts` and `todo_comments_fts` are external-content FTS5 tables kept in step by triggers. The `*_fts_vocab` tables feed typo tolerance. The code comments warn never to `VACUUM` without rebuilding both indexes, because the indexes are keyed on implicit rowids.\n- Sort keys never end in `0`, and `TRIM_KEY_ZEROS` repaired older data. Keys are never reused: `last_sort_key`, `key_before` and `key_following` include deleted rows.\n\n## Types and validation\n\n`task.rs` defines `Task`, `TaskState`, `NewTaskDetails`, `InboxView` and the validators:\n\n| Validator | Rule |\n|---|---|\n| `validate_title` | Trimmed, one line, 1–500 characters. |\n| `validate_priority` | 1–4; 4 means none. |\n| `validate_notes` | At most 100,000 characters. |\n| `validate_understood` | A JSON array of at most 4,000 characters. |\n\n`list.rs` defines `TodoList`, `ListEntry`, `SidebarView`, `ListView`, `AllView`, `ListDone` and `ListDeletion`. `DeleteChoice` says what happens to a deleted List's Tasks: `DeleteTasks`, `MoveToInbox` or `MoveToList`. Validators:\n\n- `validate_list_name`: at most 60 characters, one line.\n- `validate_emoji`: at most 16 characters, no letters or spaces.\n- `name_key`: `mnemora_core::text::fold`.\n\n`TodoError` (`error.rs`) has `Validation`, `NameTaken`, `TaskNotFound`, `ListNotFound`, `CommentNotFound` and `Snapshot`. It converts into `AppError` with `Validation`, `NotFound` or `Internal` codes. `NameTaken` shows the user's text but is never logged, following the \"no user text in logs\" rule (ADR 0008). Every file in the crate repeats this rule for Task, List and Comment text.\n\n## Core operations\n\nEach operation runs in one transaction. It writes the row and a change-log record via `record`, `record_at`, `record_session` or `record_skip`.\n\n- `create_task`: validates, resolves the When through `settle_when`, places the Task last with `key_after`, and logs a `Create`.\n- `complete_task`: a plain Task becomes `Done` with `closed_at`. A repeating Task is not closed. `repeat::complete` records a done occurrence copy and moves the Task to its next date.\n- `reopen_task`: reopens a closed Task. For the latest occurrence of a repeating Task it rewinds the parent instead.\n- `move_task`: moves a Task between Lists or to the Inbox. It does nothing and logs nothing if the List is unchanged.\n- `inbox`: groups the open List-less Tasks per preference, then adds a \"No date, in a List\" group.\n- `schedule.rs`:\n  - `set_when`, `restore_when` (Undo), `move_overdue`.\n  - `today`, `upcoming`, `counts` and `day_counts` build the date views.\n  - `assign_when` enforces \"no date means no Repeat\". A month or year Repeat is anchored on its date.\n- `capture.rs`: `parse_text` matches `#Name` against live Lists. `quick_edit` saves title, List, When, Repeat and Priority in one update.\n  - It refuses a past date, but an Overdue Task may keep its own date.\n  - With `restoring` (Undo) it puts old values back, past dates included.\n  - If nothing changed, it records nothing.\n\nThe history of a change is stored as `ChangeOp` values: `Create`, `Update`, `Tick`, `Move`, `Delete`. A Skip is a `Tick` whose snapshot carries `skipped: true`.\n\n### Task lifecycle\n\n```mermaid\nstateDiagram-v2\n    [*] --> Open: create_task\n    Open --> Done: complete_task (plain)\n    Open --> Wont: wont_do\n    Done --> Open: reopen_task\n    Wont --> Open: reopen_task\n    Open --> Open: repeating tick / skip → next date + done copy\n    Open --> Deleted: delete_task\n    Done --> Deleted: delete_task\n    Deleted --> Open: restore_task\n```\n\n## Natural-language parser (`parse.rs`)\n\n`parse(&ParseRequest, &[ListRef]) -> Parsed` is pure. The caller supplies today, now and the week start. It reads dates, times, Repeats, `#List` and `p1`–`p4`.\n\n1. Tokenise. Text in quotes or backticks is masked, and numeric dates and bare numbers are never read.\n2. Collect every candidate of every kind: `repeat`, `date`, `time`, `prio`, `list`.\n3. Drop candidates inside `frozen` ranges (Quick edit's old title) and split off `ignored` keys.\n4. Pick one winner per kind: the user's `prefer` pick, else the last. Losers become `alternatives` with reason `conflict`.\n5. A time alone means today if still ahead, else tomorrow. With a Repeat, the Repeat's first day is used instead.\n\nOffsets are UTF-16 code units, because the text lives in a JavaScript string. The browser mock has a TypeScript copy; both run `src/lib/ipc/fixtures/parse-cases.json`. See [IPC_Todo_Mocks](../IPC_Bridge_and_Browser_Mocks/IPC_Todo_Mocks.md).\n\n## History (`history.rs`)\n\n`task_history` builds readable lines (for example \"Due date Thu 22 Oct → Fri 23 Oct\") from the change log. History is a function of the records alone, so every device shows the same lines.\n\n- `advance` replays each record's `fields`, never its snapshot. A received record's snapshot is this device's merged state and may differ between devices. Own records are completed as they are sent.\n- `state_lines`, `schedule_lines` and `edit_lines` emit lines for delete or restore and state, List, date, time and Repeat, and Priority and text.\n- A tick that changes the Due date on a repeating Task reads as \"Done (occurrence of …)\", \"Reopened (occurrence of …)\", or \"Skipped (Thu → Sat)\" when the record is marked skipped.\n- Title and notes edits are compared with a `Baseline` from before the editing session. One opening of the sheet therefore gives one \"Title edited\" and one \"Notes edited\" line.\n- Lines name dates, Lists and Priorities, never the Task's own text.\n\n## Search (`search.rs`, `search_repo.rs`)\n\nSearch uses the shared matcher from `mnemora_core::search`: word prefixes, case and accent folding, and quoted phrases. It reads Task titles, notes and live Comments.\n\n- `search_repo::search` runs an FTS5 expression over both indexes. Open Tasks come first in manual order, then closed ones, latest closed first.\n- `search` returns up to 500 exact hits and up to 100 \"similar\" hits that tolerate typos. Similar hits come from a second expanded query that excludes the exact one, using `vocabulary()` from the fts5vocab tables.\n- Each `TaskHit` carries highlighted title spans and a snippet from the notes or a Comment.\n- Known v1 limit: all words must match in the title and notes together, or all in one Comment.\n\n## AI tools (`tools.rs`)\n\nThree read-only tools, `todo_list`, `todo_read` and `todo_search`, are registered through `Module::tools`. They never write, skip deleted rows, and return refusals as data. See [AI_Module](../AI_Assistant_Backend/AI_Module.md) for how the assistant uses them.\n\n- `todo_list` filters by state, List (`ListPick`: any, Inbox or one List), due range, priority and closing day. It defaults to done when a closing range is given. Rows page via `next_offset`.\n- `todo_read` returns one Task. Notes come in 8 KiB pages, with optional steps, Comments and History.\n- `todo_search` wraps `crate::search` and filters by state and List.\n\n## Sync contract\n\nDeclared in `sync.rs` and `list_sync.rs`, applied by the [Sync_Replication_Engine](../Sync_Replication_Engine.md). `Comment` is documented in [Todo_Comments](Todo_Comments.md).\n\n**Task fields** (`TASK`):\n\n- `title` and `notes` are Text fields. `understood` is in the `title` group, so the recognised words come from the same device as the newest title.\n- The **When** group is atomic: due date, time and every `repeat_*` field.\n- The **state** group is atomic: `state` and `closed_at`.\n- `sort_key` merges as an order. `deleted_at` is an ordinary value, so a delete and an edit on different devices both stand.\n- `skipped` is a log marker, not a column. `updated_at` is derived.\n\n**List fields** (`LIST`): `name`, `emoji`, `task_sort`, `group_by` and `deleted_at` are values, and `sort_key` is an order.\n\n**Applying a received change** (`apply`):\n\n1. `Patch::read` validates each unit, using the same validators as local edits. A unit that fails (a bug or a hostile peer) is dropped whole.\n2. A Task or List unknown here is only created from its first record, which carries title, `sort_key` and `created_at`. Otherwise it is kept for relay only.\n3. `insert_remote` creates the row hidden (a Task starts deleted, a List starts parked), then `update_columns` writes the winners.\n4. A Task never points at a missing List. It goes to the surviving List or the Inbox, and a `TaskToInbox` event is emitted.\n5. Events (`TaskDeleted`, `ListsMerged`, `TaskToInbox`) feed the Activity log.\n\n### List name clash and merge\n\nTwo devices may each create a List with the same folded name. A List that would go live under a taken name is first written with `deleted_at = PARKED` (0). Then `settle` decides:\n\n```mermaid\nflowchart TD\n    A[Received List record] --> B{Live twin with same name_key?}\n    B -- no --> C[unpark: goes live]\n    B -- yes --> D{twin.id < list.id?}\n    D -- yes --> E[merge list into twin; list stays deleted]\n    D -- no --> F[merge twin into list; unpark list]\n    E --> G[rehome Tasks]\n    F --> G\n    C --> G\n```\n\n- The older List by id survives with all its properties. The decision depends only on the two ids, so every device reaches the same result in any arrival order.\n- `merge` moves the loser's Tasks to the end of the survivor's manual order and soft-deletes the loser. These are recorded as ordinary `Move` and `Delete` changes, stamped later so they win everywhere.\n- `list_repo::home` says where a gone List's Tasks belong: the List itself, the older live List with its name, or the Inbox.\n- `rehome` re-places live Tasks from the change log (`repo::chosen_list_is`). It writes only the column and records nothing.\n- `sync::settle` handles a Task whose chosen List was merged away. It moves the Task to the end of the survivor's order and records a `Move`.\n\n### Backfill (`backfill.rs`)\n\n`backfill::run` logs rows the change log does not describe. It runs before Sync reads the log: Lists first, then Tasks (repeating Tasks before their occurrences), then Comments. `Unlogged.after` encodes dependencies, so what a row refers to is met first.\n\n## Error and storage helpers\n\n`repo::corrupt_or_db` maps an unreadable stored value to `ErrorCode::Internal` (\"Stored Task data is unreadable\") instead of a user error. `list_repo::get_any` and `repo::get_any` return rows whether or not they are deleted. `every` skips parked Lists.\n\n## Dependencies\n\n`crates/todo/Cargo.toml` depends on `mnemora-core`, `rusqlite`, `rusqlite_migration`, `serde`, `serde_json`, `uuid`, `thiserror`, `tracing` and `specta` (derive). The crate uses `#![forbid(unsafe_code)]`. Specta derives the TypeScript bindings. Millisecond instants are typed `u32` for the bindings only, so TypeScript sees a plain `number`.\n\n## Tests elsewhere\n\nIntegration behaviour is tested in the app crate. See [todo_sheet_tests](../Backend_Integration_Test_Suites/todo_sheet_tests.md). Other test files that cover Todo:\n\n- `todo_capture_tests.rs`, `todo_order_tests.rs` and `todo_search_tests.rs`.\n- `sync_lists_tests.rs` and `sync_cluster_tests.rs`, in [Sync_Replication_Engine](../Sync_Replication_Engine.md).\n", "Domain_Modules_(Todo_and_Journal)/Todo_Widget.md": "# Todo_Widget\n\nThe Todo_Widget module turns a Todo view into **display-ready data** for the Android home-screen widget. It lives in two files of the `todo` crate:\n\n- `crates/todo/src/widget.rs` builds a `WidgetSnapshot` (title, count, groups, rows, empty state) for a `WidgetView`, and lists the Lists offered by the widget setup screen.\n- `crates/todo/src/widget_text.rs` holds the wording rules (dates, times, titles, toast messages) as Rust ports of the app's TypeScript text rules.\n\nThe guiding rule: **every word in a snapshot is final**. The Kotlin side does no date or wording logic. Grouping, ordering and hiding of done tasks are the app's own (`today`, `inbox`, `group_tasks`); this module only picks and words them.\n\nFor the surrounding platform (Kotlin widget provider, JNI bridge, tests) see [Android and Home-Screen Widget Platform](../Android_and_Home-Screen_Widget_Platform.md), especially [widget_bridge](../Android_and_Home-Screen_Widget_Platform/widget_bridge.md) and [widget_tests](../Android_and_Home-Screen_Widget_Platform/widget_tests.md). Task and List data come from [Todo Tasks and Lists](Todo_Tasks_and_Lists.md).\n\n## Architecture\n\n```mermaid\ngraph TD\n    Kotlin[Android widget<br/>TodoWidgetProvider] --> Bridge[src-tauri widget bridge]\n    Bridge -->|WidgetView + LocalNow| Snapshot[widget::snapshot]\n    Bridge -->|setup screen| Lists[widget::lists]\n    Bridge -->|settings saved| Affect[widget::settings_affect_widget]\n    Snapshot --> Views[today / upcoming / inbox / all / list snapshots]\n    Views --> Arrange[arrange: group_tasks, compare, ViewPrefs]\n    Views --> Sched[schedule: today, counts, week_ahead]\n    Views --> Svc[service::inbox, list_service::ordered_lists]\n    Views --> Repo[repo / list_repo]\n    Views --> Text[widget_text]\n    Text --> Settings[core settings: time_format, week_start]\n```\n\n## Core types (`widget.rs`)\n\n| Type | Role |\n|---|---|\n| `WidgetView` | `Today`, `Upcoming`, `Inbox`, `All`, `List(id)`. `parse` reads the stored name (`today`, `upcoming`, `inbox`, `all`, `list:<id>`); anything else, or an empty id, is `TodoError::Validation`. |\n| `WidgetSnapshot` | The full drawing: `view`, `app_theme`, `title`, optional `count`, `groups`, optional `empty`. Serialised for the bridge. |\n| `WidgetGroup` | A heading (optional), a `Tone`, and `WidgetRow`s in the app's order. |\n| `WidgetRow` | `id`, plain `title`, priority `ring` (`p1`/`p2`/`p3`/`none`), `overdue` flag, grey `time`, red `day` for overdue rows, and a List `list` chip. |\n| `HeaderCount` / `Tone` | Count text such as `3 left` or red `2 overdue`; `Tone` is `Normal` or `Overdue`. |\n| `EmptyState` | Title and helpful line when nothing is listed. |\n| `WidgetLists` / `WidgetList` | The Lists for the setup screen, in the sidebar's order, each with a `label` of emoji and name. |\n\n`app_theme` is a Device setting, so it is left empty here; the app's bridge fills it in.\n\n## Building a snapshot\n\n`snapshot(conn, view, local)` checks the clock (`local.check()`), reads the time format, builds a `Context` (local time, `TimeFormat`, map of List id to chip text), dispatches to a per-view builder, then stamps `view` with the requested name.\n\n```mermaid\nflowchart LR\n    A[snapshot] --> B{view}\n    B -->|Today| T[today_snapshot]\n    B -->|Upcoming| U[upcoming_snapshot]\n    B -->|Inbox| I[inbox_snapshot]\n    B -->|All| L[all_snapshot]\n    B -->|List id| S[list_snapshot]\n    T --> F[finish]\n    U --> C[counted]\n    I --> C\n    L --> C\n    S --> C\n    C --> F\n```\n\nPer view:\n\n- **Today**: asks the app's `today`; Overdue-keyed groups become the red \"Overdue\" run, every other group is merged into one \"Today\" run (so the app's Priority/List splits are flattened, order kept). Header is `N overdue` (red) if anything is late, else `N left`. If empty, the line is `Next: <title>, <when>` from `counts(...).next`, or \"Nothing coming up\".\n- **Upcoming**: `week_ahead` for 7 days (`UPCOMING_DAYS`): Overdue, then one group per day headed by `day_heading`. Always by day, ignoring the app's grouping preference.\n- **Inbox**: the app's `inbox` groups; the list chip shows only in the `NoDateInList` group.\n- **All**: Inbox tasks plus open tasks in Lists, grouped `GroupBy::List` with manual sort, Lists in the sidebar's order.\n- **List**: `list_repo::get` (missing list → `TodoError::ListNotFound`), grouped and sorted by that List's own `group_by` and `task_sort`. The title is the List chip.\n\n`counted` drops empty groups, counts remaining rows for the header (hidden at zero) and sets the empty state only when nothing remains. `Context::heading` maps `GroupKey` values to the app's words (`No priority`, `P1`, `Tomorrow`, `Next 7 days`, `No date, in a List`, and so on).\n\n### Row rules\n\n`Context::row` computes overdue as `due_date < today`. The grey time (`Context::when`) is suppressed for overdue rows; for other days it prefixes the day (`Tomorrow 11:00`, `Wed 4 Nov`) unless the heading already says it (`show_day` is false in Today/Upcoming, true elsewhere). Overdue rows instead carry `day` from `overdue_day_label`. Titles pass through `plain_title`.\n\n## Settings that redraw the widget\n\n`settings_affect_widget(module, keys)` returns true when saving touches `core` keys `theme`, `time_format`, `week_start`, or Todo's `arrange::PREF_KEYS`. The host uses it to decide whether to signal the widget (see [Tauri Host and Command Layer](../Tauri_Host_and_Command_Layer.md)).\n\n## Wording rules (`widget_text.rs`)\n\n```mermaid\ngraph LR\n    TF[TimeFormat<br/>core.time_format] --> fmt[format_hm]\n    WS[WeekStart<br/>core.week_start]\n    fmt --> when[Context::when]\n    dt[day_text / short_date] --> rdl[row_date_label]\n    dt --> rdy[row_day_label]\n    dt --> odl[overdue_day_label]\n    dt --> dh[day_heading]\n    pt[plain_title] --> qt[quoted_title]\n    qt --> cm[completed_message / completed_repeat_message / quick_added_message]\n```\n\n- `TimeFormat` (`H24`/`H12`) and `WeekStart` (`Mon`/`Sun`) read the `core` Settings; defaults are 24-hour and Monday for any other value.\n- Date helpers rely on `epoch_day` and return the input unchanged when malformed, so bad data never panics: `row_date_label` (Today/Tomorrow/Yesterday/weekday/`28 Oct`), `row_day_label`, `overdue_day_label` (Yesterday, weekday within six days back, then date), `day_heading` (`Tomorrow · Thu 22`, `Mon 2 Nov`), `day_text`, `short_date` (adds the year only when it differs), and `month_short`.\n- `plain_title` strips Markdown emphasis, code and link marks via a small hand-written scanner (`strip`, `closing`, `find`); block syntax and `~~`/`==` remain as text, matching the app's `plainTitle`.\n- `quoted_title` wraps a plain title in curly quotes, cut at 34 characters with an ellipsis. It backs the toast builders `completed_message`, `completed_repeat_message`, and `quick_added_message`; `landed_in` says where a quick-added task went.\n- Quick-add chips: `meaning_text`, `when_chip_label`, `repeat_text` (via `history::repeat_label`).\n\n### Parity with the frontend\n\nThese are ports of TypeScript functions (`quotedTitle`, `landedIn`, `rowDateLabel`, `dayText`, `repeatLabel`, `meaningText`, `whenChipLabel`, `plainTitle`). The shared fixture `src/lib/ipc/fixtures/widget-text.json` is run by the Rust unit tests in `widget_text.rs` and by Vitest, so the two implementations cannot drift. See [Todo Frontend](../Todo_Frontend.md) and [IPC Todo Mocks](../IPC_Bridge_and_Browser_Mocks/IPC_Todo_Mocks.md).\n\n## Dependencies\n\n- Reads: `arrange`, `schedule`, `service`, `list_service`, `repo`, `list_repo`, `when` (`LocalNow`, `epoch_day`), `recurrence`, `history`, and `mnemora_core::settings` ([Core Foundation](../Core_Foundation.md)).\n- Used by: the widget bridge in `src-tauri` ([widget_bridge](../Android_and_Home-Screen_Widget_Platform/widget_bridge.md)); behaviour is covered end to end by [widget_tests](../Android_and_Home-Screen_Widget_Platform/widget_tests.md).\n- Sync: remote changes make the host redraw the widget (see [Sync Replication Engine](../Sync_Replication_Engine.md)).\n\n## Design notes\n\n- The module is read-only: it builds snapshots and never writes. Writes (tick, undo, quick add) go through the same app commands.\n- Errors flow as `AppResult`; an unknown view name or missing List is a typed `TodoError`, never a panic.\n- The caller supplies `LocalNow`, so day rollover follows the clock the widget sends.\n", "Domain_Modules_(Todo_and_Journal).md": "# Domain_Modules_(Todo_and_Journal)\n\n## Purpose\n\nThis module group holds the two domain backends of Mnemora. They are the `mnemora-todo` crate (`crates/todo`) and the `mnemora-journal` crate (`crates/journal`). Each crate owns the rules, SQLite storage, full-text search, sync merge rules and read-only AI tools for its own records. The Tauri app crate only exposes them as commands.\n\n| Crate | Records | Role |\n|---|---|---|\n| `mnemora-todo` | Tasks, Lists, Comments | A natural-language capture parser, date views, repeats, History, and a Home-Screen widget snapshot builder |\n| `mnemora-journal` | Pages (one per date) and Entries (Markdown) | Diary storage, typo-tolerant search, and checklist toggling |\n\nBoth crates share the same design:\n- Each implements the `Module` trait from `mnemora-core`.\n- Each uses `#![forbid(unsafe_code)]`.\n- Each uses append-only migrations, soft deletes (so Undo works) and FTS5 indexes.\n- Each declares per-field merge rules for the [Sync_Replication_Engine](Sync_Replication_Engine.md).\n- Each exposes three read-only AI tools.\n- Neither logs user text.\n\n## Architecture\n\n```mermaid\ngraph TD\n    UI[Todo_Frontend / Journal_Frontend] --> IPC[Tauri commands<br/>src-tauri todo.rs / journal.rs]\n    IPC --> Todo[Todo_Tasks_and_Lists]\n    IPC --> Journal[Journal_Module]\n    Todo --> Comments[Todo_Comments]\n    Todo --> Widget[Todo_Widget]\n    Widget --> Android[Android home-screen widget bridge]\n    Todo --> Core[Core_Foundation<br/>Module trait, changelog, settings, search]\n    Journal --> Core\n    Todo --> DB[(SQLite + FTS5)]\n    Journal --> DB\n    Engine[Sync engine] -->|apply_remote / settle_remote| Todo\n    Engine -->|apply_remote| Journal\n    AI[AI_Module] -->|read-only tools| Todo\n    AI -->|read-only tools| Journal\n```\n\nEach crate is layered the same way:\n1. Types and validation.\n2. SQL-only repositories.\n3. Services that combine rules, SQL and a change-log record in one transaction.\n4. Read models: search, History, AI tools.\n5. A sync adapter.\n\n```mermaid\nflowchart LR\n    Local[Local edit] --> Svc[Service: validate + write + changelog record]\n    Svc --> Log[(Change log)]\n    Log --> Eng[Sync engine]\n    Eng --> Peer[Other device]\n    Peer --> Apply[apply: validate each field unit, write winners]\n    Apply --> Settle[settle: e.g. List name merge]\n```\n\n## Sub-modules\n\n- **[Todo_Tasks_and_Lists](Domain_Modules_(Todo_and_Journal)/Todo_Tasks_and_Lists.md)** is the core of `mnemora-todo`.\n  - Task lifecycle: open, done, won't do, deleted, and repeating Tasks.\n  - The Lists model and the natural-language parser.\n  - Schedule views, History, search and AI tools.\n  - The sync contract, including deterministic List-name merging.\n- **[Todo_Comments](Domain_Modules_(Todo_and_Journal)/Todo_Comments.md)** covers `comment_repo.rs` and `comment_sync.rs`. It holds Comment SQL, the sync rules for Comments, the orphan guard, and hidden insertion of new remote Comments.\n- **[Todo_Widget](Domain_Modules_(Todo_and_Journal)/Todo_Widget.md)** covers `widget.rs` and `widget_text.rs`. It builds display-ready `WidgetSnapshot` data for the Android widget, and ports the frontend wording rules to Rust. A shared fixture keeps the Rust and TypeScript versions in step.\n- **[Journal_Module](Domain_Modules_(Todo_and_Journal)/Journal_Module.md)** is the whole `mnemora-journal` crate. It covers Entries and Pages, the append-only migrations and the FTS5 index. It also covers exact and \"similar\" search, field-level sync merge with an atomic `written` group, and the `journal_list`, `journal_read` and `journal_search` tools.\n\n## Related documentation\n\n- [Core_Foundation](Core_Foundation.md): the `Module` trait, change log, settings and search primitives.\n- [Sync_Replication_Engine](Sync_Replication_Engine.md): replication.\n- [AI_Assistant_Backend](AI_Assistant_Backend.md): consumer of the read-only tools.\n- [Todo_Frontend](Todo_Frontend.md) and [Journal_Frontend](Journal_Frontend.md): the UI.\n- [Tauri_Host_and_Command_Layer](Tauri_Host_and_Command_Layer.md): the command layer.\n- [Android_and_Home-Screen_Widget_Platform](Android_and_Home-Screen_Widget_Platform.md): the widget host.", "Frontend_Platform_and_Shell/App_Bootstrap_and_Platform_Utilities.md": "# App Bootstrap and Platform Utilities\n\nThis module is the foundation of the Svelte frontend. It starts the app (`src/main.ts`), detects the platform, and provides small framework-light helpers that the shell, router and feature modules share. They cover keyboard, viewport, gestures, editing leases, unsaved-work guards, a settings draft, and time greetings.\n\nRelated pages:\n- [Frontend_Platform_and_Shell](../Frontend_Platform_and_Shell.md): parent module\n- [Theme](Theme.md), [Router](Router.md), [Shell_and_Navigation](Shell_and_Navigation.md), [Home_and_Settings_Modules](Home_and_Settings_Modules.md): sibling modules\n- [IPC_Bridge_and_Browser_Mocks](../IPC_Bridge_and_Browser_Mocks.md): the `ipc` layer (`bindings`, `errors`, `mock`) used here\n- [Sync_Replication_Engine](../Sync_Replication_Engine.md): the Rust side of editing holds\n- [Tauri_Host_and_IPC_Bridge](../Tauri_Host_and_Command_Layer/Tauri_Host_and_IPC_Bridge.md): hosts the `editing_hold` / `editing_release` commands\n\n## Architecture\n\n```mermaid\ngraph TD\n    main[\"main.ts boot()\"] --> mock[\"ipc/mock installMock (dev browser only)\"]\n    main --> errs[\"ipc/errors installGlobalErrorHandlers\"]\n    main --> App[\"App.svelte (mount)\"]\n\n    platform[\"platform.ts\"] --> keyboard[\"keyboard.svelte.ts\"]\n    platform --> viewport[\"viewport.svelte.ts\"]\n    platform --> openext[\"open-external.ts\"]\n    platform --> shortcuts[\"shell shortcuts (hasMod)\"]\n\n    hold[\"editing-hold.ts\"] --> bindings[\"ipc/bindings (commands)\"]\n    draft[\"settings/draft.svelte.ts\"] --> bindingsT[\"ipc/bindings (SettingsChange type)\"]\n    longpress[\"long-press.ts\"] --> timing[\"timing.ts setTimer\"]\n\n    bare[\"bare-key.ts\"] --> shell[\"shell and Todo quick add (Q)\"]\n    swipe[\"swipe.ts\"] --> views[\"Todo views, rows, sheets\"]\n    leave[\"leave-guard.svelte.ts\"] --> forms[\"editors and settings\"]\n    greeting[\"time/greeting.ts\"] --> home[\"Home module\"]\n```\n\n## Bootstrap (`src/main.ts`)\n\n`boot()` runs once at load:\n\n1. **Dev-only mock.** If `import.meta.env.DEV` is set and `__TAURI_INTERNALS__` is absent from `window` (a plain browser with no Rust side), it dynamically imports `./lib/ipc/mock` and awaits `installMock()`. The dynamic import keeps the mock out of production bundles.\n2. **Error handlers.** `installGlobalErrorHandlers()` hooks global errors. These are reported to Rust via `log_ui_error`.\n3. **Mount.** It finds `#app` and throws `'#app not found'` if it is missing. Otherwise it mounts `App` with Svelte's `mount`.\n\n```mermaid\nsequenceDiagram\n    participant HTML as index.html\n    participant Boot as boot()\n    participant Mock as ipc/mock\n    participant Err as ipc/errors\n    participant App\n    HTML->>Boot: load main.ts\n    alt DEV and no __TAURI_INTERNALS__\n        Boot->>Mock: import + installMock()\n    end\n    Boot->>Err: installGlobalErrorHandlers()\n    Boot->>App: mount(App, #app)\n```\n\n`app.css` is imported here, so global styles load before mount. Vite configuration is in `vite.config.ts` (see [Build_and_Config](../Build,_Tooling_and_Packaging/frontend_build_config.md)).\n\n## Platform detection (`platform.ts`)\n\n- `detectOs(ua)` maps a user-agent to `'android' | 'ios' | 'macos' | 'windows' | 'linux' | 'web'`. The checks run in that order, so Android is matched before Linux.\n- Module constants: `os`, `isMac`, `isMobileOs`, and `inTauriWindow()`. `inTauriWindow()` wraps Tauri's `isTauri()`, so it is false in a browser and in the dev mock.\n- `modLabel`, `shortcutLabel(key)` and `hasMod(e)` implement the \"Cmd on macOS, Ctrl elsewhere\" rule. `hasMod` rejects events with Alt held.\n\n`open-external.ts` → `openExternal(url)` uses `window.open(..., 'noopener,noreferrer')` outside Tauri. Inside Tauri it lazy-loads `@tauri-apps/plugin-opener`.\n\n## Viewport and keyboard\n\n| Component | Role |\n|---|---|\n| `Viewport` (`viewport.svelte.ts`) | Singleton. `narrow` follows the media query `(max-width: 719.98px)`. `isPhone = narrow || isMobileOs`. It toggles `data-phone` on `<html>` synchronously at module load, so the first paint matches the layout and the `phone:` CSS variant works. |\n| `Keyboard` (`keyboard.svelte.ts`) | Singleton. On mobile OSes it listens to `visualViewport` `resize` and `scroll`. It computes `inset` with `keyboardInset` and derives `open` with `isKeyboardOpen` (helpers in `keyboard-inset`). The shell pads its bottom by `inset`. It stays 0 off mobile. |\n\n## Input helpers\n\n### Bare keys (`bare-key.ts`)\nA bare single-key shortcut (Q for Todo quick add, per ADR 0011) must never steal typing. `bareKeyFires(e, key, scene)` returns true only when all of these hold:\n- No Meta, Ctrl or Alt is held.\n- Shift is not held, unless the key is `?`.\n- The event is not a repeat, not composing, and not already `defaultPrevented`.\n- The key matches case-insensitively.\n- No overlay is open, and the target is not a text field.\n\n`isTypingTarget` uses `closest()` against `input, textarea, select, [contenteditable], [role=\"textbox\"]`. `overlayOpenIn(doc)` detects `dialog`, `alertdialog`, `menu` or `listbox` roles. Because it takes plain structural types, it can be tested without a DOM (`bare-key.test.ts`, helper `press`).\n\n### Long press (`long-press.ts`)\n`LongPress` fires `onpress(x, y)` once after `LONG_PRESS_MS` (500 ms) if the pointer stays within `LONG_PRESS_SLOP_PX` (10 px). `start` arms the timer. `move` cancels it when the pointer drifts past the slop. `cancel` clears it. `fired` stays true until the next `start`, so callers can swallow the click that follows. The timer is injectable (`setTimer`) for tests.\n\n### Swipe (`swipe.ts`)\nPure geometry helpers with named thresholds: `lockAxis`, `rowOffset` (resistance beyond `ROW_COMMIT_PX`), `rowSwipeOutcome` (distance or flick), `sheetShouldClose` and `viewSwipeStep`. `viewSwipeStep(dx, dy)` returns `-1`, `0` or `1`. It needs at least 60 px of travel and no more than 45 px of vertical drift. It is used by Todo's segment bar. See [Todo_Frontend](../Todo_Frontend.md).\n\n## Editing holds (`editing-hold.ts`)\n\nWhen a person edits a record (a Journal entry, or one field of a Todo task), changes arriving from other devices must wait, so text does not move under the cursor. Rust keeps them apart and merges them when the hold ends. See [Sync_Replication_Engine](../Sync_Replication_Engine.md).\n\n`EditingHold` manages leases per scope string. `WHOLE = '*'` holds the entire record.\n\n```mermaid\nstateDiagram-v2\n    [*] --> Idle\n    Idle --> Taking: take(scope)\n    Taking --> Renewing: hold() returns true (Sync on)\n    Taking --> HeldNoTimer: Sync off or failure\n    Taking --> Idle: released before answer\n    Renewing --> Renewing: every 30 s if window visible\n    Renewing --> Renewing: window shown, renewNow()\n    Renewing --> Idle: release(scope) / releaseAll()\n    HeldNoTimer --> Idle: release(scope)\n```\n\nKey behaviours:\n- `take` is idempotent per scope, so it is safe to call on every keystroke.\n- `HOLD_RENEW_MS` is 30 s. Rust lets a hold lapse after about two minutes, so a vanished editor can never block sync permanently.\n- Nothing is renewed while the document is hidden. `visibilitychange` triggers `renewNow`.\n- Failures of `hold` or `release` are swallowed. The worst case is that a change lands without waiting.\n- `releaseAll` releases every held scope in parallel.\n- The factory `editingHold(entity, entityId)` wires `commands.editingHold` and `commands.editingRelease` from `ipc/bindings`, plus `setInterval` and the document visibility APIs. Tests inject fakes through `EditingHoldDeps` (see `editing-hold.test.ts`).\n\n## Leave guard (`leave-guard.svelte.ts`)\n`LeaveGuard.ask()` sets the reactive `open` flag and returns a Promise. `answer(leave)` closes the dialog and resolves that Promise. A confirmation dialog is bound to `open`, so navigation can `await guard.ask()` before leaving unsaved work. One caveat: calling `ask()` twice replaces the pending resolver, so the first Promise never settles.\n\n## Settings draft (`settings/draft.svelte.ts`)\n`SettingsDraft` holds unsaved Settings edits (N9-B) on top of a saved snapshot, using Svelte runes.\n- `get`, `set`: `set` stores an edit only if it differs from the saved value (compared via JSON). Setting a value back to the saved one removes the edit.\n- `dirty`, `changes()` (as `SettingsChange[]` for `settings_save`), `merged()` (for previews), `discard()`.\n- `commit()` makes the edits the new saved values after a successful save.\n- `rebase(saved)` takes a new snapshot, for example one pushed by sync, and keeps only edits that still differ from it.\n\nThe save flow itself lives in [Home_and_Settings_Modules](Home_and_Settings_Modules.md) (`SaveState`).\n\n## Time helpers (`time/`)\n- `greetingFor(date)` returns `morning` (05–12), `afternoon` (12–17), `evening` (17–22) or `night`.\n- `greetingText(date, name)` returns \"Good morning, Name\", or just \"Good night\" when the name is blank. It feeds the Home module's `homeName`.\n- `relativeTime` is covered by `relative.test.ts` (N15-A): \"just now\", \"N min ago\", \"N h ago\", \"yesterday\", \"N days ago\", then an absolute date from 7 days on, with the year shown only if it is not the current one. Future times read \"just now\".\n\n## Testing\nVitest suites sit beside the sources: `bare-key.test.ts`, `editing-hold.test.ts`, `long-press.test.ts`, `time/greeting.test.ts` and `time/relative.test.ts`. They inject timers, visibility and Rust calls, so no DOM or Tauri runtime is needed. Run them with `make test` (the `test` script in `package.json`).\n", "Frontend_Platform_and_Shell/Home_and_Settings_Modules.md": "# Home_and_Settings_Modules\n\nSmall, pure-logic helpers behind the **Home** and **Settings** pages of the Mnemora frontend. The Svelte pages (`HomePage.svelte`, `SettingsPage.svelte`, `UnsavedDialog.svelte`, `sections/About.svelte`) hold the markup. The three files documented here hold the testable logic.\n\n| Component | File | Purpose |\n|---|---|---|\n| `homeName` | `src/modules/home/greeting-name.ts` | Chooses the name shown in the Home greeting |\n| `buildDiagnostics` | `src/modules/settings/diagnostics.ts` | Builds the bug-report text in Settings → About |\n| `SaveState` (`save`) | `src/modules/settings/save.svelte.ts` | Saves or discards the Settings draft |\n\n## Architecture\n\n```mermaid\ngraph TD\n  HomePage[HomePage.svelte] --> homeName\n  homeName -->|displayName| Core[core settings]\n  homeName -->|os_first_name| AppInfo[app_info command]\n\n  SettingsPage[SettingsPage.svelte] --> save[save: SaveState]\n  UnsavedDialog[UnsavedDialog.svelte] --> save\n  save --> Draft[settingsDraft store]\n  save --> IPC[commands.settingsSave via unwrap]\n  IPC --> Rust[Tauri settings_save]\n\n  About[sections/About.svelte] --> buildDiagnostics\n  buildDiagnostics --> Errors[recentUiErrors]\n```\n\n## Components\n\n### `homeName(displayName, osFirstName)`\nPicks the greeting name in this order:\n1. The user's display name, trimmed, if it is non-empty.\n2. The OS first name, trimmed. The comment in the source says Rust has already sanitised it.\n3. An empty string, so the greeting shows no name.\n\n`HomePage.svelte` calls it as `homeName(core.displayName, info.data?.os_first_name)`. Time-of-day wording comes from `greetingText` (see [App_Bootstrap_and_Platform_Utilities](App_Bootstrap_and_Platform_Utilities.md)). The function is pure and has a unit test.\n\n### `buildDiagnostics(input)`\nTakes a `DiagnosticsInput`: `version`, `environment`, `os`, `userAgent`, and `errors` (a list of `{at, message}`). It returns plain text:\n\n```\nMnemora <version> (<environment>)\nOS: <os>\nUser agent: <ua>\nRecent UI errors:\n  <at> <message>      (or \"  none\")\n```\n\nBy design it contains no Settings values or file paths, so a user can paste it into a bug report. `About.svelte` builds the input. The recent UI errors come from the IPC layer (`recentUiErrors`, see [IPC_Bridge_and_Core_Mocks](../IPC_Bridge_and_Browser_Mocks/IPC_Bridge_and_Core_Mocks.md)).\n\n### `SaveState` / `save`\n`SaveState` is a Svelte 5 rune class with a single exported instance, `save`. Its reactive fields are `saving` (boolean) and `error` (unknown).\n\n- `run(): Promise<boolean>`\n  - Reads `settingsDraft.changes()`. If there are none, it returns `true` without calling Rust.\n  - Otherwise it sets `saving`, clears `error`, and calls `commands.settingsSave(changes)` through `unwrap`.\n  - On success it calls `settingsDraft.commit()` and returns `true`.\n  - On failure it stores the error and returns `false`. The draft is left untouched, so the user can retry and no edits are lost (the \"N9-B\" rule from the source comment).\n  - `saving` is reset in a `finally` block.\n- `discard()`: calls `settingsDraft.discard()` and clears `error`.\n\n```mermaid\nsequenceDiagram\n  participant UI as SettingsPage / UnsavedDialog\n  participant S as save\n  participant D as settingsDraft\n  participant R as Rust settings_save\n  UI->>S: run()\n  S->>D: changes()\n  alt no changes\n    S-->>UI: true\n  else changes\n    S->>R: settingsSave(changes)\n    alt ok\n      S->>D: commit()\n      S-->>UI: true\n    else error\n      S->>S: error = e\n      S-->>UI: false (draft kept)\n    end\n  end\n```\n\nBoth `SettingsPage.svelte` and `UnsavedDialog.svelte` use `save`. The dialog is what appears when the user leaves Settings with unsaved edits, the same pattern as `LeaveGuard` in [App_Bootstrap_and_Platform_Utilities](App_Bootstrap_and_Platform_Utilities.md).\n\n## Related modules\n- The backend command and validation: [Tauri_Host_and_IPC_Bridge](../Tauri_Host_and_Command_Layer/Tauri_Host_and_IPC_Bridge.md) (`settings_save`, `app_info`) and [Core_Foundation](../Core_Foundation.md) (settings schema and sync).\n- Where the module settings sections and Home cards are registered: [Shell_and_Navigation](Shell_and_Navigation.md) (`homeCards`, `moduleSettingsSections`).\n", "Frontend_Platform_and_Shell/Router.md": "# Router\n\nThe Router (`src/lib/router/`) is the navigation layer of the Mnemora frontend. It wraps [sv-router](https://www.npmjs.com/package/sv-router) in history mode and builds the route table from **Module manifests**, so each feature Module declares its own pages. It also holds the pieces that make navigation feel native: Android Back handling, animated route changes, query-string state, and the dynamic ⌘K actions Modules contribute.\n\nThe shell that consumes the router is described in [Shell_and_Navigation](Shell_and_Navigation.md). Boot and platform helpers (`os`, etc.) are in [App_Bootstrap_and_Platform_Utilities](App_Bootstrap_and_Platform_Utilities.md).\n\n## Files and responsibilities\n\n| File | Role |\n|---|---|\n| `manifest.ts` | Types: `ModuleManifest`, `RoutePath`, `ModuleContext`, `ModuleAction`, `BareKey`, `NavTree`, `ModuleBadge`, `DeviceSwitch`, … The contract between Modules and the shell. |\n| `routes.ts` | `buildRoutes` (flatten manifests into one path→loader map, rejecting duplicates) and `navEntries` (sorted nav list). |\n| `create.ts` | `createAppRouter`: wraps sv-router and exposes `navigate`, `href`, `isActive`, `isWithin`, `pathname`. |\n| `path.ts` | `splitPath` (path + query) and `isWithin` (sub-page test). |\n| `view-transition.ts` | `withViewTransition`: runs a route change inside a View Transition. |\n| `back-button.svelte.ts` | Android hardware Back: `interceptBack`, `closeOnBack`, `handleBack`, `installBackButton`. |\n| `url-param.ts` | `urlParam`: reactive single query-parameter state. |\n| `dynamic-actions.svelte.ts` | `dynamicActions`: data-dependent palette actions per Module. |\n\n## Architecture\n\n```mermaid\ngraph TD\n    M[Module manifests] -->|routes| BR[buildRoutes]\n    M -->|nav.order| NE[navEntries]\n    BR --> CR[createAppRouter]\n    CR --> SV[sv-router]\n    CR --> SP[splitPath / isWithin]\n    CR --> VT[withViewTransition]\n    SV --> UP[urlParam]\n    BB[back-button] -->|history.back| SV\n    OV[Sheets / Popovers / Dialogs] -->|closeOnBack| BB\n    ED[Inline editors] -->|interceptBack| BB\n    MO[Module overlays] -->|set / clear| DA[dynamicActions]\n    DA --> PAL[Command palette]\n    CR --> SH[Shell & sidebar]\n    NE --> SH\n```\n\n## Route table and navigation\n\n`buildRoutes(manifests)` iterates every `routes` entry of every manifest. Two Modules claiming the same path throw `Route <path> is registered twice (<id>)` at registration, so conflicts surface at start-up rather than as silent shadowing. `navEntries` sorts manifests by `nav.order` and links each to its first route (manifests without routes are skipped).\n\n`createAppRouter(manifests)` casts sv-router's generated typings to a plain string form, since the table is runtime-built; paths are validated as `RoutePath` (`` `/${string}` ``) instead.\n\n### `navigate` behaviour\n\n```mermaid\nflowchart TD\n    A[navigate path, opts] --> B[splitPath -> pathname, search]\n    B --> C{already on pathname?}\n    C -- yes, no query --> D[resolve, do nothing]\n    C -- yes, with query --> E[replace = true]\n    C -- no --> F[replace = opts.replace]\n    E --> G[withViewTransition router.navigate]\n    F --> G\n```\n\n- Landing on the open page with a query (`/todo?task=<id>`) **replaces** the history entry, so Back doesn't step through a no-op.\n- Navigating to the current page with no query is a no-op.\n- `isActive` is exact; `isWithin` also matches sub-pages (`/sync` while `/sync/activity` is open). `href` returns the base-aware URL.\n\n## View transitions\n\n`withViewTransition(update)` uses `document.startViewTransition` when available and motion is not reduced (`data-reduce-motion=\"true\"` or `prefers-reduced-motion`); otherwise it just runs `update`. While it runs, `<html data-view-transition>` is set so the CSS keyframe fade is disabled and the page never fades twice. After `update` the code awaits `tick()` so the new route is in the DOM before the snapshot.\n\nEdge cases (covered by `view-transition.test.ts`):\n- A transition **superseded** by a newer one rejects with `AbortError`; this is swallowed because the update already ran, and the result is still returned.\n- Real errors propagate to the caller.\n- A monotonically increasing `latestTurn` ensures only the newest transition clears the marker.\n\n## Android Back handling\n\n```mermaid\nflowchart TD\n    P[Back pressed] --> I{interceptor registered?}\n    I -- yes --> H[call newest interceptor]\n    I -- no --> C{canGoBack?}\n    C -- yes --> G[history.back]\n    C -- no --> L[leave app]\n```\n\n- `interceptBack(handler)` pushes onto a stack and returns an unregister function; the newest handler wins.\n- `closeOnBack(isOpen, close)` is for overlays: it must be called during component init, as it registers a `$effect` that intercepts Back only while `isOpen()` is true.\n- `installBackButton()` is a no-op unless `os === 'android'` and running inside Tauri. It lazily imports `@tauri-apps/api/app` and subscribes to `onBackButtonPress`. \"Leave\" prefers the native `window.MnemoraAndroid.moveTaskToBack` bridge (see [Android_Integration](../Android_and_Home-Screen_Widget_Platform/Android_Integration.md)); `exit(0)` is only a fallback because it aborts while the render thread is still drawing (#51).\n\n## Query-string state: `urlParam`\n\n`urlParam.get/set/delete` wrap sv-router's `searchParams`. Reads are reactive; writes push a history entry (so Back undoes them) unless `replace` is passed. Used for state that should survive reload and answer Back, e.g. an open Todo task sheet at `/todo?task=<id>` (see [Todo_Frontend](../Todo_Frontend.md)).\n\n## Dynamic palette actions\n\n`dynamicActions` (`DynamicActions`) keeps a `$state.raw` map of Module id → `ModuleAction[]`, for ⌘K actions that depend on loaded data (Todo's \"Go to ‹List›\"). `set` and `clear` read the previous map with `untrack`, so an effect that sets actions does not depend on them and loop. A Module's always-on overlay sets them on mount and clears them when it unmounts (i.e. when the Module is switched off); `of(moduleId)` returns them for the palette alongside the manifest's static `paletteActions`. See [Shell_and_Navigation](Shell_and_Navigation.md) for palette assembly.\n\n## The manifest contract\n\n`ModuleManifest` is how a Module describes itself to the shell without the shell or the Module importing each other: routes, nav order/placement, nav tree and rail flyout, badge hooks, Home card, Settings section, palette actions, bare keys, phone-tab behaviour, an always-mounted overlay, default-enabled flag/device switch, and `openLink` for `mnemora://` deep links. Modules receive a `ModuleContext` (`navigate`, `isActive`) rather than the shell itself. Enabled-state logic lives in the shell (`enabled-modules.ts`, see [Shell_and_Navigation](Shell_and_Navigation.md)).\n\n## Tests\n\n- `routes.test.ts`: flattening, duplicate rejection, nav ordering.\n- `back-button.test.ts`: interceptor → history → leave precedence.\n- `view-transition.test.ts`: superseded transitions, error propagation, marker ownership.\n- `path.test.ts`: path splitting and sub-page matching.\n", "Frontend_Platform_and_Shell/Shell_and_Navigation.md": "# Shell and Navigation\n\nThe shell (`src/shell/`) is the frame around every Module screen. It decides which Modules are on, applies the appearance to `<html>`, owns the sidebar layout and its tree fold, resolves keyboard shortcuts, builds the ⌘K palette, and turns `mnemora://` links into routes. It holds no domain logic. Modules plug in through a `ModuleManifest` (see [Router](Router.md)), and the shell reads those manifests.\n\nRelated pages: [App Bootstrap and Platform Utilities](App_Bootstrap_and_Platform_Utilities.md) (boot, viewport, keyboard), [Router](Router.md) (manifest types, router creation), [Theme](Theme.md) (`applyAppearance`), [Home and Settings Modules](Home_and_Settings_Modules.md), and [Tauri Host and IPC Bridge](../Tauri_Host_and_Command_Layer/Tauri_Host_and_IPC_Bridge.md) (the `device_*`, `settings_save` and `app_take_links` commands).\n\n## Architecture\n\n```mermaid\ngraph TD\n  Registry[registry: modules manifests] --> Enabled[useEnabledModules]\n  Settings[settingsQuery / readCore] --> Enabled\n  Enabled --> EM[enabled-modules.ts pure helpers]\n  EM --> Home[homeCards]\n  EM --> Over[overlayModules]\n  EM --> SS[moduleSettingsSections]\n  EM --> Redir[redirectForDisabled]\n  EM --> Bare[bareKeyFor]\n  PT[phone-tabs.ts] --> Redir\n  Settings --> Appear[useAppearance] --> Theme[applyAppearance on html]\n  Device[deviceQuery] --> Persist[useSidebarPersistence]\n  Persist <--> State[ShellState shell]\n  State --> Layout[sidebar-layout.ts]\n  State --> Fold[tree-fold.ts]\n  Keys[shortcuts.ts resolveShortcut] --> Cmds[shell-commands.ts runShortcut]\n  Cmds --> State\n  Palette[paletteItemsFor] --> State\n  Links[deep-links.ts] --> Router[router.navigate]\n  Registry --> Links\n```\n\nMost files are pure functions (testable without Svelte). Files ending in `.svelte.ts` hold reactive state or effects, and must be called during component setup.\n\n## Components\n\n### Module enablement: `enabled-modules.ts` and `enabled.svelte.ts`\n\n`enabledModules(manifests, disabled, optedIn)` is the single rule:\n\n- `required` Modules (Home, Settings) are always on.\n- Default-on Modules are on unless their id is in `disabled`.\n- Modules with `defaultEnabled === false` (Sync) are on only if listed in `optedIn`. The `disabled` list is ignored for them.\n\nHelpers built on that list:\n\n| Helper | Purpose |\n|---|---|\n| `setModuleEnabled(disabled, id, on)` | New disabled list, without duplicates. |\n| `setOptedIn(optedIn, id, on)` | New opted-in list, as a plain set of ids. |\n| `bareKeyFor(enabled, key, ctx)` | First enabled Module, by `nav.order`, whose `bareKeys` claim the key (case-insensitive) and whose `when(ctx)` holds. |\n| `overlayModules` | Enabled Modules that mount an always-on overlay, in nav order. |\n| `homeCards` | `{ id, load }` for each enabled Module with a home card. |\n| `moduleSettingsSections` | Settings sections added by enabled Modules after the core ones. |\n| `redirectForDisabled(pathname, all, enabled)` | Returns `'/'` when the path belongs to a disabled Module, else `null`. Owner lookup uses `activeModuleId` from `phone-tabs.ts` (longest matching path prefix). |\n\n`useEnabledModules()` wraps this for the UI. It combines the saved Settings (`core.disabledModules`, `core.enabledOptionalModules`, never a pending draft) with Modules whose switch is a Device setting (`m.deviceSwitch(moduleContext)`). It exposes `list` and `ready`. `ready` stays false until every device switch has been read, so a default-off Module's URL is not redirected Home during startup.\n\n### Phone tabs: `phone-tabs.ts`\n\nPure logic for the phone bottom bar. The bar holds at most `MAX_TABS = 4`.\n\n- `toggleTab` adds or removes a tab. Adding past the maximum returns the same array.\n- `moveTab` reorders by one step and ignores out-of-range moves.\n- `visibleTabs(stored, known)` drops ids of Modules that no longer exist and caps at 4.\n- `activeModuleId` maps a pathname to its owning Module.\n- `isMoreActive` lights \"More\" when the current Module is not pinned to a tab.\n\n### Appearance: `appearance.svelte.ts`\n\n`useAppearance()` rebases `settingsDraft` onto fetched settings and applies the theme to `document.documentElement`. Theme and other draft edits preview live. **Reduce motion** always comes from the saved values, so it waits for Save. With `theme === 'system'` it subscribes with `watchSystemTheme`. Until settings arrive, the pre-paint attributes stay.\n\n### Shell state and sidebar: `shell-state.svelte.ts`, `sidebar-layout.ts`, `sidebar-persist.svelte.ts`\n\n`ShellState` (singleton `shell`) holds `paletteOpen`, `layout`, `treeOpen`, `treeUnset` and `layoutReady`. It offers `toggleSidebar()` and `resetSidebar()`.\n\n`sidebar-layout.ts` defines the geometry: min 200, max 360, default 248, rail 60, and a snap threshold of 150. `settleDrag(px, current)` collapses to the rail below 150 px, remembering the expanded width. Otherwise it expands with the width clamped. `shownWidth` returns the rail or expanded width.\n\n`useSidebarPersistence()` has three effects:\n\n1. Once the device query settles (success or error), restore `layout`, `treeOpen` and `treeUnset`, then set `layoutReady`.\n2. Persist `treeOpen` through `commands.deviceSetTodoOpen`, debounced, only when a fold choice exists (`!treeUnset`).\n3. Persist the layout through `commands.deviceSetSidebar`, debounced.\n\n`layoutReady` guards against overwriting the saved layout with defaults before it loads.\n\n```mermaid\nsequenceDiagram\n  participant UI as Sidebar UI\n  participant S as shell state\n  participant P as useSidebarPersistence\n  participant R as Rust device settings\n  P->>R: deviceQuery\n  R-->>P: sidebar width, rail, todo_open\n  P->>S: set layout, treeOpen, layoutReady\n  UI->>S: drag / toggle\n  S-->>P: effect re-runs\n  P->>R: deviceSetSidebar (debounced)\n```\n\n### Tree fold: `tree-fold.ts`\n\nThe rule for a Module's nested sidebar tree (Todo's views and Lists):\n\n- `onNavigate(fold, inside)`: entering unfolds, leaving folds, staying keeps the user's choice.\n- `toggle`: the chevron flips the tree wherever you are.\n- `rowClick`: inside the Module a click toggles, outside it navigates there.\n- `initialOpen(saved, inside)`: a saved choice wins, otherwise open when inside.\n\nA manual flip lasts only until the next enter or leave.\n\n### Shortcuts and commands: `shortcuts.ts`, `shell-commands.ts`\n\n`resolveShortcut(event, mac)` returns `{type:'palette'}` for ⌘/Ctrl+K and `{type:'sidebar'}` for ⌘/Ctrl+`\\`. It matches the physical `code` as well as `key`, so non-US layouts work. `\\` also accepts Alt/Shift. All other navigation uses bare keys (ADR 0011), resolved by `bareKeyFor`. `SHORTCUT_LIST` is the data behind the Keyboard shortcuts help in Settings.\n\n`runShortcut` toggles the palette, or the sidebar when not on a phone. `paletteItemsFor(enabled)` builds ⌘K items through `buildPaletteItems`. Its theme commands save at once through `commands.settingsSave` with the key `core.theme`, with no draft, and report failures with `notifyError`.\n\n### Deep links: `deep-links.ts`\n\n`routeForLink` parses `mnemora://‹module›?...`. The host names the Module, and its `openLink` hook sets state and returns a path. A bad URL, unknown host or missing hook goes to `/`. `startLinkBridge(deps)` first listens for `linkOpenedEvent`, then drains the queue from `appTakeLinks`. Only the newest link matters. The first drain uses `replace`, so a cold start has no Home entry behind it. `startAppLinkBridge` wires it to the real commands, events, router and registry.\n\n```mermaid\nsequenceDiagram\n  participant W as Widget / OS\n  participant H as Rust PendingLinks\n  participant B as startLinkBridge\n  participant R as router\n  W->>H: open mnemora://todo?...\n  B->>H: listen LinkOpenedEvent\n  B->>H: appTakeLinks (replace=true)\n  H-->>B: queued links\n  B->>R: navigate(routeForLink(newest))\n  H-->>B: LinkOpenedEvent later\n  B->>R: navigate (push)\n```\n\n## Tests\n\n`enabled-modules.test.ts`, `tree-fold.test.ts` and `shortcuts.test.ts` cover the pure logic. They check required Modules, default-off opt-in, redirects, bare-key ownership by nav order, fold transitions and layout-independent key matching.\n", "Frontend_Platform_and_Shell/Theme.md": "# Theme\n\nThe Theme module (`src/lib/theme/`) decides how Mnemora looks at runtime. It turns the saved theme preference (`system`, `light`, `dark` or `oled`) into a concrete theme, writes it onto the root element as `data-*` attributes, and tells the Android shell to restyle the status and navigation bars. Its tests also guard the design tokens in `tokens.css`: WCAG contrast, and agreement between those tokens and the first-paint style in `index.html`.\n\nThe app shell calls this module through `useAppearance`, which is documented in [Shell_and_Navigation](Shell_and_Navigation.md). Settings storage is outside this module. See [Home_and_Settings_Modules](Home_and_Settings_Modules.md) and [Core_Foundation](../Core_Foundation.md) for settings. The token and component rules are in [Design_System_and_UI_Components](../Design_System_and_UI_Components.md).\n\n## Files\n\n| File | Role |\n|---|---|\n| `resolve.ts` | `ThemePref`, `ResolvedTheme`, and `resolveTheme(pref, matchMedia)`. |\n| `apply.ts` | `applyAppearance` writes the root attributes. `watchSystemTheme` follows OS changes. |\n| `system-bars.ts` | `AndroidBridge`, `cssColorToHex`, `syncSystemBars`, `applySystemBars`. `toHexByte` is a helper. |\n| `tokens.css` | The colour tokens for the light, dark and OLED themes. The tests read this file. |\n| `contrast.test.ts` | Checks WCAG contrast of token pairs in each theme. |\n| `first-paint.test.ts` | Checks that `index.html` repeats `--bg` and `color-scheme` from `tokens.css`. |\n| `resolve.test.ts` | Checks `resolveTheme`. |\n\n`apply.ts`, `resolve.ts` and `tokens.css` are not among the core components provided. I read `apply.ts` and `resolve.ts` directly. I did not read `tokens.css`, so its contents are described only through what the tests assume.\n\n## Architecture\n\n```mermaid\ngraph TD\n    Pref[\"CoreSettings.theme / density / textSize / reduceMotion\"] --> Apply[\"apply.ts: applyAppearance\"]\n    OS[\"OS prefers-color-scheme\"] --> Resolve[\"resolve.ts: resolveTheme\"]\n    Apply --> Resolve\n    Watch[\"watchSystemTheme\"] -->|change event| Shell[\"shell: useAppearance\"]\n    Shell --> Apply\n    Apply -->|data-theme, data-theme-pref, data-density, data-text-size, data-reduce-motion| Root[\"document root\"]\n    Root --> Tokens[\"tokens.css selectors\"]\n    Apply --> Bars[\"system-bars.ts: applySystemBars\"]\n    Bars -->|reads body background| Canvas[\"cssColorToHex via 1x1 canvas\"]\n    Bars --> Android[\"window.MnemoraAndroid.setSystemBars\"]\n    Android --> MainActivity[\"Android MainActivity\"]\n```\n\nThe comment in `apply.ts` says it \"mirrors what Rust's pre-paint script sets\". The Rust host sets the attributes before first paint, and `applyAppearance` applies later changes with the same attributes. Live updates and first paint therefore agree.\n\n## Resolving the theme\n\n`ThemePref` is `'system' | 'light' | 'dark' | 'oled'`. `ResolvedTheme` drops `'system'`.\n\n`resolveTheme(pref, matchMedia)` returns an explicit choice unchanged, including `oled`. For `system` it evaluates `(prefers-color-scheme: dark)` and returns `dark` or `light`. System never resolves to `oled`. `matchMedia` is passed in so the function can be tested without a DOM. `resolve.test.ts` covers both branches with a fake `matchMedia`.\n\n## Applying the appearance\n\n`applyAppearance(root, appearance, resolved?)` takes the `theme`, `density`, `textSize` and `reduceMotion` fields of `CoreSettings`.\n\n- Sets `data-theme` to the resolved theme and `data-theme-pref` to the raw preference.\n- Sets `data-density`, `data-text-size` and `data-reduce-motion` (the last as a string).\n- Calls `applySystemBars(theme)` last, so the body background already reflects the new attributes.\n\n`watchSystemTheme(onChange)` listens for `change` on the dark media query and returns an unsubscribe function. It is how `system` re-resolves when the OS flips between light and dark.\n\n```mermaid\nsequenceDiagram\n    participant OS\n    participant Shell as useAppearance\n    participant Apply as applyAppearance\n    participant Bars as applySystemBars\n    partic
