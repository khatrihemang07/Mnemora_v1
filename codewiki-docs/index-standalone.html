tion_Engine](../Sync_Replication_Engine.md)).\n\n## Deep links (`links.rs`)\n\nThe Android runtime reports `mnemora://…` URLs (from Todo widget taps) as \"opened URL\" events. On a cold start these can arrive before setup is done and before the UI is listening. The flow:\n\n```mermaid\nsequenceDiagram\n    participant OS as Runtime (RunEvent::Opened)\n    participant L as links::accept\n    participant Q as PendingLinks\n    participant UI\n    OS->>L: urls\n    L->>Q: push (scheme filter, ≤2048 chars, ring of 16)\n    L-->>UI: LinkOpenedEvent (if any kept)\n    UI->>Q: app_take_links()\n    Q-->>UI: queued links, oldest first (queue emptied)\n```\n\nThe event carries no payload. Draining is the only way to read a link, so a link is never handled twice. A hostile intent cannot fill memory because of the scheme, length and count caps. The UI side is `startAppLinkBridge` in [Shell_and_Navigation](../Frontend_Platform_and_Shell/Shell_and_Navigation.md). The widget side is in [widget_bridge](../Android_and_Home-Screen_Widget_Platform/widget_bridge.md).\n\n## Test harness (`test_support.rs`)\n\n- **`TestApp`** builds a real `AppState` on an in-memory database migrated with every Module. It runs the Module startup hooks, mounts the full command registry on `MockRuntime`, and exposes:\n  - `invoke(cmd, json)`, which goes through Tauri's IPC and returns the deserialised result or the serialised `AppError`;\n  - `with_db`, `restart`, `set_pref`, `handle`, `widget_signals`, and `clock`.\n  - Constructors: `new`, `syncing`, `upgrading(seed, device)` and `legacy(old, device)`.\n- **`TestClock`** can be frozen, advanced or skewed, so tests can simulate devices with different clocks. It is installed with `db::set_time_source`.\n- **`Cluster`** is several syncing `TestApp`s with clocks frozen at `START`, synced pairwise over the sync crate's in-memory transport (`try_sync` with an optional `cut_after`, `sync`, `sync_all`). The test suites that use it are described in [Sync_Replication_Engine](../Sync_Replication_Engine.md).\n- Helpers such as `tasks_of`, `overdue_of`, `inbox_tasks_of` and `close_all_on` flatten grouped Todo views and pin closed times.\n\n`legacy_db_tests.rs` builds a previous-release database by running each Module's own migrations only up to the old version (core 2, journal 2, todo 4). That way the old schema cannot drift from the real history. It then boots the app and checks that:\n\n- all migrations apply, with integrity and foreign-key checks passing;\n- change-log rows survive and get a stable order (`origin_device`, HLC, `seq`);\n- comments edited before the upgrade still read as edited;\n- look preferences move to the device file;\n- Sync tables are empty and nothing is running until Sync is turned on;\n- the screens still read old data.\n\n## How it fits into the system\n\n```mermaid\ngraph LR\n    FE[\"IPC_Bridge_and_Browser_Mocks / frontend modules\"] <-->|\"commands + typed events\"| HOST[\"Tauri_Host_and_IPC_Bridge\"]\n    HOST --> CORE[\"Core_Foundation\"]\n    HOST --> DOM[\"Domain_Modules_(Todo_and_Journal)\"]\n    HOST --> AI[\"AI_Assistant_Backend\"]\n    HOST --> SYNC[\"Sync_Replication_Engine\"]\n    HOST --> AND[\"Android_and_Home-Screen_Widget_Platform\"]\n    HOST -.tests.-> BT[\"Backend_Integration_Test_Suites\"]\n```\n\nBuild and packaging, including the `sandbox` feature, `src-tauri/build.rs` and `make bindings`, are covered in [Build_and_Packaging](../Build,_Tooling_and_Packaging/Build_and_Packaging.md).\n\n## Extension guidance\n\n- **Add a command.** Write it in the right domain file with `#[tauri::command]` and `#[specta::specta]`. Add it to `collect_commands!` in `specta_builder_for!`, run `make bindings`, and add a frontend mock for browser mode. Keep the logic in the domain crate.\n- **Add an event.** Derive `Event` and `Type`, add it to `collect_events!`, and emit it from a bus subscriber in `follow_remote` (or from the relevant command).\n- **Add a Module.** Register it in `modules()`, and add its change event to `announce_remote_change` if Sync can change its data.\n- **Lock discipline.** Hold the database lock only briefly. `follow_remote` shows the pattern of moving slow work to `spawn_blocking` when a session already holds the lock.\n", "Tauri_Host_and_Command_Layer/Todo_Domain_Service.md": "# Todo_Domain_Service\n\n`src-tauri/src/todo.rs` is the Tauri command layer for Todo. It is deliberately thin: each `#[tauri::command]` locks the shared database connection, calls one function in the `mnemora-todo` crate, and returns the result as a typed `AppError`/DTO. All rules (validation, repeats, ordering, change-log records) live in the domain crate. See [Todo_Tasks_and_Lists](../Domain_Modules_(Todo_and_Journal)/Todo_Tasks_and_Lists.md), [Todo_Comments](../Domain_Modules_(Todo_and_Journal)/Todo_Comments.md) and [Todo_Widget](../Domain_Modules_(Todo_and_Journal)/Todo_Widget.md).\n\nThe module also owns the command-level integration tests (`todo_capture_tests.rs`, `todo_order_tests.rs`, `todo_search_tests.rs`, plus the tests inside `todo.rs`). They drive the real commands through the mock runtime (`TestApp`, ADR 0009) and share JSON fixtures with the browser mock (see [IPC_Todo_Mocks](../IPC_Bridge_and_Browser_Mocks/IPC_Todo_Mocks.md)).\n\n## Architecture\n\n```mermaid\ngraph TD\n    UI[Svelte Todo frontend<br/>generated bindings] -->|invoke| CMD[src-tauri/src/todo.rs<br/>todo_* commands]\n    CMD -->|lock state.db| DB[(SQLite Connection)]\n    CMD --> TODO[mnemora-todo crate]\n    TODO --> DB\n    CMD -->|after successful write| WID[state.widgets.todo_changed]\n    WID --> ANDROID[Home-screen widget]\n    TODO --> LOG[(change_log)]\n    LOG --> SYNC[Sync engine]\n```\n\nRelated: [Tauri_Host_and_IPC_Bridge](Tauri_Host_and_IPC_Bridge.md) (`AppState`, `lock`, events such as `TodoChangedEvent`), [Todo_Frontend](../Todo_Frontend.md), [Android widget platform](../Android_and_Home-Screen_Widget_Platform.md), [Sync_Replication_Engine](../Sync_Replication_Engine.md).\n\n## The `write` helper\n\nEvery command that mutates Tasks or Lists goes through one private function:\n\n```rust\nfn write<T>(state: &AppState, job: impl FnOnce(&mut Connection) -> Result<T, AppError>)\n```\n\nIt runs the job under the DB lock and, only when it returned `Ok`, calls `state.widgets.todo_changed()` so the widget redraws. Centralising this means a new write command cannot forget the widget. Comment commands and Settings do **not** use it (they do not change what the widget draws); read commands never signal. Tests in `widget_tests.rs` ([widget_tests](../Android_and_Home-Screen_Widget_Platform/widget_tests.md)) assert this signalling.\n\n```mermaid\nsequenceDiagram\n    participant FE as Frontend\n    participant C as todo command\n    participant W as write()\n    participant D as mnemora-todo\n    participant Wg as widgets\n    FE->>C: invoke(todo_task_complete)\n    C->>W: write(state, job)\n    W->>D: complete_task(&mut conn,...)\n    D-->>W: Result\n    alt Ok\n        W->>Wg: todo_changed()\n    end\n    W-->>FE: Result / AppError\n```\n\n## Command catalogue\n\nRead commands take a `LocalNow` (`today`, `now`, `offset_min`) because \"today\" is the device's day, not the server's. A malformed clock is a `validation` error.\n\n| Area | Commands | Notes |\n|---|---|---|\n| Views | `todo_inbox`, `todo_today`, `todo_upcoming`, `todo_all`, `todo_list`, `todo_lists` (sidebar), `todo_counts` (badge/Home card), `todo_done` (paged by day with a cursor), `todo_day_counts` (dots in the When picker) | Grouping and sort follow Preferences; invalid saved values fall back to defaults |\n| Task create/read | `todo_task_create`, `todo_task`, `todo_task_history`, `todo_search` | Create accepts `NewWhen` and `NewTaskDetails` (notes, priority, repeat, understood words) |\n| Capture | `todo_parse`, `todo_task_quick_edit`, `todo_task_quick_edit_undo` | `todo_parse` writes nothing; quick edit is one `update` record |\n| Task edits | `todo_task_update` (title+notes autosave by `session_id`), `todo_task_set_priority`, `todo_task_set_when`, `todo_tasks_restore_when`, `todo_tasks_move_overdue`, `todo_task_move`, `todo_task_reorder` | Past dates refused except via Undo; unchanged values log nothing |\n| Completion | `todo_task_complete`, `todo_task_skip`, `todo_task_wont_do`, `todo_task_reopen`, `todo_task_delete`, `todo_task_restore` | Repeating tasks create a done copy; only the latest occurrence can be reopened |\n| Comments | `todo_comments`, `todo_comment_add`, `_edit`, `_delete`, `_restore` | Up to 5000 chars, shown \"edited\" after change; not widget-signalling |\n| Lists | `todo_list_create`, `_rename`, `_set_emoji`, `_set_sort`, `_set_group`, `_reorder`, `_delete`, `_restore` | Names unique ignoring case/accents, ≤ 60 chars; delete returns a `ListDeletion` that restore consumes |\n\n### Notable behaviours\n\n- **Repeating tasks.** Completing creates a `create` record for a done copy (which takes the comments) and a `tick` for the task, resets the checklist and moves the date: \"fixed\" mode steps from the due date (or the first date after today if late); \"after\" mode counts from the completion day. Reopening the latest occurrence deletes the copy, returns comments and rewinds the task, keeping notes edited since.\n- **Skip / Won't do.** Skip moves a repeating task on and logs a `tick` marked skipped; Won't do on a plain task closes it without counting as done, on a repeating task it is a skip.\n- **Undo contracts.** Deletes are soft (rows stay). `todo_list_restore` brings back the list, its deleted tasks and the moved ones; a restored task whose list is gone lands in the Inbox.\n- **Reorder.** `todo_task_reorder` takes `before`/`after` neighbours and a `target` (`GroupKey`s: day, priority, list). Result is one change: `move` if the list changed, `update` otherwise, none if nothing changed; a refused reorder is atomic.\n- **Search.** Every word required, prefix match, quoted phrases exact, accent/case-insensitive, open before done; returns `exact` and typo-tolerant `similar`. Never logs.\n\n```mermaid\nflowchart LR\n    A[todo_parse] -->|spans, date, list, repeat| B[capture box]\n    B --> C[todo_task_create with NewWhen + details]\n    C --> D[(todo_tasks + create change)]\n    D --> E[todo_task_quick_edit / undo]\n```\n\n## Change-log contract\n\nEach successful mutation records `create`, `update`, `move`, `tick`, `delete` or `restore` for the entities `todo_task`, `todo_list` or `todo_comment`; rejected writes and no-op writes record nothing. History lines (`todo_task_history`) are built from this log and never contain the task's own text. This is the input to the [Sync_Replication_Engine](../Sync_Replication_Engine.md).\n\n## Tests\n\n| File | Focus |\n|---|---|\n| `todo.rs` (`mod tests`) | Lifecycle, lists, counts, repeats, done paging, and `the_shared_rule_fixtures_hold` which runs `todo-rules.json` and `todo-order-rules.json` against the real commands |\n| `todo_capture_tests.rs` | `todo_parse` against live lists, capture details validation, quick edit and undo, the `todo.parse_dates` preference |\n| `todo_order_tests.rs` | Reorder logging/atomicity, list sort/group updates, Done-in-Lists preference, device-day handling, refused settings, sort-key migration |\n| `todo_search_tests.rs` | Shared search fixtures, index following edits/deletes/restores, hostile input, snippet windowing |\n\nSee also [todo_sheet_tests](../Backend_Integration_Test_Suites/todo_sheet_tests.md) for the Task-sheet scenarios (comments, history, won't do).\n", "Tauri_Host_and_Command_Layer/window_state.md": "# window_state\n\n`src-tauri/src/window_state.rs` persists desktop window geometry (size, position, maximized flag). On launch it applies the saved geometry to the main window builder (`restore`). While the app runs it watches resize and move events and writes the geometry back to the device settings file, `device.toml` (`track`).\n\nThe module belongs to the [Tauri Host and Command Layer](../Tauri_Host_and_Command_Layer.md). It is called from the host's `setup` in `src-tauri/src/lib.rs` (see [Tauri_Host_and_IPC_Bridge](Tauri_Host_and_IPC_Bridge.md)). The persisted data type, `WindowState`, and the store, `DeviceStore`, are defined in `mnemora_core::device` (see [Core_Foundation](../Core_Foundation.md)).\n\n## Public API\n\n| Function | Role |\n|---|---|\n| `restore(handle, builder, saved)` | Applies the saved size, position and maximized state to a `WebviewWindowBuilder` before the window is created. |\n| `track(window, device)` | Starts persisting geometry changes for an existing window. It is called after the window is built (`lib.rs`). |\n\nThe core component documented here is `restore`. `track` is the matching public function in the same file.\n\n## Architecture\n\n```mermaid\nflowchart LR\n    subgraph Launch\n        A[lib.rs setup] --> B[window_state::restore]\n        B --> C[WebviewWindowBuilder]\n        C --> D[Window created]\n        D --> E[window_state::track]\n    end\n    DS[(DeviceStore / device.toml)] --> B\n    subgraph Runtime\n        E --> F[on_window_event handler]\n        F -->|Resized / Moved| G[capture -> latest]\n        G --> H[mpsc channel]\n        H --> I[debounce thread, 500 ms]\n        I --> J[flush]\n        F -->|CloseRequested| K[capture + flush now]\n        J --> DS\n        K --> DS\n    end\n```\n\n## Restore on launch\n\n`restore` takes the saved `DeviceSettings.window`:\n\n1. It sets `inner_size(w, h)` from the saved values.\n2. It checks whether a position was saved. If both `x` and `y` are `Some` and `is_on_screen` passes, it sets that position. Otherwise it calls `center()`.\n3. It sets `maximized(w.maximized)`.\n\n`is_on_screen` guards against a window saved on a monitor that has since been unplugged. It asks the `AppHandle` for `available_monitors()`. It converts each monitor's position and size to logical units using its scale factor. It then tests the point `(x + 40, y + 10)`, which is inside the window's title-bar area, against each monitor's rectangle. If monitor enumeration fails, it returns `false`, so the window is centered.\n\n```mermaid\nflowchart TD\n    S[saved x,y] -->|None| C[center]\n    S -->|Some| M{point x+40,y+10 on a monitor?}\n    M -->|yes| P[position x,y]\n    M -->|no| C\n```\n\n## Tracking and saving\n\n`track` sets up three pieces of shared state:\n\n- `latest: Arc<Mutex<Option<WindowState>>>` holds the most recent captured geometry that has not been written yet.\n- An `mpsc` channel carries \"something changed\" signals from the event handler to a single long-lived debounce thread.\n- A `flush` closure takes `latest` and writes it with `device.update(|d| d.window = state)`. A failed write is logged with `tracing::warn!` and is not propagated.\n\n**Debounce thread.** It blocks on `rx.recv()`. After the first signal it keeps calling `recv_timeout(DEBOUNCE)`, where `DEBOUNCE` is 500 ms. Each new signal restarts the wait. When the wait times out, it flushes once, so a drag or resize burst becomes one disk write. If the sender is dropped, it flushes once more and exits.\n\n**Window events.**\n- `Resized` and `Moved`: capture the geometry into `latest`, then signal the channel.\n- `CloseRequested`: capture and flush immediately, so the final geometry is saved without waiting for the debounce.\n\n```mermaid\nsequenceDiagram\n    participant W as Window\n    participant H as Event handler\n    participant T as Debounce thread\n    participant D as DeviceStore\n    W->>H: Resized/Moved (many)\n    H->>H: capture() -> latest\n    H->>T: send(())\n    Note over T: restarts the 500 ms wait on each signal\n    T->>D: update(window = latest) after quiet period\n    W->>H: CloseRequested\n    H->>D: capture + flush immediately\n```\n\n## Capturing geometry\n\n`capture(window, previous)` produces the next `WindowState`:\n\n- If the window is maximized, minimized or fullscreen (not \"normal\"), it returns `previous` with only `maximized` updated. The remembered normal size and position are not overwritten by maximized or minimized dimensions, or by a minimized window's off-screen coordinates.\n- Otherwise it sets `maximized = false`. It reads `inner_size` and `outer_position`, converts both to logical units using the scale factor, and rounds them. Size is stored through `to_px`, which rounds and clamps to at least 1. Position is stored through `to_coord`, which rounds and clamps to `i32`, so negative coordinates on multi-monitor setups are preserved.\n\nSaved values are in logical pixels, so they stay valid across displays with different DPI scaling. Both `restore` and `capture` use logical units.\n\nThe baseline `previous` is `latest` if it is set, otherwise the stored `device.get().window`.\n\n## Concurrency notes\n\n- `latest` is protected by the shared `crate::state::lock` helper (`src-tauri/src/state.rs`).\n- Only one extra thread exists per tracked window. The window event handler never blocks on disk I/O, except on `CloseRequested`, where the flush is intentionally synchronous.\n\n## Dependencies\n\n- `mnemora_core::device::{DeviceSettings, DeviceStore, WindowState}`: the persisted model and store.\n- `tauri`: `AppHandle`, `WebviewWindow`, `WebviewWindowBuilder`, `WindowEvent`, and the logical position and size types.\n- `crate::state::lock`: the mutex helper.\n- Related Android and widget platform pieces are in [Android_and_Home-Screen_Widget_Platform](../Android_and_Home-Screen_Widget_Platform.md). Window geometry applies to the desktop only.\n", "Tauri_Host_and_Command_Layer.md": "# Tauri_Host_and_Command_Layer\n\n## Purpose\n\nThis module is the Rust app shell of Mnemora. It lives in `src-tauri/src` as the `mnemora_lib` crate. It connects the domain crates (`mnemora-core`, `-journal`, `-todo`, `-ai`, `-sync`) to Tauri and does four jobs:\n\n- **Startup.** It runs the startup sequence: the environment guard, logging, database open and migration, and Module startup hooks.\n- **Shared state.** It owns `AppState`, which holds the database connection, settings, device store, event bus, sync runtime and AI runtime.\n- **Typed IPC.** It exposes a typed command and event surface to the Svelte frontend. TypeScript bindings are generated through `specta`.\n- **Domain commands.** It provides thin command layers for Todo, Journal, AI and Sync, plus desktop window-geometry persistence.\n\nThe guiding rule is \"Logic belongs in core, not here.\" Each command locks the database, calls one function in a domain crate and returns the result or an `AppError`. The module also holds the integration tests. They drive the real commands through Tauri's mock runtime with `TestApp` and `Cluster`.\n\n## Architecture\n\n```mermaid\ngraph TD\n    UI[\"Svelte UI<br/>generated bindings.ts\"] -- \"invoke(command)\" --> REG[\"specta Builder<br/>command registry\"]\n    REG --> HOST[\"Tauri_Host_and_IPC_Bridge<br/>settings, device, editing holds, deep links\"]\n    REG --> TODO[\"Todo_Domain_Service\"]\n    REG --> JRN[\"Journal_Domain_Service\"]\n    REG --> AI[\"AI_Assistant_Commands\"]\n    REG --> SYNC[\"Sync_Connectivity_and_Pairing\"]\n    REG --> SCA[\"Sync_Conflicts_and_Activity\"]\n    HOST --> STATE[\"AppState<br/>db Mutex, settings, device, bus,<br/>sync, ai, widgets\"]\n    TODO --> STATE\n    JRN --> STATE\n    AI --> STATE\n    SYNC --> STATE\n    SCA --> STATE\n    STATE --> CRATES[\"mnemora-core / journal / todo / ai / sync\"]\n    CRATES --> DB[(\"SQLite\")]\n    BUS[\"EventBus\"] -- \"follow_remote\" --> EV[\"Typed events\"]\n    EV --> UI\n    WS[\"window_state<br/>restore + track\"] --> DEV[(\"device.toml\")]\n    HOST --> WS\n```\n\n### Startup flow\n\n```mermaid\nsequenceDiagram\n    participant R as run()\n    participant S as setup()\n    R->>R: build specta builder, export bindings (debug)\n    R->>S: Tauri setup\n    S->>S: env_guard, logging, device.toml\n    S->>S: db open + migrate Modules, on_startup hooks\n    S->>S: release stale editing holds, EventBus, follow_remote\n    S->>S: SyncRuntime reconcile, AiRuntime, manage AppState\n    S->>S: restore window geometry, create main window\n```\n\n### How the parts relate\n\n- **Host.** [Tauri_Host_and_IPC_Bridge](Tauri_Host_and_Command_Layer/Tauri_Host_and_IPC_Bridge.md) is the foundation. It provides `run`/`setup`, `AppState` and the poison-tolerant `lock` helper. It also provides the `specta_builder_for!` registry and the typed events, and `follow_remote`, which turns `EventBus` messages from Sync into typed events. It owns the cross-cutting commands too: settings, device settings, diagnostics, editing holds and `mnemora://` deep links. Finally, it provides the `TestApp` and `Cluster` test harness.\n- **Domain command layers.** Todo, Journal and AI each lock `state.db` and delegate to their crate.\n  - Todo routes every write through one `write` helper, which signals the Android widget after a successful change.\n  - AI also owns `AiRuntime`. It runs each answer on its own thread and streams `AiRunEvent`s.\n- **Sync command layers.** Connectivity and pairing live in one module and conflicts and activity in another. Connectivity and pairing also own the live network and Android power gating. Conflict resolution writes through the owning domain module's own edit functions, so a resolution syncs like any other edit.\n- **Desktop window.** `window_state` restores the saved size and position at launch. It debounces writes back to `device.toml`.\n\n## Child module documentation\n\n| Module | Scope | Documentation |\n|---|---|---|\n| Tauri_Host_and_IPC_Bridge | Startup, `AppState`, command and event registry, settings, editing holds, deep links, test harness | [Tauri_Host_and_IPC_Bridge](Tauri_Host_and_Command_Layer/Tauri_Host_and_IPC_Bridge.md) |\n| Todo_Domain_Service | `todo_*` commands, widget signalling, Todo command tests | [Todo_Domain_Service](Tauri_Host_and_Command_Layer/Todo_Domain_Service.md) |\n| Journal_Domain_Service | `journal_*` commands: paging, search, soft delete and restore | [Journal_Domain_Service](Tauri_Host_and_Command_Layer/Journal_Domain_Service.md) |\n| AI_Assistant_Commands | AI Run lifecycle, steering, Conversations, Providers, Models, Saved questions, `AiRuntime` | [AI_Assistant_Commands](Tauri_Host_and_Command_Layer/AI_Assistant_Commands.md) |\n| Sync_Connectivity_and_Pairing | Sync settings, Devices tab, pairing, network lifecycle, Android power gating | [Sync_Connectivity_and_Pairing](Tauri_Host_and_Command_Layer/Sync_Connectivity_and_Pairing.md) |\n| Sync_Conflicts_and_Activity | Conflicts, Compare, Activity log, \"Use other instead\", attention summary | [Sync_Conflicts_and_Activity](Tauri_Host_and_Command_Layer/Sync_Conflicts_and_Activity.md) |\n| window_state | Desktop window geometry restore and debounced persistence | [window_state](Tauri_Host_and_Command_Layer/window_state.md) |\n\n## Related modules\n\n- Domain rules: Core_Foundation, Domain_Modules_(Todo_and_Journal), AI_Assistant_Backend and Sync_Replication_Engine.\n- Frontend consumers: IPC_Bridge_and_Browser_Mocks and the Todo, Journal, AI and Sync frontend modules.\n- Android and Home-Screen Widget platform: receives widget signals and `mnemora://` deep links.\n- Backend_Integration_Test_Suites: exercise these commands.", "Todo_Frontend/Todo_Quick_Capture_and_Editing.md": "# Todo Quick Capture and Editing\n\nThis module is the front-end logic behind the Todo module's **capture box** (the \"Add task\" input), **Quick edit** (a Task row that turns into a capture box), the **palette \"Add task\"** action, and the **Task sheet's autosaving title and notes**. Natural-language reading (dates, times, repeats, priorities, `#List`) is done by the Rust parser. This module holds the pure TypeScript rules around it: which words the user keeps as text, how `#List` suggestions work, how pasted text is split, and how typed words and property chips combine into the final fields.\n\nRelated pages: [Todo_Tasks_and_Data](Todo_Tasks_and_Data.md) (queries, dates, prefs, task actions) and [Todo_Views_Navigation_and_Interaction](Todo_Views_Navigation_and_Interaction.md) (views, sheet, keyboard). For the Rust parser and commands see [Todo_Tasks_and_Lists](../Domain_Modules_(Todo_and_Journal)/Todo_Tasks_and_Lists.md) and [Todo_Domain_Service](../Tauri_Host_and_Command_Layer/Todo_Domain_Service.md). The When picker is in [UI_When_Picker](../Design_System_and_UI_Components/UI_When_Picker.md). The browser mock of the parser is in [IPC_Todo_Mocks](../IPC_Bridge_and_Browser_Mocks/IPC_Todo_Mocks.md).\n\n## Files and responsibilities\n\n| File | Responsibility |\n|---|---|\n| `capture.ts` | Pure helpers for the capture box: word decisions, ⌫ behaviour, `#List` suggestions, highlight segments, Quick-edit frozen ranges, paste handling, `resolveFields`. |\n| `understood.ts` | The stored `Task.understood` record: parse, serialize, the \"drift rule\", meaning text, tooltip marks, merge after Quick edit. |\n| `palette-add.ts` | ⌘K \"Add task\": preview line and the actual create. |\n| `quick-add.svelte.ts` | `QuickAdd` store: Q key / \"New task\" routing and the floating box. |\n| `quick-edit.svelte.ts` | `QuickEditing` store: which Task row is currently a capture box. |\n| `steps-prompt.svelte.ts` | `StepsPrompt` store: the \"N steps are still open\" question on completing. |\n| `task-editing.ts` | `TaskEditing`: autosave session for a Task's title and notes. |\n| `when-typed.ts` | `typedWhen`: the When picker's \"Type a date\" reader using the Rust parser. |\n| `*.test.ts` | Unit tests; `capture.test.ts` and `capture-ui.test.ts` also run shared JSON fixtures. |\n\n## Architecture\n\n```mermaid\ngraph TD\n    UI[Capture box / Quick edit / Task sheet components] --> CAP[capture.ts]\n    UI --> UND[understood.ts]\n    UI --> TE[TaskEditing]\n    UI --> QA[QuickAdd store]\n    UI --> QE[QuickEditing store]\n    UI --> SP[StepsPrompt store]\n    PAL[Command palette] --> PA[palette-add.ts]\n    WP[When picker] --> WT[when-typed.ts]\n    PA --> CAP\n    PA --> UND\n    WT --> Q[queries.ts parseCapture]\n    PA --> Q\n    UI --> Q\n    Q --> IPC[Tauri IPC / browser mock]\n    IPC --> RUST[Rust parser + todo commands]\n    QA --> TS[todoSearch]\n```\n\nThe helpers in `capture.ts` and `understood.ts` are deliberately pure. The widget's native Quick add repeats them in Kotlin (`CaptureRules.kt`), and the Rust widget port runs the same cases. Both are kept in step through shared JSON fixtures (`capture-ui.json`, `capture-resolve.json`) that the tests here execute.\n\n## Capture rules (`capture.ts`)\n\n### Word decisions\n`CaptureWords` = `{ ignored: string[]; prefer: Record<kind, key> }`, keyed by the parser's span `key`.\n\n- `ignoreWord` keeps a word as text (× on chip, or ⌫) and forgets any \"use instead\" pointing at it.\n- `recogniseAgain` reverses it (\"kept as text ↺\").\n- `preferWord` picks a word over the winning one; one pick per kind.\n- `ignoreKinds` is used when a property chip is set by hand: all words (spans and alternatives) of those kinds become text and their prefers are dropped, so the chip is not overruled.\n- `pruneWords` forgets decisions about words no longer in the text.\n\n### ⌫ after a recognised word\n`backspaceTarget` returns the key of the word the caret directly follows (or follows by exactly one space). The first ⌫ un-recognises; the second (`justUnrecognised`) or any selection deletes normally.\n\n### `#List` suggestions\n```mermaid\nflowchart LR\n    T[typed text + caret] --> H[hashQuery]\n    H -->|tag at caret end| L[listSuggestions]\n    L -->|prefix matches, exact first| R[list rows]\n    L -->|none match| N[new-list offer]\n    L -->|empty or digits only| X[no new offer]\n    K[key] --> S[suggestionKey]\n    S -->|accept| A[applySuggestion]\n```\n- Names are folded (`foldTag`: NFD, accents stripped, lowercase, extras like `đ ø ł ı`) the same way Rust folds List names; `tagOf` keeps only letters, digits, `_`, `-`.\n- `suggestionKey`: ↑/↓ wrap round, Enter/Tab accept (so Enter never adds the Task while suggestions show; Shift+Enter is left alone), Esc dismisses.\n- `applySuggestion` replaces the typed tag (never duplicates), ensures a following space, and returns the new caret.\n\n### Highlight and Quick edit\n- `markSegments` cuts text into plain and recognised stretches for the highlight layer, skipping overlapping or out-of-range spans.\n- `unchangedRanges(old, new)` returns the whole-word prefix and suffix that are untouched. Quick edit passes these as ranges to the parser so a week-old \"tomorrow\" is not re-read; only new text is.\n\n### Pasting\n- `pasteParts` (capture): first non-blank line is the title (max `MAX_TITLE` = 500 chars, overflow spills into notes), rest are notes. Single-line pastes are left to the field.\n- `pasteIntoTitle` (Quick edit): lines are joined with single spaces and replace the selection, truncated to fit the title limit.\n\n### Resolving fields\n`resolveFields(parsed, hand, base)` gives precedence: **typed words > property chips > where the box opened**. `hand` fields use `undefined` for untouched and `null` for cleared. A time with no date keeps the opened day (e.g. an Upcoming day); only a box opened without a day takes the parser's today-or-tomorrow. A `#NewList` yields `newList` and a null `listId`. `fromText` lists the kinds set by the words.\n\n```mermaid\nsequenceDiagram\n    participant U as User\n    participant B as Capture box\n    participant Q as parseCapture (IPC)\n    participant C as capture.ts\n    participant K as createList/createTask\n    U->>B: types \"Pay rent tomorrow 6pm p2 #Home\"\n    B->>Q: text, CaptureWords, frozen ranges\n    Q-->>B: Parsed (spans, alternatives, date, ...)\n    B->>C: markSegments / resolveFields\n    U->>B: Enter\n    B->>K: create (new list first if needed) with fields + understood\n```\n\n## Understood words (`understood.ts`)\n`Task.understood` stores JSON `{word, kind, value}[]` for kinds `date | time | repeat | prio | list`.\n\n- **Drift rule** (`stillHolds`): a word stays \"understood\" (underlined with \"Understood as …\") only while the field it set still has the value it set. Repeats compare freq/every/mode, and `days` only for weekly rules.\n- `parseUnderstood` treats anything unreadable as empty; `serializeUnderstood` returns `null` for empty.\n- `meaningText` / `spanMeaning` render values in user terms (`Fri 23 Oct`, `9:30 PM`, `Every month`, `P1`, list name or \"a List that is gone\"; a new list shows as an offer).\n- `understoodMarks` produces `WordMark` tooltips; words sharing text (\"tonight\" = date + time) merge into one mark.\n- `understoodFromSpans` builds the record for a new Task, swapping a List name for its id (skipping lists without one).\n- `mergeUnderstood` after Quick edit keeps old words still in the title and still holding, minus kinds replaced by newly typed words.\n\n## Stores\n- **`QuickAdd`** (`quickAdd`): `request(inTodo)` — inside Todo, and not while search covers the page, it focuses an already-open `[data-capture-box]` input, else clicks the first `[data-new-task]` row so the Task inherits that place; otherwise it opens the floating box (Inbox). `openFloating(date, listId)` lets Home's Add (today) and the phone's + (current view) preset a day and List; `close()` resets.\n- **`QuickEditing`** (`quickEditing`): holds the single Task `id` whose row is a capture box.\n- **`StepsPrompt`** (`stepsPrompt`): `ask(task)` / `close()`; the Todo page's dialog answers it every time a Task with open Checklist items is completed.\n\n## Palette add (`palette-add.ts`)\n`previewAddTask(text)` reads the text with the same parser (when `todoPrefs.parseDates` is on) and returns a summary such as \"Tomorrow · 18:00 · P2\" or \"Inbox\"; it never throws. `addTaskFromPalette(text)` resolves fields against an Inbox base (priority 4), creates a new List first if `#Name` is unknown, calls `createTask` with the serialized `understood`, invalidates Todo queries, and toasts `quickAddedMessage`; errors go to `notifyError`.\n\n## Autosave (`task-editing.ts`)\n`TaskEditing<T>` is one editing session for a Task's title and notes, with injected `update`, `setTimer`, `onSaved`, `onError` (so it is testable without a DOM).\n\n```mermaid\nstateDiagram-v2\n    [*] --> Clean\n    Clean --> Dirty: setTitle / setNotes\n    Dirty --> Dirty: keystroke resets 600 ms timer\n    Dirty --> Saving: timer fires or flush()\n    Saving --> Clean: update ok (onSaved)\n    Saving --> Dirty: update failed (onError, text kept)\n    Dirty --> Clean: text equals stored again\n```\n- Saves after `SAVE_PAUSE_MS` (600 ms) of quiet, serialised through a promise queue, each sending the latest text and the **session id** so the change log keeps one record per sheet opening (one History line).\n- Titles fold line breaks to spaces. A blank title is never saved: notes are saved under the stored title and `leaveTitle()` restores it.\n- `adopt(task)` accepts externally changed text (e.g. a repeating Task's Checklist reset) as stored. `flush()` resolves true when nothing unsaved remains.\n\n## Typed When (`when-typed.ts`)\n`whenFromParse` accepts a parse only if it contains just date/time spans, has no alternatives, and leaves only whitespace/punctuation uncovered; otherwise the field reports it is not a date. A time alone drops the parser's guessed date. `typedWhen` calls `parseCapture` with empty word decisions.\n\n## Testing\n`capture.test.ts` covers each helper and the `capture-resolve.json` fixture against `resolveFields`; `capture-ui.test.ts` runs `capture-ui.json` against the word, tag, suggestion, segment and paste helpers; `understood.test.ts`, `task-editing.test.ts` and `when-typed.test.ts` cover their modules. Backend counterparts are in `todo_capture_tests.rs` (see [Todo_Domain_Service](../Tauri_Host_and_Command_Layer/Todo_Domain_Service.md)).\n", "Todo_Frontend/Todo_Tasks_and_Data.md": "# Todo Tasks and Data\n\nThe data layer of the Todo frontend (`src/modules/todo/`). It does not draw anything. It holds the query and mutation wrappers around the Rust `todo_*` commands, the user actions built on them (complete, move, delete, with Undo), the date and wording helpers, and the small stores that keep Todo in step with the rest of the app. Rust owns the rules: this layer asks, caches, and words the result.\n\nRelated pages:\n- [Todo Frontend](../Todo_Frontend.md): parent overview.\n- [Todo Quick Capture and Editing](Todo_Quick_Capture_and_Editing.md): the capture box, the Task sheet editing and `parseCapture` consumers.\n- [Todo Views, Navigation and Interaction](Todo_Views_Navigation_and_Interaction.md): the pages, `todoNav`, drag and keyboard handling that call the actions here.\n- [Todo Domain Service](../Tauri_Host_and_Command_Layer/Todo_Domain_Service.md): the Rust commands wrapped here.\n- [Todo Tasks and Lists (Rust)](../Domain_Modules_(Todo_and_Journal)/Todo_Tasks_and_Lists.md): the backend domain.\n- [IPC Todo Mocks](../IPC_Bridge_and_Browser_Mocks/IPC_Todo_Mocks.md): the browser stand-ins for the same commands.\n\n## Components at a glance\n\n| File | Role |\n|---|---|\n| `queries.ts` | `todoKeys`, TanStack query options, mutation wrappers (`unwrap(commands.todo…)`), cache invalidation |\n| `task-actions.ts` | Tick, untick, Won't do, skip, delete, move-overdue, priority, drag placement; each with toast and Undo |\n| `list-actions.ts` | Create/delete List, sort menu, drag a List |\n| `dates.ts` | Device-day helpers, row date labels, toast wording for dates |\n| `tasks.ts` | Toast wording, `withoutTaskInGroups`, priority tone |\n| `notes.ts` | Checklist progress, tick-all, note preview, `plainTitle` |\n| `counts.ts` | Sidebar/tab badge, Home card model, capture summary |\n| `badge.svelte.ts` | `useTodoBadge` |\n| `clock.svelte.ts` | `todoClock`: today, minute and `LocalNow` |\n| `prefs.svelte.ts` | `todoPrefs` mirrored from Settings |\n| `settings.ts` | Typed `todo.*` preferences (`readTodo`) |\n| `remote-delete.ts`, `list-merge.ts` | Reactions to sync events |\n\n## Architecture\n\n```mermaid\nflowchart LR\n  UI[Todo pages and sheet] --> TA[task-actions / list-actions]\n  UI --> Q[queries.ts query options]\n  TA --> M[queries.ts mutations]\n  Q --> IPC[unwrap commands.todo*]\n  M --> IPC\n  IPC --> Rust[Rust todo commands]\n  TA --> Toast[notifyUndo / notifyError]\n  M --> QC[(queryClient)]\n  Clock[todoClock] --> Q\n  Clock --> M\n  Prefs[todoPrefs / readTodo] --> Q\n  Events[todo-changed, task-deleted, lists-merged] --> RD[remote-delete / list-merge]\n  Events --> QC\n```\n\n## Queries and cache keys\n\n`todoKeys` roots every key at `['todo', …]`, so `invalidateTodo()` refreshes everything with one call. Views that depend on the date are keyed by the day string (`inbox`, `allView`, `lists`, `counts`, `list`, `today`, `upcoming`, `done`). When midnight passes the key changes and the view refetches. `listPages(id)` addresses every cached page of one List regardless of day.\n\n| Query | Command | Notes |\n|---|---|---|\n| `inboxQuery`, `allQuery`, `listQuery`, `todayQuery`, `upcomingQuery` | `todoInbox/All/List/Today/Upcoming` | pass `todoClock.local()` |\n| `listsQuery`, `countsQuery` | `todoLists`, `todoCounts` | sidebar counts; badge and Home card |\n| `doneQuery` | `todoDone` | infinite query, 14 days per page, cursor `next_cursor` |\n| `dayCountsQuery` | `todoDayCounts` | dots in the When picker |\n| `taskQuery` | `todoTask` | `retry: false`; any state, for the sheet |\n| `commentsQuery`, `historyQuery` | `todoComments`, `todoTaskHistory` | |\n| `searchQuery` | `todoSearch` | `keepPreviousData` so typing never flashes empty |\n\nMutation wrappers (`createTask`, `completeTask`, `reopenTask`, `moveTask`, `setWhen`, `setPriority`, `wontDo`, `deleteTask`/`restoreTask`, `updateTask`, comment and List operations, `reorderTask`/`reorderList`, `setListSort`/`setListGroup`, `quickEdit`/`quickEditUndo`, `skipTask`, `moveOverdue`, `restoreWhen`) are thin: they unwrap the IPC result and throw `IpcError` on refusal. `savePreference` saves a `todo.*` setting, then invalidates `['settings']` and Todo.\n\n`createTask` builds the `when` argument only if a date, time or repeat exists, and sends priority only when below 4. `parseCapture` forwards typed text, ignored/preferred words, frozen ranges and the date context to `todoParse`.\n\n`removeCachedTask` patches every cached grouped view (`inbox`, `all`, `list`, `today`, `upcoming`) with `withoutTaskInGroups`, so a Task leaves the page before Rust answers.\n\n## Action flow\n\n```mermaid\nsequenceDiagram\n  participant U as User\n  participant A as task-actions\n  participant C as queryClient\n  participant R as Rust\n  participant T as Toast\n  U->>A: tickTask(task)\n  alt open checklist steps\n    A->>U: stepsPrompt.ask (Cancel / Tick all / Complete)\n  else\n    A->>C: removeCachedTask (non-repeating)\n    A->>R: todoTaskComplete\n    alt failure\n      A->>C: invalidateTodo\n      A->>T: notifyError\n    else success\n      A->>C: invalidateTodo\n      A->>T: notifyUndo(\"Completed ...\")\n      T-->>A: Undo -> reopenTask (restore notes if Tick all)\n    end\n  end\n```\n\nPatterns shared by the actions:\n- **Optimistic removal** for complete, Won't do and delete (not for repeating Tasks, which stay open on the next date).\n- **Always `invalidateTodo()`** in `finally`/after, so the screen converges on Rust's truth.\n- **Undo via toast**: complete reopens (an occurrence id when repeating); `setTaskWhen`/`skipRepeating`/`moveAllOverdue` restore `DueChange` snapshots through `restoreWhen`, which allows past dates; delete calls `restoreTask`.\n- **Won't do on a repeating Task** is a Skip in Rust; the frontend only words and undoes it (`skipRepeating(task, wontDo)`).\n- **Tick all and complete** first saves ticked notes in a fresh session id, then completes with `undoNotes`, so Undo writes the original notes back.\n- On a phone, `completeNow` fires a light haptic tick immediately.\n- `placeTask` / `placeList` pass neighbours and the group's `adopt` keys to Rust; they say nothing on success. `dropTaskOnSidebar` maps a drop on Today, the Inbox or a List to `dateTaskToday` or `moveTaskTo`.\n\n`list-actions.ts`: `listSortItems` builds the \"Sort Lists by\" menu and saves `LISTS_SORT_PREF`; `createListAndOpen` creates then navigates (name refusals propagate for the field to show); `deleteListWithUndo` deletes with a `DeleteChoice`, leaves the List's page if open, drops its cached pages so a stale \"gone\" error cannot reappear, and Undo calls `restoreList` and reopens it.\n\n## Dates and wording\n\n- `localDate`, `localTime`, `localNow` define the device's day; every date-dependent command receives `LocalNow` (`today`, `now`, `offset_min`).\n- `rowDateLabel` (Today, Tomorrow, Yesterday, weekday within a week, `28 Oct [year]`), `stampLabel`, `longDate`, `dayHeading`, `closedTime`, `whenChipLabel`, `landedIn`.\n- `isOverdue`: open and before today. A Task due today is never Overdue; `timePassed` marks only its time red.\n- Toast builders: `whenMessage`, `completedRepeatMessage`, `skippedMessage`, `movedAllMessage` (dates.ts); `completedMessage`, `deletedMessage`, `wontMessage`, `editedMessage`, `priorityMessage`, `quickAddedMessage` (tasks.ts). Titles pass through `plainTitle` (Markdown marks removed) and `quoted` (curly quotes, cut at 34 characters, by code point).\n- `priorityTone` maps 1/2/3 to `p1`/`p2`/`p3`, otherwise `plain`.\n\n`notes.ts` parses notes with the shared Markdown AST: `checklistProgress`, `openSteps`, `tickAllSteps`, and `notePreview` (first prose line, checklists skipped).\n\n## Badge, Home card and capture summary\n\n`useTodoBadge` subscribes the shared clock inside an `$effect`, runs `countsQuery`, and derives `badgeOf(counts)`: due today plus Overdue, red while anything is Overdue, `null` when zero or not loaded. The clock subscription keeps the count rolling over at midnight with no Todo page open.\n\n`homeCardModel(counts, today)` returns up to the card's Tasks, the Overdue count, `more = max(0, due_today - tasks.length)`, and a `nothing` line (\"Nothing due today · next: …\") when none is due. `footerParts` gives \"N overdue\" and \"+N more\" separately so the overdue part can be red. `captureSummary` describes what the palette's Add task understood, or \"Inbox\".\n\n## Clock, preferences and settings\n\n- `todoClock` exposes `today` and `hm` as `$derived` strings from the shared clock, so readers update only on a minute or day change; `local()` reads a fresh `LocalNow` at call time.\n- `followCoreSettings()` (called once from Todo's page) copies week start, time format, the Journal's `journal.font` (as plain data; Todo never imports the Journal) and `todo.parse_dates` into `todoPrefs`.\n- `readTodo(values)` gives a typed view of `todo.parse_dates` and `todo.done_in_lists`, falling back to `today_shown` for unknown values. Rust validates writes.\n\n## Reacting to sync\n\n```mermaid\nflowchart LR\n  Peer[Other device] --> Sync[Sync engine] --> Ev[Tauri events]\n  Ev -->|task deleted| RD[followRemoteDelete]\n  Ev -->|lists merged| LM[followMerge]\n  RD -->|toast only if open in sheet| Sheet\n  LM -->|navigate to kept List + toast| Nav[todoNav]\n```\n\n- `followRemoteDelete(openTaskId, e)` yields a message (\"‘title’ was deleted on Pixel 8\") only for the Task open in the sheet. `remoteDeletes` remembers told Tasks so the sheet does not also show \"no longer exists\".\n- `followMerge(view, e)` moves someone on a merged-away List to the surviving one with a message; other views are untouched.\n\nFor the engine behind these events see [Sync Replication Engine](../Sync_Replication_Engine.md).\n\n## Testing\n\nUnit tests (`counts.test.ts`, `tasks.test.ts`, `task-actions.test.ts`) run without a DOM. `task-actions.test.ts` mocks `./queries`, toast, viewport and the clock, reads the Undo callback out of the toast, and checks the call order for Undo after \"Tick all and complete\": reopen first, then write back the original notes.\n", "Todo_Frontend/Todo_Views_Navigation_and_Interaction.md": "# Todo Views, Navigation and Interaction\n\nThis module is the part of the Todo frontend (`src/modules/todo/`) that decides **which page of Todo is showing, how the user moves between pages, and how the user acts on Task rows**. It covers view state, deep links, search sessions, the Task sheet, grouping and sorting tables, keyboard shortcuts and focus, touch gestures, and drag-and-drop.\n\nIt holds no data of its own. Data fetching, mutations and preferences live in [Todo Tasks and Data](Todo_Tasks_and_Data.md). Capture and editing of task text live in [Todo Quick Capture and Editing](Todo_Quick_Capture_and_Editing.md). Shared gesture and routing helpers come from [Router](../Frontend_Platform_and_Shell/Router.md) and [App Bootstrap and Platform Utilities](../Frontend_Platform_and_Shell/App_Bootstrap_and_Platform_Utilities.md). The Rust commands behind the actions are described in [Todo Domain Service](../Tauri_Host_and_Command_Layer/Todo_Domain_Service.md).\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph State[\"Navigation and session state\"]\n        views[views.ts<br/>view model]\n        nav[nav.svelte.ts<br/>todoNav]\n        sheet[task-sheet.svelte.ts<br/>taskSheet]\n        search[search.svelte.ts<br/>todoSearch]\n        link[deep-link.ts<br/>openTodoLink]\n    end\n    subgraph Arrange[\"Arrangement\"]\n        arrange[arrange.ts<br/>group and sort tables]\n        sidebar[sidebar.svelte.ts<br/>useSidebar]\n        results[search-results.ts]\n    end\n    subgraph Input[\"Input\"]\n        keymap[task-keymap.ts<br/>pure key reducer]\n        keys[task-keys.svelte.ts<br/>TaskRows registry]\n        focus[task-focus.svelte.ts<br/>taskFocus]\n        touch[row-touch.svelte.ts<br/>RowTouch]\n        drag[drag.svelte.ts<br/>DragController]\n    end\n    urlparam[(urlParam<br/>lib/router)]\n    actions[task-actions / list-actions<br/>Todo Tasks and Data]\n\n    link --> nav\n    link --> urlparam\n    nav --> views\n    sheet --> urlparam\n    search --> results\n    focus --> search\n    focus --> keymap\n    keys --> focus\n    drag --> arrange\n    drag --> actions\n    touch --> actions\n    sidebar --> actions\n```\n\n## Components\n\n### View model: `views.ts`, `nav.svelte.ts`\n- `TodoView` is either a smart view (`inbox | today | upcoming | all | done`) or a list view (`{kind:'list', id}`). Todo is a single `/todo` route, so the view is state, not URL.\n- `viewCount` gives the sidebar count, with an alert flag when Today has Overdue tasks. `viewLabel` maps a smart view to its label.\n- `activeSegment` and `swipedView` support the phone: three pinned segments (Today, Upcoming, Inbox) and a `more` (☰) bucket for All, Done and Lists. A swipe stops at the ends and does nothing from a non-segment view.\n- `addPlaceFor` picks where the phone \"+\" adds: today in Today, tomorrow in Upcoming, the List in a List, otherwise the Inbox.\n- `visibleOn` says whether a newly created task will appear on a view. `viewAfterListGone` falls back to the Inbox when the open List disappears.\n- `TodoNav` (`todoNav`) holds `view`, a `slide` direction for transitions and a `topRequests` counter. `swipeTo` sets the slide direction, `go` clears it, and `home()` returns to Today and bumps `topRequests` (the Todo tab tapped again).\n\n### Deep links: `deep-link.ts`\n`openTodoLink(url)` handles `mnemora://todo?view=…&task=…`. Unknown views are ignored. A known view is applied through `todoNav.go`, and a task returns `/todo?task=<id>`. Otherwise any open `task` parameter is removed and `/todo` is returned. It is called from the shell link bridge (see [Shell and Navigation](../Frontend_Platform_and_Shell/Shell_and_Navigation.md)); the widget generates these links (see [Todo Widget](../Domain_Modules_(Todo_and_Journal)/Todo_Widget.md)).\n\n### Task sheet: `task-sheet.svelte.ts`\n`TaskSheetState` (`taskSheet`) derives the open task id from the `task` URL parameter. This means reload, links and Android Back all work. `open` pushes a history entry, or swaps the entry if a sheet is already open. `switchTo` swaps without pushing. `close` steps back over the pushed entry, or deletes the parameter. Closes within 400 ms of each other count as one, because Esc and the editor can both request a close.\n\n### Search: `search.svelte.ts`, `search-results.ts`\n`TodoSearch` keeps `query` (the field) and `committed` (what results follow). Typing commits after `SEARCH_DEBOUNCE_MS` (150 ms); `open(query)` commits at once. `escape()` clears the words first and closes on the second press. `search-results.ts` has pure helpers: `canSearch` (needs a letter or digit), `splitHits` (open tasks first, then done and won't-do), `litWords`, `spansText` and `resultsLabel`.\n\n### Grouping and sorting: `arrange.ts`\nTables define the Group by choices per view (`GROUP_OPTIONS`), the defaults (`GROUP_DEFAULTS`), the preference keys (`GROUP_PREF_KEYS`) and the sort option lists. The set matches what Rust accepts.\n- `groupHeading(key, ctx)` turns a `GroupKey` into a heading (none, label, day, or list).\n- `groupButtonLabel` builds the `Group: Priority` text.\n- `canDrag` is true only for manual sort.\n- `groupTakesTasks` is false for the Overdue and \"No date, in a List\" groups.\n- `addDefaults` returns the day and list a task added inside a group inherits. Priority is never inherited.\n- `adoptSummary` describes in words what a drop would change.\n\n### Sidebar data: `sidebar.svelte.ts`\n`useSidebar()` runs `listsQuery` once and exposes Lists by id plus the raw sidebar view. Pages use it for list chips, group headings and drag labels.\n\n### Keyboard: `task-keymap.ts`, `task-keys.svelte.ts`, `task-focus.svelte.ts`\n- `reduceKey(state, event, scene, now)` is a pure reducer. It follows the bare-key rules from ADR 0011: no modifier, never while typing, and never with a menu or dialog open. It returns an action (`complete`, `wont`, `open`, `quick-edit`, `when`, `today`, `move-list`, `priority`, `reorder`, `delete`, `ring`, `sheet-step`, `go`, `search`, and so on) plus the \"G then letter\" chord state with a 1500 ms window.\n- Per-row keys act only on the row with the focus ring, not a row the pointer rests on (ADR 0013). Edit, date, today and priority keys apply to open tasks only.\n- Inside the sheet only Priority and Won't do apply. ⌘↑/⌘↓ step through tasks and ⌘↵ closes.\n- `bareTodayFires` stops the bare T from going to Today when a Todo row is ringed.\n- `moveRing` and `ringAfterRemoval` compute ring movement.\n- `TaskRows` (`taskRows`) is a registry of mounted rows and their pickers (When, Move to list). `inSheetScope` and `overlayOpen` classify the key target.\n- `TaskFocus` (`taskFocus`) reads rows from the DOM (`[data-task-scope]`, `[data-task-row]`). It walks the search results when search is active and the view otherwise. `focus` gives the row title real focus. `keepAfter` re-places the ring after a redraw, using a neighbour as fallback.\n\n### Touch: `row-touch.svelte.ts`\n`RowTouch` handles touch and pen on a row (not the mouse). Axis lock separates sideways swipes from scrolling. A right swipe completes and a left swipe opens When, with sides enabled per touch. A long press (via `LongPress`) lifts the row and fires `onhold`. After a gesture, `swallowsClick` stays true for 350 ms so the trailing click is ignored.\n\n### Drag and drop: `drag.svelte.ts`\n`DragController` (`drag`) drags tasks, and Lists in the sidebar. It is driven by `data-*` markers in the markup (`data-task-group`, `data-adopt`, `data-task-row`, `data-drop-nav`, `data-list-tree`, `data-list-row`).\n- Mouse press passes a 5 px slop; touch is armed by `armTouch` with a 10 px slop. A lift without moving calls the tap callback, which opens the row menu.\n- While dragging it edge-scrolls, shows a drop line and a summary, and highlights sidebar targets. Esc cancels, and the click after a drag is swallowed.\n- Drop outcomes: `placeTask` between neighbours (adopting the group's day or list), `placeList`, or `dropTaskOnSidebar` for Inbox, Today or a List.\n- `keyboardMove` implements ⌥↑/⌥↓ within a group and restores focus afterwards.\n\n## Interaction flows\n\n### Opening a task from a link\n\n```mermaid\nsequenceDiagram\n    participant Shell as Link bridge\n    participant L as openTodoLink\n    participant N as todoNav\n    participant U as urlParam\n    participant S as taskSheet\n    Shell->>L: mnemora://todo?view=list:ID&task=T\n    L->>N: go(viewOfLink)\n    L-->>Shell: /todo?task=T\n    Shell->>U: navigate\n    U-->>S: id derives from \"task\"\n```\n\n### Keyboard action\n\n```mermaid\nflowchart LR\n    K[keydown] --> Sc[build KeyScene<br/>typing, overlay, sheet, ring]\n    Sc --> R[reduceKey]\n    R -->|action| A[page runs action<br/>task-actions]\n    R -->|go| N[todoNav.go]\n    R -->|ring| F[taskFocus.move]\n    A --> Keep[taskFocus.keepAfter]\n```\n\n### Drag lifecycle\n\n```mermaid\nstateDiagram-v2\n    [*] --> Pending: press / armTouch\n    Pending --> Dragging: moved past slop\n    Pending --> [*]: release (tap callback if touch)\n    Dragging --> Dragging: move, resolve drop\n    Dragging --> [*]: Esc / cancel\n    Dragging --> Dropped: release over valid target\n    Dropped --> [*]: placeTask / placeList / dropTaskOnSidebar\n```\n\n## Testing\nThe pure logic is covered by Vitest: `task-keymap.test.ts` (key table, chords, sheet scope, ring movement) and `search-results.test.ts` (splitting, folding, validation, labels). `drag.svelte.ts`, `row-touch.svelte.ts` and the state classes depend on the DOM and are exercised through the UI.\n", "Todo_Frontend.md": "# Todo Frontend\n\nThe Todo frontend (`src/modules/todo/`) is the Svelte and TypeScript client for Mnemora's Todo feature. It covers Inbox, Today, Upcoming, All, Done and user Lists. It owns no business rules. The Rust `todo_*` commands (or the browser mocks) decide what is valid. This module asks Rust, caches the answers, words the results for the user, and handles all input: typing, keys, touch and drag.\n\n## Purpose\n\n- **Data and actions.** Query and mutation wrappers around the Rust commands, with optimistic removal, Undo toasts and cache invalidation. It also holds date and wording helpers, the Todo badge, the Home card, the clock, preferences, and reactions to sync events.\n- **Capture and editing.** The capture box, Quick edit, the palette \"Add task\" action and the Task sheet's autosave. It turns typed words and property chips into final Task fields and keeps them in step with the Rust parser.\n- **Views and interaction.** Which page is showing, deep links, the Task sheet's URL state, search sessions, grouping and sorting tables, bare-key shortcuts and the focus ring, touch swipes, and drag and drop.\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph Views[\"Todo Views, Navigation and Interaction\"]\n        NAV[todoNav / views / deep-link]\n        SHEET[taskSheet / todoSearch]\n        INPUT[keymap / taskFocus / RowTouch / DragController]\n        ARR[arrange / sidebar]\n    end\n    subgraph Capture[\"Todo Quick Capture and Editing\"]\n        CAP[capture.ts / understood.ts]\n        STORES[QuickAdd / QuickEditing / StepsPrompt]\n        EDIT[TaskEditing autosave]\n    end\n    subgraph Data[\"Todo Tasks and Data\"]\n        ACT[task-actions / list-actions]\n        Q[queries.ts + todoKeys]\n        AUX[clock / prefs / counts / badge]\n        SYNC[remote-delete / list-merge]\n    end\n    INPUT --> ACT\n    ARR --> ACT\n    NAV --> Q\n    SHEET --> EDIT\n    CAP --> Q\n    STORES --> Q\n    EDIT --> Q\n    ACT --> Q\n    AUX --> Q\n    Q --> IPC[Tauri IPC / browser mocks]\n    IPC --> RUST[Rust todo commands]\n    EVT[Sync events] --> SYNC\n    SYNC --> NAV\n    SYNC --> Q\n```\n\nThe three sub-modules form layers:\n\n1. **Views, Navigation and Interaction** sits at the top. It turns user gestures into calls to the actions below. `todoNav` holds the current view as state, since Todo is a single `/todo` route. The open Task sheet is derived from the `task` URL parameter, so reload, links and Android Back all work.\n2. **Quick Capture and Editing** is mostly pure TypeScript. `capture.ts` and `understood.ts` decide which words stay as text and how `#List` suggestions work. They also merge typed words, chips and the opening place into Task fields (typed words win over chips, which win over the opening place). A shared JSON fixture keeps these rules in step with the Android widget (Kotlin and Rust). `TaskEditing` autosaves the title and notes after 600 ms of quiet, with one session id per sheet opening.\n3. **Tasks and Data** is the foundation. `todoKeys` roots every cache key at `['todo', …]`, so `invalidateTodo()` refreshes everything. `task-actions` removes a Task from the cached page at once, calls Rust, then always invalidates. Complete, delete and date changes offer Undo through a toast.\n\n## Typical flow\n\n```mermaid\nsequenceDiagram\n    participant U as User\n    participant V as Views / keymap\n    participant A as task-actions\n    participant R as Rust\n    participant T as Toast\n    U->>V: press key, swipe or drag\n    V->>A: tickTask / placeTask / setTaskWhen\n    A->>A: optimistic removal from cache\n    A->>R: todo command via IPC\n    A->>A: invalidateTodo()\n    A->>T: notifyUndo / notifyError\n```\n\n## Core component documentation\n\n| Sub-module | Covers | Documentation |\n|---|---|---|\n| Todo Tasks and Data | `queries.ts`, `task-actions.ts`, `list-actions.ts`, `dates.ts`, `counts.ts`, `todoClock`, `todoPrefs`, sync reactions | [Todo_Tasks_and_Data](<Todo_Frontend/Todo_Tasks_and_Data.md>) |\n| Todo Quick Capture and Editing | `capture.ts`, `understood.ts`, `palette-add.ts`, `QuickAdd`, `QuickEditing`, `StepsPrompt`, `TaskEditing`, `when-typed.ts` | [Todo_Quick_Capture_and_Editing](<Todo_Frontend/Todo_Quick_Capture_and_Editing.md>) |\n| Todo Views, Navigation and Interaction | `todoNav`, `taskSheet`, `todoSearch`, `arrange.ts`, `reduceKey`, `taskFocus`, `RowTouch`, `DragController` | [Todo_Views_Navigation_and_Interaction](<Todo_Frontend/Todo_Views_Navigation_and_Interaction.md>) |\n\n## Related modules\n\n- Backend: Todo Domain Service and Todo Tasks and Lists (Rust), which own the commands and rules.\n- Browser stand-ins: IPC Todo Mocks.\n- Shared UI: UI When Picker and the Router utilities.\n- Sync: Sync Replication Engine, the source of the `task-deleted` and `lists-merged` events.", "overview.md": "# Mnemora_v1\n\n## Purpose\n\nMnemora is a local-first personal productivity app with a **Todo** Module and a **Journal** Module. It runs on macOS as a Tauri desktop app and on Android, where it adds a native Todo home-screen widget. It has these main features:\n\n- **Todo and Journal.** Tasks, Lists and Comments, with natural-language capture. Dated Journal Pages, with Markdown Entries.\n- **AI assistant (off by default).** An agent loop answers questions through read-only Tools over Todo and Journal data. It never writes that data.\n- **Serverless device sync (off by default).** A person's own devices sync directly with each other. Pairing uses an 8-digit code (SPAKE2), and transport is mutual TLS 1.3. Conflicts and Resolutions are shown to the person.\n\nThe backend is a Rust workspace. The frontend is Svelte 5 with TanStack Query. Tauri joins the two through typed IPC generated by `specta`. The central design rule is that **Modules never import each other**. They share only the contracts in `mnemora-core` and the event bus.\n\n## End-to-end architecture\n\n```mermaid\ngraph TD\n    subgraph FE[\"Frontend (src, Svelte 5)\"]\n        Shell[Frontend_Platform_and_Shell]\n        DS[Design_System_and_UI_Components]\n        TF[Todo_Frontend]\n        JF[Journal_Frontend]\n        AF[AI_Assistant_Frontend]\n        SF[Sync_Frontend]\n        IPC[IPC_Bridge_and_Browser_Mocks]\n        Shell --> TF & JF & AF & SF\n        TF & JF & AF & SF --> DS\n        TF & JF & AF & SF --> IPC\n    end\n\n    subgraph Host[\"Tauri host (src-tauri)\"]\n        Cmd[Tauri_Host_and_Command_Layer]\n        Widget[Android_and_Home-Screen_Widget_Platform]\n        Tests[Backend_Integration_Test_Suites]\n    end\n\n    subgraph Crates[\"Rust crates\"]\n        Core[Core_Foundation]\n        Dom[Domain_Modules: todo + journal]\n        AI[AI_Assistant_Backend: ai, harness, providers]\n        Sync[Sync_Replication_Engine]\n    end\n\n    IPC -- \"typed invoke / events\" --> Cmd\n    Cmd --> Dom & AI & Sync\n    Widget -- \"JNI JSON\" --> Dom\n    Dom & AI & Sync --> Core\n    AI -- \"read-only Tools\" --> Dom\n    Sync -- \"apply_remote via syncable traits\" --> Dom\n    Core --> DB[(SQLite + FTS5)]\n    Sync <-- \"mTLS, direct\" --> Peer[Other paired devices]\n    AI -- HTTPS --> LLM[(LLM service)]\n    Tests -.drives.-> Cmd\n```\n\n### A request, from tap to disk\n\n```mermaid\nsequenceDiagram\n    participant UI as Svelte screen\n    participant B as bindings.ts\n    participant C as Tauri command\n    participant M as Module crate\n    participant DB as SQLite + change_log\n    participant S as Sync engine\n    UI->>B: commands.x(...)\n    B->>C: invoke\n    C->>M: lock db, call one domain function\n    M->>DB: write row + change_log record (HLC-stamped)\n    C-->>UI: result or AppError\n    DB-->>S: records the other device lacks\n    S-->>UI: typed events, then query invalidation\n```\n\nThe Tauri command layer holds no business logic. Each command locks the database, calls one function in a domain crate and returns the result. Local writes are recorded in the core `change_log`. Sync exchanges those records between devices and applies them through each Module's own `apply_remote`. In a plain browser, Vitest and prototypes, `mockIPC` replaces the Rust side underneath the same `bindings.ts`.\n\n## Core modules\n\n| Module | Scope | Documentation |\n|---|---|---|\n| Core Foundation | `crates/core`: the `Module` trait, migrations, Settings, change log, sync contract, search and the AI `Tool` contract | [Core_Foundation](Core_Foundation.md) |\n| Domain Modules | `crates/todo` and `crates/journal`: rules, storage, FTS5 search, merge rules, AI tools and the widget snapshot | [Domain_Modules_(Todo_and_Journal)](<Domain_Modules_(Todo_and_Journal).md>) |\n| AI Assistant Backend | `crates/ai`, `crates/harness` and `crates/providers`: Conversations, Branches, the agent loop and the provider adapters | [AI_Assistant_Backend](AI_Assistant_Backend.md) |\n| Sync Replication Engine | `crates/sync`: replication, pairing, mTLS networking, Conflicts, Activity and Devices | [Sync_Replication_Engine](Sync_Replication_Engine.md) |\n| Tauri Host and Command Layer | `src-tauri/src`: startup, `AppState`, typed IPC and the Todo, Journal, AI and Sync commands | [Tauri_Host_and_Command_Layer](Tauri_Host_and_Command_Layer.md) |\n| Android and Home-Screen Widget Platform | The Kotlin host, the JNI widget bridge and the widget tests | [Android_and_Home-Screen_Widget_Platform](Android_and_Home-Screen_Widget_Platform.md) |\n| Backend Integration Test Suites | AI run, AI data and provider, and todo-sheet tests that drive the real commands | [Backend_Integration_Test_Suites](Backend_Integration_Test_Suites.md) |\n| Frontend Platform and Shell | Bootstrap, theme, router, navigation shell, Home and Settings | [Frontend_Platform_and_Shell](Frontend_Platform_and_Shell.md) |\n| IPC Bridge and Browser Mocks | Generated bindings, the event bridge and the dev-only browser mocks | [IPC_Bridge_and_Browser_Mocks](IPC_Bridge_and_Browser_Mocks.md) |\n| Design System and UI Components | `src/lib/ui` Components, the When picker and the Markdown editor | [Design_System_and_UI_Components](Design_System_and_UI_Components.md) |\n| AI Assistant Frontend | Conversations, Runs, Branches, history, Saved questions, Providers and Models | [AI_Assistant_Frontend](AI_Assistant_Frontend.md) |\n| Journal Frontend | Composer, entry editing, feed, navigation and search | [Journal_Frontend](Journal_Frontend.md) |\n| Todo Frontend | Tasks and data, quick capture and editing, views and navigation | [Todo_Frontend](Todo_Frontend.md) |\n| Sync Frontend | Devices, pairing, Activity, Conflicts and status | [Sync_Frontend](Sync_Frontend.md) |\n| Build, Tooling and Packaging | Makefile, scripts, manifests, lint config, Vite, Gradle and signing | [Build,_Tooling_and_Packaging](<Build,_Tooling_and_Packaging.md>) |\n\n## How it is built and run\n\n- **Workspaces.** A Cargo workspace holds the `crates/*` crates and the `src-tauri` shell crate (`mnemora-app`). A pnpm workspace holds the frontend. Versions are pinned exactly.\n- **Entry points.** Everything goes through `make`: `dev`, `sandbox`, `build`, `test`, `lint`, `fmt`, `bindings`, and the `android*` targets. Targets run through `scripts/with-env.sh`, which sets the environment and cleans up child processes.\n- **Dev.** Vite serves the frontend on port 47821, and `cargo tauri dev` wraps it. The Sandbox variant uses the Rust `sandbox` feature, so it can run beside Production.\n- **Test and lint.** Rust tests include integration suites that run the real commands on Tauri's mock runtime. Vitest tests share JSON fixtures with the Rust tests. Biome, `rustfmt`, `clippy` and `scripts/check-colors.sh` enforce style and the UI token rules.\n- **Packaging.** `cargo tauri build` produces the macOS `.app` and `.dmg`. `cargo tauri android build` runs Gradle with a Rust plugin and produces a signed arm64 APK. The signing scripts are `scripts/setup-signing.sh`, `scripts/signing-env.sh` and `scripts/setup-android.sh`.\n- **Deployment.** The artifacts show no server component or CI deploy step. The app is built and signed locally.\n\nFor the scripts, manifests, Vite and TypeScript configs and the Gradle project, see [Build,_Tooling_and_Packaging](<Build,_Tooling_and_Packaging.md>). For Android packaging and the widget, see [Android_and_Home-Screen_Widget_Platform](Android_and_Home-Screen_Widget_Platform.md)."};</script>

            canvas.addEventListener('dblclick', function(e) {
                const rect = canvas.getBoundingClientRect();
                zoomLightboxAt(e.clientX - rect.left, e.clientY - rect.top, 2);
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && lightboxEl.classList.contains('open')) {
                    closeMermaidLightbox();
                }
            });

            return lightboxEl;
        }

        function openMermaidLightbox(element) {
            const svg = element.querySelector('svg');
            if (!svg) return;

            const lb = ensureLightbox();
            const stage = lb.querySelector('.lightbox-stage');
            stage.innerHTML = '';

            const clone = svg.cloneNode(true);
            let width = 800;
            let height = 600;
            const vb = clone.viewBox && clone.viewBox.baseVal;
            if (vb && vb.width && vb.height) {
                width = vb.width;
                height = vb.height;
            }
            // Give the clone its natural size; scaling happens via transform
            clone.style.maxWidth = 'none';
            clone.style.width = width + 'px';
            clone.style.height = height + 'px';
            clone.setAttribute('width', width);
            clone.setAttribute('height', height);
            stage.style.width = width + 'px';
            stage.style.height = height + 'px';
            stage.appendChild(clone);

            lightboxState.width = width;
            lightboxState.height = height;

            lb.classList.add('open');
            document.body.style.overflow = 'hidden';
            fitLightbox();
        }

        function fitLightbox() {
            const canvas = lightboxEl.querySelector('.lightbox-canvas');
            const cw = canvas.clientWidth;
            const ch = canvas.clientHeight;
            // Fill most of the screen — small diagrams get scaled UP
            const fit = Math.min(cw * 0.9 / lightboxState.width, ch * 0.85 / lightboxState.height);
            lightboxState.scale = Math.min(Math.max(fit, 0.1), 10);
            lightboxState.tx = (cw - lightboxState.width * lightboxState.scale) / 2;
            lightboxState.ty = (ch - lightboxState.height * lightboxState.scale) / 2;
            applyLightboxTransform();
        }

        function zoomLightboxAt(x, y, factor) {
            const newScale = Math.min(Math.max(lightboxState.scale * factor, 0.1), 12);
            const applied = newScale / lightboxState.scale;
            lightboxState.tx = x - (x - lightboxState.tx) * applied;
            lightboxState.ty = y - (y - lightboxState.ty) * applied;
            lightboxState.scale = newScale;
            applyLightboxTransform();
        }

        function applyLightboxTransform() {
            const stage = lightboxEl.querySelector('.lightbox-stage');
            stage.style.transform = 'translate(' + lightboxState.tx + 'px, ' + lightboxState.ty + 'px) scale(' + lightboxState.scale + ')';
        }

        function closeMermaidLightbox() {
            if (!lightboxEl) return;
            lightboxEl.classList.remove('open');
            lightboxEl.querySelector('.lightbox-stage').innerHTML = '';
            document.body.style.overflow = '';
        }

        // ---------- On-page table of contents ----------

        function buildTOC() {
            const toc = document.getElementById('toc');
            const contentInner = document.querySelector('.content-inner');
            const headings = Array.from(document.querySelectorAll('#content h2, #content h3'))
                .filter(h => h.id);

            if (scrollSpyObserver) {
                scrollSpyObserver.disconnect();
                scrollSpyObserver = null;
            }

            if (headings.length < 3) {
                toc.innerHTML = '';
                contentInner.classList.add('no-toc');
                return;
            }

            contentInner.classList.remove('no-toc');
            let html = '<div class="toc-title">On this page</div>';
            headings.forEach(h => {
                html += '<a class="toc-link toc-' + h.tagName.toLowerCase() + '" href="#' +
                    escapeHtml(h.id) + '">' + escapeHtml(h.textContent) + '</a>';
            });
            toc.innerHTML = html;

            setupScrollSpy(headings);
        }

        function setupScrollSpy(headings) {
            scrollSpyObserver = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    const id = entry.target.id;
                    document.querySelectorAll('.toc-link').forEach(a => {
                        a.classList.toggle('active', a.getAttribute('href') === '#' + id);
                    });
                });
            }, { rootMargin: '0px 0px -70% 0px' });

            headings.forEach(h => scrollSpyObserver.observe(h));
        }

        // ---------- Prev/next pager ----------

        function flattenModuleTree() {
            const order = ['overview.md'];

            function walk(tree, depth) {
                for (const [key, data] of Object.entries(tree)) {
                    const hasChildren = data.children && Object.keys(data.children).length > 0;
                    const hasComponents = data.components && data.components.length > 0;
                    // Mirror buildNavItem: skip bare headers without a doc
                    if (depth > 0 || hasChildren || hasComponents) {
                        order.push(docFileFor(key));
                    }
                    if (hasChildren) {
                        walk(data.children, depth + 1);
                    }
                }
            }

            if (MODULE_TREE) {
                walk(MODULE_TREE, 0);
            }
            return order;
        }

        const DOC_ORDER = flattenModuleTree();

        function pageTitleFor(filename) {
            const base = filename.split('/').pop().replace(/\.md$/i, '');
            if (base === 'overview') {
                return PAGE_TITLES.overview || 'Overview';
            }
            return formatNavTitle(base);
        }

        function renderPagerLinks(filename) {
            const pager = document.getElementById('pager');
            const idx = DOC_ORDER.indexOf(filename);

            if (idx === -1) {
                pager.innerHTML = '';
                return;
            }

            const prev = idx > 0 ? DOC_ORDER[idx - 1] : null;
            const next = idx < DOC_ORDER.length - 1 ? DOC_ORDER[idx + 1] : null;

            let html = '';
            if (prev) {
                html += '<a class="pager-link pager-prev" href="' + buildHash(prev) + '">' +
                    '<span class="pager-label">← Previous</span>' +
                    '<span class="pager-title">' + escapeHtml(pageTitleFor(prev)) + '</span></a>';
            }
            if (next) {
                html += '<a class="pager-link pager-next" href="' + buildHash(next) + '">' +
                    '<span class="pager-label">Next →</span>' +
                    '<span class="pager-title">' + escapeHtml(pageTitleFor(next)) + '</span></a>';
            }
            pager.innerHTML = html;
        }

        // ---------- Theme ----------

        function setupThemeToggle() {
            syncThemeAssets();

            document.getElementById('theme-toggle').addEventListener('click', async function() {
                const dark = !isDarkTheme();
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
                try {
                    localStorage.setItem('codewiki-theme', dark ? 'dark' : 'light');
                } catch (e) {
                    // Storage unavailable (private mode etc.) — theme just won't persist
                }

                syncThemeAssets();
                initMermaid();
                closeMermaidLightbox();

                // Re-render diagrams from their stored source in the new theme
                document.querySelectorAll('#content .mermaid').forEach(el => {
                    if (el.dataset.src) el.innerHTML = '';
                });
                await renderMermaidDiagrams();
            });
        }

        function syncThemeAssets() {
            const dark = isDarkTheme();
            document.getElementById('theme-toggle').textContent = dark ? '☀️' : '🌙';

            const lightCss = document.getElementById('hljs-theme-light');
            const darkCss = document.getElementById('hljs-theme-dark');
            if (lightCss) lightCss.disabled = dark;
            if (darkCss) darkCss.disabled = !dark;
        }

        // ---------- Mobile drawer ----------

        function setupMobileDrawer() {
            document.getElementById('menu-toggle').addEventListener('click', function() {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('open');
                document.getElementById('backdrop').classList.toggle('visible', sidebar.classList.contains('open'));
            });

            document.getElementById('backdrop').addEventListener('click', closeDrawer);
        }

        function closeDrawer() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('backdrop').classList.remove('visible');
        }

        // ---------- Utilities ----------

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showError(message) {
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');

            loading.style.display = 'none';
            content.style.display = 'block';
            content.innerHTML = '<div class="error"><h3>⚠️ Error</h3><p>' +
                escapeHtml(message) + '</p></div>';
            document.getElementById('pager').innerHTML = '';
            document.getElementById('toc').innerHTML = '';
            document.querySelector('.content-inner').classList.add('no-toc');
        }
    </script>
</body>
</html>
