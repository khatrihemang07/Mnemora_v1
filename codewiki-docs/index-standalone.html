n\n## The reactive controller (`search.svelte.ts`)\n\n`JournalSearch` holds:\n\n- `session` (`$state.raw`): the current `SearchSession`.\n- `committed` (`$state`): the query the results follow.\n- `savedScroll`: the results list's scroll position when it was left through a result.\n- A private debounce timer.\n\nGetters: `active`, `parked` (whether `session.parked !== null`), `query` and `range`.\n\nEvery method applies a pure transition through the private `#set`. `#set` clears the pending timer, stores the new session, sets `committed` to the new query immediately, and resets `savedScroll` to 0 once there is nothing left to return to (not active and nothing parked).\n\nMethods: `open`, `openFor`, `toggle`, `close`, `park(scrollTop)`, `back`, `escape`, `setRange` and `dispose`. `park` records the scroll position and then calls `openResult`.\n\n### Debounce\n\n```mermaid\nsequenceDiagram\n    participant User\n    participant Field as Search field\n    participant JS as JournalSearch\n    participant Q as searchQuery\n    User->>Field: types \"riv\"\n    Field->>JS: setQuery(\"riv\")\n    JS->>JS: session.filter.query = \"riv\" (field updates at once)\n    JS->>JS: restart 150ms timer\n    User->>Field: types \"river\"\n    Field->>JS: setQuery(\"river\")\n    JS->>JS: restart timer\n    Note over JS: 150ms of quiet\n    JS->>JS: committed = \"river\"\n    JS->>Q: results re-run for committed + range\n```\n\nTyping in `setQuery` updates the visible field at once but moves `committed` only after 150 ms of quiet. Every other change (opening, closing, changing the range, Escape, Back) goes through `#set`, which commits immediately and cancels any pending timer. Consumers should drive the results from `committed` and `range`, not from `query`.\n\n`dispose()` clears the timer when the owning component is torn down.\n\n### External launching\n\n`requestSearch(query)` writes `searchLauncher.pending`, a reactive `SearchLauncher` singleton. The Journal view takes the pending value when it is showing and calls `openFor(query)`. An empty string opens a blank search. This is how the \"Search Journal for…\" palette action reaches the Journal. See [Shell_and_Navigation](../Frontend_Platform_and_Shell/Shell_and_Navigation.md) for the palette side.\n\n## Behaviour to remember\n\n1. **Back preserves context.** Opening a hit parks the filter, and Back or ⌘F restores the same query and range. `JournalSearch` also keeps the scroll offset in `savedScroll`. Any other exit (header toggle, Escape on an empty query, `close`) discards the parked filter for good.\n2. **Escape is two-step.** The first press clears the words, and the second closes search.\n3. **Ranges are inclusive Page dates.** They are the `YYYY-MM-DD` strings used across the Journal, not timestamps.\n4. **Searching needs a reason.** A blank query with no range does not search (`canSearch`).\n\n## Testing\n\n`search-state.test.ts` (Vitest) covers:\n\n- preset arithmetic and month clamping\n- range labels\n- `canSearch`\n- the full session lifecycle: open, close, park, Back, ⌘F, Escape, palette open, toggle\n- hit grouping and `first` offsets\n- the small helpers\n\n`search.svelte.ts` has no test file of its own.\n", "Journal_Frontend.md": "# Journal_Frontend\n\n## Purpose\n\nJournal_Frontend (`src/modules/journal/`) is the client-side UI logic for the Journal. The Journal is a dated feed of Pages, and each Page holds Entries written in Markdown. The module lets a user:\n\n- **Write** new Entries, with autosave and a per-session change record.\n- **Edit** existing Entries inline.\n- **Browse** the infinite, virtualised feed by date.\n- **Search** by words and date range.\n\nIt sits between the generated IPC bindings and the app shell. Most rules are pure, DOM-free functions that can be unit tested. Thin Svelte 5 rune classes hold the state and expose it through context. The backend is the [Journal_Module](Domain_Modules_(Todo_and_Journal)/Journal_Module.md), reached through the [Journal_Domain_Service](Tauri_Host_and_Command_Layer/Journal_Domain_Service.md).\n\n## Architecture\n\n```mermaid\ngraph TD\n    Shell[App shell: routes, bare keys, palette] -->|manifest.ts| Page[JournalPage.svelte]\n\n    subgraph Browse[\"Feed and Navigation\"]\n        Feed[feed.ts / dates.ts / paging.ts]\n        Nav[JournalNav + EntryFocus]\n        Launcher[launcher: compose / go-to-date]\n    end\n\n    subgraph Write[\"Composer and Entry Editing\"]\n        Composer[Composer]\n        EntryEditing[EntryEditing]\n        Actions[entry-actions.ts]\n        Editing[Editing context]\n    end\n\n    subgraph Find[\"Search\"]\n        SearchState[search-state.ts]\n        JS[JournalSearch]\n    end\n\n    Page --> Browse\n    Page --> Write\n    Page --> Find\n    Launcher --> Page\n    Composer --> Queries\n    EntryEditing --> Queries\n    Actions --> Queries\n    JS -->|committed query + range| Queries[queries.ts: TanStack Query]\n    Feed --> Queries\n    Queries --> IPC[IPC bindings: journal_* commands]\n    IPC --> Backend[Rust Journal backend]\n```\n\n`queries.ts` is the shared data layer. It is documented under the composer sub-module but used by all three. `JournalPage.svelte` creates the navigation, focus and editing objects, provides them through context, and renders the feed.\n\n### Sub-modules\n\n| Sub-module | Role |\n|---|---|\n| Journal_Feed_and_Navigation | Builds the feed rows (Today injection, month dividers) and formats dates. It holds the keyboard-focus reducer and the cross-module launcher mailbox, and it registers the Journal with the shell (route, keys, palette actions, Home card). |\n| Journal_Composer_and_Entry_Editing | Holds the `Composer` state machine (create once, then debounced autosave) and per-Entry `EntryEditing` sessions. It also holds the shared `Editing` context, entry actions (delete with undo, move, copy, task tick), remote-delete recovery and the `queries.ts` cache layer. |\n| Journal_Search | Holds the pure search session lifecycle (open, park, back, escape), date-range presets, hit grouping and keyboard highlight. It also holds the `JournalSearch` controller with its 150 ms debounce. |\n\n### Typical flow\n\n```mermaid\nsequenceDiagram\n    participant U as User\n    participant S as Shell\n    participant P as JournalPage\n    participant C as Composer\n    participant Q as queries.ts\n    participant B as Backend\n    U->>S: ⌘N / \"New entry\"\n    S->>P: requestCompose + navigate /journal\n    U->>C: types\n    C->>Q: create (first input), then debounced update\n    Q->>B: journal_* commands\n    U->>C: blur\n    C->>P: finish(), lastFinishedId\n    P->>Q: invalidateJournal, so the feed refreshes\n```\n\n## Key design points\n\n- **Dependency injection.** `Composer` and `EntryEditing` take their `create`, `update` and timer dependencies through a constructor, so tests drive them with fakes.\n- **No lost text.** Failed saves keep the text. Blank text never deletes an Entry. Leaving is guarded while text is unsaved. A remotely deleted Entry can be restored with the person's draft on top.\n- **Zone-free dates.** Pages use `YYYY-MM-DD` strings, and Entry times display in the zone they were written in.\n- **Optimistic cache edits.** `patchEntry` and `removeCachedEntry` update the cache in place, so the feed does not jump.\n- **Search keeps context.** Opening a hit parks the search, and Back restores the same query, range and scroll position.\n\n## Core component documentation\n\n- [Journal_Composer_and_Entry_Editing](Journal_Frontend/Journal_Composer_and_Entry_Editing.md): writing, editing, entry actions and the query layer.\n- [Journal_Feed_and_Navigation](Journal_Frontend/Journal_Feed_and_Navigation.md): the feed model, dates, focus, navigation state and the shell manifest.\n- [Journal_Search](Journal_Frontend/Journal_Search.md): search sessions, ranges, results and the debounced controller.", "Sync_Frontend/Sync_Activity_Conflicts_and_Status.md": "# Sync_Activity_Conflicts_and_Status\n\nThis module is the part of the Sync frontend (`src/modules/sync/`) that shows people what sync is doing and what needs them. It covers four things:\n\n- the **Activity** log, with its filters, day grouping and virtual-list helpers;\n- the **Conflicts** list and the rows used by Compare;\n- **attention**: the sidebar badge, the Home card line, the palette hint and the toast;\n- **status plumbing**: the on/off switch, the paused banner, the \"Sync now\" action, resume handling and the tab routing.\n\nThe code is small, mostly pure functions that are easy to test. It formats data that Rust produces and does not decide anything about sync itself. The decisions (what counts as a conflict, how activity rows are phrased, what pauses sync) are made in the Rust engine. See [Sync_Conflicts_and_Resolutions](../Sync_Replication_Engine/Sync_Conflicts_and_Resolutions.md) and [Sync_Activity_and_Devices](../Sync_Replication_Engine/Sync_Activity_and_Devices.md) for that side. The Tauri commands that carry the data are in [Sync_Conflicts_and_Activity](../Tauri_Host_and_Command_Layer/Sync_Conflicts_and_Activity.md) and [Sync_Connectivity_and_Pairing](../Tauri_Host_and_Command_Layer/Sync_Connectivity_and_Pairing.md). Device lists, pairing and device sheets live in the sibling [Sync_Devices_and_Pairing](Sync_Devices_and_Pairing.md). The parent is [Sync_Frontend](../Sync_Frontend.md).\n\n## Architecture\n\n```mermaid\ngraph TD\n    Rust[\"Rust commands & events<br/>(syncActivity, syncConflicts, syncAttention, syncSetEnabled)\"]\n    Bindings[\"lib/ipc/bindings\"]\n    Queries[\"queries.ts<br/>TanStack Query options + watchers\"]\n    Att[\"attention.ts\"]\n    Badge[\"badge.svelte.ts\"]\n    Act[\"activity.ts\"]\n    Conf[\"conflicts.ts\"]\n    Pause[\"pause.ts\"]\n    Tabs[\"tabs.ts\"]\n    Switch[\"switch.svelte.ts\"]\n    Now[\"sync-now.ts\"]\n    Resume[\"resume.ts\"]\n    UI[\"Svelte views: Activity, Conflicts, Compare,<br/>sidebar, Home card, palette, Devices banner\"]\n\n    Rust --> Bindings --> Queries\n    Queries --> Badge --> Att\n    Queries --> UI\n    Att --> UI\n    Act --> UI\n    Conf --> UI\n    Pause --> UI\n    Tabs --> UI\n    Switch --> Queries\n    Switch --> Bindings\n    Now --> UI\n    Resume --> UI\n```\n\nRust events invalidate query keys. The queries refetch, and pure formatters turn the fresh data into text and groups for the views.\n\n## Data fetching: `queries.ts`\n\nAll reads go through TanStack Query with `staleTime: Infinity`, except Activity, which uses `staleTime: 0`. Freshness comes from events, not from timers.\n\n| Export | Query key | Source command | Refreshed by |\n|---|---|---|---|\n| `syncQuery`, `refreshSync()` | `['sync']` | `syncGet` | `refreshSync` (also invalidates the device file query) |\n| `devicesQuery` | `['sync','devices']` | `syncDevices` | `syncPeersEvent` via `watchDevices` |\n| `deviceDetailQuery(id)` | `['sync','device',id]` | `syncDevice` | `syncPeersEvent` (all `['sync','device']`) |\n| `conflictsQuery` | `['sync','conflicts']` | `syncConflicts` | `syncConflictsEvent` via `watchConflicts` |\n| `conflictQuery(id)` | `['sync','conflict',id]` | `syncConflict` | `syncConflictsEvent` |\n| `attentionQuery` | `['sync','attention']` | `syncAttention` | `syncConflictsEvent` and `syncPeersEvent` via `watchAttention` |\n| `activityQuery(filter)` | `['sync','activity',filter]` | `syncActivity(filter, cursor, 100)` | `syncActivityEvent` via `watchActivity` |\n\n- `activityQuery` is an infinite query. The first page param is `null`, and each page's `next` cursor is the next param. `ACTIVITY_PAGE` is 100 rows.\n- `watchDevices` also invalidates `['sync']`, because another device may have renamed this one.\n- `whileMounted(listen)` starts an async event listener and returns a synchronous cleanup. If cleanup runs before `listen()` resolves, the listener is stopped as soon as it arrives. This avoids leaking listeners when a view unmounts quickly.\n\n```mermaid\nsequenceDiagram\n    participant Peer as Other device\n    participant Rust as Rust sync engine\n    participant Ev as Tauri events\n    participant Q as queryClient\n    participant V as Svelte view\n    Peer->>Rust: records / conflict / status\n    Rust->>Ev: SyncConflictsEvent / SyncPeersEvent / SyncActivityEvent\n    Ev->>Q: invalidateQueries(keys)\n    Q->>Rust: refetch (syncConflicts, syncAttention, ...)\n    Rust-->>Q: fresh data\n    Q-->>V: reactive update\n```\n\n## Activity: `activity.ts`\n\nThe Activity tab is a virtual list of log rows, newest first. These helpers prepare its data:\n\n- **Filters.** `CHIP_ALL = 'all'` and `CHIP_THIS = 'this'` are the fixed chips. `chipsOf(peers)` returns All, This device, then one chip per paired device in Devices-tab order. `filterOf(chip)` maps a chip to the Rust `ActivityFilter` (`all`, `this_device`, or `device` with an id). `chipStillThere(chip, peers)` falls back to All when the chosen device has been forgotten.\n- **Grouping.** `itemsOf(rows, now)` sorts rows newest first and groups them by local day. It emits a flat `ActivityItem[]` of `day` headings and `row` items for the virtual list. Headings come from `doneHeading` in `lib/time/day-heading`, the same function the Todo Done view uses, so the screens read alike. The first heading is flagged `first`. Keys are `day:<date>` for headings and the row id for rows, so they are unique.\n- **Sizing.** `estimate(item, open)` gives a first height guess in px: 36 for the first heading, 58 for later headings, 52 for a row, and 78 for an expanded row with a breakdown. Real heights are measured once the rows are shown.\n- **Row text.** `lineText(row)` joins the row's text pieces into one sentence and appends ` · on <device>` when `row.on` is set. `expandable(row)` is true when the row has a `breakdown`.\n- `TOP_PX = 400`: when the list is scrolled within this many px of the top, it takes in new lines at once instead of waiting.\n\n## Conflicts: `conflicts.ts`\n\nConflicts are rows in the \"Needs you\" list and the subject of the Compare screen.\n\n- `rowTitle(subject, format)` says what clashed and where. A journal entry reads like `Wed 21 Oct · 09:12 Entry`. The time is the time of day in the zone where the entry was written, not the viewer's zone. A task reads `‘title’ · field`. The other subjects are a comment, a conversation title and a saved question.\n- `shownIn(subject)` names the screen that shows the text (Journal, Task, Conversation, Saved question). Compare uses it in its sentence.\n- `sidesText(row, format)` gives `Mac 09:40 · Pixel 8 09:31`, with the showing version first.\n- `groupByDay(rows, now, when)` is generic. By default it groups by `raised_at`. The \"Resolved automatically\" list passes its own timestamp selector. Day headings are the same ones Done and Activity use.\n- `conflictIdOf(pathname)` extracts the id from `/sync/conflicts/<id>`.\n- `usePossessive(device)` makes the \"Use Mac’s\" button label.\n- `timeText(ms, format)` and `pageLabel(pageDate)` are the formatters behind these. `timeText` follows the Time format preference (`24h` or `12h`).\n\n## Attention: `attention.ts` and `badge.svelte.ts`\n\n`Attention` comes from Rust's `syncAttention`. It has `conflicts`, `paused`, `unseen`, `local_network_blocked`, `last_synced` and `needed`. Several surfaces read the same query.\n\n| Function | Surface | Behaviour |\n|---|---|---|\n| `badgeOf(a)` | Desktop sidebar badge | `null` when `a` is undefined or there is nothing to show. An amber `!` when sync is paused. An amber `!` when the Local Network setting blocks sync. Otherwise a count of conflicts in the sync tone. |\n| `homeCardLine(a, now)` | Home card | One clause per issue joined with ` · `: conflicts to review, `Paused with A and B`, the local-network block, and `X not seen for N days`. Then `<device> synced <relative time>`, unless that device is already named above. |\n| `reviewPath(a)` | Review button | `/sync/conflicts` if any conflicts wait, otherwise `/sync`. |\n| `paletteHint(a)` | ⌘K \"Open Sync conflicts\" | `\"N waiting\"`, or `null` at zero. |\n| `newConflictsText(count, device)` | Toast for new conflicts | `1 sync conflict from Pixel 8`. |\n\nA pause or a local-network block outranks the conflict count in the badge, because nothing will arrive until it is dealt with. The phone tab bar never shows the badge. The manifest test asserts `phoneBadge === false` and that `useBadge`, `homeCard` and the three palette actions (Sync now, Pair a device, Open Sync conflicts) exist.\n\n`useSyncBadge()` in `badge.svelte.ts` wraps `attentionQuery` in `createQuery` and exposes a `$derived` `badge` getter. It must be called during component setup. The Sync overlay keeps the query fresh while Sync is on.\n\n## Pause banners: `pause.ts`\n\n`pauseBanner(peer)` turns a peer's `pause` into `{ title, text }`, or `null` when it is not paused. The title is `Paused with <name>`. There are three kinds of pause, matching the Rust side:\n\n- `update`: the data versions of some Modules differ. The text asks to update this device, the other device or both, and names the older Modules.\n- `clock`: a clock is more than five minutes ahead. The text says whose clock it is and by how much.\n- `stamped`: the clock is fixed but records stamped ahead are still waiting. The text says when sync resumes by itself.\n\nThe helpers are `durationWords(ms)`, `moduleName(id)` and `nameList(ids)`.\n\n- `durationWords` gives minutes under an hour, then hours (with minutes while under ten hours), then whole hours up to two days, then days.\n- `moduleName` maps `todo`, `journal`, `core` (shown as Settings) and `sync` to display names, and capitalizes any other id.\n- `nameList` joins names as \"A, B and C\".\n\n## Switch, Sync now and resume\n\n- **`switch.svelte.ts`.** `useSyncSwitch(ctx)` returns the Modules-page `DeviceSwitch` for Sync. Its `on` value is read from the device file (`deviceQuery`) and is never synced. Turning on calls `syncSetEnabled(true)`, refreshes the queries, asks for the Android Local Network permission, then navigates to `/sync`. A `turningOn` guard makes repeated clicks the same click, so they never open \"Turn off Sync?\" over the page that is opening. Turning off only opens the `turnOffDialog`. `confirmTurnOff()` closes it and calls `syncSetEnabled(false)`. Data and paired devices are kept. On failure it shows `notifyError`, and in all cases it awaits `refreshSync()`, because the shell routes by those values.\n- **`sync-now.ts`.** `runSyncNow(pairedCount, syncNow, say)` is the palette action. With no paired devices it says `NO_DEVICES`. Otherwise it fires `syncNow` without waiting and says \"Syncing with your devices\".\n- **`resume.ts`.** `resumeWhenBack(resume, {doc, win})` calls `resume` when the document becomes visible or the window fires `online`. Unreachable devices are then retried from the start of the backoff schedule (5 s, 15 s, 60 s, ...). It returns an unsubscribe function. The sources can be injected, which the tests use.\n- **`bar-gate.ts`.** `bar-gate.test.ts` is listed with this module and tests `BarGate`, the 600 ms rule. The progress bar stays hidden for a sync shorter than `PROGRESS_BAR_DELAY_MS` (600). It appears after 600 ms, progress updates do not restart the wait, a new sync waits its own 600 ms, and `stop()` cancels a pending reveal. The source file `bar-gate.ts` was not among the provided components, so only the test's behaviour is documented here.\n\n## Tabs: `tabs.ts`\n\nSync has three tabs: Devices (`/sync`), Conflicts (`/sync/conflicts`) and Activity (`/sync/activity`). Each has its own address, so a link lands on a tab and Back returns to the previous one.\n\n- `tabForPath` treats `/sync/conflicts/<id>` (Compare) as the Conflicts tab. Any unknown path under `/sync` is Devices.\n- `pathForTab` is the reverse mapping.\n- `tabsWithCounts(n)` adds the pending-conflicts count to the Conflicts tab as its pill.\n\n## Testing\n\nEach file has a Vitest suite next to it. They pin the exact wording shown to people and cover edge cases: falling back to All when a device is forgotten, a delete-then-open breakdown, UTC-offset entry times, the cases where badge precedence matters, and the triple-click guard on the Sync switch. The tests mock the router's `urlParam` and the TanStack, bindings and toast modules where needed, so none of them needs Tauri. For the browser mock versions of these commands see [IPC_Sync_Mocks](../IPC_Bridge_and_Browser_Mocks/IPC_Sync_Mocks.md).\n\n## How it fits in\n\n```mermaid\ngraph LR\n    Engine[\"Sync_Replication_Engine<br/>(Rust)\"] --> Host[\"Tauri commands & events\"]\n    Host --> IPC[\"IPC bindings\"]\n    IPC --> This[\"Sync_Activity_Conflicts_and_Status\"]\n    This --> Shell[\"Shell: sidebar badge, Home card, palette\"]\n    This --> Devs[\"Sync_Devices_and_Pairing views\"]\n```\n\nThe Shell consumes `useSyncBadge`, `homeCardLine`, `paletteHint` and `runSyncNow` through the Sync manifest. See [Shell_and_Navigation](../Frontend_Platform_and_Shell/Shell_and_Navigation.md) for how modules register those hooks.\n", "Sync_Frontend/Sync_Devices_and_Pairing.md": "# Sync Devices and Pairing\n\nThis module is the frontend half of Sync's **device management and pairing** experience, in `src/modules/sync/`. It covers the Devices page, the per-device sheet, the pairing sheet (show a code, enter a code, pair by address, merge preview), the local-network permission banners, and the helpers that word device status for the user.\n\nThe Rust side owns all pairing phases and device state. This module holds only what the UI itself must remember (sheet open or closed, typed digits, drafts) and turns Rust's views into plain words. For the engine see [Sync_Pairing](../Sync_Replication_Engine/Sync_Pairing.md), [Sync_Activity_and_Devices](../Sync_Replication_Engine/Sync_Activity_and_Devices.md) and [Sync_Networking_and_Live](../Sync_Replication_Engine/Sync_Networking_and_Live.md). For the Tauri commands see [Sync_Connectivity_and_Pairing](../Tauri_Host_and_Command_Layer/Sync_Connectivity_and_Pairing.md). For the sibling frontend (activity, conflicts, on/off switch, queries) see [Sync_Activity_Conflicts_and_Status](Sync_Activity_Conflicts_and_Status.md). For the browser mocks that stand in for Rust see [IPC_Sync_Mocks](../IPC_Bridge_and_Browser_Mocks/IPC_Sync_Mocks.md).\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph Rust[\"Rust host (commands + events)\"]\n        C[commands.sync*]\n        E[events.syncPairingEvent / syncPeersEvent]\n    end\n    subgraph Pairing[\"Pairing sheet\"]\n        P[pairing.svelte.ts: Pairing]\n        PV[pair-view.ts: problem, clock, previewStats]\n        A[address.ts: parseAddress, routeOfAddress]\n        CF[compare-flow.svelte.ts: CompareFlow]\n    end\n    subgraph Devices[\"Devices page\"]\n        PS[peer-status.ts: rowParts]\n        TD[this-device.ts: listeningSummary]\n        W[welcome.ts: showWelcome]\n        DR[devices-refresh.ts]\n        DS[device-sheet.svelte.ts: DeviceSheetState]\n        DD[device-detail.ts]\n        RN[device-rename.svelte.ts: DeviceRename]\n    end\n    subgraph Platform[\"Platform glue\"]\n        LN[local-network.ts]\n        MC[multicast.ts]\n    end\n    UP[lib/router/url-param]\n    P --> C\n    E --> P\n    P --> PV\n    P --> A\n    P --> UP\n    DS --> UP\n    DD --> DS\n    RN --> C\n    LN --> C\n    LN --> Android[window.MnemoraAndroid bridge]\n    MC --> Android\n```\n\n## Pairing sheet\n\n### `Pairing` (`pairing.svelte.ts`)\nA singleton (`pairing`) state machine facade. Rust's `PairingView` (`idle`, `showing`, `asking`, `failed`, `paired`, and the merge-preview phases) is stored in `view`; the class adds `open`, `mode` (`show` | `enter` | `address`), the typed `code` and `address`, `addressError`, `commandError`, `pausedOnMobile`, and `arrivedAt` (the countdown counts from there).\n\nKey behaviours:\n- **`listen()`** subscribes to `syncPairingEvent` and `syncPeersEvent` and reads `syncPairState()`. A peers event triggers `refreshPause()` since the phone may have changed network.\n- **`start(mode)`** opens the sheet, pushes a history entry `?pair=<mode>` through `urlParam`, resets state, checks mobile-data pause, and in `show` mode calls `syncPairShow`.\n- **`submit()`** (8 digits, `syncPairEnter`) and **`submitAddress()`** (`syncPairEnterAt`); the address is validated first via `parseAddress`, so a bad address is reported and nothing is dialled.\n- **`decide(allow)`** answers the \"ask\" step; Deny closes the sheet immediately. **`merge(merge)`** answers the merge preview; Cancel closes it and leaves both databases untouched.\n- **`newCode()`**, **`switchTo(mode)`** (cancel then start again), **`close()`** (cancel and refresh the device list).\n- **History handling**: `#pushed` remembers whether opening pushed an entry so closing can `history.back()`. `backed()` handles the Back button; `dropStale()` removes a leftover `?pair=` after reload or Forward. `#stepping` stops `dropStale` from racing our own `history.back()`.\n- Editing the code or address (`editCode`, `editAddress`) clears an earlier failure. A dead code (per `problem(...).deadCode`) empties the digit boxes. A `paired` view triggers `refreshSync()`.\n\n```mermaid\nsequenceDiagram\n    participant U as Person\n    participant S as Pairing sheet\n    participant R as Rust\n    U->>S: Pair a device\n    S->>R: syncPairShow\n    R-->>S: syncPairingEvent(showing code)\n    Note over S: countdown from arrivedAt\n    R-->>S: asking (other device typed the code)\n    U->>S: Allow\n    S->>R: syncPairDecide(true)\n    R-->>S: merge preview (counts)\n    U->>S: Merge and sync\n    S->>R: syncPairMerge(true)\n    R-->>S: paired\n    S->>R: refreshSync\n```\n\n### `pair-view.ts`\nPure wording and arithmetic:\n- **`problem(error, typing, address)`** maps every `PairingError` kind (`wrong_code`, `code_expired`, `tries_used`, `declined`, `cancelled`, `different_environment`, `version_mismatch`, `different_groups`, `nothing_nearby`, `connection_lost`, `address_not_found`, `address_unreachable`, `backup_failed`, `busy`, `not_ready`) to a title, a fix, and a `deadCode` flag. `version_mismatch` names the older Modules via `nameList` from `pause.ts` (see [Sync_Activity_Conflicts_and_Status](Sync_Activity_Conflicts_and_Status.md)). Tailscale is mentioned only when `usesTailscale(address)`.\n- **`PAIRING_PAUSED`** text for mobile data.\n- **`previewStats(there, here)`** gives the six merge-preview numbers (entries, tasks, lists; other device first, singular/plural aware).\n- **`clock(ms)`** formats `m:ss`, rounding up so ring and text reach zero together; **`fractionLeft`** gives the ring fraction; **`remaining(view, elapsed)`** the time left for `showing`/`asking`; **`isBusy(view)`** is true when leaving the sheet needs a cancel.\n\n### `address.ts` and `address.test.ts`\n`address.ts` (not in this module's component list, but imported by it) provides `parseAddress`, `ADDRESS_MESSAGES`, `routeOfAddress`, `usesTailscale`. `address.test.ts` runs the shared fixture `lib/ipc/fixtures/sync-rules.json` (`address_cases`) so the TypeScript parser and the Rust parser agree, checks the four message strings equal Rust's, accepts a full-length IPv6 address and refuses nine groups, and checks the route: `100.64.0.0/10`, `fd7a:115c:a1e0::/48` and `.ts.net` names mean Tailscale, everything else Wi‑Fi.\n\n### `compare-flow.svelte.ts`\nState for the \"Edit merged\" conflict flow (it lives here in the sources, though it concerns conflicts, see [Sync_Activity_Conflicts_and_Status](Sync_Activity_Conflicts_and_Status.md)). `CompareFlow` holds `step` (`compare` → `choose` → `polish`), `choices`, `draft`, `showOriginal`, `draftFor`. It is kept in a module-level map keyed by conflict id because the shell remounts the page across the phone breakpoint, and a resize must not lose the person's work.\n- `compareFlow(id)` / `forgetCompareFlow(id)` create and drop a flow.\n- `draftIsCurrent(flow)`: the draft is only regenerated when the choices change.\n- `stepBack(step)`: polish→choose→compare, `null` from compare (leave the page); nothing typed is lost.\n- `escapeCancels(flow, event, overlayOpen, editorPopupOpen)`: Esc in choose or polish discards the edit, unless an open dialog/sheet or the editor's slash menu owns that Esc. `dialogOpen` detects an open `[role=dialog]`.\n\n## Devices page\n\n| File | Role |\n|---|---|\n| `peer-status.ts` | `rowParts(peer)` builds the line under a device name: status word, \"synced 2 min ago\", \"12 in · 3 out\" (only when up to date), route (Wi‑Fi/Tailscale). A syncing device reads \"Syncing… 120 of 340 changes\". `absoluteTime` gives the hover text honoring the 12h/24h preference. A paused, mobile-data or blocked device reads \"last synced\". |\n| `this-device.ts` | `listeningSummary(device)`: \"Paused on mobile data\", \"Not listening yet\", or \"Listening on Wi‑Fi and Tailscale\" with a detail line of addresses (IPv6 bracketed) and port. |\n| `welcome.ts` | `showWelcome(paired, listed)`: the welcome card shows when either the Sync state count or the devices list is 0 (either may notice first after Leave or Forget). |\n| `devices-refresh.ts` | `refreshWhileVisible(refresh, ms=10s)` re-reads this device's addresses on a timer while visible and on focus/visibility, since networks can change without a Sync event. Returns a stop function. |\n| `device-sheet.svelte.ts` | `deviceSheet` singleton: the open device id lives in the URL (`/sync?device=<id>`). `open` pushes an entry, `close` steps back (debounced 400 ms) or drops the parameter, `dismiss` drops it without stepping back (device forgotten). |\n| `device-detail.ts` | `versionsText` (\"Mnemora 0.9.2 · Journal 3 · Todo 9 · Core 4\", content Modules first), `addressLines` (\"worked 2 min ago\" / \"not tried yet\"), `pairedText` (\"Wed 14 Oct, by Hemang's MacBook Pro\"), `deviceGone(error)` true for an `IpcError` with code `not_found`. |\n| `device-rename.svelte.ts` | `DeviceRename`: Enter or blur saves, Esc cancels. `commit` ignores an unchanged name and is guarded so Enter plus blur save once. A refusal keeps the field open with the reason; typing or a new try clears the old message. |\n\n```mermaid\nstateDiagram-v2\n    [*] --> Viewing\n    Viewing --> Editing: start(current)\n    Editing --> Editing: type(text) clears error\n    Editing --> Viewing: commit, name unchanged\n    Editing --> Saving: commit, name changed\n    Saving --> Viewing: save ok\n    Saving --> Editing: refused, error = reason\n    Editing --> Viewing: cancel (Esc)\n```\n\n`device-rename.test.ts` (`refuse` helper) covers a good save, refusal with the reason, Esc after refusal, message replacement, and the single-save guarantee.\n\n## Local network and platform glue\n\n`local-network.ts` words and acts on the OS blocking local-network access (macOS 15+ Local Network privacy, Android 17 permission). Rust decides `local_network_blocked`; this file supplies:\n- `welcomeLine(mac, device)` the Mac-only \"will ask\" line, hidden when already blocked.\n- `localNetworkBanner(device)` phone or Mac wording with an \"Open Settings\" button, or `null`.\n- `pairByAddressHint(device)` the Mac's \"Or on your phone: Pair by address… <ip>\" line.\n- `openLocalNetworkSettings(platform, bridge)` asks via `window.MnemoraAndroid` on phones, otherwise calls `syncOpenLocalNetworkSettings`.\n- `askLocalNetworkOnEnable` (Android 17+, only when Sync is turned on).\n- `reportLocalNetworkPermission(bridge, report, sources)` while Sync is on: asks once if never requested, then reports `denied` now, on visibility change and on the `mnemora-local-network` window event. On stop it reports `false`.\n\n`multicast.ts` `holdMulticastWhileVisible(bridge, doc)` holds Android's Wi‑Fi multicast lock (needed for mDNS discovery) while the page is visible and releases it on hide or stop; a no-op without the bridge. `multicast.test.ts` uses `fakeDocument` to verify the hold/release sequence `[true, false, true, false]`. Both rely on the `AndroidBridge` type from the [Theme](../Frontend_Platform_and_Shell/Theme.md) system-bars module and on the Android side in [Android_Integration](../Android_and_Home-Screen_Widget_Platform/Android_Integration.md).\n\n## Design notes\n\n- **Rust owns truth.** The UI never derives pairing phase transitions; it stores the last view and words it.\n- **URL as sheet state.** Both the pairing and device sheets use `urlParam`, so Back closes them and reload restores them (pairing intentionally drops a stale `?pair=` since nothing is pairing).\n- **Shared fixtures keep TS and Rust identical** (address rules, error wording), the same approach the mocks use.\n- **Cleanup functions.** `listen`, `refreshWhileVisible`, `holdMulticastWhileVisible` and `reportLocalNetworkPermission` all return stop functions meant to be called on unmount, so nothing runs while Sync is off.\n", "Sync_Frontend.md": "# Sync_Frontend\n\n## Purpose\n\n`Sync_Frontend` (`src/modules/sync/`) is the UI side of Mnemora's device sync. It lets people see what sync is doing, pair and manage devices, and resolve what needs them.\n\nThe code is mostly small, pure formatters and light state holders. **Rust owns the truth.** It decides pairing phases, what counts as a conflict, how activity rows are phrased and what pauses sync. This module fetches that data, stores only transient UI state (open sheets, typed digits, drafts) and turns it into plain wording for the views.\n\nIt has two parts:\n\n| Sub-module | Responsibility |\n|---|---|\n| [Sync_Activity_Conflicts_and_Status](Sync_Frontend/Sync_Activity_Conflicts_and_Status.md) | The Activity log, the Conflicts list and Compare rows, attention surfaces (sidebar badge, Home card, palette hint, toast), pause banners, the on/off switch, \"Sync now\", resume handling, tab routing, and the TanStack Query layer. |\n| [Sync_Devices_and_Pairing](Sync_Frontend/Sync_Devices_and_Pairing.md) | The Devices page, the per-device sheet and rename, the pairing sheet (show code, enter code, pair by address, merge preview), local-network and multicast platform glue, and device-status wording. |\n\n## Architecture\n\n```mermaid\ngraph TD\n    Rust[\"Rust host<br/>(Tauri commands and events)\"]\n    IPC[\"lib/ipc/bindings\"]\n\n    subgraph Status[\"Sync_Activity_Conflicts_and_Status\"]\n        Q[\"queries.ts<br/>TanStack Query + event watchers\"]\n        Att[\"attention / badge\"]\n        Act[\"activity / conflicts\"]\n        Pause[\"pause / tabs\"]\n        Sw[\"switch / sync-now / resume\"]\n    end\n\n    subgraph Dev[\"Sync_Devices_and_Pairing\"]\n        Pair[\"Pairing sheet<br/>pairing.svelte.ts, pair-view, address\"]\n        Page[\"Devices page<br/>peer-status, device-sheet, device-rename\"]\n        Plat[\"local-network / multicast\"]\n        Cmp[\"compare-flow\"]\n    end\n\n    Shell[\"Shell: sidebar badge, Home card, palette\"]\n    Android[\"window.MnemoraAndroid bridge\"]\n\n    Rust <--> IPC\n    IPC --> Q\n    IPC --> Pair\n    Q --> Att --> Shell\n    Q --> Act\n    Q --> Page\n    Sw --> IPC\n    Pause --> Page\n    Pause --> Pair\n    Plat --> Android\n    Plat --> IPC\n    Cmp --> Act\n```\n\n### Data flow\n\nRust events invalidate query keys. Queries refetch with `staleTime: Infinity`, except Activity, which uses 0. Pure formatters then turn the fresh data into text and groups for the views.\n\n```mermaid\nsequenceDiagram\n    participant Rust as Rust sync engine\n    participant Ev as Tauri events\n    participant Q as Query layer\n    participant V as Svelte views\n    Rust->>Ev: SyncPeers / SyncConflicts / SyncActivity / SyncPairing\n    Ev->>Q: invalidate keys, or update the pairing view\n    Q->>Rust: refetch\n    Rust-->>Q: fresh data\n    Q-->>V: reactive update, formatted by pure helpers\n```\n\n### Design points\n\n- **Events, not timers.** Freshness comes from Tauri events. The only timer is `refreshWhileVisible`, which re-reads this device's addresses every 10 s because networks can change without a Sync event.\n- **URL as sheet state.** The pairing sheet (`?pair=`) and the device sheet (`?device=`) both use `urlParam`. Back closes them and reload restores them. A stale `?pair=` is dropped.\n- **Three tabs, three addresses.** Devices is `/sync`, Conflicts is `/sync/conflicts` and Activity is `/sync/activity`. Compare (`/sync/conflicts/<id>`) belongs to the Conflicts tab.\n- **Shared fixtures.** The address rules and error wording are checked against the same fixtures as the Rust code. The browser mocks use them too.\n- **Cleanup.** Listeners and watchers return stop functions that are called on unmount, so nothing runs while Sync is off.\n- **Attention precedence.** A pause or a local-network block outranks the conflict count in the sidebar badge, because nothing will arrive until it is dealt with.\n\n## Core component documentation\n\n- [Sync_Activity_Conflicts_and_Status](Sync_Frontend/Sync_Activity_Conflicts_and_Status.md): queries, activity, conflicts, attention, pause, switch and tabs.\n- [Sync_Devices_and_Pairing](Sync_Frontend/Sync_Devices_and_Pairing.md): pairing state machine, device sheet and rename, local-network glue.\n\n## Related documentation\n\n- Engine: [Sync_Replication_Engine](Sync_Replication_Engine.md)\n- Tauri commands: [Sync_Connectivity_and_Pairing](Tauri_Host_and_Command_Layer/Sync_Connectivity_and_Pairing.md) and [Sync_Conflicts_and_Activity](Tauri_Host_and_Command_Layer/Sync_Conflicts_and_Activity.md)\n- Browser mocks: [IPC_Sync_Mocks](IPC_Bridge_and_Browser_Mocks/IPC_Sync_Mocks.md)\n- Shell hooks: [Shell_and_Navigation](Frontend_Platform_and_Shell/Shell_and_Navigation.md)", "Sync_Replication_Engine/Sync_Activity_and_Devices.md": "# Sync_Activity_and_Devices\n\nThis module is the \"what happened and who is in the group\" half of the sync crate (`crates/sync`). It covers:\n\n- **Activity**: an append-only, synced log of what Sync did (sessions, pairing, pauses, renames, conflicts, list merges). It is rendered as sentences for the Activity tab.\n- **Devices**: the paired-device roster, the Devices tab view, and the per-device sheet.\n- **Group membership records**: renames and typed addresses (`sync_device`), signed Forget decisions (`sync_revocation`), and signed introductions (`sync_introduction`). All three travel through the change log like any other record.\n\nThe replication machinery that carries these records is described in [Sync_Replication_Engine](../Sync_Replication_Engine.md) and [Sync_Replication_Engine_Sync_Replication_Engine](Sync_Replication_Engine_Sync_Replication_Engine.md). Related pages:\n\n- Pairing flow: [Sync_Pairing](Sync_Pairing.md)\n- Connections and sessions: [Sync_Networking_and_Live](Sync_Networking_and_Live.md)\n- Conflicts and resolutions: [Sync_Conflicts_and_Resolutions](Sync_Conflicts_and_Resolutions.md)\n- Tauri commands that expose this module: [Sync_Connectivity_and_Pairing](../Tauri_Host_and_Command_Layer/Sync_Connectivity_and_Pairing.md) and [Sync_Conflicts_and_Activity](../Tauri_Host_and_Command_Layer/Sync_Conflicts_and_Activity.md)\n- The UI that draws the results: [Sync_Activity_Conflicts_and_Status](../Sync_Frontend/Sync_Activity_Conflicts_and_Status.md) and [Sync_Devices_and_Pairing](../Sync_Frontend/Sync_Devices_and_Pairing.md)\n- Change log, `SyncEntity` and `Applied` contracts: [Core_Foundation](../Core_Foundation.md)\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph Records[\"Synced entities (change log)\"]\n        ACT[\"activity.rs<br/>sync_activity\"]\n        REN[\"rename.rs<br/>sync_device\"]\n        REV[\"revoke.rs<br/>sync_revocation\"]\n        INT[\"introduce.rs<br/>sync_introduction\"]\n    end\n    subgraph Views[\"Read models for the UI\"]\n        AV[\"activity_view.rs<br/>ActivityPage\"]\n        DEV[\"devices.rs<br/>DevicesView\"]\n        DET[\"detail.rs<br/>DeviceDetail\"]\n    end\n    PEERS[\"peers.rs<br/>sync_peers, group\"]\n    NAME[\"name.rs<br/>validate_name\"]\n    LIVE[\"live::PeerLive<br/>(session manager)\"]\n    CL[\"core::changelog\"]\n\n    ACT --> CL\n    REN --> CL\n    REV --> CL\n    INT --> CL\n    AV --> ACT\n    AV --> PEERS\n    DEV --> PEERS\n    DEV --> LIVE\n    DET --> DEV\n    DET --> PEERS\n    REN --> NAME\n    REN --> PEERS\n    INT --> REV\n    INT --> PEERS\n    REV --> PEERS\n    PEERS --> ACT\n    REN --> ACT\n    REV --> ACT\n```\n\nEach synced entity is declared as a `SyncEntity` (a name plus its fields). Each has an `apply` function, which is Sync's side of the Module contract for records that arrive from another device. Each also has a local writer that calls `changelog::record`.\n\n## Activity (`activity.rs`)\n\n### Row model\n\nA row of `sync_activity` is written once and never changes. All ten fields of the `ACTIVITY` entity are plain values fixed at creation: `kind`, `at`, `device`, `device_name`, `peer`, `peer_name`, `n_in`, `n_out`, `detail` and `extra`. A session's breakdown is `detail`, a JSON list of `Part { m, e, n }` (Module, entity, count). It holds counts only, never content. `extra` is kind-specific JSON, such as a reason, old and new names, or the conflict id.\n\n`Kind` has 13 variants: `Session`, `Paired`, `Joined`, `Left`, `Forgot`, `Renamed`, `Paused`, `Resumed`, `Failed`, `ConflictRaised`, `ConflictResolved`, `ListsMerged` and `Blocked`. `Why` gives the reason for a pause or failure: `Update`, `Clock`, `Environment`, `Revoked` or `Lost`. Both enums round-trip through `as_str` and `parse`.\n\n### \"Appears once on every device\"\n\nEach event must be one line on every device even though every device could notice it. Three rules ensure this:\n\n| Class of event | Who logs it | Example kinds |\n|---|---|---|\n| Lived through by two devices | The device with the lower id (`leads(me, peer)`) | `Session`, `Paired`, `Paused`, `Resumed`, `Failed` |\n| Concerns one device | That device | `Renamed`, `Forgot`, `Left` |\n| Has a name of its own | Any device, using a deterministic id | `ConflictRaised`, `ConflictResolved`, `ListsMerged`, `Joined` |\n\nNamed ids come from `named_id`, a `UUIDv5` over the parts joined with NUL in a fixed namespace. Devices that notice the same thing therefore derive the same id, and the `INSERT OR IGNORE` dedupes the copies. `log_conflict_deleted` deliberately reuses the id a person's resolution would have. It sets `extra.auto = true` so the line names no device.\n\n### Writing\n\n`log()` inserts the row, and if it was new it records a `ChangeOp::Create` in the change log so the row replicates. Throttling is read from the log itself, so a restart does not repeat a line:\n\n- `log_paused` and `log_resumed` consult `paused_now`, the newest pause or resume row for that device and peer. A pause is logged once, and a resume only follows a pause.\n- `log_failed` and `log_local_network_blocked` stay quiet for 10 minutes (`QUIET_MS = 600_000`) after the last such line, so a flaky link is one line.\n- `log_session` writes nothing when `n_in + n_out == 0`.\n- `note_events` turns `SyncEvent::ListsMerged` reported by Modules during a batch into activity, in the same transaction.\n\n### Receiving\n\n`apply` rebuilds a `Row` only if every field is present and `kind` parses. A partial record is returned `changed: false` and kept only for relay. Otherwise it does an `INSERT OR IGNORE`. Activity records never count as \"moved\" in a session. A sync that only passes activity on is therefore quiet, and this ends the chain: logging a session would otherwise make new records to pass on.\n\n```mermaid\nsequenceDiagram\n    participant A as Device A (lower id)\n    participant LA as A: sync_activity + change_log\n    participant B as Device B\n    participant LB as B: sync_activity\n    A->>A: session finishes, counts n_in/n_out\n    A->>LA: log_session (leads, n>0)\n    LA-->>B: record travels in the next session\n    B->>LB: activity::apply (INSERT OR IGNORE)\n    Note over B,LB: B never logs this session itself\n    B->>B: viewer flips in/out when peer == me\n```\n\n## Activity view (`activity_view.rs`)\n\n`page(conn, viewer, filter, cursor, limit)` returns an `ActivityPage` of `ActivityRow` values, newest first. The screen only draws them.\n\n- **Filter**: `ActivityFilter::All`, `ThisDevice` or `Device { id }` select rows where `device = ?1 OR peer = ?1`.\n- **Paging**: the cursor is `at:id`, parsed by `parse_cursor` and produced by `cursor_of`. The query orders by `at DESC, id DESC` and fetches `limit + 1` rows to decide whether `next` exists. `limit` is clamped to `1..=MAX_PAGE` (200).\n- **Sentences**: `describe` builds `Piece` runs, where `strong` marks names. It resolves names live through `peers::name_of`, falling back to the stored name and then to \"another device\". For a session about the viewer (`peer == viewer.device`), in and out are swapped so it reads from the viewer's side.\n- **`on` attribution**: \"· on Pixel 8\" is added only when someone else logged it and the sentence does not already name them. `Renamed` never gets it, and auto-closed conflicts belong to no device.\n- **Breakdown**: `breakdown_text` produces \"Todo: 9 Tasks, 1 List · Journal: 2 Entries · Settings: 1\" in a fixed Module order (todo, journal, core, sync, others). Entities with no noun add up as a bare number.\n- **Links**: a `ConflictRaised` line carries `ActivityLink::Conflicts` only while `conflict_waits` finds the conflict still open.\n- **Reasons**: `why_words` maps a `Why` to words such as \"one of you needs an update\" and \"the clocks are too far apart\".\n\n## Devices\n\n### Peer roster (`peers.rs`)\n\n`sync_peers` holds paired devices, and `sync_group` holds the single group id.\n\n- `list` returns `PeerRow` values with state defaulting to `NotNearby`. `devices::enrich` fills in live and remembered data later.\n- `name_of`, `is_paired`, `pinned` (the keys to pin at startup), `members` (what a newcomer is introduced to) and `group` are the read helpers.\n- `unique_name(wanted, taken)` makes names unique ignoring case, accents and whitespace, by suffixing \" (2)\", \" (3)\" and so on. It trims the base so the result stays within 40 characters. A shared JSON fixture (`src/lib/ipc/fixtures/sync-rules.json`) pins the rule for both Rust and the browser mock, see [IPC_Sync_Mocks](../IPC_Bridge_and_Browser_Mocks/IPC_Sync_Mocks.md).\n- `store_paired` records a pairing in one transaction. It creates or checks the group, stores the peer under a unique name, logs `Paired`, and takes in the other group members the peer brought. Revoked members are skipped, and each one that is taken in gets a `Joined` line. It returns `Stored`, which carries the keys to pin.\n- `forget_all` implements leaving. It logs `Left` unless the members were already told, then clears peers, the group, `peer_state`, revocations and introductions. Synced data stays.\n\n`PeerState` has seven values: `UpToDate`, `Syncing`, `NotNearby`, `PausedOnMobileData`, `BlockedByLocalNetwork`, `Paused` and `Removed`.\n\n### Devices tab (`devices.rs`)\n\n`view` builds `DevicesView { this_device, peers }`. `ThisDevice` carries the name, platform, listening port, shareable addresses, route kinds (Wi-Fi before Tailscale, told by IP range through `routes_of`), and the two blocking flags.\n\nState is derived by `state_of(live)` with this precedence: paused, then syncing, then reachable (`UpToDate`), then `NotNearby`. `enrich` merges remembered per-peer data from `peer_state::all`. Reachable devices sort first, then by most recent `last_seen_at`, `paired_at` and name. If this device has been forgotten (`revoke::removed_here`), every row reads `Removed`.\n\nTwo overlays then replace `NotNearby` only. `with_mobile_pause` is applied first, followed by `with_local_network_block`. Mobile data therefore wins over a blocked local network, and a connected device is never overridden.\n\n### Device sheet (`detail.rs`)\n\n`detail` joins `sync_peers` with `sync_peer_status` and returns `DeviceDetail`. It carries `paired_by` (resolved to this device's own name when it did the pairing), `last_seen_at`, `last_synced_at`, route, remembered `addresses` (from `peer_state::known_addresses`), the app version, and per-Module data versions. It also carries the typed address. `typed_address` reads the stored typed address, `set_typed_address` validates it through `Address::parse` and persists and syncs it through `rename::set_address`, and `typed_for_dial` supplies the third list of dial candidates to [Sync_Networking_and_Live](Sync_Networking_and_Live.md).\n\n## Naming and addresses (`name.rs`, `rename.rs`)\n\n`validate_name` trims the name and requires 1 to 40 characters, counted as characters and not bytes. `default_device_name` uses `whoami::devicename`. On Android it reads `ro.product.model` through `getprop`.\n\nRenames and typed addresses share the `sync_device` entity (id: the device, value fields `name` and `address`). The newest write wins for each field, and a null address means it was cleared.\n\n- `rename_peer` validates the name, rejects clashes with `Another of your devices already has that name`, settles the name, records the change and logs `Renamed`, all in one transaction. `check_own_name` does the same check for this device's own name, and `record_own` publishes it.\n- **Deterministic numbering** (`settle` and `settle_family`): a device stores `wanted_name` and displays `name`. All devices wanting the same name are numbered by device id, with the lowest id keeping the plain name. The result is a function of the wishes alone, so devices that heard renames in different orders still agree. Tests cover this for two and three devices in several delivery orders.\n- `apply` emits `SyncEvent::DeviceRenamed` when the record names this device, so the host can update the device file. It ignores a typed address aimed at this device itself.\n- `set_address`, `refresh_address` (used by `store_paired`, `take_in` and `take_effect`) and `adopt_local_addresses` (run at start) keep the `typed_address` cache in step with the log.\n\n## Trust records\n\nBoth trust records are signed with the member's device key, travel as all-or-nothing field groups (`in_group`), and are kept for relay even when they change nothing locally. Both are applied only if the signer's key is held for a paired device that does not itself stand forgotten, and only if the record is newer than what is held. Both reject records dated more than 24 hours ahead.\n\n### Forget (`revoke.rs`)\n\n`sync_revocation` records are keyed by the forgotten device. A `Row` holds the public key, name, platform, `state` (`revoked` or `lifted`), `at`, `by` and the signature. The signature covers the message `mnemora-revocation-v1` plus every field joined by NUL, so none can be swapped.\n\n- `forget` signs a revocation, stores and records it, logs `Forgot`, and removes the peer's rows (`sync_peers`, `sync_peer_status`, `sync_peer_addresses`) in one transaction. It returns `Forgotten { name, key }` so the caller can close connections and unpin the key.\n- `leave` signs a revocation of this device itself and logs `Left`. It is called only when a member is connected to hear it, and it is not stored locally. The caller then runs `peers::forget_all`.\n- `lift` writes a newer `lifted` decision when pairing takes a revoked device back, so the other members take it back too. `at` is strictly increasing (`next_at`), so an old `revoked` replayed later cannot undo the `lifted`.\n- `apply` rejects, with a debug log, any record that is incomplete, made here, signed by a non-member, badly signed, future-dated, signed by a forgotten device, not newer, or contradicted by a newer pairing (`paired_since`). `take_effect` removes the peer, but only if the stored key matches the revoked key. On `lifted` it re-adds the peer under a unique name.\n- `removed_here` and `is_revoked` feed `devices.rs` and `detail.rs`. `revoked_keys` gives the transport the keys it must never trust. `clear` runs when the group is left.\n\nNo remote wipe exists: a forgotten device keeps its data.\n\n### Introduce (`introduce.rs`)\n\nWhen a newcomer pairs through one member, that member signs an introduction so the other members accept the newcomer and can connect directly. `sync_introduction` is keyed by the newcomer and signed over `mnemora-introduction-v2`, which includes the `direct` flag.\n\n- `introduce` is a no-op when the paired devices are the only ones in the group. Otherwise, for each device with a usable key that is not itself, not revoked and paired here, it signs a row with a time that increases monotonically. `direct` is true only for the device this member really paired, and false for members merely passed on. It records the row as a Create or Update.\n- `apply` runs these checks in order: the fields are complete, the record is not an echo of this device's own or about this device, the signer is not the newcomer itself, the signer is a paired device with a valid signature, the date is not too far ahead, the signer is not forgotten, the record is newer, a group exists here, and the key is not already held by another id.\n- **Forget versus introduction race**: if the newcomer stands forgotten here, the introduction is stored but not acted on unless it is newer than the Forget **and** `direct`. Only a real pairing of that device is a decision to bring it back. Without the `direct` flag, any member that was behind on news could undo a Forget by relaying the device.\n- `take_in` inserts the peer with `paired_at = row.at`, so earlier Forgets cannot remove it again. It settles the name and refreshes the address. For an already-paired device it replaces the key only when the introduction is direct and newer.\n\n```mermaid\nstateDiagram-v2\n    [*] --> Paired : pairing or direct introduction\n    Paired --> Revoked : forget (signed revoked decision)\n    Revoked --> Paired : lift or newer direct introduction\n    Revoked --> Revoked : old or relayed introduction is stored but ignored\n    Paired --> [*] : leave (forget_all)\n```\n\n## Data flow summary\n\n```mermaid\nflowchart LR\n    S[Session manager<br/>live] -->|log_session, log_paused, log_failed| ACT[(sync_activity)]\n    P[Pairing] -->|store_paired: log_paired, log_joined| PEERS[(sync_peers)]\n    P -->|introduce / lift| TRUST[(introductions<br/>revocations)]\n    UI[Commands] -->|rename_peer, forget, set_typed_address| PEERS\n    ACT & TRUST & PEERS -->|changelog::record| CL[(change_log)]\n    CL <-->|replication| OTHER[Other devices]\n    OTHER -->|apply| ACT & TRUST & PEERS\n    ACT --> AV[activity_view::page]\n    PEERS --> DV[devices::view / detail]\n    LIVE[PeerLive] --> DV\n    AV & DV --> UI\n```\n\n## Design notes for maintainers\n\n- **Never log content.** Rows hold device names, counts and Module/entity kinds. The one exception is List names in a merge line.\n- **Rows are immutable.** `INSERT OR IGNORE` plus deterministic ids give idempotence, and the `apply` path is safe to replay in any order.\n- **State comes from the log, not memory**, for pause and failure throttling, so restarts do not repeat lines.\n- **Every signed message is versioned** (`...-v1`, `...-v2`) and covers every field, which allows later format changes without ambiguity.\n- **Integration coverage** lives in `src-tauri/src/sync_activity_tests.rs`, `sync_forget_tests.rs`, `sync_groups_tests.rs` and `sync_address_tests.rs`. These tests are described on [Sync_Connectivity_and_Pairing](../Tauri_Host_and_Command_Layer/Sync_Connectivity_and_Pairing.md) and [Sync_Conflicts_and_Activity](../Tauri_Host_and_Command_Layer/Sync_Conflicts_and_Activity.md).\n", "Sync_Replication_Engine/Sync_Conflicts_and_Resolutions.md": "# Sync Conflicts and Resolutions\n\nThis module is the part of the [Sync Replication Engine](../Sync_Replication_Engine.md) that deals with disagreement between devices. It has two halves:\n\n- **Conflicts** (`conflicts.rs`, `conflict_view.rs`): two devices rewrote the *same words* of a text. The merge has already put the newest version in the record, so every device shows the same text. The other version waits as a Conflict for the person to compare, keep, or merge.\n- **Resolutions** (`resolutions.rs`, `resolved_view.rs`): a log of what Sync decided *without asking*. Examples are a value two devices changed beside each other (newest wins), a record deleted on one device and edited on another, a Task put in the Inbox because its List is gone, and a text clash on a deleted record.\n\nThe Rust code computes the labels and diffs. The window only lays them out (see [Sync Activity, Conflicts and Status (frontend)](../Sync_Frontend/Sync_Activity_Conflicts_and_Status.md)). The Tauri commands that expose this module are in [Sync Conflicts and Activity (host)](../Tauri_Host_and_Command_Layer/Sync_Conflicts_and_Activity.md).\n\nNeither half ever logs text or values. Both log only structure, through `tracing` at debug level.\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph Engine[\"Sync engine (other pages)\"]\n        texts[\"texts.rs / textmerge.rs<br/>3-way text merge\"]\n        apply[\"apply.rs<br/>store and apply remote records\"]\n        changelog[\"core changelog\"]\n    end\n\n    subgraph Module[\"Sync Conflicts and Resolutions\"]\n        conflicts[\"conflicts.rs<br/>sync_conflicts + CONFLICT entity\"]\n        cview[\"conflict_view.rs<br/>ConflictList / ConflictView / plan / draft\"]\n        res[\"resolutions.rs<br/>sync_resolutions + RESOLUTION entity\"]\n        rview[\"resolved_view.rs<br/>ResolvedRow words\"]\n    end\n\n    activity[\"activity.rs<br/>(Sync Activity and Devices)\"]\n    peers[\"peers.rs\"]\n    host[\"Tauri commands<br/>sync_conflicts.rs\"]\n\n    texts -- \"Clashed\" --> conflicts\n    apply -- \"observe / settle_value / note_delete_edit\" --> res\n    apply -- \"RemoteChange\" --> conflicts\n    apply -- \"RemoteChange\" --> res\n    conflicts -- \"record()\" --> changelog\n    res -- \"record()\" --> changelog\n    conflicts --> activity\n    conflicts -- \"note_conflict_deleted\" --> res\n    cview --> conflicts\n    cview --> rview\n    rview --> res\n    cview --> peers\n    rview --> peers\n    host --> cview\n    host --> res\n```\n\nBoth halves follow the same pattern:\n\n1. A **stored table** (`sync_conflicts`, `sync_resolutions`) holds raw values.\n2. A **`SyncEntity` schema** (`CONFLICT`, `RESOLUTION`) makes the rows travel as change-log entities, `sync_conflict` and `sync_resolution`. A decision made on one device reaches all of them.\n3. A **view module** turns raw rows into display text on read. A renamed device or a changed date/time format therefore applies to the whole log at once.\n\n## Conflicts (`conflicts.rs`)\n\n### Identity and convergence\n\nA Conflict id is a UUIDv5 over the record, field, hash of the base text, and the sorted hashes of the two versions (`conflict_id`). Two consequences follow:\n\n- Every device that meets the same clash derives the same row, whichever side it calls \"ours\".\n- A device that learns of the clash from another finds the row already there. `insert` uses `INSERT OR IGNORE`, and `raise` returns early if `get(id)` exists.\n\nEverything except the outcome is fixed at creation. The `status`, `resolution`, `resolved_at` and `resolved_by` fields form one atomic group (`OUTCOME`). The outcome only ever moves from `open` to `resolved`.\n\n### Stored shape\n\n`Stored` holds:\n\n- The target (entity, id, field).\n- `base`, the text both sides started from.\n- Side **a**, the newest version, which was applied (`a_text`, `a_device`, `a_at`).\n- Side **b**, the other version.\n- `raised_at`, equal to `a_at`.\n- The outcome fields.\n\n### `Resolution` outcomes\n\n| Variant | Stored value | Meaning |\n|---|---|---|\n| `KeptThis` | `keep_this` | The showing version stays. |\n| `KeptOther` | `keep_other` | The other version is written. |\n| `Merged` | `merged` | An edited, clash-by-clash text is written. |\n| `Deleted` | `deleted` | The record is deleted, so nothing was asked. |\n| `Superseded` | `superseded` | A late record showed the clash was never one. |\n\nOnly the first three count as a person's choice and are logged as Activity (`log_conflict_resolved`). `Deleted` and `Superseded` are the engine closing the row on its own.\n\n### Lifecycle\n\n```mermaid\nstateDiagram-v2\n    [*] --> Open: raise() finds a clash\n    [*] --> Resolved_Deleted: raise() and target already deleted\n    Open --> Resolved_Person: resolve(KeptThis / KeptOther / Merged)\n    Open --> Resolved_Deleted: settle_deleted / settle_all_deleted\n    Open --> Resolved_Superseded: supersede() after replay\n    Open --> Resolved_Remote: apply() takes status=resolved from a peer\n    Resolved_Person --> [*]\n    Resolved_Deleted --> [*]\n    Resolved_Superseded --> [*]\n    Resolved_Remote --> [*]\n```\n\nKey functions:\n\n- **`raise`** is called by the text merge with a `Clashed` value. It is idempotent. It records the new row as a `Create` change and emits `SyncEvent::ConflictRaised`, or `ConflictAutoResolved` if the target is already deleted. An auto-resolved clash also writes a `ConflictDeleted` resolution via `resolutions::note_conflict_deleted`. Otherwise it logs \"conflict raised\" Activity against the device that authored the *other* version.\n- **`resolve`** runs `UPDATE ... WHERE status='open'`. It does nothing, and returns `false`, if the Conflict is already resolved. Otherwise it records an `Update` change.\n- **`settle_all_deleted` / `settle_deleted`** close open Conflicts whose record is deleted. They run before `open` and `open_count`, because a delete made on *this* device never passes through the receiving side.\n- **`supersede`** closes open Conflicts for a field that a full replay of its records no longer produces (anything not in `keep`).\n- **`apply`** is the receiving side of the Module contract. It creates the row only from a record carrying all the creation fields. Otherwise the record is \"kept for relay only\". Then it applies a `resolved` outcome and reports `changed` by comparing before and after.\n\n## Conflict presentation (`conflict_view.rs`)\n\nAll view data is computed here: labels, diffs, the original text, and clash pieces.\n\n```mermaid\nsequenceDiagram\n    participant UI as Conflicts tab / Compare\n    participant H as Host command\n    participant V as conflict_view\n    participant C as conflicts\n    participant T as texts + textmerge\n\n    UI->>H: list\n    H->>V: list(conn, me, my_name)\n    V->>C: open() (settles deleted first)\n    V->>V: row() per Conflict, subject_of()\n    V-->>UI: ConflictList { needs_you, resolved }\n\n    UI->>H: open Compare\n    H->>V: view(id)\n    V->>T: current() for the live text\n    V->>T: diff(showing, b_text), merge(base, b_text, showing)\n    V-->>UI: ConflictView { showing, other, original, pieces }\n\n    UI->>H: draft(id, choices)\n    H->>V: draft()\n    V-->>UI: text for Edit merged\n\n    UI->>H: resolve(id, ConflictChoice)\n    H->>V: plan()\n    V-->>H: (Option<ConflictWrite>, Resolution)\n    H->>H: write text via the owning Module\n    H->>V: finish(id, resolution)\n    V->>C: resolve()\n```\n\n### \"Showing\" is live\n\n\"Showing\" is the record's *current* text (`showing_now`), not the text from when the Conflict was raised. An edit the person made after the Conflict stays, either as agreed text or inside the showing side of a clash.\n\n\"Other\" is `b_text`, the version that lost the merge. In `textmerge` terms, the older version is \"ours\" and the showing text is \"theirs\". That is why `ClashPiece::Clash { showing: k.theirs, other: k.ours, original: k.base }`.\n\n### Subjects\n\n`subject_of` maps the target entity to a `ConflictSubject` and the owning module (used for the row icon):\n\n| Entity | Subject | Module |\n|---|---|---|\n| `journal_entry` | `Entry { page_date, written_at, written_offset_min }` | journal |\n| `ai_conversation` | `Conversation { title }` | ai |\n| `ai_saved_question` | `SavedQuestion { text }` | ai |\n| `todo_comment` | `Comment { task_title }` | todo |\n| anything else | `Task { title, field: Title or Notes }` | todo |\n\n`minute_of_day(written_at, offset_min)` gives the time of day in the zone the Entry was written in. `resolved_view` reuses it.\n\n### Settling a Conflict\n\n- **`draft(id, choices)`** builds the starting text for Edit merged. It takes agreed pieces as they are. Each clash takes its `ClashChoice` in order: `Showing`, `Other`, or `Both` (newer first). A missing choice defaults to `Showing`. `Both` inserts a space or newline unless whitespace is already there.\n- **`plan(id, choice)`** returns what the app must write plus the `Resolution`. `KeepThis` writes nothing. `KeepOther` writes `b_text`. `Merged` writes the supplied text. It errors if the Conflict is gone or already resolved, for example when it was resolved on another device.\n- **`finish`** marks the Conflict resolved, which syncs to the other devices.\n\nThe write itself goes through the owning Module, as an ordinary new change. This module only plans it.\n\n## Resolutions (`resolutions.rs`)\n\nA resolution row is a record of something Sync decided on its own.\n\n| `Kind` | Meaning |\n|---|---|\n| `Value` | Two devices changed a value beside each other. The newest took. |\n| `DeleteEdit` | A record was deleted on one device and edited on another by a device unaware of the delete. Both took effect. |\n| `TaskInbox` | A Task moved into a List that is gone lands in the Inbox. |\n| `ConflictDeleted` | A text clash on a deleted record, settled without asking. |\n| `OrderPrefs` | A session's folded line, \"Order & preferences · N changes\". It is local and not recorded as a change. |\n\n### Derived, not delivered\n\n`Value` and `DeleteEdit` rows are **pure functions of the stored records**. Every device works them out itself, replayed in clock (HLC) order. The log is therefore the same whatever order records arrive in. A row made before a late record turned up is taken back.\n\n- **`settle_value`** runs `replay_clashes` over one Value unit. A record made from a value other than the one the replay holds was made *beside* the earlier one, because its author had not seen it. A change that replaced exactly what stood is just a change. If both chose the same value (`essence` ignores the moment of a delete or `closed_at`), nothing is logged. It `note`s a row per clash and deletes unused `value` rows that are no longer live.\n- **`settle_local`** covers this device's own records since the last mark (`sync_local_settled`). Sync doesn't \"store\" those, so a clash with an earlier received record would otherwise go unnoticed here.\n- **`note_delete_edit`** finds the first edit (in clock order, before any restore) by a device other than the deleter that the deleter had not seen. The edit is later by clock, or above the delete's `seen` map. It makes the row, or updates its `at` and `replaced` if an earlier edit arrived late. `retract_delete_edits` removes stale rows, and `refresh_delete_edits` rejudges after local deletes.\n- **`value_members`** decides which units are logged. A unit qualifies only if it is a pure Value field or group, none of it bookkeeping (`created_at`, `repeat_of`, `skipped`) and not Sync's own record. The exception is a device's typed `address`.\n- **`observe`** is for Order keys and Preferences only. It reports a `Folded` item when the newest value moves something. `fold_add` accumulates these into the session's line, keeping at most `DETAIL_MAX` (100) names while the count stays exact.\n- **`note_task_inbox`** and **`note_conflict_deleted`** write the other two kinds.\n\n### Ids and sync\n\nRow ids are UUIDv5 over the decision, such as the record, the unit and the two clocks (`make_id`). Devices that meet the same decision make the same id. `note` inserts the row and records a `Create`, but only if the row is new. It also calls `take_used_before_made`, which applies a \"used\" update that reached the device before the row existed.\n\n**`apply`** (receiving side) never takes a `Value` or `DeleteEdit` creation as sent, because the sender's copy might rest on records this device lacks. The one exception is a row somebody has *used*, which must stay however the records later read. The kind lives only in the creation record, so `creation_fields` looks it up in the change log when only a \"used\" update arrives.\n\n### \"Use ‹other› instead\"\n\n```mermaid\nsequenceDiagram\n    participant UI\n    participant Host\n    participant R as resolutions\n    participant M as Owning module\n    UI->>Host: sync_resolution_use_other(id)\n    Host->>R: plan_use(id)\n    R-->>Host: UsePlan { entity, entity_id, unit, values }\n    Host->>M: write replaced values as a normal change\n    Host->>R: finish_use(id, me)\n    R->>R: set used_at/used_by, record Update\n```\n\n`plan_use` fails if the row is gone, was already used, or is not a `Value` row. `finish_use` sets `used_at` and `used_by` only where `used_at IS NULL` and then syncs the update. Because the write goes through the owning Module, it is an ordinary new change that syncs and reads as a history line.\n\n### Newness\n\n`mark_visited` stores the moment of the person's last look (`sync_resolution_visit`). A row is `fresh` when its `learned_at` is later than that.\n\n## Resolved view (`resolved_view.rs`)\n\n`list(conn, me, my_name)` turns every stored `Row` into a `ResolvedRow` (title, detail, icon, module tint, `fresh`, optional `action`, `used`, and `changes` for folded lines). It reads the live records, so names and values are current. It reads the `core.date_format` (`long`/`short`/`iso`) and `core.time_format` (`24h`/`12h`) Preferences through `Formats`, and uses its own civil-date arithmetic.\n\nExamples of the text it builds:\n\n- Title: `‘Water plants’ · Priority`\n- Detail: `P1 (Mac) kept · P2 (Pixel 8) replaced`\n- Button: `Use P2 instead`\n- After use: `Changed to P2`\n\n`can_write_back` limits the button to:\n\n- Task priority, when and list.\n- Task status, unless the Task repeats, since closing a repeating Task is about its next date.\n- List name, emoji, sort and grouping.\n- A Journal Entry's page date.\n\nDeletion is never written back. `list_deleter` finds the device whose delete of a List is newest, for the \"was deleted on …\" detail of `TaskInbox` rows.\n\nDevice names come from `peers::name_of`. This device uses `my_name`, and an unpaired device reads \"Another device\".\n\n## Data model summary\n\n| Table | Written by | Synced as | Key idea |\n|---|---|---|---|\n| `sync_conflicts` | `raise`, `resolve`, `apply` | `sync_conflict` | Id from clash content. Outcome is open → resolved only. |\n| `sync_resolutions` | `note`, `settle_*`, `fold_add`, `finish_use`, `apply` | `sync_resolution` | Derived from records. Outcome is \"used\" only. |\n| `sync_resolution_visit` | `mark_visited` | not synced | Last look at the log. |\n| `sync_local_settled` | `settle_local` | not synced | High-water mark of own changes judged. |\n\n## Relationships to other modules\n\n- [Sync Replication Engine](../Sync_Replication_Engine.md): `texts`, `textmerge` and `apply` call into this module. The table migrations live there.\n- [Sync Activity and Devices](Sync_Activity_and_Devices.md): `activity::log_conflict_raised`, `log_conflict_resolved` and `log_conflict_deleted` write the matching history lines, and `activity_view` uses `conflict_subject`. `peers` provides device names.\n- [Core Foundation](../Core_Foundation.md): `changelog`, `syncable` (`SyncEntity`, `RemoteChange`, `SyncEvent`), `hlc` and `settings` are used here.\n- [Sync Conflicts and Activity (host)](../Tauri_Host_and_Command_Layer/Sync_Conflicts_and_Activity.md): the commands `sync_conflicts`, `sync_conflict`, `sync_conflict_draft`, `sync_conflict_resolve`, `sync_resolution_use_other` and `sync_resolutions_visited`. The tests `sync_conflicts_tests.rs` and `sync_resolutions_tests.rs` cover the behaviour end to end.\n- [Sync Activity, Conflicts and Status (frontend)](../Sync_Frontend/Sync_Activity_Conflicts_and_Status.md): draws `ConflictList`, `ConflictView` and `ResolvedRow`.\n", "Sync_Replication_Engine/Sync_Networking_and_Live.md": "# Sync_Networking_and_Live\n\nThis module is the network half of the sync engine in `crates/sync`. It holds four things:\n\n- A mutually authenticated TCP + TLS 1.3 transport between paired devices (`net/`).\n- The \"live\" session manager (`live/`). It keeps one connection per reachable paired device, dials devices, and starts sync sessions.\n- Parsing and resolving of the addresses a person may type for a device (`address.rs`).\n- Detection of the OS blocking local-network access (`local_network.rs`).\n\nThe replication logic itself (sessions, merge, vector clocks, wire messages) lives in [Sync_Replication_Engine](../Sync_Replication_Engine.md) and its [core page](Sync_Replication_Engine_Sync_Replication_Engine.md). Pairing, which plugs in below the sync handshake, is in [Sync_Pairing](Sync_Pairing.md). Activity lines, device lists and forgetting are in [Sync_Activity_and_Devices](Sync_Activity_and_Devices.md). The Tauri commands that start and stop all of this are in [Sync_Connectivity_and_Pairing](../Tauri_Host_and_Command_Layer/Sync_Connectivity_and_Pairing.md).\n\n## Architecture\n\n```mermaid\ngraph TD\n    App[Tauri host<br/>implements Host] -->|start / sync_now / flush / farewell| Live\n    subgraph live\n        Live[Live handle] -->|Cmd channel| Sup[Supervisor task]\n        Sup --> Dial[dial::race]\n        Sup --> Conn[conn::run per peer]\n        Sup --> Backoff[Backoff]\n        Sup --> Tie[tie::replaces]\n        Sup --> Shared[Shared status]\n    end\n    Listener[net::Listener] -->|Acceptor.accept| Sup\n    Dial --> NetDial[net::dial]\n    Conn --> Session[Session]\n    Conn --> NetT[NetTransport]\n    NetDial --> TLS[tls: pinned-key mTLS]\n    Listener --> TLS\n    TLS --> Trust[(Trust set)]\n    NetDial --> HS[handshake::check]\n    Sup --> LN[LocalNetwork detector]\n    Dial --> LN\n    Sup --> Disc[Discovery / mDNS]\n    Sup --> Addr[address::Address typed]\n```\n\n## Network transport (`net/`)\n\n| Layer | File | Role |\n|---|---|---|\n| Identity | `identity.rs` | Ed25519 key pair (PKCS#8, stored in a `0600` file `sync-key.pk8` next to `device.toml`, per Environment). `PublicKey` is the device identity, shown as 64 hex characters. `sign`/`verify` are used for group-wide notices such as revocation and rename. `key_err` maps key errors to `NetError::Key`. |\n| TLS | `tls.rs` | rustls TLS 1.3 only. `PinVerifier` accepts a certificate only if its Ed25519 key is in the `Trust` set, on both client and server (mutual TLS). No chain, name or date check. Session tickets and resumption are disabled so a forgotten key cannot return on an old ticket. `tls_err` wraps errors as `NetError::Tls`. |\n| Framing | `frame.rs` (not documented here) | 4-byte length-prefixed JSON frames, at most 8 MB (`MAX_FRAME`). |\n| Handshake | `handshake.rs` | First frame each way. Both sides run `check` on the other's `Handshake`. |\n| Link | `link.rs` (not documented here) | `Listener` (port 47311, else ephemeral), `dial`, `probe`, `secure_dial`, `NetTransport`. |\n| Errors | `mod.rs` | `NetError`. It converts into `SyncError`: I/O, closed and timeout become `Disconnected`, the rest become `Protocol`. |\n\n### Trust and pairing window\n\n`Trust` is a shared, cloneable set of pinned key → device id. `pin` and `unpin` are called on pairing, forgetting and revocation. `set_pairing_open(true)` makes TLS also admit unpinned keys so a new device can connect. The sync handshake still refuses them, and they surface as `Incoming::Unpinned` for the pairing code ([Sync_Pairing](Sync_Pairing.md)).\n\n### Handshake rules\n\n`Handshake` carries the protocol version (`PROTOCOL_VERSION = 1`), app version, `Environment`, device id, group, per-Module `data_versions`, reachable addresses and `now_ms`. `check(local, remote, key, trust)` refuses with a `Refusal` in this order:\n\n1. `Protocol`: the versions differ.\n2. `Environment`: Production and Sandbox never talk.\n3. `SelfDial`: the peer is this device.\n4. `Unpinned`: the key is not pinned.\n5. `WrongDevice`: the key is pinned under another device id.\n6. `Group`: both sides have a group and the groups differ.\n\nDiffering data versions are not a refusal. They are returned as a list of Modules, and the supervisor pauses that device until the older side updates. The clock difference is checked too and pauses sync (see `Pause`).\n\n```mermaid\nsequenceDiagram\n    participant D as Dialler\n    participant L as Listener\n    D->>L: TCP connect\n    D->>L: TLS 1.3 (client cert)\n    L->>L: PinVerifier: key in Trust? (or pairing open)\n    L->>D: server cert\n    D->>D: PinVerifier\n    D->>L: Handshake\n    L->>D: Handshake\n    Note over D,L: both run handshake::check\n    L-->>Supervisor: Established (or Unpinned channel)\n```\n\nThe listener limits stranger input: at most 16 inbound handshakes are in flight (`MAX_PENDING`), and a handshake frame has a far smaller limit (`HANDSHAKE_MAX_FRAME`) than the 8 MB for session frames. The IPv4 and IPv6 listeners share one port, and a busy default port falls back to an ephemeral one (`fell_back()`).\n\n`net/tests.rs` runs all of this over real loopback sockets with a small `Todoish` Module. It covers unpinned or wrongly pinned peers, the other Environment, oversized frames, forgotten peers (including TLS resumption), the pairing hook, port fallback, IPv6 and a full todo sync between two pinned peers.\n\n## Typed addresses (`address.rs`)\n\nA person may type `host`, `host:port`, an IPv4 address, or a bracketed IPv6 address (for example a Tailscale MagicDNS name). `Address::parse` returns an `AddressError` (`Empty`, `Host`, `Port`, `Brackets`) whose `message()` says what to fix. `normalized()` gives the stored form: lower case, IPv6 in brackets, the port only if typed. `port()` defaults to `DEFAULT_PORT`. `resolve(within)` looks a name up with a timeout and fails with `ResolveError::{NotFound, TimedOut}`. The rules are shared with the browser mock through `src/lib/ipc/fixtures/sync-rules.json` (see [IPC_Sync_Mocks](../IPC_Bridge_and_Browser_Mocks/IPC_Sync_Mocks.md)).\n\n## Local network detection (`local_network.rs`)\n\nmacOS 15+ and Android 17 can keep an app off the local network. macOS gives no API, only `EHOSTUNREACH` (\"No route to host\"), which a switched-off neighbour also gives. The module therefore needs sustained evidence.\n\n- `outcome_of_failure(addr, error)` classifies a failed dial as `Blocked`, `Worked` or `Unknown`. Only LAN addresses count. Loopback, Tailscale, public and scopeless link-local IPv6 addresses say nothing.\n- `Detector` takes observations from two `Source`s, `Dial` and `Probe`. It declares \"blocked\" after `MIN_FAILURES` (3) consecutive failures spanning the `grace` period (30 s). Any success clears it. A working probe means a dial failure is about the device, not the permission.\n- The probe, `probe_mdns_group`, sends an empty UDP datagram to `224.0.0.251:5353` (macOS only). It reports a network-unreachable error rather than a denial when no LAN interface exists.\n- `LocalNetwork` is the shared state. It combines the detector with the OS report from `set_os_denied` (Android), `reset()` on a fresh start, and a `changed()` notification raised once per change. `Rhythm` sets the probe pace: fast, slow and steady.\n\n## Live session manager (`live/`)\n\n### Host trait\n\n`live::Host` extends `PairingHost`. It is what the app gives the engine: `with_db` (the engine's own connection to the same database file), `registry`, `bus`, `automatic` (\"Sync automatically\"), `local_changes` (a `Notify` signalled on each local change), `status_changed`, `activity_changed` and `device_name`. The helpers `with_db` and `blocking` run database work on blocking threads so a slow transaction never stalls the async tasks.\n\n`Pace` holds the timings: debounce 3 s, `dial_each` 3 s, and a `Schedule` for retries.\n\n### Supervisor\n\n`Live::start` spawns one `Supervisor` Tokio task. It owns a `JoinSet` of every dia
