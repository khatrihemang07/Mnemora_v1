l and connection, so dropping `Live` aborts everything. The supervisor loop `select!`s over:\n\n- Commands from the `Live`, `Acceptor` and `Leaver` handles: Accept, SyncNow, SyncNowOne, Resume, Flush, Refresh, Reconfigure, Farewell.\n- `RoundDone` reports from connections.\n- Finished tasks in the set.\n- Local-change notifications, which set `push_at` to now plus the debounce.\n- Discovery candidates (`next_found`).\n- Timers: push (`wait_until(push_at)`), per-peer retry, and the local-network probe.\n- Local-network state changes.\n\n```mermaid\nstateDiagram-v2\n    [*] --> Idle\n    Idle --> Dialling: discovery / retry / Sync now\n    Dialling --> Connected: adopt(by_me=true)\n    Dialling --> Idle: dial_failed (backoff)\n    Idle --> Connected: Accept (incoming)\n    Connected --> Paused: data version / clock mismatch\n    Connected --> Idle: connection_ended (error → backoff)\n    Connected --> Connected: Round (debounced push)\n```\n\nKey behaviours:\n\n- **Dial sources.** `candidates` merges addresses found by discovery, remembered addresses (`peer_state::addresses_of`) and the address a person typed (`detail::typed_for_dial`, resolved inside the dial task so a slow name never holds up the others). `race` tries them with `dial_each` per address and reports failures and successes to `LocalNetwork`.\n- **Duplicate connections.** When both devices dial at once, `tie::replaces` keeps the connection dialled by the lower device id on both sides. A dial that fails after a connection was adopted does not mark the device unreachable.\n- **Backoff.** Failures schedule a retry with `Backoff`. Seeing the device again on the network, a \"Sync now\" or `resume()` resets it. A device that re-announces the same addresses is left to its backoff (`same_addresses`).\n- **Sync automatically off.** Nothing is kept open or retried. \"Sync now\" marks peers `manual`, dials once, and the connection closes after one session. Incoming connections are closed unless a manual sync is pending.\n- **Trust refresh.** `reload` reads paired devices, pins their keys and unpins revoked ones. A device that the group forgot dials and answers no one. After any round that received records, `reload` runs again so a forgotten device is dropped at once, and a push is scheduled so the news travels onward.\n- **Pauses.** A handshake mismatch (`Pause::Update`, `Pause::Clock`), or `SyncError::ClockAhead` from a record stamped more than five minutes ahead (`Pause::Stamped`), marks the device paused and writes one Activity line. A stamped pause outlives a good handshake and ends only when a sync completes.\n- **Task safety.** `task_died` recovers if a dial or connection task panics, so a device is never left marked connected or dialling.\n- **Farewell.** `Leaver::farewell(limit)` runs one last session on every connection so a leaving device's final writes reach the others. `tell_everyone` re-asks if a connection was replaced before its session ran.\n\n### Connection (`conn.rs`)\n\n`conn::run(Conn)` drives one connection. Each round is a fresh `Session`: a side with something to say sends its `Hello`, and an idle side that receives a `Hello` answers with its own. Crossing Hellos are fine. Database work runs through `blocking`, one batch per transaction. Before each round it checks the peer is still paired. Before the first non-empty `Batch` from a device met only through an introduction, it takes a backup (`back_up_before_first_records`).\n\nThe loop handles transport messages, `ConnCmd` commands (`Round`, `Close`, `Farewell`) and a 60 s `SILENCE` timeout that closes a stalled session. When a session finishes, `peer_state::finished` is updated and a `RoundDone` goes to the supervisor. The `received` count there is `news(stats)`: stored records, plus the Activity line written, plus Activity merely received. A round that brought nothing ends the relay chain.\n\n```mermaid\nsequenceDiagram\n    participant S as Supervisor\n    participant C as conn::run\n    participant P as Peer\n    S->>C: spawn (Established.transport)\n    C->>P: Hello\n    P->>C: Hello / Batch...\n    C->>C: Session.handle (blocking DB)\n    C->>P: replies\n    C->>S: RoundDone{received}\n    S->>S: backoff.reset, reload if news, schedule push\n    S->>C: Round (after debounce)\n```\n\n### Tests (`live/tests.rs`)\n\nTwo in-memory devices run over loopback sockets with no data to sync. The tests cover:\n\n- Tie-break by lower id, whichever connection each side sees first.\n- A panicking connection task.\n- A failed dial after adoption.\n- Dialling a remembered address when discovery finds nothing.\n- A failing probe blocking once and clearing when it works.\n- Loopback dials leaving local-network state untouched.\n\nHigher-level behaviour (pairing, quiet period, widget refresh, groups) is covered by the `sync_live_tests`, `sync_pairing_tests` and `sync_groups_tests` suites described in [Sync_Connectivity_and_Pairing](../Tauri_Host_and_Command_Layer/Sync_Connectivity_and_Pairing.md).\n\n## How it fits\n\n- **Below:** `Session`, `Registry`, `peer_state`, `peers`, `revoke`, `activity` and `Pause` come from the replication core ([core page](Sync_Replication_Engine_Sync_Replication_Engine.md)) and [Sync_Activity_and_Devices](Sync_Activity_and_Devices.md).\n- **Beside:** [Sync_Pairing](Sync_Pairing.md) uses `secure_dial`, `Incoming::Unpinned` and `Trust::set_pairing_open`.\n- **Above:** the Tauri host implements `Host`, owns the `LocalNetwork`, calls `Live::{sync_now, flush, resume, options_changed, refresh_peers}` and shows `PeerLive` snapshots in the Devices tab. The frontend side is in [Sync_Frontend](../Sync_Frontend.md).\n", "Sync_Replication_Engine/Sync_Pairing.md": "# Sync_Pairing\n\nSync_Pairing is the part of the sync crate (`crates/sync/src/pair/`) that lets two Mnemora devices trust each other. One device shows an 8-digit code. The other types it, either after discovering the device on the local network or by dialling a typed address. If the codes match, the person on the showing device presses Allow. Both devices then record the pairing, join one group and pin each other's TLS keys.\n\nThe crate does not touch the database or the window. Everything it needs from the app comes through the `PairingHost` trait. That trait is implemented in the Tauri host (see [Sync_Connectivity_and_Pairing](../Tauri_Host_and_Command_Layer/Sync_Connectivity_and_Pairing.md)). The UI side is in [Sync_Devices_and_Pairing](../Sync_Frontend/Sync_Devices_and_Pairing.md).\n\nThis page covers the files `host.rs`, `hub.rs`, `msg.rs`, `proto.rs` and `tests.rs`. It also uses code from the `code`, `preview` and `view` files in the same folder. Those files were not provided, so only their usage is described here.\n\nRelated modules:\n- [Sync_Networking_and_Live](Sync_Networking_and_Live.md) provides the TLS layer and the listener. While pairing is open, TLS admits unpinned keys and hands them to `Pairing::handle_incoming`.\n- [Sync_Activity_and_Devices](Sync_Activity_and_Devices.md) covers the peers, introductions and renames that follow a pairing.\n- [Sync_Replication_Engine_Sync_Replication_Engine](Sync_Replication_Engine_Sync_Replication_Engine.md) covers the core record exchange that starts after pairing.\n\n## Architecture\n\n```mermaid\ngraph TD\n    UI[Pairing sheet UI] -->|show / enter / enter_at / decide / confirm / new_code / cancel| Hub\n    subgraph pair\n        Hub[hub.rs: Pairing state machine]\n        Proto[proto.rs: type_code / show_code]\n        Msg[msg.rs: Msg, Who, Reason]\n        Host[host.rs: PairingHost trait]\n    end\n    Hub -->|TyperPort / ShowerPort| Proto\n    Proto --> Msg\n    Hub -->|me, store, backup, holdings, show| Host\n    Host -.implemented by.-> App[src-tauri: sync.rs]\n    Hub --> Net[net: secure_dial, NetConfig.trust]\n    Hub --> Disc[discovery: browse / advertise]\n    Net --> Proto\n```\n\nLayering:\n- **`proto.rs`** runs one exchange over a `Channel`. It knows nothing about sockets, windows or databases. It reaches the outside only through `TyperPort` and `ShowerPort`.\n- **`hub.rs`** holds `Pairing`, the state of the sheet. It implements both ports through `TypeSide` and `ShowSide`, owns the timers and tasks, and publishes a `PairingView` to the host after every change.\n- **`host.rs`** defines what the app supplies: `me`, `handshake`, `visible`, `pinned`, `holdings`, `backup`, `store`, `show`, `remember_address` and `paired`.\n- **`msg.rs`** defines the wire messages.\n\n## Components\n\n### `Msg`, `Who`, `Reason` (`msg.rs`)\n`Msg` is tagged with `\"pair\"`, so no pairing message can parse as a `Handshake`. A unit test checks this. The listener relies on it to tell a pinned peer's handshake from a pairing attempt.\n\n| Message | Direction | Purpose |\n|---|---|---|\n| `Start` | typer → shower | Environment and SPAKE2 message. The typer always speaks first. |\n| `Reply` | shower → typer | The shower's SPAKE2 message. |\n| `Confirm` | typer → shower | HMAC proof of the code and of both TLS keys. |\n| `Confirmed` | shower → typer | The shower's own proof, plus its `Who`. |\n| `Wrong` | shower → typer | The proof failed. Carries tries left and the shower's name. |\n| `Identity` | typer → shower | The typer's `Who`. |\n| `Allowed` | shower → typer | Allow was pressed. Carries the shower's `Holdings` for the preview. |\n| `Reviewing` | typer → shower | The typer's person is looking at the merge preview. |\n| `Go` | typer → shower | Merge. The typer has backed up. |\n| `Accepted` | shower → typer | The shower has recorded the pairing. Carries the group id. |\n| `Done` | typer → shower | The typer has recorded the pairing. |\n| `Refuse` | either | Stops the exchange, with a `Reason`. |\n\n`Who` is a device's self-description: id, name, platform, key, environment, group, per-module data versions and the group's other `members`. `Reason` is one of `Environment`, `Version`, `Groups`, `Declined`, `Expired`, `Cancelled`, `Busy` or `BackupFailed`. The `hex` and `unhex` helpers encode the binary fields.\n\n### Protocol (`proto.rs`)\n\n```mermaid\nsequenceDiagram\n    participant T as Typer (types code)\n    participant S as Shower (shows code)\n    T->>S: Start {environment, SPAKE2 A}\n    S->>T: Reply {SPAKE2 B}\n    T->>S: Confirm {HMAC(transcript incl. both TLS keys)}\n    alt wrong code\n        S->>T: Wrong {tries_left, name}\n    else right\n        S->>T: Confirmed {HMAC, Who}\n        T->>S: Identity {Who}\n        Note over T,S: compatible(): environment, data versions, group\n        Note over S: ask person: Allow / Deny\n        S->>T: Allowed {holdings}\n        opt both hold data\n            T->>S: Reviewing\n            Note over T: merge preview, person picks Merge or Cancel\n        end\n        Note over T: backup\n        T->>S: Go\n        Note over S: backup, store pairing\n        S->>T: Accepted {group}\n        Note over T: store pairing\n        T->>S: Done\n    end\n```\n\nSecurity properties:\n- The proofs are HMAC-SHA256 over a transcript made of a label (`typer` or `shower`), both TLS public keys and both SPAKE2 messages. A device in the middle has a different TLS key towards each end, so its proofs fail. This is what authenticates the keys.\n- The `who.key` in each identity must equal the TLS key actually seen on the connection.\n- A wrong code counts as a try. The proof is checked inside `ShowerPort::attempt`, under the same lock that counts the tries. Parallel connections therefore cannot check a proof after the last try is spent. The test `a_proof_is_not_checked_once_the_tries_are_spent` covers this.\n\n`compatible()` applies three rules, in this order:\n1. The environments must match (Production versus Sandbox).\n2. The per-module data versions must be equal. A mismatch yields `Failure::Version`, with `Older::Me`, `Older::Them` or `Older::Both` and the names of the older modules.\n3. If both devices already belong to a group, the groups must be the same.\n\nFailure types:\n- `Failure` has the variants `WrongCode`, `Refused`, `Environment`, `Version`, `Denied` and `Lost`.\n- `Denied` means TLS turned the typer away because no code is open there.\n- `Decision` is the shower person's answer: Allow, Deny, Expired, Cancelled or Busy.\n- `Choice` is the typer person's answer on the preview: Merge or Cancel.\n- `Attempt` is `Right`, `Wrong(n)` or `Dead`.\n\nData safety: nothing is stored until Merge. Both devices back up their databases before either records the pairing, and so before any record is exchanged. If a backup fails, the pairing is refused with `BackupFailed` and nothing changes. The preview is shown only when `needs_preview` says both sides hold data. If one side is empty, the exchange goes straight to the backups.\n\n### `Pairing` hub (`hub.rs`)\n\n`Pairing` owns one `Mutex<Inner>`:\n- `show`: the code on display, with its expiry, tries left, an optional `dead` error and an optional `notice`.\n- `asking`: the `Pending` question to the person on the showing device. It has `answered`, `confirming` and `stop` flags.\n- `typing`: the abort handle of the typing task.\n- `reviewing`: the channel for the preview choice.\n- `timer`: the expiry timer.\n- `generation`: bumped by every clear, so a late task can tell it is stale.\n- `next_question`: the id source for questions.\n\nState is published as a `PairingView`. The variants are `Idle`, `Showing`, `Asking`, `Confirming`, `Finishing`, `Searching`, `Waiting`, `Preview`, `Paired` and `Failed`.\n\n```mermaid\nstateDiagram-v2\n    [*] --> Idle\n    Idle --> Showing: show()\n    Showing --> Asking: typer proved the code\n    Asking --> Finishing: Allow\n    Asking --> Showing: typer left / Deny\n    Asking --> Confirming: typer reviewing preview\n    Confirming --> Finishing\n    Finishing --> Paired\n    Showing --> Failed: expired / tries used\n    Idle --> Searching: enter() / enter_at()\n    Searching --> Waiting: code right\n    Waiting --> Preview: both hold data\n    Waiting --> Paired\n    Preview --> Paired: Merge\n    Preview --> Idle: Cancel\n    Searching --> Failed\n    Paired --> [*]\n```\n\n**Public API:**\n- `show` and `new_code` generate an 8-digit code with 3 tries and a life of `timing.code_life`. `new_code` does nothing if no code is on show or someone is being asked.\n- `enter(input)` normalises the code. It browses discovery for adverts with `pairing_open` and tries each device address in turn.\n- `enter_at(address, input)` dials a typed address, skipping discovery. On success the address is remembered as that device's typed address through `PairingHost::remember_address`.\n- `decide(allow)` answers the question.\n- `confirm(merge)` answers the preview.\n- `cancel` closes the sheet and tells the other device.\n- `shutdown` stops everything when Sync is turned off.\n- `refresh_advert` re-announces the device, with the pairing-open flag only while a live code is shown.\n- `state` reads the current view, and `tasks` counts live pairing tasks (used by tests to prove nothing leaks).\n\n**Trust gate:** `sync_open` calls `config.trust.set_pairing_open(...)`. While a code is shown, being typed, or has expired but is still on the sheet, TLS admits unpinned keys. The expired-code case lets the typer be told that the code is dead, which is more useful than \"nothing answered\". The listener passes such connections to `handle_incoming`, which spawns `serve`, and `serve` runs `proto::show_code`.\n\n**Choosing which error to show:** when several devices are tried, `rank` picks the most useful error. The order, from highest, is WrongCode, CodeExpired, DifferentEnvironment, Busy, ConnectionLost. `is_final` ends the search at once for errors that mean the right code was typed and something else is wrong (Declined, VersionMismatch, DifferentGroups, Cancelled, BackupFailed). `typer_error` maps a protocol `Failure` to a user-facing `PairingError`.\n\n**Commit:** `commit` calls `host.store`, optionally `remember_address`, pins every key in `stored.pins` (the other device plus the members it brought), and then calls `host.paired()` so new devices can be connected to.\n\n**Shower-side outcomes** (in `serve`): the code stays on screen with a `notice` for an environment, version, groups or backup problem, or when the typer cancelled the merge. Deny cancels the whole show.\n\n### `PairingHost` and `Stored` (`host.rs`)\n`PairingHost` is `Send + Sync + 'static`. `holdings` and `backup` have defaults (empty, and Ok). With the default `holdings`, no preview is shown. `Stored` reports back the name the other device has here (unique, so a clash gets a number), its platform, whether it was renamed, the `also_joined` device names, and the `pins` list.\n\n## Pairing a whole group\n\nThe `Who.members` field carries the other devices of the group, so pairing with one member joins the newcomer to all of them. `Stored.also_joined` and `pins` carry this back to the hub. Further introductions to the rest of the group go through [Sync_Activity_and_Devices](Sync_Activity_and_Devices.md) (`introduce`).\n\n## Tests (`tests.rs`)\n\nThe tests start two or more real `Network` instances over loopback sockets, each with an in-memory database. A `Dev` wrapper holds the test `Host` (which implements both `PairingHost` and the crate's `Host`), a `Fixed` discovery and the network. The helper `pair(shower, typer)` runs the whole happy path. The `until` helper polls the view.\n\n| Area | Tests |\n|---|---|\n| Happy path | `the_right_code_pairs_both_devices_and_each_lists_the_other`, `a_name_that_clashes_gets_a_number`, `pairing_with_one_member_joins_the_whole_group` |\n| Code handling | `a_code_must_have_eight_digits`, `a_wrong_code_reports_tries_left_and_the_right_one_still_works`, `three_wrong_tries_kill_the_code`, `a_proof_is_not_checked_once_the_tries_are_spent`, `new_code_makes_a_different_code_with_fresh_tries` |\n| Expiry | `an_expired_code_is_refused_and_says_so`, `running_out_of_time_while_asking_tells_the_other_device`, the by-address expiry tests |\n| Person's choice | `deny_tells_the_other_device_and_pairs_nothing`, `cancelling_while_asked_tells_the_typing_device`, `the_typing_device_leaving_returns_the_showing_one_to_its_code` |\n| Compatibility | `sandbox_and_production_refuse_each_other`, `devices_on_different_data_versions_do_not_pair`, `two_devices_in_different_groups_do_not_pair` |\n| Discovery and lifecycle | `nothing_nearby_is_reported_when_no_device_shows_a_code`, `the_pairing_flag_is_announced_only_while_a_code_is_shown`, `dropping_the_network_closes_the_port_and_stops_announcing` |\n| One-sided forget | `a_device_that_still_pins_the_typer_can_be_paired_with_by_address` and the by-address expired-code tests. These come from a real-device failure. One side had forgotten the other, which still pinned it, and the two devices then misread each other's first frame. |\n\nCommand-level and multi-device pairing behaviour is tested in the app crate. This includes the merge preview and backups in `sync_merge_preview_tests.rs`, and the group and forget flows in `sync_groups_tests.rs` and `sync_forget_tests.rs`. See [Sync_Connectivity_and_Pairing](../Tauri_Host_and_Command_Layer/Sync_Connectivity_and_Pairing.md).\n\n## Concurrency notes\n- All hub state sits behind one mutex. `publish` is called with the lock held, so host events keep the order of the changes.\n- Async tasks started through `Pairing::spawn` are counted (`TaskCount` decrements on drop) and can be aborted.\n- A `generation` counter makes late tasks (timers, typing outcomes) harmless after a cancel or a new code.\n- Once Allow is pressed, `expire` does not kill the pairing, because the merge preview may take longer than the code. `end_question` closes a code that ran out in the meantime.\n", "Sync_Replication_Engine/Sync_Replication_Engine_Sync_Replication_Engine.md": "# Sync Replication Engine (core)\n\nThis page covers the replication core of the `mnemora-sync` crate (`crates/sync`). The core is the part that decides what two devices send each other and what each device does with it. Its integration tests live in `src-tauri/src/sync_*_tests.rs`. The neighbouring pages cover the rest of the crate:\n\n- [Sync Conflicts and Resolutions](Sync_Conflicts_and_Resolutions.md)\n- [Sync Activity and Devices](Sync_Activity_and_Devices.md)\n- [Sync Networking and Live](Sync_Networking_and_Live.md)\n- [Sync Pairing](Sync_Pairing.md)\n\nSync keeps a person's own devices in step, directly between them with no server. It is off by default and inert while off. It never imports the Journal or Todo crates. Those modules plug in through `mnemora_core::syncable` (`SyncEntity`, `RemoteChange`, `apply_remote` and `settle_remote`).\n\n## Purpose\n\n- Every local change is a record in the core `change_log`. It carries an origin device, an origin sequence and a hybrid logical clock (HLC).\n- Two devices exchange the records the other lacks. A device can relay records it holds from a third device.\n- Each device converges to the same state whatever order records arrive in.\n\n## Architecture\n\n```mermaid\nflowchart LR\n  CL[(change_log in core)] --> ST[stream.rs: next_batch]\n  ST -->|Hello / Batch / Ack| WI[wire.rs: Message, WireRecord]\n  WI --> TR[transport.rs: Transport trait + memory pair]\n  TR --> AP[apply.rs: apply_batch]\n  AP --> VE[vector.rs: version vector in sync_seen]\n  AP --> CK[clocks.rs: per-field clocks]\n  AP --> MG[merge.rs: decide]\n  AP --> HE[held.rs: hold while typing]\n  AP --> TX[texts.rs: replay and settle]\n  TX --> TM[textmerge.rs: 3-way merge]\n  AP --> MOD[Module.apply_remote / settle_remote]\n  TX --> CF[Conflicts]\n  AP --> RS[Resolutions and Activity]\n```\n\n### Components\n\n| File | Role |\n|---|---|\n| `lib.rs` | `SyncModule`, which implements `Module`. It is disabled by default, owns the module migrations and registers the sync entities (conflict, resolution, activity, revocation, device, introduction). Its `on_startup` only adopts typed addresses into the log. It re-exports the crate API. |\n| `migrations.rs` | Append-only schema: peers, `sync_seen` (version vector), `sync_field_clocks`, `sync_clock_marks`, `sync_held`, `sync_conflicts`, `sync_text_replay`, `sync_resolutions`, `sync_activity`, `sync_revocations`, `sync_introductions` and others. |\n| `wire.rs` | The protocol. `Message` is `Hello{device, vector}`, `Batch{records, last, total}` or `Ack`, serialised as JSON. `WireRecord` carries only the changed fields, `prev` (what the change replaced) and `seen` (for deletes). |\n| `transport.rs` | The `Transport` trait (`send`, non-blocking `try_recv`). The `memory` module has `pair()` and `Link::cut` and `cut_after` for fault tests. The TLS transport is in the [networking page](Sync_Networking_and_Live.md). |\n| `vector.rs` | The version vector: highest origin sequence per entity and origin device (`of_entity`, `all`, `seen`, `advance`). |\n| `stream.rs` | Outbound side. `next_batch` merges per-origin queues by clock order (`order_key`). A batch holds at most `BATCH_RECORDS` = 500 records or about `BATCH_BYTES` = 2 MiB. `placeholders` builds the SQL `NOT IN` list for local-only ids. `pending` counts the records still to send. |\n| `apply.rs` | Inbound side. `apply_batch` runs everything in one `Immediate` transaction, so the whole batch and the vector advance are applied together or not at all. |\n| `clocks.rs` | `fold` reads the change log into per-field clocks. `raise` and `load` keep and read them. |\n| `merge.rs` | `Verdict::{Take, Keep}` from `decide`: the newest clock wins, and ties go by device id. Derived fields never take. |\n| `held.rs` | Changes held back while an editor is open (`core::editing`). Values go into `sync_held`, and `release_ready` applies them when the hold ends. `Released` reports what changed. |\n| `texts.rs` | A text is the replay of all its records in clock order, with a three-way merge where a record was made from an older text. Replay is memoised in `sync_text_replay`. `settle_unit` raises and supersedes Conflicts. `settle_local` replays this device's own saves. |\n| `textmerge.rs` | Pure three-way merge: line first, then word. `Piece::{Agreed, Clash}`, `diff` and `DiffSpan` for Compare. |\n| `state.rs` | Device settings: `SyncState`, `SyncOption`, `set_enabled`, `rename`, `set_option`. |\n| `peer_state.rs` | Local memory per peer: route (`Route::Wifi` or `Tailscale`), last session counts, remembered addresses (at most 8 kept), `needs_first_backup`. |\n| `check.rs` | The \"Check\" button. It dials a typed address with timeouts (lookup 3 s, each 4 s, total 10 s) and reports `CheckKind` in words (`Expect`, `Limits`, `check`). |\n\n## Applying a batch\n\n```mermaid\nsequenceDiagram\n  participant S as Sender (stream.rs)\n  participant R as Receiver (apply.rs)\n  participant M as Module\n  S->>R: Hello(vector)\n  R->>S: Hello(vector)\n  S->>R: Batch(records oldest-clock first)\n  R->>R: sort by clock, begin tx, release lapsed holds\n  loop each record\n    R->>R: skip own / already seen, refuse > 5 min ahead\n    R->>R: fold clocks, decide units (value/order by clock, text deferred)\n    R->>M: apply_remote(winners)\n    R->>R: record_remote, advance vector, stash held\n    R->>M: settle_remote\n  end\n  R->>R: settle texts (replay + 3-way), local texts, resolutions, activity\n  R->>R: commit\n  R->>S: Ack\n```\n\nKey rules:\n\n- **Units.** An ungrouped field is a unit on its own. A field group is atomic. For example, the \"when\" group (date, time, repeat) and the state and closed time are taken whole from the newest record and never mixed.\n- **Field classes.** `Value` and `Order` are newest-wins by HLC. `Text` is merged by replaying records. `Derived` is recomputed locally.\n- **Idempotent and order-independent.**\n  - \"Already seen\" is read once per origin before the batch, so a record isn't skipped because a later one of its origin came first.\n  - Duplicates are counted once.\n  - Records arriving by two paths are stored once, and an interrupted exchange resumes exactly.\n- **Clock safety.** A record more than `MAX_AHEAD_MS` (5 minutes) ahead rolls the transaction back and returns `SyncError::ClockAhead`. This pauses sync.\n- **Holds.** Holds never delay a delete, because the `deleted_at` mark is never held. A hold ends when the editor closes, its lease lapses (about 2 minutes), or the app restarts. Held values are applied only if they are still the newest the clocks know.\n- **Events.** Modules report `SyncEvent`s such as `TaskDeleted`, `EntryDeleted`, `TaskToInbox` and list merges. `apply` fills in the origin device. They feed Activity and Resolved-automatically lines. Details are in [Sync Conflicts and Resolutions](Sync_Conflicts_and_Resolutions.md) and [Sync Activity and Devices](Sync_Activity_and_Devices.md).\n- **Privacy.** Field values and text are never logged.\n\n## Text merge\n\n`textmerge::merge(base, ours, theirs)` first merges by line and then re-merges overlapping lines by word. A word is anything between spaces, so \"tomorrow!\" differs from \"tomorrow\". Edits that only touch each other don't clash. Two different insertions at the same spot do. A clash resolves to the newer side (`theirs`) and is kept as a `Clash` for the Conflicts UI.\n\n`texts::replay` carries each record onto the earlier result. A record made from the held text simply takes over. Otherwise it is merged, and a clash is recorded. `is_phantom` drops clashes that only appear because a session record was rewritten, so every device raises the same conflicts.\n\n## Test suites (`src-tauri/src/sync_*_tests.rs`)\n\nThese run on a `Cluster` of `TestApp`s, each with its own database, synced pairwise through the in-memory transport. Every step is a real command, and every assertion reads back through commands.\n\n- `sync_cluster_tests.rs` covers Todo task scenarios: merging per field, the \"when\" group, deletes against edits, repeating-task occurrences, relaying through a middle device, cut and resume with 1,200 tasks, and sync off. `three_devices_with_random_edits_end_identical` runs seeded random action mixes (Todo, Journal, AI, Lists, Comments, Preferences, addresses, conflicts) over `FIXED_SEEDS`. `MNEMORA_CONVERGE_SEED=n` runs one seed, and `MNEMORA_CONVERGE_SEEDS=n` with `MNEMORA_CONVERGE_FIRST` hunts a range.\n- `sync_backfill_tests.rs` covers the first merge when the change log has no history (DV1/DV10): unlogged rows, tick-only records and old preferences. It also checks that a repeat writes nothing and that 3,000 rows backfill quickly.\n- `sync_merge_fixture_tests.rs` runs `src/lib/ipc/fixtures/sync-merge-rules.json` on two real devices. The browser mock runs the same file, so the TypeScript copy of the rules can't drift (see [IPC Sync Mocks](../IPC_Bridge_and_Browser_Mocks/IPC_Sync_Mocks.md)).\n- `sync_journal_tests.rs` covers Entries travelling, holds while editing (no jump, release, lease lapse, restart), relay of held data, undo after remote edits, and the DV3 order-independence sequence.\n- `sync_lists_tests.rs` covers List name clashes (accent and case-insensitive merge into the older List), tasks moved into deleted Lists, Comments, Preferences (look and feel stays per device), and convergence in every delivery order of three devices.\n\n## Where this fits\n\n- It builds on [Core Foundation](../Core_Foundation.md): the change log, HLC, editing holds and the `syncable` traits.\n- The host drives it through the commands in [Sync Connectivity and Pairing](../Tauri_Host_and_Command_Layer/Sync_Connectivity_and_Pairing.md) and [Sync Conflicts and Activity](../Tauri_Host_and_Command_Layer/Sync_Conflicts_and_Activity.md).\n- Domain modules that sync through it are [Todo](../Domain_Modules_(Todo_and_Journal)/Todo_Tasks_and_Lists.md), [Journal](../Domain_Modules_(Todo_and_Journal)/Journal_Module.md) and the [AI module](../AI_Assistant_Backend/AI_Module.md).\n- The UI side is [Sync Frontend](../Sync_Frontend.md).\n", "Sync_Replication_Engine.md": "# Sync Replication Engine\n\n## Purpose\n\nThe Sync Replication Engine is the `mnemora-sync` crate (`crates/sync`). It keeps a person's own devices in step by syncing them directly with each other, with no server. Sync is off by default and does nothing while off. The crate never imports the Journal or Todo crates. Those modules plug in through the `mnemora_core::syncable` traits (`SyncEntity`, `RemoteChange`, `apply_remote`, `settle_remote`).\n\n- Every local change is a record in the core `change_log`. Each record carries an origin device, an origin sequence and a hybrid logical clock (HLC).\n- Two devices exchange the records the other lacks. A device can also relay records it holds from a third device.\n- Every device converges to the same state, whatever order the records arrive in.\n- Pairing and trust use an 8-digit code with SPAKE2. Transport is mutual TLS 1.3 with pinned Ed25519 keys.\n- Conflicts and automatic decisions are surfaced to the person as Conflicts, Resolutions and Activity.\n\n## Architecture\n\n```mermaid\ngraph TD\n    Host[\"Tauri host<br/>(Host / PairingHost)\"] --> Live\n    subgraph Net[\"Networking and Live\"]\n        Live[\"live: supervisor + conn\"]\n        NetT[\"net: mTLS, handshake, Trust\"]\n        Live --> NetT\n    end\n    subgraph Pair[\"Pairing\"]\n        Hub[\"pair: hub + proto\"]\n    end\n    subgraph Core[\"Replication core\"]\n        Stream[\"stream.rs<br/>outbound batches\"]\n        Apply[\"apply.rs<br/>inbound, one transaction\"]\n        Merge[\"merge / clocks / vector / held\"]\n        Text[\"texts + textmerge<br/>3-way text merge\"]\n        Stream --> Apply --> Merge\n        Apply --> Text\n    end\n    subgraph Disagree[\"Conflicts and Resolutions\"]\n        Conf[\"conflicts + conflict_view\"]\n        Res[\"resolutions + resolved_view\"]\n    end\n    subgraph Group[\"Activity and Devices\"]\n        Act[\"activity + activity_view\"]\n        Dev[\"peers, devices, detail\"]\n        Trust[\"rename, revoke, introduce\"]\n    end\n    Hub --> NetT\n    Hub -->|store pairing| Dev\n    Live -->|Session rounds| Stream\n    Live -->|Session rounds| Apply\n    Text -->|clash| Conf\n    Apply -->|decisions| Res\n    Conf --> Act\n    Live --> Act\n    Trust --> Dev\n    Core --> CL[(core change_log)]\n    Disagree --> CL\n    Group --> CL\n```\n\n### How the parts fit together\n\n1. **Pairing.** `Pairing` shows or enters a code. The devices prove the code and each other's TLS keys. Both back up their databases, record the pairing in one group and pin each other's keys. See [Sync Pairing](Sync_Replication_Engine/Sync_Pairing.md).\n2. **Connecting.** The `live` supervisor keeps one connection per reachable paired device. It dials from discovery, remembered addresses and typed addresses. It breaks ties between duplicate connections, backs off after failures and pauses a device on a version or clock mismatch. See [Sync Networking and Live](Sync_Replication_Engine/Sync_Networking_and_Live.md).\n3. **Replicating.** Each round is a `Session`. Both sides send `Hello` with their version vectors, then `Batch` records oldest clock first, then `Ack`. The receiver applies a whole batch in one transaction. Fields are resolved per unit: newest HLC wins for values and order, and text is replayed with a three-way merge. See [Sync Replication Engine core](Sync_Replication_Engine/Sync_Replication_Engine_Sync_Replication_Engine.md).\n4. **Disagreement.** A text clash becomes a Conflict that every device derives identically. Values changed side by side, delete against edit, and Tasks moved to the Inbox are written as Resolutions. See [Sync Conflicts and Resolutions](Sync_Replication_Engine/Sync_Conflicts_and_Resolutions.md).\n5. **History and roster.** Activity is an append-only synced log that appears once on every device. The peer roster, renames, typed addresses, signed Forget decisions and signed introductions travel through the same change log. See [Sync Activity and Devices](Sync_Replication_Engine/Sync_Activity_and_Devices.md).\n\n### Batch application\n\n```mermaid\nsequenceDiagram\n    participant S as Sender\n    participant R as Receiver\n    participant M as Module\n    S->>R: Hello(vector)\n    R->>S: Hello(vector)\n    S->>R: Batch(records)\n    R->>R: begin tx, fold clocks, decide units\n    R->>M: apply_remote / settle_remote\n    R->>R: settle texts, resolutions, activity\n    R->>R: advance vector, commit\n    R->>S: Ack\n```\n\n## Design guarantees\n\n- **Idempotent and order-independent.** Duplicates are counted once, and an interrupted exchange resumes exactly.\n- **Deterministic ids.** Conflicts, Resolutions and named Activity rows use UUIDv5 ids derived from their content. Every device that notices the same thing creates the same row.\n- **Clock safety.** A record more than 5 minutes ahead rolls the batch back and pauses sync.\n- **Editing holds.** Remote changes to a record being edited are held until the editor closes. A delete is never held.\n- **Privacy.** Field values and text are never logged.\n- **Environment isolation.** Production and Sandbox devices never sync or pair with each other.\n\n## Core component documentation\n\n| Area | Contents | Documentation |\n|---|---|---|\n| Replication core | Wire protocol, streaming, apply, clocks, merge, holds, text merge, device settings, and the cluster test suites | [Sync Replication Engine core](Sync_Replication_Engine/Sync_Replication_Engine_Sync_Replication_Engine.md) |\n| Conflicts and Resolutions | Text-clash Conflicts, automatic Resolutions, their views, and \"Use other instead\" | [Sync Conflicts and Resolutions](Sync_Replication_Engine/Sync_Conflicts_and_Resolutions.md) |\n| Activity and Devices | Activity log and view, peer roster, Devices tab, device sheet, renames, Forget and introductions | [Sync Activity and Devices](Sync_Replication_Engine/Sync_Activity_and_Devices.md) |\n| Networking and Live | mTLS transport, handshake rules, typed addresses, local-network detection, the live supervisor and connections | [Sync Networking and Live](Sync_Replication_Engine/Sync_Networking_and_Live.md) |\n| Pairing | Code-based pairing protocol, the `Pairing` hub state machine and the `PairingHost` trait | [Sync Pairing](Sync_Replication_Engine/Sync_Pairing.md) |", "Tauri_Host_and_Command_Layer/AI_Assistant_Commands.md": "# AI_Assistant_Commands\n\n`src-tauri/src/ai.rs` is the Tauri command surface for the AI assistant. It is deliberately thin: the rules (validation, persistence, prompting, tool execution) live in the `mnemora-ai` crate (see [AI_Module](../AI_Assistant_Backend/AI_Module.md)), the agent loop lives in `mnemora-harness` (see [Agent_Harness](../AI_Assistant_Backend/Agent_Harness.md)), and provider adapters live in `mnemora-providers` (see [LLM_Providers](../AI_Assistant_Backend/LLM_Providers.md)). This module's job is to:\n\n1. Expose typed `#[tauri::command]` / `#[specta::specta]` functions to the frontend (see [AI_Assistant_Frontend](../AI_Assistant_Frontend.md) and [IPC_Bridge_and_Core_Mocks](../IPC_Bridge_and_Browser_Mocks/IPC_Bridge_and_Core_Mocks.md)).\n2. Own the in-process runtime state of live Runs (`AiRuntime`, `LiveRun`, `RunSlot`).\n3. Run each answer on its own thread and stream progress back as the typed `AiRunEvent`.\n4. Keep network calls (connection test, Model search) off the command thread and out of the database lock.\n\nShared host state (`AppState`, the `lock` helper) is described in [Tauri_Host_and_IPC_Bridge](Tauri_Host_and_IPC_Bridge.md). Behaviour is verified by [AI_Run_Engine_Tests](../Backend_Integration_Test_Suites/AI_Run_Engine_Tests.md) and [AI_Data_and_Provider_Tests](../Backend_Integration_Test_Suites/AI_Data_and_Provider_Tests.md).\n\n## Architecture\n\n```mermaid\ngraph TD\n    FE[Svelte frontend<br/>AI_Assistant_Frontend] -->|invoke typed commands| CMD[ai.rs commands]\n    CMD -->|AiRunEvent via tauri_specta::Event| FE\n    CMD --> RT[AiRuntime<br/>keys, provider override, running map]\n    CMD --> AIC[mnemora-ai<br/>validate, prepare_run, begin, execute, CRUD]\n    AIC --> H[mnemora-harness<br/>Control, Provider, agent loop]\n    AIC --> P[mnemora-providers<br/>OpenAI-compatible / Anthropic / OpenRouter]\n    CMD --> ST[AppState<br/>db: Mutex Connection, ai, modules]\n    ST --> MOD[Module::tools<br/>Todo, Journal tools]\n    AIC --> DB[(SQLite)]\n```\n\n### Runtime state\n\n```mermaid\nclassDiagram\n    class AiRuntime {\n      KeyStore keys\n      Mutex~Option~Arc~Provider~~~ provider\n      Arc~Mutex~HashMap~String, Arc~LiveRun~~~~ running\n      new(keys_dir)\n      keys()\n      provider_for(prepared)\n      is_running(conversation)\n      live(conversation)\n      queued(conversation)\n      reserve(conversation, run_id) Option~RunSlot~\n      interrupt_all()\n    }\n    class LiveRun {\n      run_id\n      Control control\n      Steering steering\n    }\n    class RunSlot {\n      running map\n      conversation\n      live\n      Drop: removes claim\n    }\n    AiRuntime --> LiveRun : tracks per Conversation\n    AiRuntime ..> RunSlot : reserve()\n    RunSlot --> LiveRun\n```\n\n- **`AiRuntime`** holds the device-local `KeyStore` (the config dir's `ai-keys`), an optional test-only `Provider` override, and a map Conversation id → `LiveRun`.\n- **`LiveRun`** bundles the Run id, a `Control` (stop / interrupt / skip step) and `Steering` (queue of notes sent mid-run).\n- **`RunSlot`** is an RAII claim: `reserve` returns `None` if the Conversation already has a Run, so only one Run answers per Conversation; dropping the slot removes the claim. Different Conversations may answer concurrently.\n- `interrupt_all` ends every Run as interrupted; it is used when the app leaves the foreground on Android.\n\n## Command groups\n\n| Group | Commands | Delegates to |\n|---|---|---|\n| Run lifecycle | `ai_run_start`, `ai_run_retry`, `ai_run_abort` | `validate_question`, `validate_local`, `prepare_run`, `begin`, `execute`, `question_text` |\n| Steering | `ai_run_steer`, `ai_run_unqueue`, `ai_run_send_now` | `LiveRun.steering`, `LiveRun.control` |\n| Conversations | `ai_conversation_get`, `_list`, `_rename`, `_delete`, `_restore`, `_markdown` | `conversation`, `list_conversations`, `rename_conversation`, `delete_conversation`, `restore_conversation`, `conversation_markdown` |\n| Branches | `ai_conversation_set_leaf`, `ai_conversation_show_branch` | `set_leaf`, `show_branch` (device-local, not synced) |\n| Providers | `ai_provider_list`, `_create`, `_update`, `_delete`, `_key_set`, `_key_clear`, `_test` | `list_providers`, `create_provider`, `update_provider`, `delete_provider`, `set_key`, `clear_key`, `reachable`, `connection_test` |\n| Models | `ai_models_search`, `ai_models_usage` | `matching_models`, `model_usage` |\n| Saved questions | `ai_saved_list`, `_create`, `_update`, `_delete`, `_restore`, `_reorder` | `list_saved`, `create_saved`, `update_saved`, `delete_saved`, `restore_saved`, `reorder_saved` |\n\nMost DB-writing commands follow one pattern: take the lock via `lock(&state.db)`, read `physical_now(&conn)` as the timestamp, and call the matching `mnemora_ai` function. Errors are `AppError` with an `ErrorCode`.\n\n## Starting a Run\n\n`start_run` (shared by `ai_run_start` and `ai_run_retry`) is the core of the module.\n\n```mermaid\nsequenceDiagram\n    participant UI as Frontend\n    participant C as start_run\n    participant RT as AiRuntime\n    participant AI as mnemora-ai\n    participant T as Run thread\n    UI->>C: ai_run_start(RunRequest)\n    C->>AI: validate_question / validate_local\n    C->>C: branch_of requires conversation_id\n    C->>AI: prepare_run(db, keys, provider_id, model)\n    C->>RT: reserve(conversation, run_id)\n    alt Conversation already answering\n        RT-->>C: None\n        C-->>UI: Validation \"still answering\"\n    end\n    C->>AI: ensure_conversation (if continuing)\n    C->>RT: provider_for(prepared)\n    C->>C: offered_tools(state)\n    C->>AI: begin(db, ask) saves the question\n    C-->>UI: RunStarted{run_id, conversation_id}\n    C->>T: spawn thread\n    T->>AI: execute(db, provider, ask, toolset, Handles, emit)\n    loop events\n        AI-->>T: RunEvent\n        T-->>UI: AiRunEvent{run_id, conversation_id, event}\n    end\n    Note over T: on RunEnded the slot is dropped before emitting\n```\n\nKey design points:\n\n- **Returns at once.** The question is persisted via `begin` before the command returns, so the Conversation can be read immediately. The answer arrives as `AiRunEvent`s ending in `RunEnded`.\n- **Survives navigation.** The Run lives on its own `std::thread`, so leaving the page does not stop it.\n- **Claim before check.** The slot is reserved before `ensure_conversation` because a Run's first write happens on its thread, so a new Conversation might not be on disk yet.\n- **Slot released before the end event.** The slot is dropped when `RunEnded` is seen, *before* emitting, so a read triggered by that event sees the Conversation as idle.\n- **Retry.** `ai_run_retry` loads the old question text via `question_text` and starts a Run with `branch_of = entry_id`, creating a sibling question (the \"Try again\" pager).\n- **Edit / branch.** `RunRequest.branch_of` makes the new question a sibling that follows what the original followed; it needs an existing Conversation.\n\n### Tool offering\n\n`offered_tools` reads the `disabled_modules` and `enabled_optional_modules` core preferences (via `preference_list`), then walks `state.modules`. Modules that `is_enabled` contribute their `tools()`; modules that are off but would have offered tools are named (via `capitalised`) in `off` so the prompt can say so. The result forms a `Toolset { tools, off }`. See [Domain_Modules_(Todo_and_Journal)](../Domain_Modules_(Todo_and_Journal).md) for the tools modules provide.\n\n## Steering and stopping\n\n```mermaid\nstateDiagram-v2\n    [*] --> Idle\n    Idle --> Answering: ai_run_start / retry (reserve)\n    Answering --> Answering: ai_run_steer (note queued, QueueChanged)\n    Answering --> Answering: ai_run_unqueue (note removed)\n    Answering --> Answering: ai_run_send_now (promote + skip_step)\n    Answering --> Idle: ai_run_abort (control.stop) / RunEnded\n    Answering --> Idle: interrupt_all (Android background)\n```\n\n- `ai_run_steer` validates the note, requires a live Run (else `not_answering`, a Validation error), and queues the trimmed text; the page is told via `QueueChanged`.\n- `ai_run_unqueue` returns `NotFound` (\"That note was already sent.\") if the Run or note is gone.\n- `ai_run_send_now` promotes the note and calls `control.skip_step()`: the current Step ends where it is, unrun Tools are skipped, and the note is sent next while the Run continues.\n- `ai_run_abort` is a no-op when nothing is answering; otherwise it stops the Run, keeping what was written.\n- `announce_queue` emits an `AiRunEvent` carrying `QueueChanged { notes }`.\n\n## Conversations and guards\n\n- `ai_conversation_get` merges the persisted view with runtime state: `running` from `is_running` and `queued` notes from the live Run's steering snapshot.\n- `ai_conversation_delete` is refused while a Run is answering there, since the Run would save into a deleted Conversation. Restore has no such guard.\n- `ai_conversation_markdown` returns the visible branch, or one answer (without citations) when `entry_id` is given.\n- `ai_conversation_list` pages history newest first with a title filter.\n\n## Providers and keys\n\nKeys are write-only: `ai_provider_key_set` returns a `ProviderView` that never carries the key, and keys are stored in the device's `KeyStore`, not the database or sync log. `ai_provider_delete` removes the key with the Provider. Updating the address clears the key (enforced in `mnemora-ai`).\n\n`ai_provider_test` and `ai_models_search` are `async`: they resolve `(record, key)` under the DB lock via `reachable`, release the lock, then run the HTTP work in `tauri::async_runtime::spawn_blocking`. A join failure maps through `join_error` to `ErrorCode::Internal` (\"The AI service check stopped.\").\n\n## Request types\n\n| Type | Purpose |\n|---|---|\n| `RunRequest` | question text, optional `conversation_id`, `provider_id`, `model`, `LocalContext` (calendar for the model), optional `branch_of` |\n| `RetryRequest` | `conversation_id`, `entry_id`, `provider_id`, `model`, `local` |\n| `RunStarted` | `run_id` and `conversation_id` returned to the caller |\n\nAll derive `specta::Type` so TypeScript bindings are generated (`make bindings`, see [Build_and_Config](../Build,_Tooling_and_Packaging/Build_and_Config.md)). The event type `AiRunEvent` and `AiChangedEvent` are declared in `lib.rs` (see [Tauri_Host_and_IPC_Bridge](Tauri_Host_and_IPC_Bridge.md)).\n\n## Testing hooks\n\n`AiRuntime::set_provider` (`#[cfg(test)]`) installs a scripted `Provider` that `provider_for` returns instead of building a real adapter. The integration suites listed above use it to drive Runs deterministically.\n", "Tauri_Host_and_Command_Layer/Journal_Domain_Service.md": "# Journal_Domain_Service\n\n`src-tauri/src/journal.rs` is the Tauri command surface of the Journal module. It is deliberately thin: each of its ten `#[tauri::command]` functions locks the shared database connection, forwards to a function in the `mnemora-journal` crate, and returns the result or an `AppError`. All rules (validation, edited-mark logic, change-log recording, search ranking) live in the crate; see [Journal_Module](../Domain_Modules_(Todo_and_Journal)/Journal_Module.md). The file also holds a large integration-test suite that drives the commands through the real IPC dispatch against a `TestApp`.\n\nParent: [Tauri_Host_and_Command_Layer](../Tauri_Host_and_Command_Layer.md). Host wiring (state, event emission, command registration) is covered in [Tauri_Host_and_IPC_Bridge](Tauri_Host_and_IPC_Bridge.md).\n\n## Architecture\n\n```mermaid\ngraph LR\n    FE[\"Journal_Frontend<br/>(TS, generated bindings)\"] -->|invoke| CMD[\"journal.rs commands\"]\n    MOCK[\"Browser mock<br/>(mock-journal)\"] -. same JSON rules fixture .- CMD\n    CMD -->|\"lock(&state.db)\"| ST[\"AppState.db (Mutex&lt;Connection&gt;)\"]\n    CMD --> JM[\"mnemora-journal crate\"]\n    JM --> DB[(\"SQLite: journal_entries, FTS index, change_log\")]\n    SYNC[\"Sync engine\"] -->|\"JournalChangedEvent / JournalEntryDeletedEvent\"| FE\n    SYNC --> DB\n```\n\nKey points:\n- Every command takes `State<'_, AppState>` and calls `crate::state::lock(&state.db)`. Read-only commands pass `&` and write commands `&mut` to the crate function.\n- `#[specta::specta]` makes the signatures part of the generated TypeScript bindings (`make bindings`); registration happens in `src-tauri/src/lib.rs` (names such as `journalEntryCreate` ... `journalToday` appear in the exported list).\n- Errors are `mnemora_core::error::AppError`, serialised with a `code` (`validation`, `not_found`, ...) that the frontend and tests match on.\n\n## Commands\n\n| Command | Delegates to | Purpose |\n|---|---|---|\n| `journal_entry_create(entry: NewEntry)` | `create_entry` | New Entry on a Page; rejects blank text, invalid dates, bad zone/offset (offset beyond ±14 h). |\n| `journal_entry_update(id, text, session_id)` | `update_entry` | Replace text; `session_id` groups a composer session's saves into one change-log record. |\n| `journal_entry_toggle_task(id, line)` | `toggle_task_line` | Tick/untick the checklist item on 0-based source line; never marks the Entry edited. Each tick is its own `tick` record with no session. |\n| `journal_entry_delete(id)` | `delete_entry` | Soft delete (undoable). |\n| `journal_entry_restore(id)` | `restore_entry` | Bring a deleted Entry back to its own Page. |\n| `journal_entry_move(id, page_date)` | `move_entry` | Change only the Page date (future dates allowed); the written timestamp is untouched. |\n| `journal_month_days(year, month)` | `month_days` | Dates with live Entries, for calendar dots. |\n| `journal_pages(cursor, limit, direction)` | `list_pages` | Windowed Page listing; `PageDirection` is `older`, `from`, or `newer`. |\n| `journal_search(query, from, to)` | `search` | Exact + typo-tolerant (\"similar\") search with optional date range. |\n| `journal_today(today)` | `today` | Entry count and latest-written snippet for the Home card. |\n\n### Paging semantics\n\nPages are always returned newest first, with Entries inside a Page oldest-written first. The cursor is a Page date:\n\n- `older` – strictly before the cursor (continuation of the previous request's last Page); no cursor means the newest Pages.\n- `from` – starts *at* the cursor (jump to a date); a date with no Page starts at the next older one.\n- `newer` – the nearest Pages above the cursor (scrolling up after a jump); requires a cursor, otherwise `validation`.\n\nA result shorter than `limit` means that end was reached. Chained `newer`/`from`/`older` windows tile the journal without gaps or overlap.\n\n### Search semantics\n\nEvery word is required and prefix-matched; quoted text is an exact phrase (no prefix inside quotes); case and accents are ignored. FTS syntax in the query is plain text and never errors. `similar` holds typo-tolerant matches that are never repeated from `exact` (1 typo for 4–7 letter words, 2 for 8+, none for shorter; phrases stay exact), capped at 100 with `similar_truncated`. With a range and no words, every Entry in the range is listed. Snippets are plain-text spans with `matched` flags (markdown markers and link URLs are stripped). Deleted Entries never appear and return on restore.\n\n## Data flow: writing an Entry\n\n```mermaid\nsequenceDiagram\n    participant UI as Journal composer\n    participant C as journal_entry_update\n    participant J as mnemora-journal\n    participant DB as SQLite\n    UI->>C: id, text, session_id\n    C->>J: update_entry(&mut conn, ...)\n    J->>DB: UPDATE journal_entries + FTS index\n    J->>DB: change_log: reuse record for same session_id, else append \"update\"\n    J-->>C: Entry\n    C-->>UI: Entry (written_at unchanged, edited_at set only after 10 min)\n```\n\nBehaviours pinned down by the tests:\n- A create plus further updates in the same session leave one `create` record whose snapshot holds the latest state; a new session appends an `update` record.\n- Updates within 10 minutes of `written_at` are not edits (`edited_at` stays null); later ones set `edited_at == updated_at` and move forward with each save.\n- Delete and restore both bump `updated_at` and log `delete` / `restore` with snapshots carrying `deleted_at`. Operations on a deleted or unknown Entry return `not_found`; restoring a live Entry is also `not_found`.\n- Move to the same date logs nothing; edits, moves and ticks keep the search index current.\n- Entries deleted over 30 days ago survive a restart (startup hook) with their history, and Undo still works.\n\n## Tests\n\nThe `tests` module uses `crate::test_support::TestApp` (`invoke`, `with_db`, `run_startup`) so commands run through the same dispatch as production. Coverage areas: validation, ordering, paging directions, counts, session/change-log behaviour, edited-mark rules, task toggling, soft delete/restore, month days, search (case/accent, prefix, phrases, ranges, typos, truncation, snippets, hostile input), Home summary, and the `journal.font` / `journal.width` / `journal.page_summary` preferences via `settings_save`/`settings_get_all`.\n\n`the_shared_rule_fixtures_hold` loads `src/lib/ipc/fixtures/journal-rules.json` (ADR 0009) and replays each case against the real commands, comparing a normalised shape (seed indexes instead of ids/timestamps). The same file runs against the browser mock in `src/lib/ipc/mock-journal.test.ts`, keeping the mock and backend in step; see [IPC_Bridge_and_Core_Mocks](../IPC_Bridge_and_Browser_Mocks/IPC_Bridge_and_Core_Mocks.md).\n\n## Relationships\n\n- Rules and storage: [Journal_Module](../Domain_Modules_(Todo_and_Journal)/Journal_Module.md).\n- Consumers: [Journal_Frontend](../Journal_Frontend.md), [Journal_Composer_and_Entry_Editing](../Journal_Frontend/Journal_Composer_and_Entry_Editing.md), [Journal_Search](../Journal_Frontend/Journal_Search.md).\n- Remote changes: when sync applies Journal records, the host emits `JournalChangedEvent` (and `JournalEntryDeletedEvent` for deletions of open entries); see [Sync_Replication_Engine](../Sync_Replication_Engine.md) and sync tests in `sync_journal_tests.rs`.\n- Sibling command layers: [Todo_Domain_Service](Todo_Domain_Service.md), [AI_Assistant_Commands](AI_Assistant_Commands.md).\n", "Tauri_Host_and_Command_Layer/Sync_Conflicts_and_Activity.md": "# Sync_Conflicts_and_Activity\n\n## Purpose\n\nThis module is the Tauri command surface for the Sync **Conflicts** and **Activity** screens. It lives in `src-tauri/src/sync_conflicts.rs`. The commands are thin. The rules for detecting, merging, logging and paging are in the `mnemora-sync` crate (see [Sync_Conflicts_and_Resolutions](../Sync_Replication_Engine/Sync_Conflicts_and_Resolutions.md) and [Sync_Activity_and_Devices](../Sync_Replication_Engine/Sync_Activity_and_Devices.md)).\n\nThe module does three things:\n\n1. It exposes read commands: the Conflicts tab, Compare, the Activity log and the \"attention\" summary.\n2. It settles a Conflict or a \"Use other instead\" request. It does this by writing the chosen text or value through the **owning domain module's own edit function**, so that:\n   - the write is validated,\n   - it is recorded as an ordinary change,\n   - it syncs like any other edit.\n3. It holds the behavioural test suites for conflicts, auto-resolutions and the activity log. These run on a multi-device `Cluster` in `test_support`.\n\n## Architecture\n\n```mermaid\ngraph TD\n    UI[Sync_Frontend<br/>Conflicts / Compare / Activity tabs] -->|IPC| CMD[sync_conflicts.rs<br/>Tauri commands]\n    CMD -->|read & plan| SYNC[mnemora-sync crate<br/>conflict_list, conflict_view, conflict_draft,<br/>conflict_plan/finish, resolution_plan_use/finish,<br/>activity_page, attention]\n    CMD -->|write_text| J[mnemora-journal<br/>update_entry, move_entry]\n    CMD -->|write_text / write_value| T[mnemora-todo<br/>update_task, edit_comment, set_priority,<br/>set_task_state, move_task, restore_when, list setters]\n    CMD -->|write_text| AI[mnemora-ai<br/>rename_conversation, update_saved]\n    CMD -->|todo_changed| W[state.widgets<br/>Android widget refresh]\n    CMD --> ST[AppState<br/>db mutex, device, sync]\n```\n\n## Commands\n\n| Command | Role |\n|---|---|\n| `sync_conflicts` | Returns the `ConflictList`: \"Needs you\" (open conflicts) and \"Resolved automatically\". |\n| `sync_conflict` | Returns one `ConflictView` for Compare, or `None` if the id is unknown. |\n| `sync_conflict_draft` | Builds the starting text for \"Edit merged\" from the agreed parts and a `ClashChoice` per clash. A clash with no choice takes the showing version. |\n| `sync_conflict_resolve` | Settles a conflict with `keep_this`, `keep_other` or `merged`. |\n| `sync_activity` | Returns one `ActivityPage` of the log, newest first. It takes a filter, a cursor and a limit. |\n| `sync_attention` | Returns the `Attention` summary that the Home card, sidebar badge and palette hint read. |\n| `sync_resolution_use_other` | \"Use ‹other› instead\" for an automatically resolved value. |\n| `sync_resolutions_visited` | Marks the \"Resolved automatically\" rows as seen, so they stop showing as new. |\n\nAll commands take a `State<AppState>`. They lock `state.db` through `crate::state::lock`. They name the device using `state.device` (`my_name` falls back to `default_device_name`).\n\n### Resolve flow\n\n`sync_conflict_resolve` calls `conflict_plan` to get an optional `ConflictWrite` and a resolution. If there is a write, `write_text` dispatches on `entity`:\n\n| Entity | Domain call |\n|---|---|\n| `journal_entry` | `mnemora_journal::update_entry`, as a new editing session |\n| `todo_task` | `mnemora_todo::update_task`; the `notes` or `title` field is replaced and the other is kept |\n| `todo_comment` | `edit_comment` |\n| `ai_conversation` | `rename_conversation` |\n| `ai_saved_question` | `update_saved` |\n\nAny other entity returns `ErrorCode::Internal`. Non-journal entities also call `widgets.todo_changed()`. Then `conflict_finish` records the resolution under this device's id, so the Conflict reads resolved on every device.\n\n```mermaid\nsequenceDiagram\n    participant UI\n    participant Cmd as sync_conflict_resolve\n    participant Sync as mnemora-sync\n    participant Dom as Domain module\n    UI->>Cmd: id, choice\n    Cmd->>Sync: conflict_plan(id, choice)\n    Sync-->>Cmd: (ConflictWrite?, resolution)\n    opt there is text to write\n        Cmd->>Dom: update/rename (ordinary edit, new change record)\n        Cmd->>Cmd: widgets.todo_changed() if not journal\n    end\n    Cmd->>Sync: conflict_finish(id, resolution, me, now)\n    Note over Sync: the resolution and the edit sync to the other devices\n```\n\n### \"Use other instead\"\n\n`sync_resolution_use_other` gets a `UsePlan` from `resolution_plan_use`. `write_value` then replays the replaced value through the owning module, dispatching on `(entity, unit)`:\n\n- `todo_task`:\n  - `priority`: `set_priority`.\n  - `state`: `set_task_state`.\n  - `list_id`: `move_task`.\n  - `when`: `restore_when`, with a `DueChange` that rebuilds the whole date, time and `RepeatRule` group.\n- `todo_list`:\n  - `name`: `rename_list`.\n  - `emoji`: `set_list_emoji`.\n  - `task_sort`: `set_list_sort`.\n  - `group_by`: `set_list_group`.\n- `journal_entry`:\n  - `page_date`: `move_entry`.\n\nAnything else, or an unparsable value, returns a `Validation` error. `resolution_finish_use` then marks the row used on every device. A row cannot be used twice, and a repeating task's status cannot be reverted.\n\n## Test suites\n\nAll three suites drive real commands and assert only through commands (ADR 0009). They use `Cluster::new(n)` with controllable clocks and `c.sync(a, b)` exchanges.\n\n- **`sync_conflicts_tests.rs`: text merge and Conflicts.**\n  - Edits to different words or lines merge silently and identically on every device.\n  - Overlapping edits raise exactly one Conflict, which is the same on every device. The newest text shows.\n  - Compare marks the differing words and shows the original. The draft supports `showing`, `other` and `both` choices, and edits made after the conflict was raised are kept.\n  - Resolving on one device clears it on all of them. The resolution travels as an ordinary edit.\n  - Task title and notes merge and clash independently. Comment bodies merge three-way and keep the \"edited\" mark.\n  - Convergence holds across three devices in any sync order.\n  - Edits made under `editing_hold` are merged when the editor is released.\n  - Rewritten editing sessions are replayed correctly.\n  - A conflict on an entry that is later deleted resolves as `deleted` without asking.\n- **`sync_resolutions_tests.rs`: \"Resolved automatically\".**\n  - A value clash (priority, status, due-date and repeat group) decided newest-wins is logged once, with the same row id everywhere. Detail strings follow the date and time format preferences.\n  - Non-clashes are not logged: sequential changes, equal values, double delete and double complete.\n  - Delete-versus-edit, a task moved into a list that was deleted elsewhere, and a text clash on a deleted entry each produce one row.\n  - Order and preference changes fold into one line per sync session.\n  - `fresh` rows clear on `sync_resolutions_visited`.\n  - `sync_attention` follows the waiting conflicts.\n  - The new-conflict toast fires only on a device with `toast_conflicts` set.\n- **`sync_activity_tests.rs`: Activity log.**\n  - Each session is logged once, with counts that read the right way round for each end and a breakdown that adds up and contains no content.\n  - A sync that moved nothing is not logged.\n  - Conflict raised/resolved, list-merge, rename, forget, leave, pause, resume, failed and local-network-blocked events are each one attributed line. Other devices read them with \"· on <name>\".\n  - Repeated pauses and failures are de-duplicated.\n  - A 450-row log pages newest first without gaps or repeats, filters by device or \"this device\", and clamps the page limit to between 1 and the limit.\n\n## Related modules\n\n- [Sync_Conflicts_and_Resolutions](../Sync_Replication_Engine/Sync_Conflicts_and_Resolutions.md): detection, `Resolution`, and the plan and finish logic.\n- [Sync_Activity_and_Devices](../Sync_Replication_Engine/Sync_Activity_and_Devices.md): activity logging and paging.\n- [Sync_Activity_Conflicts_and_Status](../Sync_Frontend/Sync_Activity_Conflicts_and_Status.md): the screens that call these commands.\n- [Tauri_Host_and_IPC_Bridge](Tauri_Host_and_IPC_Bridge.md): the `AppState`, the lock helper and event registration.\n- [Sync_Connectivity_and_Pairing](Sync_Connectivity_and_Pairing.md): sibling sync commands.\n- [Journal_Module](../Domain_Modules_(Todo_and_Journal)/Journal_Module.md), [Todo_Tasks_and_Lists](../Domain_Modules_(Todo_and_Journal)/Todo_Tasks_and_Lists.md) and [AI_Module](../AI_Assistant_Backend/AI_Module.md): the modules that perform the actual writes.\n", "Tauri_Host_and_Command_Layer/Sync_Connectivity_and_Pairing.md": "# Sync_Connectivity_and_Pairing\n\nThe Tauri-side layer of Sync. It exposes the Sync commands the UI calls, hosts the live network owned by the `mnemora-sync` crate, and decides when that network may run on Android. The rules (merge, wire format, pairing protocol) live in [Sync_Replication_Engine](../Sync_Replication_Engine.md); this module is deliberately thin.\n\nFiles: `src-tauri/src/sync.rs`, `sync_power.rs`, `sync_power/android.rs`, plus the integration test suites (`sync_power_tests`, `sync_pairing_tests`, `sync_merge_preview_tests`, `sync_forget_tests`, `sync_address_tests`, `sync_groups_tests`, `sync_live_tests`, `sync_pause_tests`).\n\nRelated pages: [Sync_Conflicts_and_Activity](Sync_Conflicts_and_Activity.md) (conflict/activity commands), [Tauri_Host_and_IPC_Bridge](Tauri_Host_and_IPC_Bridge.md) (app state, events), [Sync_Frontend](../Sync_Frontend.md) (the UI that calls these commands), [Sync_Networking_and_Live](../Sync_Replication_Engine/Sync_Networking_and_Live.md) and [Sync_Pairing](../Sync_Replication_Engine/Sync_Pairing.md) (engine internals).\n\n## Architecture\n\n```mermaid\ngraph TD\n    UI[Svelte UI - Sync_Frontend] -->|tauri commands| CMD[sync.rs commands]\n    CMD --> STATE[AppState: device, db, sync, power]\n    CMD -->|launch_network / start_network| NET[mnemora_sync::Network]\n    HOST[AppHost - PairingHost + Host] --> NET\n    HOST -->|SyncPairingEvent / SyncPeersEvent / SyncActivityEvent| UI\n    ANDROID[SyncBridge.kt] -->|JNI| AND[sync_power/android.rs]\n    AND --> POWER[sync_power.rs: Power, settle, foreground, link]\n    POWER -->|settle: start or drop| NET\n    CMD -->|set_option MobileData| POWER\n```\n\n## Components\n\n### Commands (`sync.rs`)\n- **Settings / identity:** `sync_get`, `sync_set_enabled` (device-only switch; turning on calls `launch_network`), `sync_set_option` (Automatic, MobileData, Visible, ToastConflicts), `sync_rename` (1–40 chars, unique in the group; logs and syncs the rename).\n- **Devices tab:** `sync_devices`, `sync_device` (sheet; maps NotNearby to `PausedOnMobileData` or `BlockedByLocalNetwork`), `sync_device_rename`, `sync_device_address`, `sync_device_check` (dials a typed address and reports who answered), `sync_device_sync_now`, `sync_device_forget` (signed revocation, group-wide), `sync_leave` (tells connected members for up to 3 s, then forgets all; data is kept), `sync_now`, `sync_resume`.\n- **Local network:** `sync_local_network_os` (Android denial, ignored while Sync is off), `sync_open_local_network_settings` (macOS: tries the Local Network pane, falls back to Privacy & Security).\n- **Pairing:** `sync_pair_state/show/new_code/enter/enter_at/decide/merge/cancel`. They go through `pairing()`, which refuses with `PausedOnMobileData` when mobile data is the only reason nothing runs.\n\n### `AppHost`\nImplements `PairingHost` and `Host` for the engine. It supplies this device's `Who`/handshake, pinned keys, stores a pairing (`store_paired`, lifts revocations, introduces members signed by this device), computes holdings for the merge preview (after a backfill), takes the pre-merge backup, and emits events. Sync gets its own DB connection (`own_db`) so a big sync never blocks commands; tests use the app's single connection.\n\n### Network lifecycle\n`launch_network` (spawned async: mDNS discovery, falling back to `Fixed` if unavailable) → `start_network` (loads or creates the `DeviceIdentity` on a blocking thread, `Network::start`, `attach`). If Sync was switched off meanwhile, the network is dropped, closing its port.\n\n### Power gating (`sync_power.rs`, `android.rs`)\n`should_run(Conditions)` = enabled ∧ screen ≠ Away ∧ (link ≠ Mobile ∨ mobile_data allowed).\n\n```mermaid\nstateDiagram-v2\n    [*] --> Front\n    Front --> Leaving: app leaves, network running\n    Front --> Away: app leaves, no network\n    Leaving --> Front: returns (turn bumped, flush timer stands down)\n    Leaving --> Away: flush over (5 s grace, or idle after 1 s)\n    Away --> Front: returns, settle() restarts network\n```\n\n`foreground()` and `link()` are entered from JNI (`Java_com_hemang_mnemora_SyncBridge_nativeForeground/nativeLink`) because the WebView may be suspended. `Early` stores reports made before Tauri setup; `register_app` replays them. Leaving also interrupts AI runs. `settle()` starts or drops the network to match conditions; `paused_on_mobile_data` feeds the Devices tab. Desktop never receives lifecycle events, so it stays \"Front\".\n\n## Pairing flow\n\n```mermaid\nsequenceDiagram\n    participant S as Showing device\n    participant T as Typing device\n    S->>S: sync_pair_show (code, 3 tries, 2 min)\n    T->>S: sync_pair_enter(code) / enter_at(address, code)\n    S-->>S: asking\n    S->>S: sync_pair_decide(allow)\n    alt both hold data\n        T->>T: preview then sync_pair_merge (merge or cancel)\n    end\n    Note over S,T: both back up, then pairing stored, members introduced\n```\n\nCancel at any stage tells the other device and changes nothing.\n\n## Tests\nIntegration tests run two or more `TestApp`s over real loopback sockets (or in-memory `Cluster`s). Coverage:\n- `sync_pairing_tests`: pairing, wrong codes, by-address and IPv6, network exists only while Sync is on.\n- `sync_merge_preview_tests`: preview counts, backups, cancel paths.\n- `sync_forget_tests`, `sync_groups_tests`: forget/leave, rename, address check, 3–4 device groups and introductions.\n- `sync_address_tests`: group-shared typed addresses.\n- `sync_live_tests`: connect, quiet-period debounce, widget refresh once per session, off/on cycles, local-network blocking.\n- `sync_pause_tests`: data-version and clock (>5 min ahead) pauses with automatic resume.\n- `sync_power_tests`: flush on leave, mobile-data rules, rapid leave/return.\n", "Tauri_Host_and_Command_Layer/Tauri_Host_and_IPC_Bridge.md": "# Tauri Host and IPC Bridge\n\nThe `src-tauri` crate (library `mnemora_lib`) is Mnemora's app shell. It wires the domain crates (`mnemora-core`, `-journal`, `-todo`, `-ai`, `-sync`) into Tauri. It owns four things:\n\n- the startup sequence;\n- the shared `AppState`;\n- the typed command and event surface exported to TypeScript;\n- a small set of cross-cutting commands (settings, device settings, diagnostics, editing holds, deep links).\n\nThe guiding rule, stated in `lib.rs`, is \"Logic belongs in core, not here.\" Commands are thin: they validate only what core does not, then delegate.\n\nDomain command groups live in sibling pages:\n\n- [Todo_Domain_Service](Todo_Domain_Service.md)\n- [Journal_Domain_Service](Journal_Domain_Service.md)\n- [AI_Assistant_Commands](AI_Assistant_Commands.md)\n- [Sync_Connectivity_and_Pairing](Sync_Connectivity_and_Pairing.md)\n- [Sync_Conflicts_and_Activity](Sync_Conflicts_and_Activity.md)\n- [window_state](window_state.md)\n\nThis page covers the host itself.\n\n## Files in this module\n\n| File | Role |\n|---|---|\n| `main.rs` | Desktop entry point; calls `mnemora_lib::run()`. |\n| `lib.rs` | `run`, `setup`, the `specta_builder_for!` command/event registry, typed events, remote-change fan-out. |\n| `state.rs` | `AppState` and the poison-tolerant `lock` helper. |\n| `commands.rs` | Settings, device settings, app info, UI error log, backup, open log folder. |\n| `editing.rs` | `editing_hold` / `editing_release` and held-change settlement. |\n| `links.rs` | `PendingLinks` queue and `app_take_links` for `mnemora://` deep links. |\n| `env_guard.rs` | Refuses to start when the build Environment and the running app disagree. |\n| `test_support.rs` | `TestApp` and `Cluster` harness that drive the real commands through Tauri's mock runtime. |\n| `legacy_db_tests.rs` | Upgrade test against a previous-release database. |\n\n## Architecture\n\n```mermaid\ngraph TD\n    UI[\"Svelte UI<br/>src/lib/ipc/bindings.ts\"] -- \"invoke(command)\" --> H[\"tauri invoke_handler<br/>(specta Builder)\"]\n    H --> CMD[\"commands.rs / editing.rs / links.rs<br/>+ domain command files\"]\n    CMD --> ST[\"AppState\"]\n    ST --> DB[(\"SQLite Connection<br/>Mutex\")]\n    ST --> SS[\"SettingsStore\"]\n    ST --> DS[\"DeviceStore (device.toml)\"]\n    ST --> BUS[\"EventBus\"]\n    ST --> SR[\"SyncRuntime / Power\"]\n    ST --> AIR[\"AiRuntime\"]\n    ST --> WS[\"WidgetSignal\"]\n    BUS -- \"subscribe (follow_remote)\" --> EV[\"tauri_specta events\"]\n    EV -- \"emit\" --> UI\n    CORE[\"mnemora-core / journal / todo / ai / sync crates\"] --- ST\n```\n\nThe frontend side of this boundary is described in [IPC_Bridge_and_Browser_Mocks](../IPC_Bridge_and_Browser_Mocks.md). The Rust command surface is exported to `src/lib/ipc/bindings.ts`. In debug desktop builds `run()` regenerates that file on every start. The ignored test `regenerate_bindings` (`make bindings`) does the same without launching the GUI.\n\n## Startup sequence (`setup`)\n\n```mermaid\nsequenceDiagram\n    participant R as run()\n    participant S as setup()\n    participant D as Database\n    participant M as Modules\n    R->>R: build specta builder, export bindings (debug desktop)\n    R->>S: tauri Builder .setup\n    S->>S: env_guard::check(ENVIRONMENT, identifier, data_dir, android)\n    S->>S: logging::init, load device.toml, apply saved log level\n    S->>D: db::open + migrate::run(modules) (backup first)\n    S->>M: on_startup for each Module (failures only warn)\n    S->>S: editing::release_at_start\n    S->>S: EventBus, SettingsStore, WidgetSignal, follow_remote\n    S->>S: SyncRuntime::reconcile(sync.enabled), on_change_log_write\n    S->>S: mount typed events, build AiRuntime, manage(AppState)\n    S->>S: launch_network if Sync on, and register Android bridges\n    S->>S: create_main_window with theme init script\n```\n\nKey points:\n\n- **Environment is compile-time.** `ENVIRONMENT` is `Sandbox` when the `sandbox` feature is set, otherwise `Production`. There is deliberately no runtime switch that could mix data sets.\n- **`env_guard::check`** compares the Tauri config identifier with the build's expected identifier. On Android the Tauri CLI forces the identifier to match the Kotlin package, so Sandbox is distinguished by the package name in `data_dir`. The check uses a trailing-slash match so the Production package does not match inside the Sandbox path. A mismatch aborts startup.\n- **Logging is initialised before anything else** so a corrupt `device.toml` is recorded. `run()` falls back to stderr when setup fails before tracing exists.\n- **Modules** are registered in one place, `modules()`, in migration order: Core, Journal, Todo, AI, Sync. A failing `on_startup` does not stop the app.\n- **Editing holds** from a previous run are released at start (`release_at_start`), because their editors died with it.\n- **The first paint** reads look-and-feel from the device file alone (`settings.device_values()`), so it never waits on the database. The values are injected by `theme_inject::script`.\n- **`PendingLinks` is managed in `run()`, not `setup`**, because a link can arrive before setup finishes.\n- Sync starts only when the device has it on. Otherwise nothing is started.\n\n## Shared state (`state.rs`)\n\n`AppState` holds everything commands need:\n\n- `env` and `paths`;\n- `db: Mutex<Connection>`;\n- `settings: SettingsStore` and `device: Arc<DeviceStore>`;\n- `log: LogHandle`;\n- `widgets: Arc<WidgetSignal>`;\n- `sync: SyncRuntime` and `power`;\n- `live_network`;\n- `modules: Modules` and `bus: EventBus`;\n- `ai: AiRuntime`.\n\n`lock()` recovers a poisoned mutex via `PoisonError::into_inner`, so one panicking thread cannot brick every command for the rest of the session. Every command goes through it.\n\n`live_network` is `true` in the app and `false` in tests, which start their own loopback network.\n\n## Command registry and typed events\n\n`specta_builder_for!($runtime)` is a macro rather than a function. `#[specta::specta]` cannot see a generic runtime parameter of an outer function. The app instantiates it with `tauri::Wry` and the tests with `MockRuntime`. The same macro supplies both the invoke handler and the exported TypeScript. Generic commands are registered with a turbofish, for example `commands::open_log_dir::<$runtime>`.\n\nTyped events registered:\n\n| Event | Meaning |\n|---|---|\n| `SettingsChangedEvent` | Mirrors core's `SettingsChanged`. |\n| `TodoChangedEvent`, `JournalChangedEvent`, `AiChangedEvent` | A remote sync (or the widget) changed that Module's data, so refresh silently. |\n| `TodoListsMergedEvent`, `TodoTaskDeletedEvent`, `JournalEntryDeletedEvent` | Remote merge or delete of something possibly open in the UI. |\n| `SyncPairingEvent`, `SyncPeersEvent`, `SyncConflictsEvent`, `SyncActivityEvent`, `SyncNewConflictsEvent` | Sync UI state. |\n| `AiRunEvent` | One step of an AI run with its run and conversation ids. |\n| `LinkOpenedEvent` | A deep link is waiting in the queue. |\n\n### Remote-change fan-out (`follow_remote`)\n\nCore and Sync publish on an in-process `EventBus`. `follow_remote` subscribes handlers that translate those into typed IPC events.\n\n```mermaid\nflowchart LR\n    SY[Sync session] -->|RemoteChanged module| B(EventBus)\n    SY -->|ListsMerged| B\n    SY -->|TaskDeletedRemotely / EntryDeletedRemotely| B\n    SY -->|ConflictsRaised| B\n    SY -->|DeviceRenamed| B\n    SY -->|RemoteSessionEnded| B\n    B --> A[announce_remote_change] --> E1[Todo/Journal/AI/Sync events]\n    B --> E2[TodoListsMergedEvent etc.]\n    B -->|only if device.sync.toast_conflicts| E3[SyncNewConflictsEvent]\n    B -->|rename: write device.toml, then spawn_blocking refresh_advert| E4[SyncPeersEvent]\n    B -->|modules contains todo| W[WidgetSignal.todo_changed]\n```\n\nDesign notes:\n\n- The widget redraws once per sync session (`RemoteSessionEnded`), not per batch, so a large sync does not flood it.\n- A remote rename writes the device file before the session continues. Re-advertising happens off-thread because it needs the database lock the session holds. The window is told before and after.\n- New-conflict toasts are suppressed unless the device is set to \"Show a toast\".\n\n## Cross-cutting commands (`commands.rs`)\n\n| Command | Behaviour |\n|---|---|\n| `settings_get_all` | `SettingsSnapshot` (values plus schema defaults) via `SettingsStore::get_all`. |\n| `settings_save` | Atomic batch via `save_batch`. Emits `SettingsChangedEvent`. Errors use `AppError` codes such as `validation` and `unknown_key`. |\n| `device_get` | Device-only settings from `device.toml`. |\n| `device_set_sidebar` | Width clamped to 200–360 px, plus the rail flag. |\n| `device_set_todo_open` | Remembers the Todo fold state in the sidebar. |\n| `device_set_log_level` | Validates with `normalize_level`, applies live, and persists. |\n| `device_set_spellcheck` | Per-device editor spellcheck. |\n| `app_info` | Version, environment, data and log dirs, and the OS first name. |\n| `log_ui_error` | Forwards a frontend error to the log (target `ui`), truncated to 8,000 characters each for message and stack. |\n| `backup_now` | `db::backup::backup_now`, returns the path. |\n| `open_log_dir` | Opens the log folder through `tauri_plugin_opener`. |\n\nDetails worth knowing:\n\n- Look-and-feel keys (theme, density, text size, reduce motion, phone tabs) are stored in the device file and not in the database. They are never Preferences, so they do not sync. The tests assert zero `settings` and `change_log` rows for them.\n- Other Preferences write a `setting` record into the change log, so they sync.\n- `os_first_name` returns an empty string on mobile and for placeholder names (\"anonymous\", \"unknown\"). The UI then shows a plain greeting.\n\n## Editing holds (`editing.rs`)\n\nAn open Journal entry editor or Task sheet field tells Rust what it is editing. Changes from other devices for that unit wait until the editor is done. The rules live in `mnemora_core::editing` and `mnemora_sync`.\n\n- `editing_hold(entity, entity_id, scope)` validates the entity, scope (a field, a group, or `*` for the whole record) and id length (max 64) against the sync `Registry`. It returns `false` and writes nothing when Sync is off. The editor should renew about every 30 seconds. The hold lapses after two minutes, so a vanished editor cannot block changes forever.\n- `editing_release` ends the hold and, in one transaction, calls `settle` (`mnemora_sync::release_held`). It then publishes `RemoteChanged` for each affected Module through `announce`, so screens refresh.\n- `release_lapsed` runs when the app returns to the foreground. `release_at_start` runs at boot.\n\nFrontend counterpart: `EditingHold` in [App_Bootstrap_and_Platform_Utilities](../Frontend_Platform_and_Shell/App_Bootstrap_and_Platform_Utilities.md). Behavioural tests: `sync_journal_tests` (see [Sync_Replica
