ipant Native as MnemoraAndroid\n    OS->>Shell: prefers-color-scheme changes\n    Shell->>Apply: root, settings\n    Apply->>Apply: resolveTheme, set data-* attributes\n    Apply->>Bars: resolved theme\n    Bars->>Bars: read body background, convert to #rrggbb\n    Bars->>Native: setSystemBars(dark, hex)\n```\n\n## System bars (Android)\n\n`system-bars.ts` also declares `AndroidBridge`, the interface that `MainActivity` exposes to the WebView as `window.MnemoraAndroid`. Every method is optional, because the object is absent on every other platform. The interface also carries the non-theme calls `moveTaskToBack`, `holdMulticastLock`, and the local-network permission calls (`localNetworkState`, `requestLocalNetwork`, `requestLocalNetworkOnce`, `openAppSettings`). Those are used by the router and Sync. See [Android_Integration](../Android_and_Home-Screen_Widget_Platform/Android_Integration.md), [Router](Router.md) and [Sync_Devices_and_Pairing](../Sync_Frontend/Sync_Devices_and_Pairing.md).\n\n- `isDarkTheme(theme)` is true for every theme except `light`. Icons are light-on-dark for `dark` and `oled`.\n- `cssColorToHex(css)` converts any CSS colour, including `oklch`, to `#rrggbb`. It paints one pixel on a canvas and reads it back. It returns `null` if no 2D context is available. `toHexByte` pads each channel to two hex digits.\n- `syncSystemBars(bridge, theme, readBackground)` returns `false` and does nothing if the bridge or its `setSystemBars` is missing, or if the background cannot be read. Otherwise it calls `bridge.setSystemBars(isDarkTheme(theme), color)` and returns `true`.\n- `applySystemBars(theme)` wires the browser side: it reads the computed `backgroundColor` of `document.body` and passes it to `syncSystemBars` along with `window.MnemoraAndroid`.\n\nUsing the body background means the bars always match the surface the CSS tokens actually paint.\n\n## Token guard tests\n\nThe tokens are CSS custom properties, and two tests parse `tokens.css` and fail when it drifts.\n\n### Contrast (`contrast.test.ts`)\n\nThe test strips comments from `tokens.css` and parses each `selector { --name: value; }` block into a `Rule`. `tokensFor(theme)` rebuilds the cascade:\n\n1. `:root` for light.\n2. `:root[data-theme=\"dark\"]` is added on top for dark.\n3. `:root[data-theme=\"oled\"]` is added on top of that for OLED.\n\n`linearRgb` resolves `var(--x)` references inside the same theme and converts opaque `oklch()` values to clamped linear sRGB. Anything else throws, so a token must be an opaque `oklch` colour or a `var()` pointing to one. `contrast(theme, fg, bg)` computes the WCAG ratio from the luminance of the two tokens.\n\nThe asserted thresholds, in all three themes:\n\n| Pair | Minimum |\n|---|---|\n| `warning-ink` and `success` on `surface-2` (Provider status chips) | 4.5:1 |\n| `muted` (used for placeholders) on `pop`, `surface`, `surface-2`, `bg` | 4.5:1 |\n| `warning-ink` (icon) on each of those four surfaces | 3:1 |\n| `switch-off` (Switch off track) on each of those four surfaces | 3:1 |\n\n`scripts/check-colors.sh` is a related build-time check. See [Build_and_Config](../Build,_Tooling_and_Packaging/Build_and_Config.md).\n\n### First paint (`first-paint.test.ts`)\n\n`index.html` paints the background before `app.css` loads, so it repeats `--bg` and `color-scheme`. The test reads both files from disk with `readFileSync`, because Vitest turns CSS imports into empty strings. It checks that for each theme:\n\n- The `background` in the matching `html` / `html[data-theme=…]` rule in `index.html` equals `--bg` in `tokens.css`.\n- `color-scheme` is `light` for the default, and `dark` for both `dark` and `oled`, in `index.html` and in the shared dark and OLED token rule.\n\nThe helper `block` returns the last matching rule, mirroring CSS where the last declaration wins. This matters because `oled` also appears in the shared dark-and-OLED rule. `prop` extracts a property value from a block.\n\n## Maintenance notes\n\n- Changing a token in `tokens.css` can fail the contrast test, or the first-paint test if it touches `--bg` or `color-scheme`. Fix `index.html` or the token. Do not edit the tests to match.\n- A new theme needs changes in `ThemePref` / `ResolvedTheme`, a selector in `tokens.css`, a case in `tokensFor`, and an entry in the first-paint `THEMES` table. `isDarkTheme` also has to classify it.\n- Features that need native bar styling should go through `AndroidBridge`, with every member optional so the browser and desktop builds keep working.\n", "Frontend_Platform_and_Shell.md": "# Frontend_Platform_and_Shell\n\n## Purpose\n\nThis module is the frame of the Mnemora Svelte frontend. Feature modules (Todo, Journal, Sync, AI) run inside it. It has five parts:\n\n- **Boot and platform utilities.** Starts the app, detects the OS, and supplies shared helpers for keyboard, viewport, gestures, editing holds, unsaved-work guards and the settings draft.\n- **Theme.** Resolves the saved theme preference into a concrete theme and applies it to the root element. It also restyles the Android system bars and has tests that guard the design tokens.\n- **Router.** Builds the route table from Module manifests. It also handles Android Back, view transitions, query-string state and dynamic palette actions.\n- **Shell.** Decides which Modules are enabled and owns the sidebar, phone tabs, shortcuts, ⌘K palette and `mnemora://` deep links. It holds no domain logic.\n- **Home and Settings.** Pure logic behind the Home greeting, the Settings save/discard flow and the bug-report diagnostics.\n\nModules and the shell never import each other. They meet through the `ModuleManifest` contract defined in the Router.\n\n## Architecture\n\n```mermaid\ngraph TD\n    Main[\"main.ts boot()\"] --> App[\"App.svelte\"]\n    Main --> Boot[\"App Bootstrap and Platform Utilities\"]\n    Boot --> Shell\n    Boot --> Router\n    Manifests[\"Module manifests\"] --> Router\n    Router --> Shell\n    Settings[\"Saved settings\"] --> Shell\n    Shell -->|useAppearance| Theme\n    Theme -->|data-* attributes| Root[\"html root + tokens.css\"]\n    Theme -->|setSystemBars| Android[\"Android MainActivity\"]\n    Shell --> HomeSettings[\"Home and Settings\"]\n    HomeSettings -->|settingsSave| IPC[\"IPC bridge / Rust host\"]\n    Shell -->|device settings, app_take_links| IPC\n    Boot -->|editing hold| IPC\n```\n\n```mermaid\nsequenceDiagram\n    participant Main as main.ts\n    participant Shell\n    participant Theme\n    participant Router\n    participant Mod as Feature Module\n    Main->>Main: install mock (dev browser), error handlers\n    Main->>Shell: mount App\n    Shell->>Theme: useAppearance applies settings to html\n    Shell->>Router: createAppRouter(enabled manifests)\n    Router->>Mod: lazy-load the active route\n    Mod-->>Shell: cards, settings sections, palette actions, overlays\n```\n\n## Core component documentation\n\n| Sub-module | Covers | Docs |\n|---|---|---|\n| App Bootstrap and Platform Utilities | `main.ts` boot, `platform.ts`, viewport and keyboard singletons, bare-key, long-press, swipe, editing holds, leave guard, settings draft, time helpers | [App_Bootstrap_and_Platform_Utilities](Frontend_Platform_and_Shell/App_Bootstrap_and_Platform_Utilities.md) |\n| Theme | `resolveTheme`, `applyAppearance`, Android system bars, contrast and first-paint token tests | [Theme](Frontend_Platform_and_Shell/Theme.md) |\n| Router | `ModuleManifest` contract, `buildRoutes`, `createAppRouter`, view transitions, Android Back, `urlParam`, `dynamicActions` | [Router](Frontend_Platform_and_Shell/Router.md) |\n| Shell and Navigation | Module enablement, phone tabs, appearance hook, sidebar layout and persistence, tree fold, shortcuts, palette, deep links | [Shell_and_Navigation](Frontend_Platform_and_Shell/Shell_and_Navigation.md) |\n| Home and Settings Modules | `homeName`, `buildDiagnostics`, `SaveState` | [Home_and_Settings_Modules](Frontend_Platform_and_Shell/Home_and_Settings_Modules.md) |\n\n## Related modules\n\n- IPC and dev mocks: IPC_Bridge_and_Browser_Mocks.\n- Design tokens and UI components: Design_System_and_UI_Components.\n- Rust command host: Tauri_Host_and_IPC_Bridge.\n- Native bridge: Android_Integration.", "IPC_Bridge_and_Browser_Mocks/IPC_Bridge_and_Core_Mocks.md": "# IPC Bridge and Core Mocks\n\nThis module is the frontend's only door to the Rust backend, plus the browser-only stand-in for that backend. It has two halves:\n\n1. **The real IPC bridge** (`bindings.ts`, `errors.ts`, `event-bridge.ts`). It holds the typed Tauri command and event surface, global UI error reporting, and the translation of backend events into TanStack Query cache invalidations.\n2. **The core browser mock** (`mock.ts` and its tests). It replaces the Rust side with `mockIPC` so the whole UI can run at `http://localhost:47821` without Tauri. It is loaded only in dev builds (`import.meta.env.DEV`) and never reaches a production build.\n\nThe mock's Todo, Sync and other domain parts live in sibling pages: [IPC Todo Mocks](IPC_Todo_Mocks.md) and [IPC Sync Mocks](IPC_Sync_Mocks.md). This page covers the bridge, the settings and device layer of the mock, the AI and Journal mocks and their tests, and how the mock dispatches to all of them.\n\n## Components\n\n| File | Role |\n|---|---|\n| `src/lib/ipc/bindings.ts` | Generated by Tauri Specta. Exports `commands`, `events` and all payload types. Contains the runtime helpers `typedError` and `makeEvent`. |\n| `src/lib/ipc/errors.ts` | `installGlobalErrorHandlers`, `recentUiErrors`. Forwards UI errors to the Rust log. |\n| `src/lib/ipc/event-bridge.ts` | `startEventBridge`: Rust events become query invalidations. |\n| `src/lib/ipc/mock.ts` | `installMock`, plus the setting validators `oneOf`, `bool`, `text`, `list`. |\n| `*.test.ts` | Tests for the bridge, the AI mock, and the Journal mock (rules, remote edits, search). |\n\n## Architecture\n\n```mermaid\ngraph TD\n    UI[Svelte screens and Module queries] -->|commands.x| B[bindings.ts]\n    B -->|invoke| T{Tauri runtime}\n    T -->|real build| R[Rust commands in src-tauri]\n    T -->|dev browser: mockIPC| M[mock.ts installMock]\n    R -->|emit| EV[events.xChangedEvent]\n    M -->|emit| EV\n    EV --> EB[event-bridge.ts]\n    EB -->|invalidateQueries| QC[(TanStack QueryClient)]\n    QC --> UI\n    UI -.unhandled errors.-> ER[errors.ts]\n    ER -->|logUiError| B\n    M --> AI[mock-ai]\n    M --> J[mock-journal]\n    M --> TD[mock-todo]\n    M --> S[mock-sync*]\n```\n\nThe same `bindings.ts` is used in both worlds. The mock does not replace the module. It replaces the Tauri transport underneath it with `mockIPC(handler, { shouldMockEvents: true })`. The screens therefore cannot tell the difference.\n\n## bindings.ts (generated)\n\nThe file is produced by Tauri Specta (`make bindings`) and must not be edited by hand. It has three parts.\n\n- **`commands`**: one function per Rust command, grouped by area:\n  - Settings and Device: `settingsGetAll`, `settingsSave`, `deviceGet`, `deviceSet*`, `appInfo`, `backupNow`\n  - Editing holds: `editingHold`, `editingRelease`\n  - Journal: `journalEntry*`, `journalPages`, `journalSearch`, `journalToday`\n  - Todo: `todo*`\n  - AI: `ai*`\n  - Sync: `sync*`\n- **`events`**: typed event handles (`settingsChangedEvent`, `todoChangedEvent`, `journalChangedEvent`, `aiChangedEvent`, `aiRunEvent`, `sync*Event`, `todoListsMergedEvent`, `todoTaskDeletedEvent`, `journalEntryDeletedEvent`, `linkOpenedEvent`).\n- **Types**: the wire shapes (`AppError`, `Task`, `Entry`, `ConversationView`, `PairingView`, and so on), with the Rust doc comments carried over.\n\n### `typedError`\n\nCommands that return `Result<_, AppError>` on the Rust side are wrapped in `typedError`. It turns a rejected invoke into `{ status: \"error\", error }` and a resolved one into `{ status: \"ok\", data }`. A real `Error` instance (a crash, not an `AppError`) is rethrown. Commands without a `Result` (such as `deviceGet`, `appInfo`, `aiRunAbort`, `syncNow`) return the plain value and reject on failure.\n\n```mermaid\nsequenceDiagram\n    participant S as Screen\n    participant C as commands.settingsSave\n    participant TE as typedError\n    participant I as invoke / mockIPC\n    S->>C: settingsSave(changes)\n    C->>TE: wrap(invoke(\"settings_save\"))\n    TE->>I: await\n    alt resolves\n        I-->>TE: null\n        TE-->>S: {status:\"ok\", data:null}\n    else rejects with AppError object\n        I-->>TE: {code,message,details}\n        TE-->>S: {status:\"error\", error}\n    else rejects with Error\n        I-->>TE: Error\n        TE-->>S: throws\n    end\n```\n\nThis is why the mock **throws plain `AppError` objects** (`{code, message, details}`) and not `Error` instances: `typedError` only turns non-`Error` rejections into typed results. `AppError.code` is one of `validation | unknown_key | not_found | io | database | internal`.\n\n### `makeEvent`\n\n`makeEvent<T>(name)` builds an event handle with `listen`, `once` and `emit`. Calling the handle with a `Webview` or `Window` gives the same API scoped to that target. Events with a `null` payload have an `emit()` that takes no argument. This is what the mocks use to simulate backend pushes, for example `events.todoChangedEvent.emit()`.\n\n## errors.ts\n\n- `installGlobalErrorHandlers()` listens to `window` `error` and `unhandledrejection`.\n- Each error goes to an internal `report`, which keeps the last 5 in memory and calls `commands.logUiError(message, stack)`. The Rust side writes it to the log file. The call's own failure is swallowed so reporting cannot raise another unhandled error.\n- `recentUiErrors()` returns a copy of the kept errors for \"Copy diagnostics\" (see [Home and Settings Modules](../Frontend_Platform_and_Shell/Home_and_Settings_Modules.md)).\n\n## event-bridge.ts\n\n`startEventBridge(client)` is the one place where Rust events turn into cache invalidations. It returns an unlisten function.\n\n| Event | Effect |\n|---|---|\n| `settingsChangedEvent` | `invalidateQueries()` on everything. A Preference can change any view. Only on-screen queries refetch now. |\n| `todoChangedEvent` (widget wrote) | invalidate `['todo']` |\n| `journalChangedEvent` (Sync changed data) | invalidate `['journal']` |\n| `aiChangedEvent` (Sync changed data) | invalidate `['ai']` |\n| `document` `visibilitychange` (becoming visible) | invalidate `['todo']`. The widget can write while the app is stopped, and then no event arrives. |\n\nListeners are registered one after another. If a later registration throws, the earlier ones are removed before the error is rethrown, so nothing leaks. `event-bridge.test.ts` checks exactly this. It mocks `./bindings` with an event factory whose `listen` can be made to fail, and a fake `document` that can be hidden and shown. `setup()` builds a `QueryClient` with active Todo and Journal queries and records which refetch. `setHidden()` toggles the fake document.\n\nOther events are consumed elsewhere. Sync events feed the Sync queries ([Sync Activity, Conflicts and Status](../Sync_Frontend/Sync_Activity_Conflicts_and_Status.md)). `todoListsMergedEvent` and `todoTaskDeletedEvent` are handled in [Todo Tasks and Data](../Todo_Frontend/Todo_Tasks_and_Data.md). `journalEntryDeletedEvent` is handled in [Journal Composer and Entry Editing](../Journal_Frontend/Journal_Composer_and_Entry_Editing.md).\n\n## mock.ts: the browser backend\n\n`installMock()` builds the in-memory world and installs `mockIPC`.\n\n### Settings\n\n`DEFS` maps each key to a default and a validator. The validators `oneOf`, `bool`, `text(max)` and `list(max)` mirror `crates/core/src/module.rs`. Todo's allowed values come from `PREF_VALUES` in the Todo mock.\n\n- `settings_get_all` returns a JSON copy of `values` and the schema. The copy is deliberate: real IPC serialises, and handing out the live object would hide later saves from the query cache.\n- `settings_save` validates the whole batch first. An unknown key gives `unknown_key` and an invalid value gives `validation`. Only then does it apply the batch.\n  - Saving `core.phone_tabs` also sets `core.phone_tabs_edited`.\n  - Keys in `LOOK_KEYS` (theme, density, text size, reduce motion, phone tabs) are also written into `device.look`. Rust keeps them in `device.toml`, not in the database.\n  - It emits one `settingsChangedEvent` per module, with keys stripped of the module prefix.\n\n### Device and app commands\n\n- `device_get`\n- `device_set_sidebar`: the width is clamped to 200–360.\n- `device_set_todo_open`\n- `device_set_log_level`: validated against `error|warn|info|debug|trace`.\n- `device_set_spellcheck`\n- `app_info`: sandbox environment, fake paths, `os_first_name: \"Alex\"`.\n- `app_take_links`\n- `log_ui_error`: written to `console.warn`.\n- `backup_now`\n- `open_log_dir`\n\n`applyPrePaintAttributes` reproduces what Rust's window-init script sets before first paint: `data-theme`, `data-theme-pref`, `data-density`, `data-text-size`, `data-reduce-motion` and `data-env`. See [Theme](../Frontend_Platform_and_Shell/Theme.md).\n\n### Command dispatch\n\n```mermaid\nflowchart TD\n    cmd[IPC cmd] --> sw{settings / device / app?}\n    sw -->|yes| local[handled in mock.ts]\n    sw -->|no| a{activity.handles}\n    a -->|yes| ACT[activity mock]\n    a -->|no| c{conflicts.handles}\n    c -->|yes| CON[conflicts mock]\n    c -->|no| s{sync.handles}\n    s -->|yes| SY[sync mock]\n    s -->|no| t{todo.handles or handlesEditing}\n    t -->|yes| TO[todo mock]\n    t -->|no| ai{ai.handles}\n    ai -->|yes| AIM[ai mock]\n    ai -->|no| j[journal.handles ? journal.handle : undefined]\n```\n\n`editing_hold` and `editing_release` are shared. `todo.handlesEditing(cmd, args)` claims them for Todo entities, and the Journal mock handles the rest (the entity `journal_entry`).\n\n### Wiring of the simulated second device\n\n`installMock` also wires the Sync simulation. Details are in [IPC Sync Mocks](IPC_Sync_Mocks.md); the points that touch this module are:\n\n- Mock `onRemoteChange` hooks emit `todoChangedEvent` and `journalChangedEvent`, as the Rust side does after a sync.\n- `onHeldClash` hooks (Todo and Journal) raise a Conflict and log an Activity line. This mirrors a change that waited while an editor was open and then clashed with what was typed (Rust `held.rs`, `texts.rs`).\n- `createPixelMock` receives Todo, Journal and a Preferences adapter. A Preference takes part in sync once it differs from its default, or did before (`touchedPrefs`). Look-and-feel keys never sync.\n- Dev-console hooks installed on `window`: `__journalMock`, `__journalRemoteMock`, `__listMergeMock`, `__syncMock`, `__pixel`.\n\n### URL switches\n\n| Switch | Effect |\n|---|---|\n| `?sync=on` | Sync on, nobody paired |\n| `?paired=N` | Sync on with N paired devices |\n| `&paused=update\\|me\\|both\\|clock\\|clock_me` | Pixel 8 starts paused for that reason |\n| `&activity=N` | N Activity lines (default 4000) |\n| `&paircode=SECONDS` | shorter pairing-code life |\n| `&localnet=blocked[-phone]` | simulate the Local Network permission being refused |\n| `?seed=journal` | seed Journal data |\n| `?fail=journal_update` / `journal_pages` | make that Journal command fail |\n\nThe header comment of `mock.ts` lists every Sync scenario of `docs/design/sync-prototype.html` and the URL that reaches it.\n\n## The AI and Journal mocks and their tests\n\n`mock-ai.ts` and `mock-journal.ts` are not in the provided source, so this section describes only what their tests show.\n\n### AI mock (`mock-ai.test.ts`)\n\n`createAiMock({ emit })` returns `{ handle, handles }`. It streams `AiRunEvent`s in the order the Rust Run does: `runStarted`, `entrySaved(user)`, `stepStarted`, `textDelta`…, `entrySaved(assistant)`, `runEnded`. The tests cover:\n\n- **Trigger words.** A question containing \"fail\", \"offline\", \"timeout\" and similar ends with that failure. Words such as \"walk\", \"overdue\" and \"week\" make the answer cite sources. \"Twelve steps\" hits the step budget note, and \"repeat\" produces a repeated-call refusal.\n- **Run control.** Abort (words so far kept, marked `aborted`), steering notes, unqueueing, and Send now.\n- **Branches.** Try again, Edit (`branch_of`), the pager (`ai_conversation_show_branch`), Branch from earlier (`ai_conversation_set_leaf`), with the same refusals as Rust.\n- **Provider kinds.** `wrapper`, `openai_compatible`, `anthropic` and `openrouter`, with key states (`not_needed`, `saved`, `missing`) that never expose the key, paid-model gating, and the key being dropped when an address changes.\n- **History.** 34 demo Conversations (30 per page plus 4), 3 Saved questions, and delete/restore.\n\n**Shared fixtures.** Pure helpers (`titleOf`, `addressProblem`, `failureSentence`, `validateTitle`, `titleMatches`, `markdownOf`) run against `fixtures/ai-*.json`. The Rust tests (`ai_provider_tests.rs`, `ai_conversations_tests.rs`) read the same files, so the mock cannot drift from the backend. The helpers in the test file are `request()` (builds a `RunRequest`) and `caught()` (returns what a handler threw).\n\n### Journal mock (`mock-journal*.test.ts`)\n\n- `mock-journal.test.ts` runs `fixtures/journal-rules.json`. It seeds Entries, calls the matching `journal_*` command, normalises the result (`run`) and compares it with the expectation. `src-tauri/src/journal.rs` runs the same file (ADR 0009).\n- `mock-journal-remote.test.ts` covers `simulateRemoteEdit`. The edit applies at once, unless an `editing_hold` is active. Then it waits, and on `editing_release` it is merged three-way with what was typed. Different lines are both kept. A clash keeps the typed text and calls `onHeldClash` with `base`, `showing` and `other`.\n- `mock-journal-search.test.ts` covers `searchEntries` and `plainText`: case and accent folding, prefix matches, phrases, a typo-tolerant `similar` group, range-only listing, and snippets as plain text.\n\n## Keeping the mock honest\n\n```mermaid\ngraph LR\n    F[fixtures/*.json] --> RT[Rust tests in src-tauri]\n    F --> VT[Vitest mock tests]\n    RT --> R[Rust backend]\n    VT --> M[Browser mock]\n```\n\nThree mechanisms keep the mock from drifting:\n\n- Shared JSON fixtures that both Rust and Vitest run.\n- Validators and defaults that copy Rust's, with comments pointing at the Rust file.\n- Using the generated `bindings.ts` types in the mocks, so a changed command shape fails type checking.\n\nWhen you add a command:\n\n1. Run `make bindings`.\n2. Handle the command in the right mock. An unhandled command returns `undefined` from `mockIPC`.\n3. Add a shared fixture case if it encodes a rule.\n\n## Related modules\n\n- [IPC Todo Mocks](IPC_Todo_Mocks.md)\n- [IPC Sync Mocks](IPC_Sync_Mocks.md)\n- [Tauri Host and IPC Bridge](../Tauri_Host_and_Command_Layer/Tauri_Host_and_IPC_Bridge.md): the Rust side of the commands and events.\n- [Frontend Platform and Shell](../Frontend_Platform_and_Shell.md)\n", "IPC_Bridge_and_Browser_Mocks/IPC_Sync_Mocks.md": "# IPC_Sync_Mocks\n\nThe browser-side simulation of the Sync module. When Mnemora runs in a plain browser (`make dev` in a browser, tests, prototypes), there is no Rust backend. The IPC layer then routes `sync_*` commands to TypeScript mocks that behave like the Rust commands in `src-tauri/src/sync*.rs` and `crates/sync`. This lets the Sync pages (Devices, Activity, Conflicts, Pairing) be built and judged without real devices.\n\nThe module lives in `src/lib/ipc/`. Its core files are:\n\n| File | Role |\n|---|---|\n| `mock-sync-activity.ts` | Activity log mock: a seeded, long log, paged newest first, worded like Rust. |\n| `mock-sync-merge.ts` | TypeScript copy of Sync's merge rules: a pure fold over a log of records. |\n| `mock-sync-replica.ts` | One simulated device: a log, the edits a person makes, and syncing two devices. |\n| `mock-sync*.test.ts` | Tests for the device settings, pairing, devices sheet, live status, Local Network permission, merge fixture and the simulated Pixel 8. |\n\nThe mock factories used by the tests (`createSyncMock`, `createPixelMock`, `createConflictsMock`, `defaultPairingFlags`) are defined in sibling files that are not core components of this page. They are documented here only through how the tests use them.\n\nFor the bridge, the shared command and event plumbing and the other mocks, see [IPC Bridge and Core Mocks](IPC_Bridge_and_Core_Mocks.md) and [IPC Todo Mocks](IPC_Todo_Mocks.md). The real implementations that these mocks mirror are in [Sync Replication Engine](../Sync_Replication_Engine.md), [Sync Conflicts and Resolutions](../Sync_Replication_Engine/Sync_Conflicts_and_Resolutions.md), [Sync Activity and Devices](../Sync_Replication_Engine/Sync_Activity_and_Devices.md) and [Sync Pairing](../Sync_Replication_Engine/Sync_Pairing.md). The commands are exposed by [Sync Connectivity and Pairing](../Tauri_Host_and_Command_Layer/Sync_Connectivity_and_Pairing.md) and [Sync Conflicts and Activity](../Tauri_Host_and_Command_Layer/Sync_Conflicts_and_Activity.md). The UI that consumes them is the [Sync Frontend](../Sync_Frontend.md).\n\n## Why mocks, and how they stay honest\n\nPer ADR 0009, every rule that exists on both sides has a shared fixture, and both implementations run it:\n\n- `fixtures/sync-rules.json` (device-name, unique-name, code-normalisation cases). It is run by `mock-sync.test.ts` and `mock-sync-pairing.test.ts` in TypeScript and by the Rust tests in `src-tauri/src/sync.rs`.\n- `fixtures/sync-merge-rules.json` (merge cases). It is run by `mock-sync-merge.test.ts` through this copy and by `src-tauri/src/sync_merge_fixture_tests.rs` through two real devices. See [Backend Integration Test Suites](../Backend_Integration_Test_Suites.md) and [Sync Replication Engine](../Sync_Replication_Engine/Sync_Replication_Engine_Sync_Replication_Engine.md).\n\nIf a rule changes in Rust, a fixture case fails on the TypeScript side until the copy follows.\n\n```mermaid\ngraph LR\n    UI[Sync Frontend] -->|invoke sync_*| Bridge[IPC bridge]\n    Bridge -->|Tauri| Rust[Rust commands]\n    Bridge -->|browser| SM[createSyncMock]\n    SM --> ACT[mock-sync-activity]\n    SM --> PIX[Pixel 8 mock]\n    PIX --> REP[mock-sync-replica]\n    REP --> MRG[mock-sync-merge]\n    PIX --> ACT\n    PIX --> CON[Conflicts mock]\n    FIX[(fixtures/*.json)] -.guards.-> SM\n    FIX -.guards.-> MRG\n    FIX -.guards.-> Rust\n```\n\n## Merge model (`mock-sync-merge.ts`)\n\nA device's data is its **log of records** (the counterpart of Rust's `change_log`). The state is a pure function of the union of two logs, so both devices always agree.\n\n### Records and schema\n\n- `Rec` is one change of one record: `entity`, `id`, a `stamp` (`ms`, `counter`, `device`), a per-device `seq`, the author's `fields`, and `prev` (what those fields held on the author's device before). A delete also carries `seen`, the highest `seq` of each other device's records that the author held.\n- `SCHEMA` mirrors the entities in `crates/todo`, `crates/journal` and `crates/core`. Each field is a class: `value`, `text` or `order`. The helpers `v(group)`, `t(group)` and `o` build these definitions. A `group` makes fields travel as one atomic unit (a Task's When, its state and closed time, title with understood words, a comment's body with its edited mark).\n- `LOOK_KEYS` lists the look-and-feel preferences that stay on each device and never sync.\n- Entities are `task`, `list`, `comment`, `entry` and `setting`.\n\n### `fold(log)`\n\n`fold` returns an `Outcome`. The steps are:\n\n1. Sort by stamp (`ms`, `counter`, `device`, `seq`) and group records by `entity/id`.\n2. For each unit of a document:\n   - **Value or Order unit**: taken whole from the newest record that touched it. If the newest author had not seen the previous value (its `prev` differs from what stood), and the value really changed, a `ValueClash` is recorded. `essence` decides what counts as a change: any non-null `deleted_at` is equal to another, and `closed_at` is ignored inside the `state` unit.\n   - **Text unit**: `foldText` replays records in clock order. A record whose author had not seen the text before it is merged three-way against `prev`. Companion members of the group (the `edited` mark) are combined too.\n3. Detect a **delete met by an edit** (`deleteEdits`): an edit from another device that is later by the clock, or above the deleter's `seen` mark.\n4. Split text clashes into live ones (`conflicts`, which wait for a person) and those on deleted records (`deletedConflicts`, resolved at once and only logged).\n5. Apply `rules`:\n   - Lists with the same normalised name merge into the older one (the lower id, as in Rust `list_sync::settle`). The loser is deleted and recorded in `mergedLists`. Names are normalised by `nameKey` (accents, case and spacing removed).\n   - A Task whose List is gone goes to the Inbox and is recorded in `inbox`. A Task moved into a merged List is re-keyed after the survivor's own Tasks with `keyAfter`.\n\n### Text merge\n\n`textMerge(base, ours, theirs)` returns `Piece[]`, each either `{ agreed }` or `{ clash }`. It works in two passes. The first compares lines (`linesOf`) with an LCS diff (`hunksOf`). Where both sides changed the same line, it recurses on word tokens (`tokensOf`: words, runs of spaces, single line breaks), and `settle` trims text the sides share at both ends of a clash. A clash shows `theirs`, the newer side, via `textOf`. The tokenisation mirrors `crates/sync/src/textmerge.rs`.\n\n## Replica (`mock-sync-replica.ts`)\n\n`Replica` is one simulated device: `device`, `log`, `seq`, `look` and a hybrid clock (`lastMs`, `lastCounter`).\n\n- `createReplica(device)` makes one. `syncReplicas(a, b)` gives both the union of their logs, deduplicated by `device/seq`.\n- `perform(replica, step, ids, now)` is one person's edit. It implements the fixture's ops: `list_*`, `task_*` (create, edit, priority, title, when, skip, done, move, delete, place), `comment_*`, `entry_*` and `pref`.\n  - A repeating Task being completed writes a done copy under the deterministic `occurrenceId`, so completing the same occurrence on two devices is one record.\n  - `task_place` uses `keyBetween` and `keyAfter` from `mock-todo-order` for manual order (compare [IPC Todo Mocks](IPC_Todo_Mocks.md)).\n- `append` writes only values that differ from what the device shows. A touched group is written complete, but `prev` holds only what the edit changed, which matches Rust's `change_log.prev`. A delete also records `seen`.\n- `capture(replica, docs, now)` turns changes made elsewhere in the mock app (the Todo and Journal mocks' `exportDocs`) into records.\n- `worldOf(replica, ids, defaults)` projects the folded data into the shape the fixture's `expect` uses (lists, tasks, arrange, order, comments, entries, settings, conflict count, resolved kinds). `byKey` is its ordering helper: by sort key, then id.\n- `resolvedKinds(outcome)` gives the sorted kinds of \"Resolved automatically\" lines: `value`, `delete_edit`, `task_inbox` and `conflict_deleted`.\n\n```mermaid\nsequenceDiagram\n    participant Test as Fixture case\n    participant A as Replica a\n    participant B as Replica b\n    participant F as fold()\n    Test->>A: perform(step)\n    Test->>B: perform(step)\n    Test->>A: syncReplicas(a, b)\n    A-->>B: union of logs\n    Test->>F: worldOf(a), worldOf(b)\n    F-->>Test: identical shared worlds, as expected\n```\n\n## Activity mock (`mock-sync-activity.ts`)\n\n`createActivityMock(count = 4000, now, isOpen)` handles only `sync_activity`. It mirrors `crates/sync/src/activity_view.rs`.\n\n- **Data**: `makeEvents` builds a long log from a fixed seed (`seeded`), so the same log appears every time. The size can be changed with `?activity=N`. Events are sessions, raised and resolved conflicts, list merges, pauses, resumes, failures and renames. The oldest event is the first pairing. Two sample open conflicts exist, `mock-conflict-notes` and `mock-conflict-entry`.\n- **Order**: `newestFirst` sorts by time, with ties broken by id descending, which is the Rust order.\n- **Paging**: the cursor is `at:id`. Pages are clamped to 1–200 rows, and `next` is set only if more rows match. An unreadable cursor throws a `validation` error.\n- **Filters**: `all`, `this_device` and `device` (by id). A device filter matches events where it is the device or the peer.\n- **Wording**: `describe(event, viewer, isOpen)` is the viewer's view of an event. When the viewer is the peer, session counts are flipped (in and out swap). `left` is worded plainly on the leaving device and by name elsewhere. A `Review` link (`'conflicts'`) is offered only while the conflict still waits, whatever the line said when written.\n- `breakdownOf` makes the \"Todo: 9 Tasks, 1 List · Journal: 2 Entries · Settings: 1\" breakdown, and its counts always add up to in plus out. `subjectWords` words the text a conflict is about. `lineNow` creates a line the mock writes now. `add(...)` lets other mocks append lines and ignores duplicate ids.\n\n## Test suites\n\n| Test file | What it pins down |\n|---|---|\n| `mock-sync.test.ts` (`fresh`) | Shared name rules, rename uniqueness within a group, Device settings defaults (off, automatic, no mobile data, visible), naming once on enable, options saved, leave forgets peers, `attentionOf` (mirrors `crates/sync/src/attention.rs`), the new-conflicts toast choice. |\n| `mock-sync-activity.test.ts` (`everything`, `mock`) | Paging without gaps or repeats, filters, session breakdown arithmetic, Review links only on open conflicts, `left` wording, the cursor error. |\n| `mock-sync-devices.test.ts` (`setup`) | Device sheet detail, Rename, the typed Address, Check results, Forget, Sync now for one device, the activity lines Forget, Rename and Leave write, and the mobile-data pause with pairing refused. |\n| `mock-sync-live.test.ts` (`setup`) | The simulated Pixel 8's status changes: progress during Sync now, console helper `setPeer`, paused reasons (update, clock). |\n| `mock-sync-local-network.test.ts` (`setup`) | The `flags.localNetwork` hook simulates a refused Local Network permission in devices, sheet and attention. It logs one Activity line per blocked episode (not again while it flickers, but again after about 10 minutes), and mobile data is the stronger reason. |\n| `mock-sync-merge.test.ts` (`run`, `shared`) | Runs every `sync-merge-rules.json` case on two replicas, checks that the devices agree once look-and-feel keys are removed, and checks `textMerge`. |\n| `mock-sync-pairing.test.ts` (`setup`) | Shared fixtures (`uniqueName`, `normaliseCode`), showing a code, typing one, pairing by address, merge preview and every failure kind. |\n| `mock-sync-pixel.test.ts` (`setup`) | End-to-end behaviour of the simulated Pixel 8 wired to the Todo, Journal, Conflicts and Activity mocks. |\n\n### Pairing flow in the mock\n\n```mermaid\nstateDiagram-v2\n    [*] --> idle\n    idle --> showing: sync_pair_show\n    showing --> asking: Pixel enters code\n    asking --> finishing: decide(allow)\n    asking --> idle: decide(deny)\n    finishing --> paired\n    showing --> failed: code expired or tries used\n    idle --> searching: sync_pair_enter / enter_at\n    searching --> waiting: right code\n    searching --> preview: both sides hold data\n    preview --> finishing: merge(true)\n    preview --> idle: merge(false)\n    waiting --> paired\n    searching --> failed: error kinds\n```\n\nThe magic codes in typed pairing (`00000000` nothing nearby, `20000000` expired, `30000000` declined, `50000000` version mismatch, `92000000` merge preview, and so on) and the `flags.pixel` values (`wrong`, `joins`, `merge`, `merge_cancel`, `never`) are what QA and the tests use to reach every state. The tries lockout stays until `sync_pair_cancel`. These states match the Rust pair protocol in [Sync Pairing](../Sync_Replication_Engine/Sync_Pairing.md).\n\n### The simulated Pixel 8\n\n`createPixelMock` (from `mock-sync-pixel`) owns a `Replica` and syncs it against the mock apps' data. Its `sync()` captures local changes, unions the logs, folds them, imports the result into the Todo, Journal and settings mocks, writes Activity lines, and announces events (`todoChanged`, `journalChanged`, `listsMerged`, `taskDeleted`, `entryDeleted`, `activityChanged`, `settingsChanged`, `newConflicts`). The `scenario` helper stages conflicts, resolved-automatically cases, list merges and remote edits or deletes. Conflicts raised by a sync go through the Conflicts mock. Resolving one with \"keep other\" writes the chosen text back. A conflict whose record is deleted afterwards is closed without asking and logged once.\n\n## Extending\n\n1. Change the rule in Rust and add a case to the matching fixture in `fixtures/`.\n2. Update `SCHEMA`, `fold` or `perform` here until `mock-sync-merge.test.ts` passes.\n3. If wording changes, update `describe` in `mock-sync-activity.ts` and `activity_view.rs` together.\n", "IPC_Bridge_and_Browser_Mocks/IPC_Todo_Mocks.md": "# IPC Todo Mocks\n\n`IPC_Todo_Mocks` is the in-memory, browser-only stand-in for the Rust `crates/todo` backend. When the frontend runs without Tauri (for example under `pnpm dev` in a browser or in Vitest), the IPC layer routes every `todo_*` command to `createTodoMock()` in `src/lib/ipc/mock-todo.ts`. The mock re-implements the Todo rules (validation, ordering, grouping, repeats, change-log history, comments, search, sync hooks) so the UI behaves as it would against the real backend.\n\nThe mock is kept honest by **shared rule fixtures** (`fixtures/todo-rules.json`, `todo-order-rules.json`, `parse-cases.json`, `todo-search-rules.json`). The same JSON runs against the Rust commands (`src-tauri/src/todo.rs`, `todo_capture_tests.rs`, `todo_search_tests.rs`, `todo_order_tests.rs`) and against the mock (see ADR 0009), so the two cannot drift.\n\n## Where it fits\n\n```mermaid\ngraph LR\n    UI[Todo Frontend<br/>queries.ts, actions] -->|invoke todo_*| Bridge[IPC bridge<br/>mock.ts]\n    Bridge -->|Tauri present| Rust[Tauri commands<br/>Todo_Domain_Service]\n    Bridge -->|browser only| Mock[createTodoMock<br/>mock-todo.ts]\n    Mock --> Arrange[mock-todo-arrange]\n    Mock --> Order[mock-todo-order]\n    Mock --> Hist[mock-todo-history]\n    Mock --> Parse[mock-todo-parse]\n    Mock --> Search[mock-todo-search]\n    Mock --> Occ[mock-occurrence]\n    Mock --> When[ui/when-repeat, ui/calendar]\n    Mock <-->|exportDocs / importDocs| SyncMock[mock-sync-merge<br/>mock-sync-replica]\n    Fix[(shared JSON fixtures)] -.verifies.-> Mock\n    Fix -.verifies.-> Rust\n```\n\n- The bridge and general mock plumbing live in [IPC Bridge and Core Mocks](IPC_Bridge_and_Core_Mocks.md); the sync-side mock that consumes `exportDocs`/`importDocs` is in [IPC Sync Mocks](IPC_Sync_Mocks.md).\n- The real behaviour being mirrored is documented in [Todo Tasks and Lists](../Domain_Modules_(Todo_and_Journal)/Todo_Tasks_and_Lists.md), [Todo Comments](../Domain_Modules_(Todo_and_Journal)/Todo_Comments.md) and [Todo Domain Service](../Tauri_Host_and_Command_Layer/Todo_Domain_Service.md).\n- Consumers are described in [Todo Frontend](../Todo_Frontend.md). Repeat/calendar helpers come from [UI When Picker](../Design_System_and_UI_Components/UI_When_Picker.md).\n\n## Core components\n\n| Component | File | Role |\n|---|---|---|\n| `createTodoMock(prefs)` | `mock-todo.ts` | Factory returning the mock: `handle(cmd, args)`, `handles`, `handlesEditing`, `ops`, `simulateMerge`, `exportDocs`, `importDocs`, plus `onRemoteChange` / `onHeldClash` callbacks |\n| `byDateThenDay` | `mock-todo.ts` | Comparator: due date, then `inDay` (timed tasks first by time, then Priority, then manual key) |\n| `byListKey` | `mock-todo.ts` | Comparator for Lists by `sort_key`, tie-broken by id (byte order, like SQLite's default collation) |\n| `run` | `mock-todo.test.ts` | Executes one fixture case step by step and returns observable state; mirrors `run_rule_case` in Rust |\n| `task`, `titles` | `mock-todo-arrange.test.ts` | Task builder and title projection for grouping/sorting tests |\n| `Case`, `brief` | `mock-todo-parse.test.ts` | Fixture shape and span summariser for the natural-language parser |\n| `build`, `titles` | `mock-todo-search.test.ts` | Seeds a mock from fixture tasks and returns a search function |\n\nExported validators mirror Rust: `validateTitle`, `validateBody`, `validateListName`, `validateEmoji`, `foldName` (case/accent folding plus `đ ø ł ı`, as `fold_char` in core), `epochDay`, `isTime`, `resolveWhen`, `resetChecklist`.\n\n## Architecture of the mock\n\nState is closure-local: arrays of `Stored` tasks, lists and comments (soft deletes use `deleted` / `deleted_at`), a per-task change log `logs: Map<taskId, LogRecord[]>`, a list of recorded `ops`, and the editing-hold maps `held` and `waiting`. Every return value is passed through `copy()` (JSON clone) and `wire()` strips mock-only flags and adds `comment_count`, so the UI cannot mutate the \"database\" (a test asserts this).\n\n```mermaid\nflowchart TD\n    A[handle cmd, args] --> B{cmd}\n    B -->|todo_task_*| T[Task commands]\n    B -->|todo_list_*| L[List commands]\n    B -->|todo_comment*| C[Comment commands]\n    B -->|view commands| V[todo_inbox / today / upcoming / all / list / lists / counts / done / day_counts]\n    B -->|todo_parse / todo_search| P[parse / search helpers]\n    B -->|editing_hold / release| H[hold + three-way merge]\n    T --> R[record: change-log entry]\n    L --> R\n    R --> Hist[todo_task_history via historyOf]\n    V --> G[groupTasks + compareTasks + readPrefs]\n```\n\n### Command groups\n\n- **Tasks**: create (with `NewWhen`, `NewTaskDetails`: notes ≤ 100,000 chars, priority 1–4, repeat, understood words ≤ 4000 chars JSON array), complete, reopen, skip, won't-do, move, set priority, set when, update (session-scoped), delete/restore, quick edit and its undo, reorder, move overdue and its restore.\n- **Lists**: create, rename (fold-unique names), emoji, sort, group, reorder, delete with a `DeleteChoice` (`delete_tasks`, `move_to_inbox`, `move_to_list`) and restore from the returned `ListDeletion`.\n- **Comments**: add, edit (sets `edited` only when the body changes), delete, restore, list oldest first (≤ 5000 chars).\n- **Views**: Inbox, Today (Overdue group + today's groups + tasks done in the device day), Upcoming, All, a single List (with the `done_in_lists` modes), sidebar counts, badge/Home counts (`todo_counts`, card limited to five), paged Done by day, and day counts for the When picker.\n- **Parse/Search**: delegated to `parseText` and `searchTasks`.\n\n### Rules worth knowing\n\n- **When resolution** (`resolveWhen`, `settleWhen`): a past date is refused; a time without a date means today if still ahead, otherwise tomorrow; a Repeat without a date lands on `firstMatch`; no date means no time and no Repeat. `assignWhen` re-anchors month/year repeats on a new date unless `keepDay`.\n- **Repeating tasks**: completing creates a done occurrence copy with a deterministic `occurrenceId(task.id, due)`, moves comments to it, unticks the Checklist (`resetChecklist`) and advances the due date. Reopening an occurrence rewinds the parent, but only for the latest occurrence while the parent is open. Skip is a `tick` flagged `skipped` so History can tell it apart.\n- **Ordering**: `keyAfter` / `placeKey` produce sort keys; `keysAround` considers deleted rows too, as Rust does.\n- **Quick edit undo** (`todo_task_quick_edit_undo`) skips the past-date check and keeps the Repeat's day.\n\n```mermaid\nsequenceDiagram\n    participant UI\n    participant M as mock.handle\n    participant S as state\n    UI->>M: todo_task_complete(id, local)\n    M->>S: find task, check open\n    alt has Repeat\n        M->>S: push occurrence (done, repeat_of=task)\n        M->>S: move comments, reset checklist, advance due date\n        M->>S: record(occurrence,'create'), record(task,'tick')\n        M-->>UI: Completion{task, occurrence}\n    else plain task\n        M->>S: state=done, closed_at=now, record 'tick'\n        M-->>UI: Completion{task, occurrence:null}\n    end\n```\n\n## Sync and editing seams (browser-only)\n\nThese are not commands; they let the mock sync/devtools simulate a second device.\n\n- `exportDocs()` / `importDocs(docs)` expose every List, Task and Comment (deleted ones too) as `Doc`s for the merge in `mock-sync-merge.ts`. Imports write only differing fields, create unknown rows and log `create`/`update`/`delete`. Repeat fields and `understood` are included so a sync keeps Repeat.\n- `simulateMerge(name, device)` mimics Sync merging same-named Lists: a survivor List takes the loser's Tasks and a `TodoListsMergedEvent` is returned.\n- **Editing hold** (`editing_hold` / `editing_release`, routed when `handlesEditing` sees entity `todo_task`): while a field (`title` or `notes`) is held, remote values for it wait in `waiting` and other fields refresh immediately. On release, if the typed text is unchanged the waiting text is applied; otherwise `textMerge` performs the three-way merge. `onRemoteChange` fires if the merged text differs; `onHeldClash` fires when the merge contains a real clash (the typing shows and the other text becomes a Conflict). See [IPC Sync Mocks](IPC_Sync_Mocks.md).\n\n## Tests\n\n```mermaid\ngraph TD\n    F1[todo-rules.json + todo-order-rules.json] --> RunFn[run in mock-todo.test.ts]\n    F2[parse-cases.json] --> ParseT[mock-todo-parse.test.ts]\n    F3[todo-search-rules.json] --> SearchT[mock-todo-search.test.ts]\n    RunFn --> Mock[createTodoMock]\n    ParseT --> PT[parseText]\n    SearchT --> Mock\n    Arr[mock-todo-arrange.test.ts] --> AR[compareTasks / groupTasks / sortLists / readPrefs]\n```\n\n- `mock-todo.test.ts`: `run(c)` plays a case's steps (create, complete, reorder, list ops, comments, prefs…), records `ok` or the error code per step, then snapshots views (today, upcoming, inbox, all, per-list), History, comments, counts and Done. A case's `expect` keys select which parts to compare. Additional tests cover Done paging by device day (fake timers), day-count exclusion, badge counts, copy-on-return, name folding, taken-name messages, capture/quick edit, simulated list merge, sync docs and the editing hold.\n- `mock-todo-arrange.test.ts`: due buckets (`overdue`, `today`, `tomorrow`, `week`, `later`, `no_date`), sort orders, grouping, list sorts, preference defaults (`readPrefs`, `PREF_VALUES`) and the four `done_in_lists` modes.\n- `mock-todo-parse.test.ts`: shared parse fixtures; spans are reported in UTF-16 units, kept in order, and repeated words get numbered keys.\n- `mock-todo-search.test.ts`: exact vs similar hits, marked title words, windowed snippets, and hostile queries never throwing.\n\n## Maintenance notes\n\n- When a Rust Todo rule changes, update the shared fixture first, then fix both the Rust command and the mock; keep `run` in step with `run_rule_case`.\n- `prefs` is a callback taking the full settings key (e.g. `todo.group_today`), mirroring how Rust reads the `settings` table; unknown values fall back to defaults.\n- Keep `wire()`/`copy()` on every return path to preserve real-IPC semantics.\n", "IPC_Bridge_and_Browser_Mocks.md": "# IPC Bridge and Browser Mocks\n\n## Purpose\n\n`src/lib/ipc` is the frontend's only door to the Rust backend. It has two halves:\n\n1. **The real IPC bridge.** `bindings.ts` is generated by Tauri Specta and holds the typed commands, events and payload types. `errors.ts` forwards unhandled UI errors to the Rust log. `event-bridge.ts` turns backend events into TanStack Query cache invalidations.\n2. **Browser mocks.** `mock.ts` and the `mock-*` files replace the Rust side by installing `mockIPC` underneath the same `bindings.ts`. The whole UI can then run in a plain browser, in Vitest and in prototypes, with no Tauri. The mocks are loaded only in dev builds (`import.meta.env.DEV`).\n\nThe mocks stay close to the real backend in three ways. Shared JSON fixtures in `fixtures/*.json` run against both the Rust tests and the Vitest tests (ADR 0009). Validators and defaults copy the Rust ones. The mocks use the generated types, so a changed command shape fails type checking.\n\n## Architecture\n\n```mermaid\ngraph TD\n    UI[Svelte screens and Module queries] -->|commands.x| B[bindings.ts]\n    B -->|invoke| T{Tauri runtime}\n    T -->|real build| R[Rust commands in src-tauri]\n    T -->|dev browser: mockIPC| M[mock.ts installMock]\n    R -->|emit| EV[typed events]\n    M -->|emit| EV\n    EV --> EB[event-bridge.ts]\n    EB -->|invalidateQueries| QC[(TanStack QueryClient)]\n    QC --> UI\n    UI -.unhandled errors.-> ER[errors.ts]\n    ER -->|logUiError| B\n    M --> AI[mock-ai]\n    M --> J[mock-journal]\n    M --> TD[mock-todo]\n    M --> S[mock-sync, activity, conflicts, pixel]\n```\n\n`mock.ts` handles settings, device and app commands itself. It passes every other command to the first mock that claims it through `handles`: activity, conflicts, sync, todo, ai, then journal. `editing_hold` and `editing_release` are shared between the Todo and Journal mocks.\n\n```mermaid\ngraph LR\n    F[(fixtures/*.json)] --> RT[Rust tests in src-tauri]\n    F --> VT[Vitest mock tests]\n    RT --> R[Rust backend]\n    VT --> M[Browser mocks]\n    SM[Sync mock] --> PX[Simulated Pixel 8 Replica]\n    PX --> MG[mock-sync-merge fold]\n    PX <-->|exportDocs / importDocs| TM[Todo and Journal mocks]\n```\n\nThe Sync mock simulates a second device, the Pixel 8. That device keeps a log of records and merges it with the app's Todo and Journal data. Conflicts, Activity lines and sync events come out of that merge, as they would from the real sync engine.\n\n## Sub-modules and core components\n\n| Sub-module | Scope | Key components |\n|---|---|---|\n| [IPC Bridge and Core Mocks](IPC_Bridge_and_Browser_Mocks/IPC_Bridge_and_Core_Mocks.md) | The generated bindings, `typedError`, `makeEvent`, global error reporting, the event-to-query bridge, `installMock`, the Settings and Device mock, the command dispatcher, and the AI and Journal mocks with their tests. | `bindings.ts`, `errors.ts`, `event-bridge.ts`, `mock.ts` |\n| [IPC Todo Mocks](IPC_Bridge_and_Browser_Mocks/IPC_Todo_Mocks.md) | An in-memory copy of the Todo backend. It covers validation, ordering, grouping, repeats, History, Comments, search, and the editing hold with its three-way merge. | `createTodoMock`, `mock-todo-*`, `mock-occurrence` |\n| [IPC Sync Mocks](IPC_Bridge_and_Browser_Mocks/IPC_Sync_Mocks.md) | The browser simulation of Sync: the merge rules, a simulated device, the Activity log, pairing flows and the simulated Pixel 8. | `mock-sync-merge.ts`, `mock-sync-replica.ts`, `mock-sync-activity.ts` |\n\n## Typical workflow for a new command\n\n1. Add the Rust command and run `make bindings`.\n2. Handle the command in the matching mock. An unhandled command returns `undefined`.\n3. If the command encodes a rule that exists on both sides, add a shared fixture case that Rust and Vitest both run.\n\n## Related documentation\n\n- [Tauri Host and IPC Bridge](Tauri_Host_and_Command_Layer/Tauri_Host_and_IPC_Bridge.md): the Rust side of the commands and events.\n- [Frontend Platform and Shell](Frontend_Platform_and_Shell.md): the app bootstrap that installs the bridge and the mock.", "Journal_Frontend/Journal_Composer_and_Entry_Editing.md": "# Journal Composer and Entry Editing\n\nThis module is the writing side of the Journal frontend (`src/modules/journal/`). It covers three things:\n\n- **Creating entries**: the `Composer`, which turns typing into one created Entry and later autosaved updates.\n- **Editing existing entries**: `EntryEditing`, which runs one inline editing session per Entry. `Editing` is the shared state that says which Entry is open.\n- **Acting on entries**: delete with undo, move, copy, task ticking, remote-delete recovery, and the TanStack Query layer that talks to the backend.\n\nThe browsing side is in [Journal_Feed_and_Navigation](Journal_Feed_and_Navigation.md) and [Journal_Search](Journal_Search.md). The parent page is [Journal_Frontend](../Journal_Frontend.md). The Rust side is in [Journal_Module](../Domain_Modules_(Todo_and_Journal)/Journal_Module.md) and [Journal_Domain_Service](../Tauri_Host_and_Command_Layer/Journal_Domain_Service.md).\n\n## Architecture\n\n```mermaid\ngraph TD\n    UI[Svelte components: composer box, entry rows, ⋯ menu] --> Composer\n    UI --> EntryEditing\n    UI --> EntryActions[entry-actions.ts]\n    Editing[Editing context<br/>editing.svelte.ts] --- UI\n    EntryActions --> Editing\n    EntryActions --> Queries\n    Composer -->|deps: create/update/move/discard| Queries[queries.ts]\n    EntryEditing -->|deps: update, onSaved| Queries\n    EntryEditing -. SAVE_PAUSE_MS .-> Composer\n    RemoteDelete[entry-remote-delete.ts] --> Queries\n    Queries -->|unwrap commands.*| IPC[IPC bindings]\n    Queries --> Cache[(TanStack query cache)]\n    IPC --> Backend[journal_* Tauri commands]\n```\n\n`Composer` and `EntryEditing` do not call IPC directly. Both receive their dependencies (`create`, `update`, `setTimer`, `onError` and so on) through a constructor interface, so the unit tests drive them with fakes and a manual timer. The Svelte components wire them to `queries.ts`.\n\n## Composer (`composer.ts`)\n\nThe composer is a small state machine: `idle → creating → editing → finishing → idle`.\n\n```mermaid\nstateDiagram-v2\n    [*] --> idle\n    idle --> creating: first non-blank input\n    creating --> editing: create resolved\n    creating --> idle: create failed (text kept)\n    editing --> editing: input (debounced save, 600 ms)\n    editing --> finishing: finish()\n    finishing --> idle: saved or discarded, session reset\n    finishing --> editing: save or discard failed\n    finishing --> idle: create never succeeded (text kept)\n```\n\nBehaviour:\n\n- **A blank composer never creates anything.** The first visible character calls `deps.create(text, sessionId, pageDate)`. `pageDate` is the date chip's choice, and `null` means Today.\n- **Autosave.** Later typing restarts a `SAVE_PAUSE_MS` (600 ms) timer through `deps.setTimer`. When it fires, `deps.update(id, text, sessionId)` runs. `EntryEditing` imports the same constant, so both paths pause for the same time.\n- **Serialised saves.** Every job is chained onto a private promise queue (`#enqueue`), so create, move and update never overlap. Typing during `creating` is saved after the create resolves, because `#create` re-schedules when `text` changed.\n- **Session id.** One id is generated per composer session (`newSessionId`) and reset after each finish. The backend change log keeps one record per session, so a burst of autosaves reads as one edit (see [Sync_Conflicts_and_Resolutions](../Sync_Replication_Engine/Sync_Conflicts_and_Resolutions.md) for how sessions are merged).\n- **`finish()`** runs on blur or when leaving:\n  - It cancels the timer, flushes pending text and waits for the queue.\n  - It returns `false`, keeping the text, if any save failed, so nothing is lost.\n  - If the text is blank and an Entry was created, it calls `deps.discard(id)`. If the discard fails, the phase goes back to `editing`.\n  - On success it sets `lastFinishedId`, which the feed uses to play the arrival animation, and then resets.\n  - A second call while `finishing` is refused with `false`.\n- **Blank while focused.** The Entry is not discarded. Retyping reuses the same Entry, because `update` is skipped for blank text. The `cleared` getter exposes this state: an Entry exists and its text is blank.\n- **`setPageDate(date)`** stores the chip value. If an Entry already exists and `date` is not `null`, it queues `deps.move`. Choosing `null` only affects the next Entry. A failed move is reported and the text is kept.\n- **`unsaved`** is true for text that failed to store (a failed create, or edits left behind by a failed update). `saveNow()` retries immediately and is used by Retry, blur and leaving.\n\n## EntryEditing (`entry-editing.ts`)\n\n`EntryEditing<E>` is one editing session of an existing Entry. It is constructed with `(deps, id, initialText, sessionId)`.\n\n- `input(text)` restarts the debounce timer only if the text is `unsaved`. Typing back to the saved text cancels the pending save.\n- `unsaved` means the text is non-blank and differs from the last saved text.\n- **Blank text is never saved.** `blankKept` flags blank text over a stored Entry. Clearing everything and leaving keeps the previous text, because clearing never deletes an Entry here. Deletion is an explicit action.\n- `flush()` saves now and resolves `true` when nothing unsaved remains. After a failure it returns `false`, and calling it again is a retry. The next edit also retries.\n- Each success calls `deps.onSaved(entry)`. The component uses this to call `patchEntry` so the cache updates in place.\n- `abandon()` is used when the Entry is deleted elsewhere. It stops all further saves and returns `{ text, saved }`, which `restoreWithDraft` uses.\n\n## Editing context (`editing.svelte.ts`)\n\n`Editing` is a Svelte 5 rune class provided through context with `provideEditing` and read with `useEditing`. It holds journal-wide editing state:\n\n| Field | Purpose |\n|---|---|\n| `id` | The Entry open for inline editing. The other rows dim. |\n| `active` (`ActiveEditor`) | The focused editor. The phone KeyboardBar calls `run(command)` on it. |\n| `arrived` | The Entry the composer just finished, so its row plays the arrival once. |\n| `slashValues`, `font`, `spellcheck` | Editor settings fed from General Settings, the Journal preference and the device setting. |\n| `finisher` | Set by the open editor. It saves and closes, and returns `false` if text is still unsaved. |\n| `abandon` | Set by the open editor. It drops the session and returns the held and saved text. |\n\n`open(id)` finishes any other open Entry first. If that Entry can't be saved, it stays put, so unsaved text is never dropped. `close()` clears `id`, `finisher` and `abandon`.\n\n`journalLeaveGuard` is a [`LeaveGuard`](../Frontend_Platform_and_Shell/App_Bootstrap_and_Platform_Utilities.md) that asks before leaving the Journal with text that failed to save. The editor itself is the [Markdown_Editor](../Design_System_and_UI_Components/Markdown_Editor.md).\n\n## Entry actions (`entry-actions.ts`)\n\n| Function | Behaviour |\n|---|---|\n| `tickTask(entry, line)` | Optimistic. It computes the new body with `toggleTaskLine`, patches the cache, then calls `toggleTask`. On failure it invalidates the journal queries and shows an error toast. |\n| `copyEntryText(entry)` | Writes the Markdown body to the clipboard and shows a toast. |\n| `deleteEntryWithUndo(entry, editing, onrestored?)` | If the Entry is open, it finishes it first, so the last keystrokes are saved and the restore brings them back, and then closes the editor. It removes the Entry from the cache, calls `deleteEntry`, and shows an Undo toast. Undo calls `restoreEntry`, invalidates the queries and runs `onrestored`. |\n| `moveEntryToDate(entry, date, editing, nav)` | Used by the ⋯ menu. It finishes the open editor first and aborts if that fails. It moves the Entry, invalidates the queries, and shows a \"Moved to …\" toast. The toast's Show action scrolls to the Entry through `nav.scrollTo`. |\n| `moveEditedEntry(entry, date, flush, nav)` | Used by the editor's own date chip. It flushes without closing, moves the Entry, then scrolls to it. The row reopens in edit mode because the session is keyed by Entry id. There is no toast. |\n\n```mermaid\nsequenceDiagram\n    participant U as User\n    participant A as deleteEntryWithUndo\n    participant E as Editing\n    participant Q as queries.ts\n    participant B as Backend\n    U->>A: Delete\n    A->>E: finisher() then close() (if open)\n    A->>Q: removeCachedEntry\n    A->>B: deleteEntry\n    A-->>U: Toast \"Entry deleted\" + Undo\n    U->>A: Undo\n    A->>B: restoreEntry\n    A->>Q: invalidateJournal\n```\n\n## Remote deletes (`entry-remote-delete.ts`)\n\nWhen another device deletes the Entry being edited, a `JournalEntryDeletedEvent` arrives. The event comes from the host and the event bridge (see [IPC_Bridge_and_Core_Mocks](../IPC_Bridge_and_Browser_Mocks/IPC_Bridge_and_Core_Mocks.md)).\n\n- `followEntryDelete(openId, event, today)` returns a toast message only if the deleted Entry is the open one. An Entry has no title, so the message names its Page: \"‘Wed 21 Oct’ was deleted on Pixel 8\".\n- `restoreWithDraft(deps, id, draft)` restores the Entry, then saves the person's unsaved text on top. It never overwrites remote edits:\n  - If the restored body equals the saved text, the draft replaces it.\n  - If the restored body was also edited elsewhere and the draft extends the saved text, only the new tail is appended.\n  - Otherwise the whole draft is appended after a blank line.\n  - Blank drafts are never saved.\n\nThis ties into the backend editing holds described in [Sync_Replication_Engine](../Sync_Replication_Engine.md) (`editing_hold` in [Tauri_Host_and_IPC_Bridge](../Tauri_Host_and_Command_Layer/Tauri_Host_and_IPC_Bridge.md)).\n\n## Queries (`queries.ts`)\n\nTanStack Query options and mutation helpers over the generated `commands.*` bindings, with errors raised by `unwrap`.\n\n- **Keys** (`journalKeys`): `all`, `pages`, `window(anchor)`, `search(query, from, to)`, `today(date)`, `monthDays(year, month)`.\n- **Reads**:\n  - `todayQuery`: the Home card's count and latest snippet.\n  - `monthDaysQuery`: the Calendar's dots.\n  - `searchQuery`: uses `keepPreviousData`, so typing never flashes empty.\n  - `pagesQuery(anchor)`: an infinite query over a window of Pages, newest first. An anchor date starts the window at that date, so only the Pages around it load. Older Pages load downward and newer ones are prepended upward, using the helpers in `paging`.\n- **Writes**: `createEntry` (with `deviceWrittenWhere`, the device time zone and offset), `updateEntry`, `moveEntry`, `toggleTask`, `deleteEntry` and `restoreEntry`.\n- **Cache edits**:\n  - `patchEntry` replaces an Entry in place.\n  - `removeCachedEntry` removes an Entry, and a Page left empty goes with it.\n  - Both go through `editCachedPages` and recompute `entry_count` and `word_count`.\n  - They exist so the feed neither jumps nor flashes old text while an Entry is edited.\n- `invalidateJournal()` refetches everything. The feed does not refresh while the composer is open and refreshes once it finishes.\n\n`queries.test.ts` mocks `journalPages` with the real paging rules from `mock-journal-pages`. It checks that:\n- the window opens at the anchor;\n- newer Pages are prepended in order until the top;\n- refetching keeps group order without repeats;\n- an empty newer group at the exact top is survived.\n\n## Tests\n\n- `composer.test.ts` and `entry-editing.test.ts` use a `setup()` helper with fake deps, a manual timer and a recorded call log. They cover the create/update ordering, failures, retry, the chip move ordering, discard behaviour and the double-finish guard.\n- `queries.test.ts` covers feed window paging.\n\n## Related modules\n\n- [Journal_Feed_and_Navigation](Journal_Feed_and_Navigation.md): the feed, `JournalNav.scrollTo`, dates and focus.\n- [Journal_Search](Journal_Search.md): the search UI that reuses `searchQuery`.\n- [Journal_Module](../Domain_Modules_(Todo_and_Journal)/Journal_Module.md): the Rust repository and sync behind these commands.\n- [IPC_Bridge_and_Core_Mocks](../IPC_Bridge_and_Browser_Mocks/IPC_Bridge_and_Core_Mocks.md): the bindings and browser mocks for the journal commands.\n- [Todo_Quick_Capture_and_Editing](../Todo_Frontend/Todo_Quick_Capture_and_Editing.md): the analogous `TaskEditing` session for tasks.\n", "Journal_Frontend/Journal_Feed_and_Navigation.md": "# Journal Feed and Navigation\n\nThe **Journal Feed and Navigation** module is the part of the Journal frontend (`src/modules/journal/`) that decides *what the Journal shows* and *where the user is pointing*. It turns the loaded Pages into a flat list of virtual-feed rows, formats dates and times for display, tracks keyboard focus across Entries, carries cross-module requests (\"compose\", \"go to date\") into the Journal, and registers the Journal with the app shell.\n\nIt contains almost no I/O. Most logic is pure functions (`feed.ts`, `dates.ts`, `focus-nav.ts`, `paging.ts`, `settings.ts`, `today-card.ts`) with thin Svelte 5 rune wrappers (`focus.svelte.ts`, `navigation.svelte.ts`, `launcher.svelte.ts`, `marked-days.svelte.ts`) that wire them to the UI via context.\n\nSibling modules: [Journal Composer and Entry Editing](Journal_Composer_and_Entry_Editing.md) (writing and editing Entries, and the `queries.ts` data layer) and [Journal Search](Journal_Search.md). Backend data comes from the [Journal Module](../Domain_Modules_(Todo_and_Journal)/Journal_Module.md) via the [Journal Domain Service](../Tauri_Host_and_Command_Layer/Journal_Domain_Service.md). Shell integration (routes, bare keys, palette) is described in [Shell and Navigation](../Frontend_Platform_and_Shell/Shell_and_Navigation.md) and [Router](../Frontend_Platform_and_Shell/Router.md).\n\n## Architecture\n\n```mermaid\ngraph TD\n    Shell[App shell: palette, bare keys, Home] -->|manifest| Manifest[manifest.ts]\n    Manifest -->|requestCompose / requestGoToDate| Launcher[launcher.svelte.ts]\n    Manifest -->|requestSearch| Search[Journal Search]\n    Launcher -->|pending request| Page[JournalPage.svelte]\n    Page -->|provideNav| Nav[navigation.svelte.ts JournalNav]\n    Page -->|provideFocus| Focus[focus.svelte.ts EntryFocus]\n    Focus --> Reducer[focus-nav.ts focusReducer]\n    Page --> Feed[feed.ts buildFeed]\n    Page --> Paging[paging.ts cursors]\n    Feed --> Dates[dates.ts]\n    Page --> Dates\n    Page --> Settings[settings.ts]\n    Picker[Calendar pickers] --> Marked[marked-days.svelte.ts]\n    Marked --> Queries[queries.ts monthDaysQuery]\n    Home[HomeCard] --> Today[today-card.ts]\n    Queries --> IPC[(IPC bindings: Page, TodaySummary)]\n```\n\n`JournalPage.svelte` (not in this module's core set) is the orchestrator: it creates `JournalNav` and `EntryFocus`, provides them through context, registers callbacks on them, and renders the feed.\n\n## Components\n\n### Feed model — `feed.ts`\n- **`FeedItem`**: either `{kind:'page'}` or `{kind:'month'}` (a faint month divider).\n- **`buildFeed(pages, today, reachesToday = true)`**: input is Pages newest-first. Returns `[]` for a Journal with no Pages (first-run empty state). Otherwise ensures Today's Page exists (empty if needed) when the window reaches Today; a window opened on a far date (`reachesToday=false`) does not get Today injected. Future Pages sit above Today. A month divider is inserted wherever the month changes, never above the first row. Keys are `page-<date>` / `month-<yyyy-mm>`.\n- **`upcomingCount(pages, today)`**: number of loaded Pages after Today (never counts the synthetic empty Today).\n- **`withoutEntry(pages, id)`**: hides the Entry the composer is still writing, adjusting `entry_count`/`word_count` and dropping a Page left empty by it; returns the same array reference when nothing changes.\n- **`openIndex(feed, today)`**: opens on Today's row when future Pages exist above it, else row 0.\n- **`pageIndex`** / **`pageAt(feed, index)`**: find a Page row by date, or the nearest Page row at or above an index (skipping dividers) — used to know which date is being read.\n- **`calendarStart(inView, today)`**: month and selected day the Calendar opens on.\n\n### Dates and labels — `dates.ts`\nAll calendar dates are `YYYY-MM-DD` strings with no zone; formatting uses UTC on both ends so the viewer's zone never shifts a date. Entry times are shown in the zone they were *written* in (`writtenAt + offsetMin`).\n\n| Function | Purpose |\n|---|---|\n| `localDateString(now)` | Device-calendar date: default Page for a new Entry and Today |\n| `pageHeading(date, today)` | Title (\"Tuesday, 20 October\"), year (other years only), Today/Yesterday badge |\n| `pageSummary(entries, words)` | \"2 entries · 40 words\" |\n| `chipLabel` / `dayLabel` | Composer/editor chip: Today, Yesterday or short date |\n| `dayHue` | Colour token: `--day-today`, `--day-yesterday`, else `--hue-journal` |\n| `writtenDateLabel` | Date shown beside an Entry time only when written on a different day than its Page |\n| `fullWritten`, `editedLabel` | Tooltip texts for written time and the \"edited\" mark |\n| `monthLabel` | Month divider text |\n| `showTodayPill` / `showUpcomingPill` | Scroll-position rules for the \"↑ Today\" and \"↑ Upcoming (n)\" pills |\n\nThe two pills are mutually exclusive: Upcoming shows from Today's top (within a 24 px slack) down to one viewport below; beyond that the Today pill takes over. If the loaded window is `away` from Today (a far-date jump), only the Today pill shows.\n\n### Keyboard focus — `focus-nav.ts` and `focus.svelte.ts`\n`focus-nav.ts` is a pure reducer over the loaded Entries in feed order (`feedEntries(pages)`: newest Page first, oldest Entry first within a Page).\n\n```mermaid\nstateDiagram-v2\n    [*] --> NoFocus\n    NoFocus --> Focused: focus / edit / from-composer\n    Focused --> Focused: up, down, edit, stop-edit\n    Focused --> Focused_wantsMore: down at last Entry\n    Focused_wantsMore --> Focused: older Pages loaded, down\n    Focused --> Focused: deleted (moves to next, else previous)\n    Focused --> NoFocus: clear, or deleted last Entry\n```\n\nEvents: `up`, `down`, `focus`, `clear`, `from-composer`, `edit`, `stop-edit`, `deleted`. ↓ at the end sets `wantsMore` so the wrapper can load older Pages. `newestEntryId` picks the target for ↑ from an empty composer: the last Entry of Today, else of the newest earlier Page; never a future Page.\n\n`EntryFocus` (Svelte class) holds the state in `$state.raw`, and exposes callbacks `reveal`, `loadOlder`, `toToday` that `JournalPage` registers. `move()` sends the event, loads older Pages if `wantsMore`, re-sends `down`, then reveals the Entry. `fromComposer()` first returns the feed to Today. `dispose()` nulls the callbacks. Access via `provideFocus` / `useFocus` context.\n\n### Navigation state — `navigation.svelte.ts`\n`JournalNav` is shared via context between feed, composer and Entry actions:\n- `flashEntry` / `flashPage` with `flashEntryFor(id)` / `flashPageFor(date)`: tint for 1550 ms, restarting if already active (clear, then set in a microtask so the animation retriggers).\n- `weekStart`, `today` (moved at midnight by `JournalPage`), `composerDate` (null = Today), `composingId` (the Entry hidden from the feed via `withoutEntry`).\n- Registered callbacks: `scrollTo(date, entryId?)`, `focusComposer`, `compose`.\n- `writeOn(date)`: moves the composer chip and focuses it. `dispose()` clears timers and callbacks.\n\n### Launcher — `launcher.svelte.ts`\nA one-slot mailbox (`launcher.pending`: `'compose' | 'go-to-date' | null`). `requestCompose()` and `requestGoToDate()` set it; the Journal consumes it once showing. This lets ⌘N/⌘K/Home card requests work even when the Journal is not yet mounted.\n\n### Manifest — `manifest.ts`\n`journalManifest` registers the module with the shell: id `journal`, route `/journal` (lazy `JournalPage.svelte`), nav order 20, a Home card, a settings section, bare keys (`n` compose, `j` open, `/` search while on `/journal`) and palette actions (New entry, Search Journal, Go to date…, and a query-aware \"Search Journal for…\"). `compose(ctx)` calls `requestCompose()` then navigates to `/journal`.\n\n### Other pieces\n- **`marked-days.svelte.ts` → `useMarkedDays`**: for a date picker, runs three `monthDaysQuery` queries (previous, current, next month) only while the picker is open, merging them into a `Set` of days having Entries (the coral dots).\n- **`settings.ts`**: `readJournal(values)` narrows `journal.font` (`serif|sans`), `journal.width` (`narrow|default|wide`) and `journal.page_summary` with fallbacks; Rust validates. `columnWidth` maps width to rem (35.5 / 42.5 / 53) so it scales with text size.\n- **`today-card.ts`**: `todayCardText(summary)` produces the Home card quote (curly-quoted latest snippet) and meta (\"Today · 3 entries\" or \"Nothing written today\").\n- **`paging.ts`** (tested by `paging.test.ts`): cursor helpers `firstParam`, `olderParam`, `newerParam`, `PAGE_SIZE` for infinite queries. A full group means more may follow; a short group ends that direction; a window anchored on a date (`direction: 'from'`) tries once upward.\n\n## Data flow\n\n```mermaid\nsequenceDiagram\n    participant U as User\n    participant S as Shell (palette/key)\n    participant L as Launcher\n    participant P as JournalPage\n    participant F as buildFeed\n    participant Q as Queries (IPC)\n    U->>S: ⌘K \"Go to date…\"\n    S->>L: requestGoToDate()\n    S->>P: navigate('/journal')\n    P->>L: take pending\n    P->>Q: load window at date (firstParam)\n    Q-->>P: Pages\n    P->>F: buildFeed(withoutEntry(pages), today, reachesToday)\n    F-->>P: FeedItem[]\n    P->>P: scrollTo(date) + flashPageFor(date)\n```\n\n## Testing\nUnit tests accompany each pure module: `feed.test.ts` (feed building, month dividers, Today injection, midnight rollover), `focus-nav.test.ts` (reducer transitions), `paging.test.ts` (cursor logic) and `today-card.test.ts`. Run with `make test` (see [Build and Config](../Build,_Tooling_and_Packaging/Build_and_Config.md)).\n\n## Design notes\n- Pure-function cores keep date, feed and focus rules testable without the DOM; Svelte classes only hold state and callbacks.\n- Callbacks are registered by `JournalPage` instead of imported, avoiding circular dependencies between rows/actions and the page.\n- Dates are zone-free strings; instants carry their own offset so Entries always display in the zone they were written in.\n", "Journal_Frontend/Journal_Search.md": "# Journal_Search\n\nThe Journal_Search module is the frontend logic behind searching the Journal. It lives in `src/modules/journal/` and has two parts:\n\n- `search-state.ts` holds pure functions and types. It covers the search session lifecycle, date-range presets and labels, grouping of hits by Page, and keyboard-highlight helpers.\n- `search.svelte.ts` wraps those functions in a Svelte 5 reactive class, `JournalSearch`. The class adds the 150 ms debounce and a small launcher that lets code outside the Journal (the command palette) request a search.\n\nThe module calls no IPC itself. It only decides what the user is searching for. The query layer (`searchQuery` in `queries.ts`, see [Journal_Composer_and_Entry_Editing](Journal_Composer_and_Entry_Editing.md)) sends that filter to the backend `journal_search` command. The Rust search is described in [Journal_Module](../Domain_Modules_(Todo_and_Journal)/Journal_Module.md) and [Journal_Domain_Service](../Tauri_Host_and_Command_Layer/Journal_Domain_Service.md). The `Hit` and `Span` types come from the generated IPC bindings (see [IPC_Bridge_and_Core_Mocks](../IPC_Bridge_and_Browser_Mocks/IPC_Bridge_and_Core_Mocks.md)).\n\n## Architecture\n\n```mermaid\ngraph TD\n    Palette[\"Command palette (⌘K)<br/>'Search Journal for…'\"] -->|requestSearch| Launcher[SearchLauncher.pending]\n    Launcher -->|taken when Journal is showing| JS[JournalSearch<br/>search.svelte.ts]\n    UI[Search UI: header button, field,<br/>date chip, results list] --> JS\n    JS -->|pure transitions| State[search-state.ts<br/>SearchSession functions]\n    JS -->|committed query + range| Q[searchQuery<br/>queries.ts]\n    Q -->|IPC journal_search| Rust[Journal search backend]\n    Rust -->|Hit list| UI\n    UI -->|groupHits, snippetText,<br/>moveActive, hitDomId| State\n    State --> Cal[lib/ui/calendar<br/>addDays, shiftMonthKeepingDay]\n    State --> Dates[journal/dates.ts dayLabel]\n```\n\nThe split is deliberate. All decisions live in `search-state.ts` as pure functions that are unit tested without a DOM (`search-state.test.ts`). `JournalSearch` only stores the result and manages the timer.\n\n## The search session (`search-state.ts`)\n\n### Data types\n\n| Type | Meaning |\n|---|---|\n| `SearchRange` | `{from, to, preset}`: Page dates, ends included. `preset` is set when the range came from the menu, otherwise `null`. |\n| `SearchFilter` | `{query, range}`: what the user is looking for. |\n| `SearchSession` | `{active, filter, parked}`: the view's lifecycle. `parked` holds the filter of a search left by opening a result. |\n| `HitGroup` | `{date, label, start, hits}`: consecutive hits sharing a Page. |\n\n`IDLE` is the closed, empty session. `SEARCH_DEBOUNCE_MS` is 150.\n\n### Session transitions\n\n```mermaid\nstateDiagram-v2\n    [*] --> Idle\n    Idle --> Active: openSearch / openSearchFor(query)\n    Active --> Active: withQuery / withRange\n    Active --> Active: escapeSearch (query not empty → clear words)\n    Active --> Idle: escapeSearch (query empty) / closeSearch / toggleSearch\n    Active --> Parked: openResult (filter saved in parked)\n    Parked --> Active: openSearch (⌘F) / goBack, filter restored\n    Parked --> Idle: toggleSearch / closeSearch\n```\n\n- **`openSearch`** does nothing if search is already active. Otherwise it resumes the `parked` filter if there is one, and falls back to a blank filter.\n- **`openSearchFor(query)`** always opens a fresh search holding the query, with no range. The palette uses this.\n- **`openResult`** closes search and moves the current filter into `parked`. If search is not active, it returns the same session unchanged.\n- **`goBack`** is the Back action. With a parked search it resumes it, otherwise it closes search.\n- **`toggleSearch`** is the header button. From idle it opens a blank search. If search is active or parked, it closes for good and clears the filter.\n- **`escapeSearch`** clears the words first. Pressing it again closes search, and the range is cleared then too.\n- **`wantsBack`** is true when search is active or parked, so the router's back handling can ask whether search should take the press (see [Router](../Frontend_Platform_and_Shell/Router.md)).\n\n### Date range\n\n- **`presetRange(id, today)`** gives the same calendar day a week, a month or a year earlier, up to `today`. A week is `addDays(today, -7)`, a month is `shiftMonthKeepingDay(today, -1)`, and a year is `shiftMonthKeepingDay(today, -12)`. The shift helpers come from [UI_Widgets_and_Interaction](../Design_System_and_UI_Components/UI_Widgets_and_Interaction.md) (`calendar.ts`). Tests confirm the clamp to a shorter month (31 Mar → 28 Feb) and the leap-day case.\n- **`rangeLabel(range, today)`** is the text on the date chip:\n  - `null` gives \"Any date\".\n  - A preset gives its label (\"Past week\", \"Past month\" or \"Past year\").\n  - A single day gives \"5 Oct\".\n  - A span gives \"5 Oct – 12 Oct\".\n  - The year is appended to a date outside `today`'s year.\n- **`canSearch(filter)`** is true when the trimmed query is non-empty or a range is set. A range alone lets the user browse a period.\n\n### Results helpers\n\n- **`groupHits(hits, today, first = 0)`** groups consecutive hits by `page_date`. The Rust side sorts the hits, and the function does not re-sort. Each group's `start` is its first hit's position in the whole list (`first` + preceding hits). That position matches the keyboard highlight index, and `first` lets a paged list continue the numbering. The label comes from `dayLabel` in `dates.ts`, see [Journal_Feed_and_Navigation](Journal_Feed_and_Navigation.md).\n- **`hitDomId(listId, hit)`** gives `${listId}-${hit.id}` for `aria-activedescendant`.\n- **`moveActive(index, key, count)`** moves the highlight with ArrowDown or ArrowUp. `-1` means no result is highlighted, with focus in the field. It stops at the last result and at `-1`, and returns `-1` when `count` is 0.\n- **`entriesLabel(n)`** gives \"1 entry\" or \"n entries\".\n- **`snippetText(spans)`** joins the snippet spans without marks, for screen readers.\
