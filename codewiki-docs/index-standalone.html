th no UI or IPC of their own. The Svelte screens call them, and they shape the requests sent to the Rust backend ([LLM Providers](../AI_Assistant_Backend/LLM_Providers.md), [AI Module](../AI_Assistant_Backend/AI_Module.md)).\n\n| File | Responsibility |\n|---|---|\n| `src/modules/ai/choice.ts` | `effectiveChoice`: resolves the default Provider + Model for a question |\n| `src/modules/ai/model-picker.ts` | Model search, \"Use\" row/Enter behaviour, per-Provider usage, paid/free row state |\n| `src/modules/ai/provider-kinds.ts` | Static description of the four Provider kinds; create/update request builders; key chip and hints |\n| `src/modules/ai/choice.test.ts` | Vitest cases pinning the fallback order of `effectiveChoice` |\n\n## Architecture\n\n```mermaid\ngraph TD\n    UI[Svelte screens: composer pill, model picker, provider form] --> Choice[choice.ts]\n    UI --> Picker[model-picker.ts]\n    UI --> Kinds[provider-kinds.ts]\n    Choice --> Bindings[lib/ipc/bindings: ModelUsage, ProviderView]\n    Picker --> Bindings\n    Kinds --> Bindings\n    Bindings --> Cmds[Tauri commands: ai_provider_*, ai_models_*]\n    Cmds --> Backend[AI Module / LLM Providers crates]\n```\n\nThe types (`ProviderView`, `ProviderKind`, `KeyState`, `NewProvider`, `ProviderUpdate`, `ModelUsage`, `ModelUse`) come from the generated IPC bindings (see [IPC Bridge and Core Mocks](../IPC_Bridge_and_Browser_Mocks/IPC_Bridge_and_Core_Mocks.md)). The matching commands live in [AI Assistant Commands](../Tauri_Host_and_Command_Layer/AI_Assistant_Commands.md) (`ai_provider_create`, `ai_provider_update`, `ai_provider_key_set`, `ai_models_search`, `ai_models_usage`, …).\n\n## Choosing the Model: `choice.ts`\n\n`effectiveChoice(sources)` returns `Choice { providerId, model } | null`. `null` means the person must choose, and the pill says so.\n\nPriority order:\n1. **picked**: the choice made on this page since it opened.\n2. **conversation**: the Provider/Model the open Conversation last used.\n3. **usage**: the most recent entry in `usage.recent[0]` (this device's history).\n\nRules:\n- A candidate is *usable* only if its Provider still exists in `providers` and its model is not empty. Unusable candidates are skipped, so the next source is tried.\n- If the open Conversation names a Provider this device lacks (for example it synced from another device), `lacksProvider` is true. The Conversation *and* the usage fallback are then both ignored, so the device's usual Model is not silently substituted. Only an explicit `picked` choice still works. This avoids sending a question to a Model the person did not expect.\n\n```mermaid\nflowchart TD\n    A[picked usable?] -->|yes| R[use picked]\n    A -->|no| B{conversation provider missing on device?}\n    B -->|yes| N[null: person chooses]\n    B -->|no| C[conversation usable?]\n    C -->|yes| R2[use conversation]\n    C -->|no| D[usage.recent 0 usable?]\n    D -->|yes| R3[use latest usage]\n    D -->|no| N\n```\n\n`choice.test.ts` covers each branch: picked wins, then the conversation, then usage, null when nothing is known, null for a missing conversation Provider, picked still winning in that case, and skipping a picked Provider that was deleted.\n\n## Model picker helpers: `model-picker.ts`\n\n- `typedModelId(query)` trims the query. Any id is accepted, even one the Provider did not list.\n- `choiceOnEnter(key, query)` returns the typed id only for `Enter`, matching the \"Use\" row.\n- `matchingModels(models, query)` does a case-insensitive substring filter and keeps the Provider's order.\n- `usesOf(uses, providerId)` filters recent or most-used `ModelUse` rows to one Provider.\n- `isFreeModel(model)` is true when the id ends in `:free` (OpenRouter's convention, mirrored from the Rust rule).\n- `modelRowState(model, { paidKind, paidIds, allowPaid })` returns `{ paid, disabled, reason }`.\n  - A row is *paid* only for kinds with paid Models, and only if the Provider's list marks it paid or its id is not a free route. Recent and most-used rows are not in the Provider's list, so the id decides for them.\n  - A paid row is *disabled* while the Provider's `allow_paid` switch is off. The reason is `PAID_MODEL_REASON`.\n\n## Provider kinds: `provider-kinds.ts`\n\n`KINDS` lists the four kinds in the order the kind step shows them. `kindOf(id)` looks one up (falling back to the wrapper, which should never happen).\n\n| Kind | Address | Key | Paid Models |\n|---|---|---|---|\n| `wrapper` (Local AI Wrapper) | default `http://127.0.0.1:8080/v1`, editable | none | no |\n| `openai_compatible` | typed by the person, editable | optional | no |\n| `anthropic` | fixed `https://api.anthropic.com/v1` | required | no |\n| `openrouter` | fixed `https://openrouter.ai/api/v1` | required | yes |\n\nHelpers:\n- `addressFor(kind, typed)` returns the fixed address for fixed kinds, else the trimmed typed address.\n- `createRequest(kind, name, typedAddress)` builds `NewProvider`. Paid Models are not part of creation.\n- `updateRequest(kind, name, typedAddress, allowPaid)` builds `ProviderUpdate`. `allow_paid` is forced to `false` for kinds without paid Models.\n- `keyChip(state)` gives \"Needs a key\" (warn) or \"Key saved\" (ok), and `null` when no key is needed.\n- `freeOnlyNote(provider)` gives \"Free Models only\" for an OpenRouter Provider with the paid switch off.\n- `keyHint(rule)` gives the text under the key field. Keys are write-only and stored on this device only.\n- `PAID_SWITCH` holds the label and hint of the paid switch.\n\nThe comment in the source says \"the Rust side agrees\". Address and key rules are enforced again in the backend (see [LLM Providers](../AI_Assistant_Backend/LLM_Providers.md) address checks and `KeyPolicy` in [AI Module](../AI_Assistant_Backend/AI_Module.md)), so these helpers only guide the form.\n\n## Data flow\n\n```mermaid\nsequenceDiagram\n    participant P as Person\n    participant S as Provider form\n    participant K as provider-kinds\n    participant I as IPC\n    participant R as Rust AI module\n    P->>S: pick kind, name, address\n    S->>K: createRequest(kind, name, address)\n    K-->>S: NewProvider\n    S->>I: ai_provider_create\n    I->>R: validate address and key policy\n    P->>S: enter key (write-only)\n    S->>I: ai_provider_key_set\n    S->>I: ai_models_search / ai_models_usage\n    S->>S: matchingModels, modelRowState, effectiveChoice\n```\n\n## Notes for maintainers\n\n- Adding a new Provider kind needs a new `KindInfo` in `provider-kinds.ts` and matching support in the Rust crates and bindings.\n- Provider records, usage and the visible branch stay on the device. Only Conversations sync, which is why `effectiveChoice` must handle a Provider that is absent locally.\n- Related frontend pages: [AI Conversation and Runs](AI_Conversation_and_Runs.md), [AI Branches, History and Saved](AI_Branches_History_and_Saved.md).\n", "AI_Assistant_Frontend.md": "# AI_Assistant_Frontend\n\n## Purpose\n\n`AI_Assistant_Frontend` (`src/modules/ai/`) is the client side of Mnemora's AI assistant. It is a thin TypeScript layer between the Svelte AI page and the Rust backend. It does three things:\n\n- **Folds the run stream into screen state.** It turns the live run events streamed from Rust into in-memory Run state: streamed text, tool steps, failures and queued notes.\n- **Derives thread view data from saved Conversations.** This covers activity lines, source previews, the \"Branch from earlier\" choices, failure banners and the end-of-run announcement.\n- **Handles everything around a Conversation.** That means which Branch is shown, the history list, Saved questions, and which Provider and Model answer a question.\n\nIt keeps no persistent state of its own. Conversations, Branches, Saved questions and Providers all live in the backend and are read through the generated IPC `commands`. The only local state is the in-memory live Run store. Server data is cached with TanStack Query and invalidated after each mutation. Most of the logic is pure functions, so it can be unit tested without a DOM.\n\n## Architecture\n\n```mermaid\ngraph TD\n    UI[Svelte AI page components] --> Conv[AI_Conversation_and_Runs]\n    UI --> Br[AI_Branches_History_and_Saved]\n    UI --> Prov[AI_Providers_and_Models]\n\n    Conv -->|live run events| Live[LiveRunStore / run-state]\n    Br -->|queries and mutations| QC[TanStack Query cache]\n    Prov -->|choice and request builders| Bindings\n\n    Live --> Bindings[lib/ipc/bindings commands]\n    QC --> Bindings\n    Bindings --> Host[Tauri AI commands]\n    Host --> Backend[AI Module / Agent Harness / LLM Providers]\n    Backend -. AiRunEvent .-> Live\n```\n\nThe three sub-modules divide the work like this:\n\n```mermaid\nflowchart LR\n    subgraph Conversation and Runs\n      A1[run-state, live, queue-state]\n      A2[activity, answers, earlier-answers]\n      A3[failure-banner, announce, source-excerpt]\n    end\n    subgraph Branches, History and Saved\n      B1[queries, branch-actions, branch-pager]\n      B2[history, saved-actions]\n      B3[focus, long-press]\n    end\n    subgraph Providers and Models\n      C1[choice]\n      C2[model-picker]\n      C3[provider-kinds]\n    end\n    C1 -->|Choice for the question| A1\n    B1 -->|Conversation query| A2\n    A3 -->|Branch from earlier| B1\n```\n\n### Question flow\n\n```mermaid\nsequenceDiagram\n    participant P as AI page\n    participant C as choice.ts\n    participant R as Rust run engine\n    participant S as liveRuns\n    participant Q as Query cache\n    P->>C: effectiveChoice(picked, conversation, usage)\n    P->>R: aiRunStart(text, choice, localContext)\n    R-->>S: runStarted / textDelta / toolStarted / toolEnded\n    S-->>P: live text and steps\n    R-->>S: runEnded\n    alt answered or stopped\n        P->>Q: refetch Conversation (saved entries)\n    else failed\n        S-->>P: failure kept, banner shown\n    end\n```\n\n## Core component documentation\n\n| Sub-module | Scope | Documentation |\n|---|---|---|\n| **AI Conversation and Runs** | Run event reducer and the `liveRuns` store, the queued-notes helpers, activity lines, answer and earlier-answer derivations, failure banners, end-of-run announcements, cited-source previews, copy as Markdown, and the local context sent with a question | [AI_Conversation_and_Runs](AI_Assistant_Frontend/AI_Conversation_and_Runs.md) |\n| **AI Branches, History and Saved** | TanStack Query keys and options, Branch switching and branching from an earlier answer, pager maths, date-grouped history, Saved question mutations with Undo, focus return, phone long-press, and the bare-key guard test | [AI_Branches_History_and_Saved](AI_Assistant_Frontend/AI_Branches_History_and_Saved.md) |\n| **AI Providers and Models** | `effectiveChoice` for the default Provider and Model, model picker search and paid/free row state, and the four Provider kinds with their create and update request builders | [AI_Providers_and_Models](AI_Assistant_Frontend/AI_Providers_and_Models.md) |\n\n## Design principles\n\n- **Backend is the source of truth.** The frontend caches and derives data but never stores a Branch, Saved question or Conversation itself.\n- **Pure, testable logic.** Reducers, selectors, pager arithmetic, grouping and request builders are pure functions with Vitest coverage. Svelte components only render their results.\n- **Live state is ephemeral.** A reload drops live Runs. The saved Conversation is the record.\n- **Device-local settings.** Providers, usage and the shown Branch stay on the device. Only Conversations sync, so `effectiveChoice` handles a Conversation that names a Provider this device lacks.\n- **Wording from Rust.** Failure sentences come from the backend, and the TypeScript side supplies only short titles, tones and actions.\n\n## Related modules\n\n- Backend: [AI Module](AI_Assistant_Backend/AI_Module.md), [Agent Harness](AI_Assistant_Backend/Agent_Harness.md), [LLM Providers](AI_Assistant_Backend/LLM_Providers.md)\n- Host commands: [AI Assistant Commands](Tauri_Host_and_Command_Layer/AI_Assistant_Commands.md)\n- IPC and browser mocks: [IPC Bridge and Core Mocks](IPC_Bridge_and_Browser_Mocks/IPC_Bridge_and_Core_Mocks.md)\n- Behaviour tests: [AI Data and Provider Tests](Backend_Integration_Test_Suites/AI_Data_and_Provider_Tests.md)", "Android_and_Home-Screen_Widget_Platform/Android_Integration.md": "# Android Integration\n\nThe Android Integration module is the Kotlin side of Mnemora on Android. It has two parts:\n\n1. **`MainActivity`**: the Tauri host activity. It adds the native services the web UI and the Rust sync engine need: system-bar styling, back-to-background, the Wi-Fi multicast lock for mDNS, the Android 17 \"local network\" permission, and lifecycle hooks for Sync and the widget bridge.\n2. **The Todo home-screen widget**: a provider, a setup screen, a Quick add sheet, a steps dialog, a tap receiver and framework jobs. All of it is native Android UI. It has no business rules of its own, because every read and write goes through the Rust widget bridge.\n\nAll files live under `src-tauri/gen/android/app/src/main/java/com/hemang/mnemora/`. The widget is offered on Android 12+ only (ADR 0015). The activities that draw native UI are annotated `@RequiresApi(31)`.\n\nThe Rust side of the widget is documented in [widget_bridge](widget_bridge.md). Its behaviour is pinned by [widget_tests](widget_tests.md). The parent overview is [Android and Home-Screen Widget Platform](../Android_and_Home-Screen_Widget_Platform.md).\n\nSource of truth: this page describes the Kotlin files in this module. Helper types they call (`WidgetBridge`, `WidgetUpdater`, `WidgetRenderer`, `WidgetConfigStore`, `Palette`, `WidgetTheme`, `UndoBar`, `LocalNetworkPolicy`, `SyncBridge`, `CaptureRules` and others) are referenced by name only. They were not among the provided core components, so their internals are not described here.\n\n## Component overview\n\n| Component | Kind | Role |\n|---|---|---|\n| `MainActivity` | `TauriActivity` | Hosts the WebView. Exposes `window.MnemoraAndroid`, manages the multicast lock and the local-network permission, and forwards lifecycle to `SyncBridge` and `WidgetBridge`. |\n| `TodoWidgetProvider` | `AppWidgetProvider` | Receives system and redraw broadcasts and delegates drawing to `WidgetUpdater`. Cleans up per-widget config. |\n| `WidgetActionReceiver` | `BroadcastReceiver` | Handles taps that change Tasks (tick, Undo, open). Runs on a single-thread executor under `goAsync`. |\n| `StepsDialogActivity` | `Activity` | Asks \"N steps are still open\" when a tick hits a Task with unticked checklist items. |\n| `WidgetSetupActivity` | `Activity` | Configure screen: View, Theme and Background, with a live preview. |\n| `QuickAddActivity` | `Activity` | Native Quick add bottom sheet, opened by the widget's + and \"Add a task…\" pill. |\n| `WidgetJobService` / `WidgetJobs` | `JobService` | Timed redraws: the midnight rollover and the Undo bar's expiry. |\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph WebView[\"Tauri WebView (Svelte UI)\"]\n        JS[\"window.MnemoraAndroid\"]\n    end\n\n    subgraph Kotlin[\"Android Integration (this module)\"]\n        MA[MainActivity]\n        TWP[TodoWidgetProvider]\n        WAR[WidgetActionReceiver]\n        SDA[StepsDialogActivity]\n        WSA[WidgetSetupActivity]\n        QAA[QuickAddActivity]\n        WJS[WidgetJobService]\n    end\n\n    subgraph Helpers[\"Other Kotlin helpers (not documented here)\"]\n        WU[WidgetUpdater]\n        WR[WidgetRenderer]\n        WCS[WidgetConfigStore]\n        WB[WidgetBridge]\n        SB[SyncBridge]\n    end\n\n    subgraph Rust[\"Rust (src-tauri)\"]\n        WRB[\"widget bridge (JNI)\"]\n        SYNC[\"Sync power / network\"]\n    end\n\n    JS -->|JavascriptInterface| MA\n    MA -->|lifecycle| SB --> SYNC\n    MA -->|attach| WB\n    TWP --> WU --> WR\n    WAR --> WB\n    WSA --> WB\n    QAA --> WB\n    WB -->|nativeCall| WRB\n    WJS --> WU\n    SDA -->|broadcast| WAR\n    WAR -->|starts| SDA\n    WSA --> WCS\n    QAA --> WCS\n```\n\nThe widget UI is a thin native client. Reading words, ordering Tasks, completing, undoing and adding all happen in Rust via `WidgetBridge.call(...)`. The Kotlin layer builds requests, parses replies and draws.\n\n## MainActivity\n\n### Lifecycle responsibilities\n\n| Callback | Action |\n|---|---|\n| `onCreate` | Enables edge-to-edge. Calls `SyncBridge.watch(this)` **before** `super.onCreate`, so Rust starts knowing about the mobile-data policy. Then calls `WidgetBridge.attach(this)` so Rust can redraw the Todo widgets after the app changes data. |\n| `onResume` | Applies the multicast lock (if wanted) and calls `SyncBridge.foreground(true)`. Rust starts or keeps Sync's network and runs a round. |\n| `onPause` | Releases the lock and calls `SyncBridge.foreground(false)`. Rust flushes pending changes for up to 5 s on its own timer, then stops everything. This is best effort: there is no wake lock. |\n| `onDestroy` | Clears the multicast want, releases the lock and calls `SyncBridge.unwatch(this)`. |\n\nThe Rust counterparts are the `Java_com_hemang_mnemora_SyncBridge_*` JNI entry points in `sync_power/android.rs`. They are covered in [Sync Connectivity and Pairing](../Tauri_Host_and_Command_Layer/Sync_Connectivity_and_Pairing.md).\n\n### JavaScript bridge: `window.MnemoraAndroid`\n\n`onWebViewCreate` stores the WebView and registers the inner `MnemoraBridge` as `MnemoraAndroid`. `@JavascriptInterface` methods run on a WebView thread, so every one that touches windows or activity state hops to the UI thread with `runOnUiThread`.\n\n| Method | Purpose |\n|---|---|\n| `moveTaskToBack()` | Back at the app root leaves like any Android app and keeps the process alive. |\n| `holdMulticastLock(hold)` | The web side says Sync is on and the page is visible. The lock is acquired only if that is true **and** the activity is at least `RESUMED`. |\n| `localNetworkState()` | Returns `\"unneeded\"` before Android 17, otherwise `\"granted\"` or `\"denied\"`. |\n| `requestLocalNetwork(settingsIfBlocked)` | Shows the system dialog, or opens app settings if the system will no longer show it. |\n| `requestLocalNetworkOnce()` | If Sync was already on and the permission was never requested (for example after updating to Android 17), asks once. It never asks again. |\n| `openAppSettings()` | Opens `ACTION_APPLICATION_DETAILS_SETTINGS`. |\n| `setSystemBars(dark, colorHex)` | Sets light or dark bar icons and the status and navigation bar colours. An unparsable colour is ignored. |\n\nThe web counterparts are `multicast.ts` and `local-network.ts`, in [Sync Devices and Pairing](../Sync_Frontend/Sync_Devices_and_Pairing.md). `system-bars.ts` is in [Theme](../Frontend_Platform_and_Shell/Theme.md).\n\n### Multicast lock\n\nWithout a multicast lock the Wi-Fi chip drops multicast packets, so mDNS discovery of the other device hears nothing. The activity lifecycle is the authority: the lock cannot outlive the screen even if the WebView never reports the page as hidden.\n\n```mermaid\nflowchart LR\n    W[Web: holdMulticastLock] --> WANT[wantMulticast]\n    LC[onResume / onPause] --> FRONT[inFront]\n    WANT --> AND{want AND inFront}\n    FRONT --> AND\n    AND -- yes --> ACQ[acquire mnemora-sync lock]\n    AND -- no --> REL[release if held]\n```\n\nThe lock is non-reference-counted, which makes acquire and release idempotent.\n\n### Local-network permission flow (Android 17+)\n\n`LocalNetworkPolicy` decides `applies`, `canAsk`, `state` and `shouldAskUnprompted`. `MainActivity` supplies the facts: the SDK level, whether the permission is granted, and an `asked_local_network` flag in the `sync` SharedPreferences.\n\n```mermaid\nsequenceDiagram\n    participant Web\n    participant MA as MainActivity\n    participant OS as Android\n    Web->>MA: requestLocalNetwork(settingsIfBlocked)\n    alt policy applies and not granted\n        alt canAsk(asked, rationale)\n            MA->>MA: set asked flag, askingLocalNetwork=true\n            MA->>OS: requestPermissions(code 4317)\n            OS-->>MA: onRequestPermissionsResult\n            MA->>MA: askingLocalNetwork=false\n            MA->>Web: dispatch 'mnemora-local-network' event\n        else blocked and settingsIfBlocked\n            MA->>OS: open app settings\n        end\n    end\n```\n\nWhile the dialog is up (`askingLocalNetwork`), a missing grant is not reported as a refusal yet. `currentLocalNetworkState()` passes `asked && !askingLocalNetwork`.\n\n## Todo widget\n\n### Provider: `TodoWidgetProvider`\n\n- `onReceive`: if `WidgetUpdater.isRedrawAction(action)`, it redraws asynchronously under `goAsync()`. Otherwise it falls through to the default dispatch.\n- `onUpdate`: redraws.\n- `onAppWidgetOptionsChanged`: `redrawOnResize`. The responsive RemoteViews already handle the new size.\n- `onDeleted`: `WidgetConfigStore.remove` (a removed widget takes its settings with it).\n- `onRestored`: `WidgetConfigStore.move(old, new)`, because widgets come back under new ids after a backup restore.\n- `onDisabled`: `WidgetUpdater.cancelMidnight`.\n\nThe Rust side signals the widget after Task writes through the platform notifier in `widget/signal.rs`. See [widget_bridge](widget_bridge.md).\n\n### Tap handling: `WidgetActionReceiver`\n\nThe receiver is not exported. Only this app's own PendingIntents reach it. The work runs off the main thread on a single-thread executor, kept alive by `goAsync`. Failures are logged (tag `TodoWidget`) and never crash.\n\n| Action | Extra `kind` | Behaviour |\n|---|---|---|\n| `ACTION_UNDO` | n/a | `WidgetActions.undo(app)`. |\n| `ACTION_ROW` | `tick` | `WidgetActions.complete(id, null)`. If the reply is `TickReply.OpenSteps`, it starts `StepsDialogActivity`. |\n| `ACTION_ROW` | `complete` | Completes with the dialog's answer (`tick_steps` true or false). |\n| `ACTION_ROW` | other (`open`) | Opens the Task through `WidgetLinks.intent` if the link is valid. Otherwise it launches `MainActivity`. |\n\n```mermaid\nsequenceDiagram\n    participant User\n    participant W as Widget row\n    participant R as WidgetActionReceiver\n    participant B as Rust bridge\n    participant D as StepsDialogActivity\n    User->>W: tap diamond\n    W->>R: ACTION_ROW kind=tick\n    R->>B: complete(id, null)\n    alt Task has open steps\n        B-->>R: OpenSteps(count, title)\n        R->>D: startActivity\n        User->>D: Tick all and complete / Complete / Cancel\n        D->>R: broadcast kind=complete tickSteps\n        R->>B: complete(id, tickSteps)\n    else no open steps\n        B-->>R: done\n    end\n```\n\n### Steps dialog: `StepsDialogActivity`\n\nA translucent card dressed in the tapped widget's theme. It resolves `WidgetConfigStore.get(widgetId)`, then `WidgetTheme.resolve`, then `Palette.from`. It finishes immediately if the Task id is missing or the count is 0. A tap outside is Cancel.\n\nThe answer is **not** processed in the activity. `answer()` finishes with no transition and then sends an explicit broadcast to `WidgetActionReceiver`. Once the activity is gone the process is cached and its threads are held back for seconds, while a receiver's `goAsync` keeps the process running. In that case a tick from the dialog took 3.4 s. A `busy` flag prevents double answers.\n\n### Setup screen: `WidgetSetupActivity`\n\nThis is the configure activity, shown when a widget is dropped and again from the launcher's reconfigure. It must be exported for the launcher, so `isOurWidget()` checks that the widget id belongs to `TodoWidgetProvider`.\n\n- Starts with `RESULT_CANCELED`, so backing out on first placement makes the launcher remove the widget.\n- Loads the Lists through `WidgetBridge.call(WidgetRequests.lists())` on a background executor and parses them with `ReplyParser.parseLists`.\n- Shows radio groups for **View** (Today, Upcoming, Inbox, All, or a specific `list:<id>`), **Theme** (App, Light, Dark, True black) and **Background** (Solid, See-through, None).\n- If the saved List no longer exists, the view falls back to `WidgetConfig.DEFAULT_VIEW`.\n- The live preview uses the same `WidgetRenderer.render` inside an `AppWidgetHostView`, with `PREVIEW_LINES = 4`. Replies are cached per view, and a sequence counter drops stale results. If there is nothing real to show (not set up, an error), it draws `SampleSnapshot.today`. A transparent view swallows touches over the preview.\n- The config survives rotation through `onSaveInstanceState` (JSON).\n- **Done** stores the config with `WidgetConfigStore.put`, sets `RESULT_OK` and redraws.\n- The app's theme is remembered with `rememberAppTheme` so later screens and dialogs match.\n\n### Quick add: `QuickAddActivity`\n\nA native copy of the app's Quick add (ADR 0016), shown as a translucent bottom sheet with the keyboard up. See the web counterpart in [Todo Quick Capture and Editing](../Todo_Frontend/Todo_Quick_Capture_and_Editing.md). Its guiding rule is that it has **no parsing or adding rules of its own**. Rust reads the words and adds the Task through the bridge. Only the pure helpers in `CaptureRules` run locally, for UTF-16-offset text editing.\n\n```mermaid\nsequenceDiagram\n    participant UI as QuickAddActivity (main)\n    participant IO as io executor\n    participant B as WidgetBridge / Rust\n    UI->>IO: loadContext (QuickAddRequests.context)\n    IO->>B: call\n    B-->>UI: QuickContext (lists, placeholder, parseDates)\n    loop each text change\n        UI->>IO: requestReading (sequence n)\n        IO->>B: parse(draft)\n        B-->>UI: Reading (spans, alternatives, ignored, fields)\n        Note over UI: stale answers dropped when sequence != n\n    end\n    UI->>IO: submit\n    IO->>B: add(draft)\n    B-->>UI: Added(message)\n    UI->>UI: toast, redraw widgets, finish\n```\n\nKey behaviours:\n\n- **Context failures** (not set up, needs update, error) show a toast and close the sheet.\n- **Recognised words** are shown as marks in the field and as \"word → meaning ×\" chips. Dismissing one adds it to `CaptureWords` as ignored. Alternatives (\"use instead\") and ignored words (\"kept as text ↺\") are dashed chips that can be reversed.\n- **Backspace filter**: ⌫ right after a recognised word keeps it as text instead of deleting a letter. The reading is updated at once, so a second ⌫ deletes normally.\n- **Paste filter**: a multi-line paste becomes one Task. The first line is the title and the rest goes to the notes.\n- **`#List` suggestions**: up to five rows from `CaptureRules.listSuggestions`. The first row is what Enter takes. A dismissed hash is remembered. Suggestions never throw.\n- **Hand choices** (`QuickHand`): the List and Priority pickers set `hand`, and the typed words of that kind are then ignored (`decided`). The When chip is read-only, because there is no When picker in the sheet.\n- **Keys**: Enter adds (or takes the first suggestion). Shift+Enter opens the notes. Ctrl or Meta+Enter adds from the notes. Backspace on empty notes closes them. Back closes an open picker first, then discards the draft. A tap outside also discards.\n- **Submit** sets `busy`. On success it toasts the bridge's message, redraws the widgets and finishes. On failure it keeps the typed text.\n- The intent uses `FLAG_ACTIVITY_NEW_TASK | CLEAR_TASK`, so a stale draft is never reopened. `pending(...)` builds an immutable, explicit PendingIntent per widget (request code `REQUEST_BASE + widgetId`).\n\n### Timed redraws: `WidgetJobs` and `WidgetJobService`\n\nThe widget's timed redraws use `JobScheduler` instead of alarms. On vivo devices the freezer freezes the app seconds after it finishes work and deletes its alarms (`dumpsys alarm` shows Reason=frozen), and `DATE_CHANGED` is not delivered to a manifest receiver. A job belongs to the system, needs no permission, and starts the process when it runs. It is not exact: it runs at the first device wake after its time, and within about half a minute while the screen is on.\n\n| Job | Id | Behaviour |\n|---|---|---|\n| Midnight redraw | `4401` | Scheduled with `Midnight.delayFrom(now, zone)`. Re-armed on every redraw, so a clock or zone change corrects it. Cancelled in `onDisabled`. |\n| Undo expiry | `4402` | Scheduled with no delay on purpose: a running job keeps the process out of the freezer, which a timer or alarm cannot. `WidgetJobService` waits in a thread until `UndoBar.storedUntil` has passed, then redraws, which hides the bar. |\n\nThe service redraws through `WidgetUpdater.redrawAsync` and calls `jobFinished` when done. `onStopJob` interrupts the waiter and returns `false`, so it is never retried. The next redraw hides a stale bar by its timestamp anyway.\n\n## Cross-layer data flow\n\n```mermaid\nflowchart LR\n    App[App UI change] -->|Rust write| Sig[widget signal]\n    Sig -->|platform notify| Redraw[TodoWidgetProvider redraw action]\n    Redraw --> WU[WidgetUpdater.redrawAsync]\n    WU -->|snapshot request| Bridge[WidgetBridge.call]\n    Bridge -->|nativeCall| Rust[Rust widget source]\n    Rust --> Reply[Reply JSON]\n    Reply --> WR[WidgetRenderer RemoteViews]\n    Widget[Widget tap / Quick add] --> Bridge\n    Rust -->|todo-changed event| App\n```\n\nWhen the app process is alive, the Rust side answers from its own connection and emits `todo-changed` once per write. When it is not, the bridge opens the database itself. A sandbox build refuses a production data dir. Both cases are covered by [widget_tests](widget_tests.md).\n\n## Design notes and constraints\n\n- **Threading**: never do bridge calls on the main thread. Activities use a single-thread `ExecutorService` plus `runOnUiThread` or a main `Handler`. Receivers use `goAsync` plus an executor.\n- **Process survival**: work that must complete is handed to a receiver (`goAsync`) or job, never left in a closing activity.\n- **Security**: `WidgetActionReceiver` and `WidgetJobService` are not exported. Intents are explicit. PendingIntents are immutable. The exported `WidgetSetupActivity` validates the widget id.\n- **Theming**: every native surface resolves `WidgetTheme.resolve(config.theme, appTheme, phoneNight)` into a `Palette`, so it matches the app or the widget's own choice.\n- **Single source of rules**: parsing, ordering, completion and undo semantics live in Rust ([Todo Widget](../Domain_Modules_(Todo_and_Journal)/Todo_Widget.md)). Kotlin never reimplements them.\n- **Build**: the Gradle project is generated under `src-tauri/gen/android`. See [Build and Packaging](../Build,_Tooling_and_Packaging/Build_and_Packaging.md) for how `RustPlugin` builds the native library, and the `android*` targets in the `Makefile`.\n", "Android_and_Home-Screen_Widget_Platform/widget_bridge.md": "# widget_bridge\n\nThe `widget_bridge` module is the Rust side of the Android Todo home-screen widget (ADR 0014). It exposes one JSON-in, JSON-out function over the same Todo rules the Tauri commands use. Kotlin reaches it through JNI. Tests call it directly. It also sends the opposite signal: Rust tells Android to redraw the widgets when Todo data changes.\n\nSource files (all under `src-tauri/src/widget/`):\n\n| File | Role |\n|---|---|\n| `mod.rs` | Request protocol (`Request`), reply envelope (`Outcome`, `Status`), `handle`, tick/undo logic |\n| `source.rs` | `Source` trait with `Live` (running app) and `Standalone` (no app in the process) implementations |\n| `signal.rs` | `WidgetSignal`, `platform_notify`, `follow_settings` |\n| `android.rs` | JNI entry points (`nativeAttach`, `nativeCall`), `register_app`, `notify_todo_changed` (Android only) |\n\nThe Kotlin counterparts (`TodoWidgetProvider`, `WidgetActionReceiver`, `WidgetJobService` and others) are described in [Android_Integration](Android_Integration.md). The behaviour is exercised by [widget_tests](widget_tests.md). The Todo rules the bridge calls (`WidgetView`, snapshots, quick add) live in [Todo_Widget](../Domain_Modules_(Todo_and_Journal)/Todo_Widget.md) and [Todo_Tasks_and_Lists](../Domain_Modules_(Todo_and_Journal)/Todo_Tasks_and_Lists.md).\n\n## Architecture\n\n```mermaid\nflowchart LR\n    subgraph Android[Android process: Kotlin]\n        WP[TodoWidgetProvider / WidgetActionReceiver / QuickAdd / Steps dialog]\n        WB[WidgetBridge.kt]\n    end\n    subgraph Rust[Rust library: src-tauri/src/widget]\n        JNI[android.rs<br/>nativeAttach / nativeCall]\n        H[mod.rs handle]\n        SRC{{Source trait}}\n        LIVE[Live: app connection]\n        STAND[Standalone: own read connection]\n        SIG[signal.rs WidgetSignal]\n    end\n    TODO[mnemora_todo rules]\n    DB[(SQLite)]\n\n    WP --> WB -->|nativeCall dataDir, json| JNI --> H\n    H --> SRC\n    SRC --> LIVE --> DB\n    SRC --> STAND --> DB\n    H --> TODO\n    SIG -->|platform_notify| JNI\n    JNI -->|onTodoChanged| WB\n```\n\nA broadcast receiver can load the native library without Tauri starting. Every function in the bridge therefore works with or without the app in the process. Release builds abort on panic, so nothing in the module may panic, unwrap or index. Every failure becomes an `err` reply or a null string.\n\n## Protocol (`mod.rs`)\n\n`Request` is a tagged enum (`\"method\"`, snake_case):\n\n| Method | Purpose | Writes? |\n|---|---|---|\n| `snapshot {view, local}` | A view as the widget draws it, as of the device clock (`LocalNow`) | no |\n| `lists` | Lists for the setup screen, plus app theme | no |\n| `complete {id, tick_steps?, local}` | Tick a task through the app's `complete_task` | yes |\n| `undo {token}` | Reverse a tick | yes |\n| `capture_context {view, local}` | What the Quick add sheet needs on opening | no |\n| `parse(QuickRequest)` | Read typed text as the Capture box does; writes nothing | no |\n| `add(QuickRequest)` | Create the described task | yes |\n\nReplies are one of:\n\n- `{\"ok\": payload}`\n- `{\"status\": \"not_set_up\" | \"needs_update\"}`\n- `{\"err\": {\"code\", \"message\"}}`\n\n`Outcome` carries these three cases (`Ok`, `Status`, `Err`). `Status` is `NotSetUp` when the app has never run and there is no database. It is `NeedsUpdate` when the app was updated and its migrations have not run. Only the app can fix either. Errors are logged by code only, because messages and details can contain the user's own text. Malformed requests are a `Validation` error whose details are the parser's message, never the request text.\n\n### Complete and Undo\n\n```mermaid\nsequenceDiagram\n    participant K as Kotlin\n    participant B as handle/complete\n    participant S as Source\n    K->>B: complete {id, tick_steps: null}\n    B->>S: run: read task, count open steps\n    alt open steps and state Open\n        B-->>K: ok {kind: open_steps, task_id, title, count}\n        K->>K: StepsDialogActivity asks the user\n        K->>B: complete {id, tick_steps: true|false}\n    end\n    B->>S: write: tick()\n    Note over B: optionally tick all steps first, then complete the task, restoring notes if that fails\n    B-->>K: ok {kind: completed, message, lead, suffix, token}\n    K->>B: undo {token}\n    B->>S: write: reopen_task, restore notes\n```\n\n- A task with open steps is answered with `open_steps` and left unchanged until `tick_steps` says what to do. `true` ticks every step first. `false` completes it as it is.\n- `tick` follows the app: steps are ticked in their own save, then the task is completed. If completion fails after the notes changed, the original notes are written back.\n- For a repeating task, the `suffix` says where it went (the part of `completed_repeat_message` after the lead). The widget keeps the suffix whole and truncates the title.\n- `UndoToken` is opaque to Kotlin. It holds `reopen` (the task id, or the recorded occurrence id for a repeating task) and optionally the `notes` to put back. Undo reopens and restores the notes only if they differ.\n\n## Sources (`source.rs`)\n\n`Source` abstracts which database connection a job runs on:\n\n- `run(job)` runs a job on the connection, or says why there is none.\n- `write(job)` is `run` for jobs that change Todo data. The default only delegates.\n- `app_theme()` returns Settings ▸ Theme from the device file (`system`, `light`, `dark` or `oled`). Anything else becomes `system`. Snapshots and lists carry it as `app_theme`.\n\n| Implementation | When | Behaviour |\n|---|---|---|\n| `Live<R>` | The app's `AppState` exists in this process | Locks the app's own connection (`state.db`), shared with the commands. A successful `write` emits `TodoChangedEvent` so open screens update at once. `is_ready()` checks that `AppState` is managed. Before then, `run` returns `NotSetUp`. |\n| `Standalone` | The widget started the process before the app | Resolves paths like app start-up (device file first, since it can move the data directory). The `env_guard` check runs first, and a sandbox build refuses a production data dir. It opens the database only if it exists (`db::open_existing`) and uses it only if every module's migrations are current (`is_current`). It never creates or migrates a database. A verified connection is cached. A `Database` or `Io` error drops the cache, so the next call reopens. |\n\n```mermaid\nflowchart TD\n    A[answer dataDir, request] --> B{APP set and Live.is_ready?}\n    B -- yes --> C[handle with Live]\n    B -- no --> D[STANDALONE get_or_init: start_logging + Standalone::new]\n    D --> E[handle with Standalone]\n    E --> F{db file exists?}\n    F -- no --> G[status not_set_up]\n    F -- yes --> H{migrations current?}\n    H -- no --> I[status needs_update]\n    H -- yes --> J[run job on cached connection]\n```\n\n## Redraw signal (`signal.rs`)\n\n`WidgetSignal` is held in app state, and every Todo write command goes through `todo_changed()`. Reads and comments never do. It counts calls (read by tests) and invokes a platform function pointer:\n\n- `platform_notify` on Android calls `android::notify_todo_changed`, a package-scoped redraw request to the widgets.\n- On other platforms it does nothing.\n- `WidgetSignal::silent()` (tests only) counts without notifying.\n\n`follow_settings` subscribes to the core `EventBus` for `SettingsChanged`. It fires the signal only when `mnemora_todo::settings_affect_widget(module, keys)` says the setting changes what the widget draws: the theme, time format, week start, and Todo grouping and sorting.\n\n## JNI layer (`android.rs`, Android only)\n\n| Item | Role |\n|---|---|\n| `register_app(AppHandle)` | Called from app setup. Stores the handle in `APP` so bridge calls use the app's connection instead of opening their own. |\n| `nativeAttach()` | Called by `WidgetBridge.kt`. Stores the `JavaVM` and a global ref to the class in `NOTIFIER`, so Rust can call back from any thread. If a signal fired earlier (`MISSED`, e.g. setup finished first), it replays it. |\n| `nativeCall(dataDir, request)` | One JSON request in, one JSON reply out. Returns null if the strings cannot be read or the reply cannot be made. The caller then shows its read-error state. |\n| `notify_todo_changed()` | Attaches the current thread and calls static `WidgetBridge.onTodoChanged()`. It clears any pending Java exception, which would poison the thread's next JNI call. It stores `MISSED` if the notifier is not attached yet. |\n| `answer` / `start_logging` | Chooses `Live` or `Standalone`. In standalone mode it starts logging into the same log directory as the app (kept alive in `LOG`) at `info` level. |\n\nProcess-wide state is held in `OnceLock`s (`APP`, `STANDALONE`, `LOG`, `NOTIFIER`) and an `AtomicBool` (`MISSED`).\n\n## How it fits in the system\n\n- **Inbound:** Kotlin widget components (see [Android_Integration](Android_Integration.md)) call `nativeCall` for snapshots, ticks, undo, and Quick add parsing and creation.\n- **Outbound:** Todo write commands in the [Tauri host](../Tauri_Host_and_Command_Layer.md) fire `WidgetSignal`. Writes arriving from [sync](../Sync_Replication_Engine.md) also trigger a widget redraw (see `sync_cluster_tests`).\n- **Shared rules:** the bridge adds no Todo logic of its own beyond JSON glue. Ticks, parsing and adds use `mnemora_todo` functions, so a task added or ticked on the widget is the same as one made in the app.\n- **Build:** the JNI symbols are compiled only for `target_os = \"android\"`. Elsewhere only tests drive the bridge (`#![cfg_attr(not(any(target_os = \"android\", test)), allow(dead_code))]`). See [Build_and_Packaging](../Build,_Tooling_and_Packaging/Build_and_Packaging.md).\n", "Android_and_Home-Screen_Widget_Platform/widget_tests.md": "# widget_tests\n\n`src-tauri/src/widget_tests.rs` is the Rust test suite for the Todo home-screen widget's bridge. It drives the bridge's single JSON entry point, `widget::handle`, exactly as the Kotlin side does (see ADR 0009 and ADR 0014). Each test runs against a temporary SQLite database or against an in-memory `TestApp`.\n\nThe code under test lives in [widget_bridge](widget_bridge.md): `widget/mod.rs` (`Request`, `Outcome`), `widget/source.rs` (`Live`, `Standalone`) and `widget/signal.rs` (`platform_notify`). The Kotlin callers are described in [Android_Integration](Android_Integration.md). The view-building logic is in [Todo_Widget](../Domain_Modules_(Todo_and_Journal)/Todo_Widget.md), which covers `WidgetView` and `widget_text`. The commands that the write-signal tests invoke belong to [Todo_Domain_Service](../Tauri_Host_and_Command_Layer/Todo_Domain_Service.md).\n\n## Architecture of the test harness\n\n```mermaid\nflowchart LR\n    T[Test case] -->|JSON request| H[widget::handle]\n    H --> S{Source}\n    S -->|Standalone| P[Phone fixture<br/>temp dir + file DB]\n    S -->|Live| A[TestApp<br/>in-memory DB, app connection]\n    P --> DB[(SQLite)]\n    A --> DB\n    A -->|platform_notify counter| SIG[widget_signals]\n    A -->|TodoChangedEvent| EV[count_events]\n    H -->|JSON reply| T\n```\n\n### Fixtures and helpers\n\n| Helper | Role |\n|---|---|\n| `Phone` | Fakes an Android data dir (`data/user/0/com.hemang.mnemora`) with `AppPaths` for Production. `fresh()` means the app has never run. `migrated()` returns a database with every Module migrated. `make_db(file, keep)` lets a test migrate only some Modules, and `set_theme` writes the device file. |\n| `Standalone` | The `Source` used when the app is not running. It opens the database itself and never migrates it. |\n| `Live` | The `Source` used when the app is alive. It uses the app's own connection and tells the app about writes. |\n| `TestApp` | From `test_support`. It offers `invoke`, `with_db`, `set_pref`, `widget_signals` and `handle`. |\n| `call`, `snapshot`, `view`, `context`, `read`, `added`, `tick`, `undo` | Thin wrappers over `handle` that build the request JSON and assert the shape of the reply. |\n| `add`, `new_list`, `repeat_daily`, `with_notes` | Seed data through the `mnemora_todo` API. |\n\nThe tests fix `TODAY = \"2026-10-21\"` (a Wednesday) with a clock of 14:05. Every request carries a `local` object (`today`, `now`, `offset_min`), so the day rolls over with the clock the widget sends.\n\n## Test groups\n\n### 1. Opening the database (Standalone)\n- `before_the_app_ever_ran_the_reply_is_not_set_up_and_nothing_is_created` and `lists_before_the_app_ran_is_not_set_up` expect `{status: \"not_set_up\"}`. They also check that no file or folder is created.\n- `a_pending_migration_means_needs_update_and_nothing_is_migrated` expects `needs_update`, and the test checks that `todo_tasks` was not created.\n- `the_database_is_found_where_the_device_setting_moved_it` covers a relocated `data_dir`.\n- `a_sandbox_build_refuses_a_production_data_dir` expects an `internal` error.\n\n### 2. Snapshots by view\nThe views are `today`, `upcoming`, `inbox`, `all` and `list:<id>`.\n- **Today:** overdue first, then today. Done tasks are hidden and Markdown marks are stripped. The grouping preference `group_today` is honoured. Rows carry a priority ring, a list chip and an overdue flag. The header reads \"N left\" or, in the overdue tone, \"N overdue\".\n- **Time and day labels:** the 12-hour setting applies. Rows not due today name their day in grey, except where a heading already does. The `day` and `time` fields are used differently for overdue rows.\n- **Empty states:** `an_empty_today_says_what_comes_next`, the \"Nothing coming up\" case, \"Inbox zero\", \"No open Tasks\" and an empty list naming itself. The next-task line says \"tomorrow HH:MM\", a weekday, or a date, depending on distance.\n- **Upcoming:** overdue plus the next 7 days, with a day heading such as \"Tomorrow · Thu 22\" or \"Mon 2 Nov\". It ignores the app's grouping preference.\n- **Inbox:** has a second \"No date, in a List\" group and follows `inbox_sort`.\n- **All:** grouped by list, with the Inbox first and then lists in sidebar order. Empty lists are left out, and `lists_sort` is followed.\n- **A list view:** follows its own sort and grouping. A missing or deleted list returns `not_found` with \"That List no longer exists\".\n- **Theme:** `every_snapshot_carries_the_apps_theme` and the `lists` method confirm the theme comes from the device file.\n\n### 3. Robustness\n`bad_requests_get_an_err_and_never_a_panic`, `bad_ticks_and_undos_are_errors_not_panics` and `bad_quick_add_requests_are_errors_and_create_nothing` feed malformed JSON, unknown methods, unknown views, bad dates, over-long or multi-line text and unknown list ids. Every case must return `err.code` and `err.message`, and no task may be created.\n\n### 4. Write signals\nUsing `TestApp::widget_signals`, these tests check that every list or task write signals the widget exactly once (`ok_once`):\n- `every_list_write_signals_the_widget_once`\n- `every_task_write_signals_the_widget_once`\n\nOther cases that must stay silent or fire only once:\n- Reads, comments and parse stay silent (`todo_reads_comments_and_settings_never_signal_the_widget`).\n- Only settings that change the drawing signal, and a batch counts as one signal (`settings_that_change_the_drawing_signal_once_and_others_do_not`).\n- A refused write stays silent.\n\n### 5. Ticking and Undo\n```mermaid\nsequenceDiagram\n    participant W as Widget (Kotlin)\n    participant B as handle()\n    participant D as Todo domain\n    W->>B: complete {id, tick_steps?}\n    alt open steps and tick_steps unset\n        B-->>W: kind=open_steps {count}\n    else\n        B->>D: complete_task (+ tick all steps)\n        B-->>W: kind=completed {message, lead, suffix, token}\n    end\n    W->>B: undo {token}\n    B->>D: reopen / rewind, restore notes\n```\n- Plain tasks complete, and undo reopens them.\n- Repeating tasks report \"· next Thu 22 Oct\". Undo rewinds the due date and removes the occurrence record.\n- Open steps: the widget asks first (`open_steps`) and changes nothing until answered. `tick_steps=false` leaves the notes alone. `tick_steps=true` ticks nested steps, and undo restores the original notes.\n- `ticking_on_the_widget_is_the_same_as_the_apps_complete_command` and `undoing_on_the_widget_is_the_same_as_reopening_in_the_app` compare task rows, change-log shape and History lines between the app command and the widget path, for both plain and repeating tasks.\n\n### 6. Telling a running app\n`a_live_app_answers_from_its_own_connection` shows that `Live` reads the in-memory database that a `Standalone` source could not see. `a_widget_write_while_the_app_is_alive_emits_todo_changed_once_per_write` and `adding_tells_a_running_app_once_and_a_refused_add_says_nothing` count `TodoChangedEvent`s. Reads emit none, and each successful write emits one.\n\n### 7. Quick add\nThe methods are `capture_context`, `parse` and `add`.\n- **Context:** `the_sheet_opens_in_the_place_each_view_stands_for` checks the placeholder and default date or list per view. A deleted list falls back to the Inbox. The context also carries lists, `parse_dates`, `week_start` and `time_format`.\n- **Parse:** word recognition matches the app's. Spans have kinds `date`, `time`, `prio` and `list`, and offsets count UTF-16 units. A conflicting phrase gives `alternatives`. `prefer` swaps the winner and `ignored` keeps words as text. An unknown `#Name` offers a new list. The `parse_dates` preference turns reading off. Chips set by hand lose to typed words.\n- **Add:** inherits the view's place, and typed words beat that place. A hash name that matches no list creates it, and the second use reuses it. A repeat word makes a repeating task, and the default priority is 4. `understood` JSON is stored.\n- **Parity:** `a_task_added_by_the_widget_is_the_task_the_app_would_add` compares the task, change log and History produced by the app's `todo_task_create` and by the widget's `add`.\n- **Change log:** `adding_writes_one_create_row_and_a_new_list_writes_its_own` checks one `create` row for the task, and one for the list when a new list is made.\n\n## Design principles the tests enforce\n1. **The widget never migrates and never creates files.** It reports `not_set_up` or `needs_update`.\n2. **Single source of truth.** Widget actions use the same domain functions as the app, so change log, History and sync behave identically. See [Sync_Replication_Engine](../Sync_Replication_Engine.md) for why that matters.\n3. **Exactly one redraw signal per write**, and none for reads.\n4. **Errors are data, not panics.** Every failure is a JSON `err` with `code` and `message`.\n5. **Environment isolation.** Sandbox builds refuse Production data.\n\n## Running\nThe suite runs with the Rust tests (`make test`; see [Build_and_Config](../Build,_Tooling_and_Packaging/Build_and_Config.md)). The widget tests use `tempfile` and need no emulator.\n", "Android_and_Home-Screen_Widget_Platform.md": "# Android and Home-Screen Widget Platform\n\n## Purpose\n\nThis module covers everything Mnemora needs to run on Android and to show a Todo home-screen widget. It has three parts:\n\n- **Android host layer (Kotlin).** `MainActivity` hosts the Tauri WebView. It adds system-bar styling, back-to-background, the Wi-Fi multicast lock for mDNS sync discovery, the Android 17 local-network permission, and lifecycle hooks for Sync and the widget. The widget itself is native UI: a provider, a setup screen, a Quick add sheet, a steps dialog, a tap receiver and `JobScheduler` jobs for timed redraws. It is offered on Android 12+ only.\n- **Rust widget bridge.** One JSON-in, JSON-out entry point, `widget::handle`, reached from Kotlin over JNI. It reads and writes Todo data through the same `mnemora_todo` rules the app uses, so Kotlin holds no business logic. In the other direction, Rust signals Android to redraw the widgets after Todo data changes.\n- **Bridge test suite.** `widget_tests.rs` drives the bridge as Kotlin does and pins its behaviour: the not-set-up and needs-update states, view snapshots, ticking and undo, Quick add, error handling and redraw signalling.\n\nDesign rules shared by all three parts:\n\n- The widget never migrates a database and never creates files.\n- Widget actions behave exactly like the app's own commands.\n- Every write sends exactly one redraw signal.\n- Failures come back as data, never as panics.\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph Android[\"Android process (Kotlin)\"]\n        MA[MainActivity]\n        WIDGET[\"Widget UI: TodoWidgetProvider, WidgetActionReceiver,<br/>QuickAddActivity, WidgetSetupActivity,<br/>StepsDialogActivity, WidgetJobService\"]\n        WB[WidgetBridge.kt]\n    end\n    subgraph RustSide[\"Rust (src-tauri/src/widget)\"]\n        JNI[\"android.rs: nativeAttach / nativeCall\"]\n        HANDLE[\"mod.rs: handle\"]\n        SRC{{\"source.rs: Live or Standalone\"}}\n        SIG[\"signal.rs: WidgetSignal\"]\n    end\n    TODO[mnemora_todo rules]\n    DB[(SQLite)]\n    TESTS[\"widget_tests.rs\"]\n\n    MA -->|attach| WB\n    WIDGET --> WB\n    WB -->|nativeCall JSON| JNI --> HANDLE --> SRC --> DB\n    HANDLE --> TODO\n    SIG -->|platform_notify| JNI\n    JNI -->|onTodoChanged| WB\n    TESTS -.->|drives| HANDLE\n```\n\n### Request and redraw flow\n\n```mermaid\nsequenceDiagram\n    participant U as User\n    participant K as Widget (Kotlin)\n    participant R as Rust bridge\n    participant A as Tauri app\n    U->>K: tap tick / Quick add\n    K->>R: nativeCall(request JSON)\n    R->>R: Live (app running) or Standalone (own connection)\n    R-->>K: ok / status / err reply\n    R-->>A: todo-changed event (if app is alive)\n    R-->>K: onTodoChanged, redraw widgets\n    K->>K: WidgetRenderer redraws\n```\n\nHow the layers cooperate:\n\n- **Two ways to reach the database.** If the app is alive in the process, the bridge answers from the app's own connection (`Live`) and the UI updates at once. Otherwise it opens the existing database read-only-in-spirit (`Standalone`). It reports `not_set_up` or `needs_update` rather than creating or migrating anything.\n- **Kotlin stays thin.** It builds requests, parses replies and draws. Parsing, ordering, completion and undo semantics all live in Rust.\n- **Threading and process survival.** Bridge calls run off the main thread. Work that must finish is handed to a `goAsync` receiver or a `JobScheduler` job.\n\n## Core components\n\n| Component | Responsibility | Documentation |\n|---|---|---|\n| Android Integration | `MainActivity` (JS bridge `window.MnemoraAndroid`, multicast lock, local-network permission, lifecycle) and the native Todo widget UI (provider, tap receiver, setup, Quick add, steps dialog, timed jobs) | [Android_Integration](Android_and_Home-Screen_Widget_Platform/Android_Integration.md) |\n| widget_bridge | Rust side of the widget: JSON protocol, `Live` and `Standalone` sources, redraw signal and JNI entry points | [widget_bridge](Android_and_Home-Screen_Widget_Platform/widget_bridge.md) |\n| widget_tests | Rust test suite that pins the bridge's behaviour using temporary databases and an in-memory `TestApp` | [widget_tests](Android_and_Home-Screen_Widget_Platform/widget_tests.md) |\n\n## Related modules\n\n- Todo rules used by the bridge: [Todo_Widget](Domain_Modules_(Todo_and_Journal)/Todo_Widget.md) and [Todo_Tasks_and_Lists](Domain_Modules_(Todo_and_Journal)/Todo_Tasks_and_Lists.md)\n- Sync power and network JNI entry points: [Sync_Connectivity_and_Pairing](Tauri_Host_and_Command_Layer/Sync_Connectivity_and_Pairing.md)\n- Build and packaging of the Android library: [Build_and_Packaging](Build,_Tooling_and_Packaging/Build_and_Packaging.md)", "Backend_Integration_Test_Suites/AI_Data_and_Provider_Tests.md": "# AI_Data_and_Provider_Tests\n\nCommand-layer integration tests for the AI Module's stored data and its Providers. They live in `src-tauri/src/` and drive the **real Tauri commands** (`ai_*`) through the mock runtime (`TestApp`, see ADR 0009), not the internal crates directly. A scripted Provider (`mnemora_harness::scripted::ScriptedProvider`) stands in for the Model where a test needs a fixed outcome. Other tests run the real Wrapper adapter against an in-process loopback `FakeServer` (`mnemora_providers::testing`), so there is no network and no real Model.\n\nThe sibling suite [AI_Run_Engine_Tests](AI_Run_Engine_Tests.md) covers the Run loop: tracer, tools, run control and wire format. This page covers the data around it: Branches, Conversations, Providers, Saved questions and sync. The commands under test are described in [AI_Assistant_Commands](../Tauri_Host_and_Command_Layer/AI_Assistant_Commands.md). The crates behind them are documented in [AI_Module](../AI_Assistant_Backend/AI_Module.md), [Agent_Harness](../AI_Assistant_Backend/Agent_Harness.md) and [LLM_Providers](../AI_Assistant_Backend/LLM_Providers.md).\n\n## Architecture\n\n```mermaid\ngraph TD\n  subgraph Tests[\"AI_Data_and_Provider_Tests\"]\n    BR[ai_branching_tests.rs]\n    CV[ai_conversations_tests.rs]\n    PR[ai_provider_tests.rs]\n    SV[ai_saved_tests.rs]\n    SY[ai_sync_tests.rs]\n  end\n  TR[ai_tracer_tests helpers: ask, get, install, scripted, until_end]\n  TA[test_support::TestApp / Cluster]\n  CMD[ai_* Tauri commands]\n  AI[mnemora_ai]\n  H[mnemora_harness ScriptedProvider]\n  P[mnemora_providers FakeServer]\n  FX[(src/lib/ipc/fixtures/*.json)]\n  Tests --> TR --> TA --> CMD --> AI\n  AI --> H\n  AI --> P\n  CV --> FX\n  PR --> FX\n  SY --> SYNC[sync tests: group, meet, paired_pair]\n```\n\nShared helpers come from [AI_Run_Engine_Tests](AI_Run_Engine_Tests.md) (`ask`, `get`, `install`, `scripted`, `until_end`, `ended_outcome`, `label`, `provider_id`, `local`). The sync tests also use the cluster helpers from the sync test files, described in [Sync_Replication_Engine](../Sync_Replication_Engine.md) and [Sync_Connectivity_and_Pairing](../Tauri_Host_and_Command_Layer/Sync_Connectivity_and_Pairing.md).\n\n## Test files\n\n### ai_branching_tests.rs\nBranches are sibling questions in a Conversation.\n- **Try again** (`ai_run_retry`) adds a sibling question and runs it. The Model is sent only what the original followed. The pager reports `sibling_index` and `sibling_count`.\n- **Edit** (`ai_run_start` with `branch_of`) adds an edited sibling that sits beside the question it changed.\n- **Branch from earlier** (`ai_conversation_set_leaf`) continues after a chosen answer. The Model sees only the context up to that answer. The original Branch stays reachable via `ai_conversation_show_branch`, and an out-of-range position is refused.\n- Entries from another Conversation, unknown entries, and retrying a non-question are refused.\n- A Conversation that is too long (budget exhausted, ADR 0018) fails with `Failure::TooLong`. The over-budget request is never sent. The two exits are branching from an earlier answer or starting a new Conversation.\n- Copy as Markdown copies only the Branch that is shown.\n- The shown Branch is device-local: setting it writes nothing to `change_log`.\n\n### ai_conversations_tests.rs\nManaging Conversations: history, rename, delete and restore, and Markdown copy.\n- The history is newest first, 30 per page, with a `more` flag. Search matches titles only, not entry text, and a blank query lists everything.\n- Shared JSON fixtures (`ai-rename.json`, `ai-history.json`, `ai-markdown.json`) are run through the Rust commands. The browser mock uses the same fixtures, which keeps the two implementations consistent.\n- Rename trims and collapses whitespace. A refused rename saves nothing, and a missing Conversation gives `not_found`.\n- Delete hides the Conversation and restore brings back every entry. Deleting a Conversation that is still answering gives a `validation` error.\n- Markdown output has the form `# title`, `**You:** …`, then the answer. Citation markers `[uuid]` are stripped from a single answer.\n\n### ai_provider_tests.rs\nProviders, keys, connection tests, model search and usage, and Run failures.\n- CRUD for a `wrapper` Provider. It needs no key (`key_state: not_needed`), and the address is normalised (trailing `/` removed).\n- Address rules are enforced on create and update: plain `http` is allowed only for local or private hosts, and the scheme must be valid. Names are required and at most 40 characters. These checks match `ai-addresses.json` via `mnemora_providers::address::check`.\n- A kind that takes no key refuses one, and the `ai-keys` folder stays empty.\n- `ai_provider_test` reports `Connected · N models` or a one-sentence failure such as `key_rejected` or `unreachable`. Raw upstream text (the `SECRET` marker) never reaches the screen.\n- `ai_models_search` queries the Provider only when called and filters by text. `ai_models_usage` lists recent and most-used models and drops deleted Providers.\n- Failure mapping: HTTP 404, 429, 504, 502, 503 and 400 each map to a `Failure` kind with its fixed wording (`ai-failures.json`), and the question is kept. `Offline` and `Interrupted` appear after a partial text delta.\n- A deleted Provider leaves its Conversations readable.\n- The Android backup rules (`backup_rules.xml`, `data_extraction_rules.xml`) must exclude the key folder for both the Production and Sandbox identifiers.\n\n### ai_saved_tests.rs\nSaved questions: create, trimmed rename, reorder between two neighbours (`afterId`, `beforeId`), delete and restore in place, and refusal of blank text (`Type a question first.`). Editing or moving a deleted item gives `not_found`. Running a saved question is an ordinary Run that produces a Conversation titled with its text and leaves the list unchanged.\n\n### ai_sync_tests.rs\nSync of the AI Module (ADR 0019) over the in-memory `Cluster` of two devices, each with its own scripted Provider.\n- A Conversation and its entries read the same on both devices. The Provider name and Model id travel as text in a `model_change` entry.\n- Continuations on two devices become two Branches on both devices, in the same order, and each device keeps showing its own Branch.\n- History order, rename, delete and undo, and Saved question order and delete converge.\n- Concurrent renames of one title raise one conflict that both devices show, and `keep_other` writes the title back and converges. The same holds for Saved question text.\n- Only `ai_conversation`, `ai_entry` and `ai_saved_question` are ever logged. Providers, keys, usage and the visible Branch never leave the device, and no Provider address appears in the log.\n- A device continuing a Conversation uses its own Provider.\n- Pre-change-log rows are backfilled to the other device.\n- Differing AI data versions pause sync until the older device updates (`pause.kind = \"update\"`). Rows received while the Module is off are stored and show once it is turned on.\n\n## Typical flow\n\n```mermaid\nsequenceDiagram\n  participant T as Test\n  participant A as TestApp\n  participant C as ai_* command\n  participant P as ScriptedProvider / FakeServer\n  T->>A: install(provider)\n  T->>C: ai_run_start / retry\n  C->>P: request (messages)\n  P-->>C: scripted reply or canned HTTP\n  C-->>T: run events (until_end), saved entries\n  T->>C: ai_conversation_get\n  T->>T: assert thread, pager, change_log\n```\n\n## Related config\nTests run with `make test`; see [Build_and_Config](../Build,_Tooling_and_Packaging/Build_and_Config.md).\n", "Backend_Integration_Test_Suites/AI_Run_Engine_Tests.md": "# AI_Run_Engine_Tests\n\nCommand-layer integration tests for the AI assistant's **Run engine**. They live in `src-tauri/src/` as four sibling test modules:\n\n| File | Focus |\n|---|---|\n| `ai_tracer_tests.rs` | The \"tracer bullet\": ask a question, get one saved Conversation with ordered run events. Also owns the shared helpers. |\n| `ai_tools_tests.rs` | The six read-only Tools (`journal_list`, `journal_search`, `journal_read`, `todo_list`, `todo_search`, `todo_read`), citation checks, step budget, repeat detection. |\n| `ai_run_control_tests.rs` | Stop, queued notes (\"steer\"), send-now, Android backgrounding, concurrent Conversations. |\n| `ai_wire_tests.rs` | Real wire adapters (Wrapper JSON envelope, OpenAI-compatible, Anthropic, OpenRouter) against a loopback fake server. |\n\nNone of them touch the network or a real Model. They drive the real Tauri commands (`ai_run_start`, `ai_conversation_get`, `ai_run_abort`, `ai_run_steer`, …) through the mock runtime (ADR 0009) via `TestApp`, and read results back from the saved Conversation entries and the typed `AiRunEvent` stream.\n\nRelated modules: [AI_Assistant_Commands](../Tauri_Host_and_Command_Layer/AI_Assistant_Commands.md) (the commands under test), [AI_Module](../AI_Assistant_Backend/AI_Module.md), [Agent_Harness](../AI_Assistant_Backend/Agent_Harness.md) (`ScriptedProvider`, run loop), [LLM_Providers](../AI_Assistant_Backend/LLM_Providers.md) (adapters, `FakeServer`). Sibling suites: [AI_Data_and_Provider_Tests](AI_Data_and_Provider_Tests.md) (reuses these helpers), [todo_sheet_tests](todo_sheet_tests.md).\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph Tests\n        T[ai_tracer_tests<br/>helpers: install, ask, get, until_end, label]\n        TL[ai_tools_tests]\n        RC[ai_run_control_tests]\n        W[ai_wire_tests]\n    end\n    TL --> T\n    RC --> T\n    RC --> W\n    TA[TestApp / test_support] --> CMD[ai_* commands]\n    T --> TA\n    TL --> TA\n    RC --> TA\n    W --> TA\n    CMD --> AI[mnemora_ai run engine]\n    AI --> H[mnemora_harness agent loop]\n    H -->|scripted tests| SP[ScriptedProvider]\n    H -->|wire tests| AD[mnemora_providers adapters]\n    AD --> FS[FakeServer loopback]\n    AI --> DB[(SQLite: ai_*, journal, todo)]\n    AI -->|AiRunEvent| EV[Receiver AiRunEvent]\n    T --> EV\n```\n\nTwo provider strategies:\n\n- **Scripted** (tracer, tools, run-control): `install()` calls `app.set_ai_provider(...)` to replace the adapter every Run uses, and still creates a `wrapper` Provider record (address `http://127.0.0.1:9/v1`, never contacted) because the command validates the record. Each `Reply` is one Step: `Reply::text(&[chunks])`, `Reply::calls(&[(tool, args)])`, `Reply::fail(Failure)`, `Reply::length_calls`. Gating modifiers `.held(gate)` / `.held_after_first(gate)` block on an `mpsc` channel so a test can act mid-Step. `provider.requests()` exposes what the Model was sent (messages, tools, system prompt).\n- **Wire** (`ai_wire_tests`): the real adapter talks to `FakeServer` (`Canned::json`, `Canned::sse`, `.delayed`) so request bodies, headers and paths are asserted.\n\n## Shared helpers (`ai_tracer_tests`)\n\n| Helper | Role |\n|---|---|\n| `local()` | Client-local context: `today=2026-10-25`, `Sunday`, `Europe/London`, `week_start=mon`. |\n| `scripted`, `install`, `provider_id` | Build/install the scripted Provider; fetch the first Provider id. |\n| `ask(app, conversation?, text)` | Calls `ai_run_start`; returns `Result<Value, Value>` (error has `code`, `message`). |\n| `get` | `ai_conversation_get`. |\n| `until_end` | Collects `AiRunEvent`s (5 s timeout) through `RunEnded`. |\n| `label` | Event type, plus entry kind: `entrySaved:user`. |\n| `ended_outcome`, `conversation_count` | Final `RunOutcome`; row count of `ai_conversations`. |\n\n## Run lifecycle verified\n\n```mermaid\nsequenceDiagram\n    participant Test\n    participant Cmd as ai_run_start\n    participant Run as Run engine\n    participant Model as ScriptedProvider\n    Test->>Cmd: question, provider_id, model, local\n    Cmd-->>Test: {run_id, conversation_id}\n    Run-->>Test: runStarted, entrySaved:user\n    loop each Step (max 12)\n        Run->>Model: messages + tools + system prompt\n        Model-->>Run: text deltas / tool calls\n        Run-->>Test: stepStarted, textDelta*, entrySaved:assistant\n        Run-->>Test: toolStarted, entrySaved:tool_result, toolEnded\n    end\n    Run-->>Test: runEnded(Answered | Stopped | Failed)\n```\n\n## Test groups\n\n### Tracer (`ai_tracer_tests`)\n- Event order for a plain answer: `runStarted, entrySaved:user, stepStarted, textDelta×n, entrySaved:assistant, runEnded`.\n- Stored entries: `model_change` (parent null) → `user` → `assistant` (with `stop`, `provider`, `model`, `calls`, `sources`, `budget_note`).\n- Title is the trimmed, capped first question, driven by the shared fixture `src/lib/ipc/fixtures/ai-title.json` (also used by the browser mock).\n- A second question continues the branch and the Model is sent the whole history.\n- The system prompt contains date, weekday, time zone and week start.\n- Refusals save nothing: blank question (`validation`, \"Type a question first.\"), no Provider or unknown Conversation (`not_found`), a Conversation still answering (`validation`).\n- A failed Step (`Failure::Unreachable`) keeps the question and ends with `failure_message`.\n\n### Tools (`ai_tools_tests`)\nSeeds real data via `journal_entry_create` / `todo_task_create` and asserts through saved `tool_result` payloads.\n- list → read → cite flow produces `Sources` (`id`, `module`); a cited id no Tool returned triggers a correction turn.\n- Six Tools: defaults, paging (`next_offset`, `null` on last page), deleted rows skipped, `todo_list` `closed_from/closed_to` default to done tasks, explicit `state` wins, ordered by close time newest first.\n- Errors are results (`is_error`) and the Run goes on: missing id, bad arguments, unknown fields; three invalid replies in a row → `Failure::BadResponse`.\n- Limits: ≤8 calls per Step (ninth returns \"at most eight\"); 12th request has no Tools and the answer carries `budget_note` \"Answered after 12 steps; there may be more to find\"; 100 KB prompt budget → `Failure::TooLong`; exact repeats get the earlier observation, three in a row withdraw Tools; a `length` stop does not execute its calls (\"cut off\").\n- Providers without native tools get no Tools and a prompt saying \"cannot use Tools\"; disabling a module (`core.disabled_modules`) removes its Tools and the prompt says \"Todo is turned off\".\n- Two tests are `#[ignore]`d: IANA time-zone support (`closed_at_local`, client-zone days) is blocked on a time-zone crate.\n\n### Run control (`ai_run_control_tests`)\n\n```mermaid\nstateDiagram-v2\n    [*] --> Running\n    Running --> Stopped: ai_run_abort\n    Running --> Running: ai_run_steer (note queued)\n    Running --> Running: tools finish → note sent as user entry\n    Running --> Answered: send_now ends step, note answered\n    Running --> Interrupted: app sent to background\n    Stopped --> [*]: queued notes handed back via QueueChanged\n```\n\n- Stop keeps the partial answer (`stop: \"aborted\"`) and the next question sees it as the Model's own text; stop before any text leaves an empty assistant entry that is not sent to the Model; stop mid-calls records unrun calls as error results (\"stopped before this call ran\").\n- Notes: trimmed, shown in `get().queued`, unqueue removes, queued notes are sent after the Step's Tools finish; leftover notes are handed back on end and further steering fails.\n- Send-now ends the current Step (`stop: \"stop\"`, not shown as stopped) and sends the note next; on the budget-forced last answer it stops the Run with no 13th request and hands the note back.\n- Android background → `Failure::Interrupted`.\n- Two Conversations can run concurrently.\n- Stop on a blocked HTTP reply (delayed `FakeServer`) ends in <1 s and the late reply is never written.\n\n### Wire adapters (`ai_wire_tests`)\n- **Wrapper**: JSON envelope (`action: tools|finish`), `response_format` strict schema, tools listed in the prompt, results returned as `Result of …:` turns; unseen sources corrected; repeats refused (\"repeats call\"); prose replies corrected, three → `BadResponse` after exactly 3 requests.\n- **OpenAI-compatible**: native `tools`, SSE tool calls, `tool` role messages with `tool_call_id`; key is optional, write-only (`key_state`, never echoed), sent as `Bearer`.\n- **Anthropic**: fixed address `https://api.anthropic.com/v1`, key required (run refused without), `/v1/messages`, `x-api-key`, `max_tokens: 8192`, `tool_result` blocks.\n- **OpenRouter**: fixed address, `allow_paid` off by default; models listing flags `paid_models`; paid model refused while off (no chat request sent); free routes sent with `provider.max_price = {prompt:0, completion:0}`, paid routes carry no cap once enabled.\n\n## Notes for maintainers\n- Helpers are `pub(crate)` and reused by [AI_Data_and_Provider_Tests](AI_Data_and_Provider_Tests.md); changing signatures such as `ask`, `install`, `until_end` ripples there.\n- Several tests sleep briefly or poll `provider.requests()` to synchronise with the engine thread; keep the 5 s event timeout in mind when adding gated tests.\n- Run with `make test` (see [Build_and_Config](../Build,_Tooling_and_Packaging/Build_and_Config.md)); `cargo test -- --ignored` shows the time-zone tests failing until the crate is added.\n", "Backend_Integration_Test_Suites/todo_sheet_tests.md": "# todo_sheet_tests\n\n`src-tauri/src/todo_sheet_tests.rs` is the command-layer integration suite for the Todo **Task sheet** rules. It covers Priority, Won't do, open steps, editing sessions, delete/restore/purge, Comments and History. The tests call the real Tauri commands (`todo_task_*`, `todo_comment_*`, `todo_list_*`, `todo_today`, `todo_upcoming`, `todo_inbox`, …) through the mock runtime described in ADR 0009. They then check both the command results and the underlying SQLite state (`change_log`, `todo_tasks`, `todo_comments`, `todo_tasks_fts`).\n\nThe suite tests behaviour implemented in [Todo_Domain_Service](../Tauri_Host_and_Command_Layer/Todo_Domain_Service.md) (the command layer) and [Todo_Tasks_and_Lists](../Domain_Modules_(Todo_and_Journal)/Todo_Tasks_and_Lists.md) and [Todo_Comments](../Domain_Modules_(Todo_and_Journal)/Todo_Comments.md) (the domain crate). Sibling suites live in [Backend_Integration_Test_Suites](../Backend_Integration_Test_Suites.md). Capture, ordering and search tests are covered alongside the Todo command service.\n\n## Architecture\n\n```mermaid\ngraph TD\n    T[todo_sheet_tests.rs] -->|invoke command JSON| A[TestApp mock runtime<br/>test_support.rs]\n    A --> C[src-tauri todo.rs commands]\n    C --> M[mnemora_todo::TodoModule]\n    M --> DB[(SQLite)]\n    DB --> CL[change_log]\n    DB --> TT[todo_tasks / todo_comments / todo_lists]\n    DB --> FTS[todo_tasks_fts]\n    T -->|with_db raw SQL asserts| DB\n    T -->|run_startup| M\n    A --> CK[clock freeze]\n```\n\nHelpers from `test_support` (see [Tauri_Host_and_IPC_Bridge](../Tauri_Host_and_Command_Layer/Tauri_Host_and_IPC_Bridge.md)): `TestApp` (`invoke`, `with_db`, `set_pref`, `clock`, `run_startup`), `close_all_on`, `inbox_tasks_of`, `tasks_of`.\n\n### Local helpers\n\n| Helper | Purpose |\n|---|---|\n| `local(today)` | Builds the `{today, now: \"14:05\", offset_min: 0}` device-time argument; `TODAY` is `2026-10-21`. |\n| `create`, `dated`, `repeating` | Make a task, optionally with a due date/time or a daily fixed repeat. |\n| `priority`, `complete`, `update`, `get`, `comment`, `bodies` | Thin wrappers over the commands. |\n| `history`, `log`, `log_len`, `count` | Read History lines, `(op, entity)` change records, and raw SQL counts. |\n| `inbox`, `titles` | Extract titles from views. |\n| `age` | Backdates `deleted_at` to simulate time passing for purge tests. |\n\n## Test groups\n\n```mermaid\nflowchart LR\n    P[Priority] --- W[Won't do]\n    W --- S[Open steps]\n    S --- E[Editing sessions]\n    E --- D[Delete / restore / purge]\n    D --- C[Comments]\n    C --- H[History]\n```\n\n### Priority\n- `a_task_starts_at_priority_four_and_takes_one_to_four`: default P4, valid 1–4, otherwise a `validation` error.\n- `a_priority_change_is_one_update_and_the_same_priority_records_nothing`: one `update/todo_task` change record; a no-op writes none.\n- `priority_needs_an_open_task_and_a_known_one`: closed task gives `validation`, unknown id gives `not_found`.\n- `within_a_time_block_today_orders_by_priority_then_manual_order` and `upcoming_days_order_by_priority_inside_each_block_too`: priority orders only inside a time block; timed tasks keep their place before untimed ones.\n\n### Won't do\n- `wont_do_closes_the_task_into_done_without_counting_as_done`: state `wont`, with `closed_at` set. It appears in Done but is excluded from Today's progress total and from the sidebar counts.\n- `wont_do_is_a_tick_that_reopening_undoes`: both directions are `tick` records.\n- `wont_do_is_refused_for_a_closed_and_an_unknown_task`: `validation` and `not_found` errors.\n- `wont_do_on_a_repeating_task_skips_it_in_rust`: acts as a skip, moves to the next date and writes a single `tick`. History reads `Skipped (Wed → Sat)`.\n\n### Open steps\n- `completing_with_open_steps_is_still_allowed_and_tick_all_is_a_notes_update_first`: plain Complete leaves notes unchanged. \"Tick all and complete\" is a notes update followed by a complete.\n\n### Editing sessions\n- `saves_of_one_session_make_one_record_and_a_new_session_makes_another`: the same `sessionId` coalesces into one record, and saving unchanged text writes nothing.\n- `updates_refuse_bad_titles_missing_sessions_and_unknown_tasks`: empty, multi-line or over-500-character titles, a blank session id (`validation`), unknown task (`not_found`); nothing is logged.\n- `notes_over_100000_characters_are_refused`: 100,000 characters is the limit.\n- `notes_and_titles_are_searchable_after_an_update`: the FTS index follows edits.\n\n### Delete, restore, purge\n- `deleting_leaves_every_view_at_once_and_restore_puts_the_task_back_in_place`: records `delete` then `restore`; the delete snapshot carries `deleted_at`.\n- `deleting_twice_restoring_a_live_task_and_unknown_ids_are_refused`.\n- `a_task_restored_after_its_list_was_deleted_returns_to_the_inbox`.\n- `what_was_deleted_over_thirty_days_ago_survives_a_restart_with_its_change_log`: after `run_startup(&TodoModule)` the purge removes the aged tasks, lists and comments from their tables. The `change_log` is untouched and the old delete can still be restored.\n\n### Comments\n- Add, edit, delete and restore: `comments_are_added_oldest_first_trimmed_and_counted_on_the_task`, `bad_comments_are_refused_and_record_nothing`, `a_comment_may_hold_line_breaks_and_up_to_5000_characters` (counted in characters), `an_edited_comment_says_so_and_the_same_text_is_no_edit`, `deleting_a_comment_is_undone_by_restoring_it_without_marking_it_edited`, `a_done_task_can_still_be_commented`.\n- Repeating tasks: `comments_move_with_the_occurrence_and_the_counts_follow`, `completing_the_same_occurrence_again_after_a_reopen_reuses_its_row` (one occurrence has one id) and `deleting_a_comment_and_completing_with_comments_record_and_stamp_them`. Comments, including deleted ones, are re-parented to the occurrence as `move` records carrying the full snapshot, and their `updated_at` is stamped. These records matter to [Sync_Replication_Engine](../Sync_Replication_Engine.md).\n\n### History\nHistory lines are derived from `change_log` with newest first and never contain the task's own text.\n- `history_reads_the_change_log_as_lines_newest_first`: for example `Priority P4 → P1`, `Due date Thu 22 Oct → Fri 23 Oct`, `Moved 📥 Inbox → 💼 Work`.\n- `history_lines_never_hold_the_tasks_own_text`\n- `title_and_notes_edits_make_one_line_per_opening_of_the_sheet` and `one_opening_is_one_line_per_field_even_when_other_changes_happen_in_between`.\n- `repeats_and_removals_read_naturally`: for example `Repeat set: Every 2 weeks on Mon, Sat` and `Time removed`.\n- `completing_a_repeating_task_reads_as_an_occurrence_and_so_does_its_copy` and `a_skip_reads_as_skipped_and_not_as_an_occurrence_or_a_date_edit`: `Done (occurrence of 21 Oct)`, `Reopened (occurrence of …)`, `Skipped (Thu → Sat)`.\n- `history_shows_deleted_and_restored_and_names_a_deleted_list`\n- `history_of_an_unknown_task_is_not_found`\n- `history_stays_in_the_order_things_happened_when_the_wall_clock_stands_still_or_goes_back`: the test freezes the app clock, so ordering relies on the `change_log` rowid/sequence rather than the wall clock.\n\n## Key invariants\n\n```mermaid\nsequenceDiagram\n    participant Test\n    participant Cmd as todo_task_update\n    participant Log as change_log\n    Test->>Cmd: title/notes, sessionId s1\n    Cmd->>Log: create session record\n    Test->>Cmd: more notes, sessionId s1\n    Cmd->>Log: rewrite same record (no new row)\n    Test->>Cmd: sessionId s2\n    Cmd->>Log: new record\n```\n\n- Refused commands change and log nothing (`log_len` unchanged).\n- Equal-value writes are no-ops.\n- State changes (done, won't do, reopen, skip) are `tick` records; deletes are `delete`/`restore` records and never erase the log.\n- Error codes are `validation` and `not_found`.\n\n## Running\n\n`make test` runs the Rust and frontend tests (see [Build_and_Config](../Build,_Tooling_and_Packaging/Build_and_Config.md)). To run only this suite, use `CARGO_BUILD_JOBS=2 cargo test -p mnemora-app todo_sheet_tests`. The crate name `mnemora-app` is an assumption; check `src-tauri/Cargo.toml`.\n", "Backend_Integration_Test_Suites.md": "# Backend_Integration_Test_Suites\n\n## Purpose\n\nThis module holds the command-layer integration tests for the Rust backend. T
