<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mnemora_v1</title>
    <link rel="icon" type="image/png" href="codewiki-icon.png">
    <script>
        // Apply persisted theme before first paint to avoid a flash of the wrong theme
        (function() {
            try {
                var theme = localStorage.getItem('codewiki-theme');
                if (!theme) {
                    theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" id="hljs-theme-light">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" id="hljs-theme-dark" disabled>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11.9.0/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.0.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-gfm-heading-id@3.1.3/lib/index.umd.js"></script>
    <style>
        :root {
            --primary-color: #d95f00;
            --active-nav-bg: #0d2b50;
            --active-nav-text: #ffffff;
            --secondary-color: #f1f5f9;
            --text-color: #334155;
            --border-color: #e2e8f0;
            --hover-color: #f8fafc;
            --code-bg: #f8fafc;
            --page-bg: #ffffff;
            --panel-bg: #ffffff;
            --heading-color: #1e293b;
            --subheading-color: #475569;
            --body-color: #475569;
            --muted-color: #64748b;
            --inline-code-color: #e11d48;
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --error-color: #991b1b;
            --backdrop-color: rgba(15, 23, 42, 0.5);
            --lightbox-bg: rgba(255, 255, 255, 0.97);
        }

        html[data-theme="dark"] {
            color-scheme: dark;
            --primary-color: #ff9a2e;
            --active-nav-bg: #c45100;
            --active-nav-text: #ffffff;
            --secondary-color: #111827;
            --text-color: #cbd5e1;
            --border-color: #334155;
            --hover-color: #1e293b;
            --code-bg: #0d1117;
            --page-bg: #0f172a;
            --panel-bg: #1e293b;
            --heading-color: #f1f5f9;
            --subheading-color: #cbd5e1;
            --body-color: #94a3b8;
            --muted-color: #94a3b8;
            --inline-code-color: #f472b6;
            --error-bg: rgba(127, 29, 29, 0.25);
            --error-border: #7f1d1d;
            --error-color: #fca5a5;
            --backdrop-color: rgba(0, 0, 0, 0.6);
            --lightbox-bg: rgba(15, 23, 42, 0.97);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--page-bg);
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 320px;
            background-color: var(--secondary-color);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
            position: fixed;
            height: 100vh;
            z-index: 200;
        }

        .content {
            flex: 1;
            margin-left: 320px;
            padding: 40px 60px;
            max-width: calc(100% - 320px);
        }

        .content-inner {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 220px;
            gap: 48px;
            align-items: start;
        }

        .content-inner.no-toc {
            grid-template-columns: minmax(0, 1fr);
        }

        .content-inner.no-toc .toc {
            display: none;
        }

        .doc-column {
            min-width: 0;
            max-width: 920px;
        }

        .sidebar-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 15px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .logo-mark {
            width: 34px;
            height: 34px;
            flex: 0 0 34px;
            object-fit: contain;
        }

        .logo-title {
            overflow: hidden;
            color: var(--heading-color);
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .theme-toggle {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--panel-bg);
            font-size: 15px;
            line-height: 1;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .theme-toggle:hover {
            border-color: var(--primary-color);
        }

        .repo-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: var(--panel-bg);
            color: var(--primary-color);
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .repo-link:hover {
            background: var(--hover-color);
            border-color: var(--primary-color);
        }

        .repo-info {
            margin: 0 0 20px 0;
            padding: 15px;
            background: var(--hover-color);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .repo-info h4 {
            margin: 0 0 10px 0;
            font-size: 12px;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .info-row {
            font-size: 11px;
            color: var(--body-color);
            line-height: 1.6;
            margin-bottom: 4px;
        }

        .info-row strong {
            font-weight: 600;
            min-width: 80px;
            display: inline-block;
        }

        .nav-filter {
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            background: var(--panel-bg);
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s;
        }

        .nav-filter:focus {
            border-color: var(--primary-color);
        }

        .nav-filter::placeholder {
            color: var(--muted-color);
        }

        .nav-section {
            margin-bottom: 12px;
        }

        .nav-section h3 {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            padding: 8px 12px;
        }

        .nav-item {
            display: block;
            padding: 10px 12px;
            color: var(--text-color);
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s ease;
            margin-bottom: 2px;
            cursor: pointer;
        }

        .nav-item:hover {
            background-color: var(--panel-bg);
            color: var(--primary-color);
        }

        .nav-item.active {
            background-color: var(--active-nav-bg);
            color: var(--active-nav-text);
        }

        .nav-item.nav-parent {
            font-weight: 600;
            font-size: 13px;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-item.nav-parent.active {
            color: var(--active-nav-text);
        }

        .nav-row {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .nav-row .nav-item {
            flex: 1;
            min-width: 0;
        }

        .nav-toggle {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            padding: 0;
            color: var(--muted-color);
            font-size: 11px;
            cursor: pointer;
            transition: transform 0.15s ease;
            transform: rotate(90deg);
        }

        .nav-group.collapsed > .nav-row .nav-toggle {
            transform: none;
        }

        .nav-group.collapsed > .nav-children {
            display: none;
        }

        .nav-children {
            margin-left: 14px;
        }

        .nav-children .nav-item {
            font-size: 13px;
            padding: 8px 12px;
        }

        .nav-children .nav-children .nav-item {
            font-size: 12px;
            padding: 6px 10px;
        }

        .nav-hidden {
            display: none !important;
        }

        #navigation.filtering .nav-group.filter-open > .nav-children {
            display: block;
        }

        .markdown-content {
            max-width: 100%;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3,
        .markdown-content h4,
        .markdown-content h5,
        .markdown-content h6 {
            scroll-margin-top: 1rem;
        }

        .markdown-content h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--heading-color);
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .markdown-content h2 {
            font-size: 2rem;
            font-weight: 600;
            color: var(--text-color);
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .markdown-content h3 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--subheading-color);
            margin-top: 2rem;
            margin-bottom: 0.75rem;
        }

        .markdown-content h4 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--subheading-color);
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .markdown-content p {
            margin-bottom: 1rem;
            color: var(--body-color);
        }

        .markdown-content ul, .markdown-content ol {
            margin-bottom: 1rem;
            padding-left: 2rem;
        }

        .markdown-content li {
            margin-bottom: 0.5rem;
            color: var(--body-color);
        }

        .markdown-content code {
            background-color: var(--code-bg);
            padding: 0.2em 0.4em;
            border-radius: 0.25rem;
            font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
            color: var(--inline-code-color);
        }

        .code-block {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .markdown-content pre {
            background-color: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1.25rem;
            overflow-x: auto;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .code-block pre {
            margin-bottom: 0;
        }

        .markdown-content pre code {
            background-color: transparent;
            padding: 0;
            font-size: 0.875rem;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 10px;
            font-size: 12px;
            font-family: inherit;
            color: var(--muted-color);
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s ease, border-color 0.15s ease;
        }

        .code-block:hover .copy-btn,
        .copy-btn:focus {
            opacity: 1;
        }

        @media (hover: none) {
            .copy-btn {
                opacity: 1;
            }
        }

        .copy-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .copy-btn.copied {
            color: #16a34a;
            border-color: #16a34a;
            opacity: 1;
        }

        .markdown-content blockquote {
            border-left: 4px solid var(--primary-color);
            padding-left: 1rem;
            margin: 1.5rem 0;
            font-style: italic;
            color: var(--muted-color);
            background: var(--hover-color);
            padding: 1rem 1rem 1rem 1.5rem;
            border-radius: 0 0.5rem 0.5rem 0;
        }

        .markdown-content table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .markdown-content th, .markdown-content td {
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            text-align: left;
        }

        .markdown-content th {
            background-color: var(--secondary-color);
            font-weight: 600;
            color: var(--text-color);
        }

        .markdown-content tr:hover {
            background-color: var(--hover-color);
        }

        .markdown-content a {
            color: var(--primary-color);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .markdown-content a:hover {
            border-bottom-color: var(--primary-color);
        }

        .markdown-content img {
            max-width: 100%;
            height: auto;
            border-radius: 0.5rem;
            margin: 1rem 0;
        }

        .mermaid {
            position: relative;
            margin: 2rem 0;
            padding: 1.5rem;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            overflow-x: auto;
        }

        .mermaid svg {
            max-width: 100%;
            height: auto;
        }

        .mermaid.zoomable svg {
            cursor: zoom-in;
        }

        .mermaid-expand {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            line-height: 1;
            color: var(--muted-color);
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s ease, border-color 0.15s ease;
        }

        .mermaid:hover .mermaid-expand,
        .mermaid-expand:focus {
            opacity: 1;
        }

        @media (hover: none) {
            .mermaid-expand {
                opacity: 1;
            }
        }

        .mermaid-expand:hover {
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .mermaid-lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 400;
            background: var(--lightbox-bg);
        }

        .mermaid-lightbox.open {
            display: block;
        }

        .lightbox-canvas {
            position: absolute;
            inset: 0;
            overflow: hidden;
            cursor: grab;
            touch-action: none;
        }

        .lightbox-canvas.dragging {
            cursor: grabbing;
        }

        .lightbox-stage {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
        }

        .lightbox-toolbar {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 2;
            display: flex;
            gap: 8px;
        }

        .lightbox-toolbar button {
            min-width: 38px;
            height: 38px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-family: inherit;
            color: var(--text-color);
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            transition: border-color 0.15s ease, color 0.15s ease;
        }

        .lightbox-toolbar button:hover {
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .lightbox-hint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            padding: 6px 14px;
            font-size: 12px;
            color: var(--muted-color);
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            pointer-events: none;
        }

        .mermaid-error {
            padding: 1rem;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: 0.5rem;
            color: var(--error-color);
            font-size: 0.875rem;
        }

        .mermaid-error details {
            margin-top: 0.5rem;
        }

        .mermaid-error summary {
            cursor: pointer;
            font-weight: 500;
        }

        .mermaid-error pre {
            margin-top: 0.5rem;
            padding: 0.75rem;
            background: var(--code-bg);
            border-radius: 0.375rem;
            overflow-x: auto;
            color: var(--text-color);
            font-size: 0.8rem;
        }

        .toc {
            position: sticky;
            top: 40px;
            max-height: calc(100vh - 80px);
            overflow-y: auto;
            font-size: 13px;
            padding-bottom: 20px;
        }

        .toc-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted-color);
            margin-bottom: 8px;
        }

        .toc-link {
            display: block;
            padding: 4px 0 4px 12px;
            color: var(--muted-color);
            text-decoration: none;
            border-left: 2px solid var(--border-color);
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .toc-link.toc-h3 {
            padding-left: 24px;
        }

        .toc-link:hover {
            color: var(--primary-color);
        }

        .toc-link.active {
            color: var(--primary-color);
            border-left-color: var(--primary-color);
            font-weight: 500;
        }

        .pager {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .pager:empty {
            display: none;
        }

        .pager-link {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-decoration: none;
            max-width: 48%;
            transition: border-color 0.2s, background 0.2s;
        }

        .pager-link:hover {
            border-color: var(--primary-color);
            background: var(--hover-color);
        }

        .pager-next {
            margin-left: auto;
            text-align: right;
        }

        .pager-label {
            font-size: 12px;
            color: var(--muted-color);
        }

        .pager-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--primary-color);
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            color: var(--muted-color);
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--secondary-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            padding: 2rem;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: 0.5rem;
            color: var(--error-color);
            margin: 2rem 0;
        }

        .error h3 {
            margin-bottom: 0.5rem;
        }

        .menu-toggle {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 300;
            width: 40px;
            height: 40px;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--panel-bg);
            color: var(--text-color);
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--backdrop-color);
            z-index: 150;
        }

        .backdrop.visible {
            display: block;
        }

        @media (max-width: 1280px) {
            .content-inner {
                grid-template-columns: minmax(0, 1fr);
            }

            .toc {
                display: none;
            }
        }

        @media (max-width: 1024px) {
            .menu-toggle {
                display: flex;
            }

            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.25s ease;
                box-shadow: 0 0 24px rgba(0, 0, 0, 0.2);
            }

            .sidebar.open {
                transform: none;
            }

            .content {
                margin-left: 0;
                padding: 72px 20px 20px;
                max-width: 100%;
            }

            .markdown-content h1,
            .markdown-content h2,
            .markdown-content h3,
            .markdown-content h4,
            .markdown-content h5,
            .markdown-content h6 {
                scroll-margin-top: 64px;
            }
        }
    </style>
</head>
<body>
    <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Toggle navigation">☰</button>
    <div class="backdrop" id="backdrop"></div>

    <div class="container">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <div class="logo">
                    <img class="logo-mark" src="codewiki-icon.png" alt="CodeWiki">
                    <span class="logo-title">Mnemora_v1</span>
                </div>
                <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>
            </div>
            <a href="https://github.com/khatrihemang07/Mnemora_v1" class="repo-link" target="_blank">🔗 View Repository</a>

    <script>window.__EMBEDDED_DOCS = {"AI_Assistant_Backend/AI_Module.md": "# AI Module (`mnemora-ai`)\n\nThe AI Module is the Rust crate (`crates/ai`, package `mnemora-ai`) that owns **Conversations**, their **entries**, **Saved questions**, **Providers** and the **Run** that answers a question. It is *read-only* with respect to other modules: it never changes Journal or Task data. It only reads them through Tools. The agent loop and the Provider contract live in the [Agent Harness](Agent_Harness.md); the concrete LLM adapters live in [LLM Providers](LLM_Providers.md). The Tauri commands that call this crate are in [AI Assistant Commands](../Tauri_Host_and_Command_Layer/AI_Assistant_Commands.md). The UI is in [AI Assistant Frontend](../AI_Assistant_Frontend.md).\n\nManifest: `crates/ai/Cargo.toml` depends on `mnemora-core`, `mnemora-harness`, `mnemora-providers`, `rusqlite`, `rusqlite_migration`, `serde`, `serde_json`, `specta`, `thiserror` and `tracing`. `lib.rs` uses `#![forbid(unsafe_code)]`.\n\n## Architecture\n\n```mermaid\ngraph TD\n    Cmd[Tauri AI commands] --> Lib[lib.rs: AiModule + re-exports]\n    Lib --> Conv[conversations.rs]\n    Lib --> Run[run.rs: begin / execute]\n    Lib --> Svc[service.rs: Provider use-cases]\n    Lib --> Saved[saved.rs]\n    Run --> Harness[mnemora-harness agent::run]\n    Run --> Tools[tools.rs: Toolbox]\n    Run --> Store[store.rs]\n    Conv --> Store\n    Conv --> MD[markdown.rs]\n    Svc --> PStore[provider_store.rs]\n    Svc --> Prov[provider.rs]\n    Svc --> Keys[keys.rs: KeyStore]\n    Prov --> Adapters[mnemora-providers]\n    Saved --> SStore[saved_store.rs]\n    Store --> Sync[sync.rs: change-log]\n    SStore --> Sync\n    Apply[sync_apply.rs] --> Sync\n    Core[mnemora-core Module trait] --> Lib\n```\n\nThe crate follows a strict split: *rule files* (`conversations`, `saved`, `provider`, `service`) validate and decide; *store files* (`store`, `saved_store`, `provider_store`) only move rows.\n\n## Module contract (`lib.rs`)\n\n`AiModule` implements `mnemora_core::module::Module`:\n\n| Method | Behaviour |\n|---|---|\n| `id` | `\"ai\"` (`MODULE_ID`, the migration namespace) |\n| `default_enabled` | `false` – off until the person turns it on |\n| `migrations` | `migrations::all()` |\n| `register_settings` | none |\n| `sync_entities` | `CONVERSATION_SCHEMA`, `ENTRY_SCHEMA`, `SAVED_SCHEMA` only |\n| `apply_remote` | `sync_apply::apply` |\n| `backfill_log` | `sync::backfill` |\n\nProviders, keys, usage and the visible branch are **never synced**; they stay on the device. See [Sync Replication Engine](../Sync_Replication_Engine.md) and [Core Foundation](../Core_Foundation.md) for `SyncEntity`/`RemoteChange`.\n\n`lib.rs` also exposes `ensure_conversation` and `conversation`, which builds a `ConversationView` containing only the entries of the Branch shown on this device, with each question's `sibling_index`/`sibling_count`.\n\n## Data model (`migrations.rs`)\n\nAppend-only migrations:\n\n```mermaid\nerDiagram\n    ai_conversations ||--o{ ai_entries : has\n    ai_entries ||--o{ ai_entries : parent_id\n    ai_conversations ||--o| ai_visible_branches : shows\n    ai_providers ||--o{ ai_model_usage : used\n    ai_saved_questions {\n        text sort_key\n        int deleted_at\n    }\n```\n\n1. `ai_conversations`, `ai_entries` – entries are **insert-only** (ADR 0019): a tree via `parent_id`, no `updated_at`/`deleted_at`. Conversations are soft-deleted and renamable.\n2. `ai_providers`, `ai_model_usage`, plus `provider_id/provider_name/model` columns on conversations.\n3. `ai_saved_questions` with a fractional-index `sort_key` (ADR 0012).\n4. `allow_paid` on providers.\n5. `ai_visible_branches` – device-local, not logged.\n6. Index `ai_entries_parent`.\n\n## Conversations and Branches (`conversations.rs`, `store.rs`, `markdown.rs`)\n\n- `list` – newest first, paged (`PAGE_MAX = 100`), matching **titles only**, using the core `fold` (case/accent-insensitive).\n- `rename`, `delete` (soft, `set_deleted`), `restore` – each logs a change via `sync::log_conversation`.\n- `set_leaf` / `show_branch` – choose which Branch is visible on this device (`store::show`, never synced). `show_branch` is the pager: it picks the *n*-th sibling question and shows the newest descendant (`newest_under`).\n- `question_text` – supports Try again; only user questions qualify.\n- `markdown` – whole shown Branch or a single tool-free answer. `markdown::strip_citations` removes bracketed 36-character ids so a copy matches what the screen shows.\n\nSiblings (`store::question_groups`) are questions sharing the same non-`model_change` ancestor, so Try again and Edit create sibling branches. Entry kinds: `user`, `assistant`, `tool_result`, `correction`, `model_change` (`kind_text`). `store::branch_messages` converts a Branch into harness `Message`s, skipping empty stopped assistant steps and model-change markers.\n\n## Runs (`run.rs`)\n\n```mermaid\nsequenceDiagram\n    participant C as Command\n    participant R as run.rs\n    participant DB as SQLite (Mutex)\n    participant H as harness agent::run\n    participant P as Provider\n    C->>R: begin(db, Ask)\n    R->>DB: tx: new conversation?, model_change?, question, show, record_use\n    R-->>C: question id\n    C->>R: execute(provider, Ask, toolset, handles, emit)\n    R-->>C: RunStarted, EntrySaved(user)\n    R->>H: run(system prompt, messages, Toolbox, Control, steering)\n    loop each step\n        H->>P: stream\n        H-->>R: Event (StepEnded / ToolEnded / Correction / Steered)\n        R->>DB: save_entry (parent chain)\n        R-->>C: RunEvent\n    end\n    R-->>C: RunEnded(outcome)\n```\n\nKey points:\n- `begin` writes the question (and a `ModelChange` entry if the Provider/Model differs from the Conversation's) in one transaction; the Conversation therefore exists when the command returns.\n- `execute` never throws; a failure is the last event (`RunOutcome::Failed { kind, message }`). The DB lock is held only for each row read/write, never while streaming or running a Tool.\n- `Recorder` saves each entry after its parent, collects Tool items by id for **Sources**, and flags `broken` if saving fails (outcome `Unexpected`).\n- `Handles` bundles `Control` (stop / send now) and `Steering` (queued notes). On end, unsent notes are announced with `QueueChanged`; an interrupted stop maps to `Failure::Interrupted`.\n- `failure_message` maps each harness `Failure` to one plain sentence; provider text is never shown. `budget_note` annotates answers forced by the request budget (`MAX_REQUESTS`).\n\n## Tools (`tools.rs`)\n\n`Toolbox` implements the harness `ToolHost`. Each call: look up the Tool, parse JSON, validate against its spec (`check`), number the result as an observation `e<N>`, run it under the DB lock, remember returned items, and cap oversized results (`RESULT_LIMIT`). Refusals reach the model as data (`Reply::refused`, `invalid`). A provider without native tools is offered none. `check_answer` rejects citations of ids no Tool returned (`UNSEEN_CITATION`), producing a correction turn. `cited_ids` extracts distinct lowercase-hex UUIDs from text.\n\n## Providers (`provider.rs`, `provider_store.rs`, `service.rs`, `keys.rs`)\n\n| Kind | Key policy | Address |\n|---|---|---|\n| `Wrapper` (Local AI Wrapper) | NotNeeded | user-given |\n| `OpenAiCompatible` | Optional | user-given |\n| `Anthropic` | Required | fixed (`anthropic::ADDRESS`) |\n| `OpenRouter` | Required | fixed (`OPENROUTER_ADDRESS`) |\n\n- Validation: name ≤ 40 chars, key ≤ 512 bytes, model id ≤ 200 chars without control characters, address via `mnemora_providers::address::check` mapped to `AiError::Validation`.\n- `ProviderView` never carries the key; `KeyState` is `NotNeeded | Saved | Missing`. Keys live in an owner-only file handled by `KeyStore`, outside the database; changing an address clears the key (a key is bound to its address).\n- OpenRouter: free routes end in `:free` and are sent with a zero `max_price` cap; paid models need `allow_paid`. `may_send` is re-checked on every send in `prepare_run`.\n- `build` creates the harness `Provider` adapter; `build_models` lists models; `connection_test` and `matching_models` ask the Provider (read under the lock, used without it since asking can take minutes).\n- Providers are soft-deleted so Conversations naming them still read. `usage` returns the 5 most recent and 5 most used models among live Providers.\n\n## Saved questions (`saved.rs`, `saved_store.rs`)\n\nOne-tap questions kept in manual order using `key_after` / `key_between`. Deleted ones keep their key so Undo restores the position; `last_key` includes deleted rows for that reason. Every write is logged through `sync::log_saved`.\n\n## Sync (`sync_apply.rs`)\n\nApplies records received from other devices straight to the tables without re-logging. Each field is validated as local writes are (`validate_title`, `validate_saved`); invalid fields are skipped. Records that cannot be created yet (missing Conversation, parent entry or creation fields) are \"relayed only\": snapshot returned, `changed: false`. Entries use `INSERT OR IGNORE`, and an arriving entry advances the Conversation's `updated_at`. `Sent<T>` distinguishes an explicit null (clears a column) from an absent field. The provider group (`provider_id`, `provider_name`, `model`) arrives whole or not at all. Conversation text must never reach a log line.\n\n## Errors (`error.rs`)\n\n`AiError` – `Validation(&'static str)`, `NotFound`, `ProviderNotFound`, `Payload(serde_json::Error)` – converts to `AppError` with codes `Validation`, `NotFound`, `Internal` (the source goes in `details`).\n\n## Tests\n\nBehaviour is exercised by the integration suites in [AI Run Engine Tests](../Backend_Integration_Test_Suites/AI_Run_Engine_Tests.md) and [AI Data and Provider Tests](../Backend_Integration_Test_Suites/AI_Data_and_Provider_Tests.md).\n", "AI_Assistant_Backend/Agent_Harness.md": "# Agent Harness\n\nThe Agent Harness (`crates/harness`, package `mnemora-harness`) is the small, dependency-light Rust crate that runs the AI assistant's **agent loop**. It defines the typed messages, the `Provider` contract that every AI-service adapter implements, one **Step** (a single request to the Model) and the loop that chains Steps together with Tool calls. It is inspired by *pi* (ADR 0018).\n\nIt knows nothing about HTTP, SQLite or Mnemora's data. Those are supplied from outside:\n\n- Wire formats come from [LLM Providers](LLM_Providers.md), which implement `Provider`.\n- Tools and answer checking come from the [AI Module](AI_Module.md), which implements `ToolHost` over the Todo/Journal data.\n- The Tauri commands that start, stop and steer a Run live in [AI Assistant Commands](../Tauri_Host_and_Command_Layer/AI_Assistant_Commands.md).\n\nThe crate depends only on `serde` and `specta` (see `crates/harness/Cargo.toml`). Other files in the crate (`message.rs`, `control.rs`, `scripted.rs`) are referenced by the code below but were not part of the core components documented here.\n\n## Architecture\n\n```mermaid\ngraph TD\n    AIMod[AI Module<br/>ToolHost + persistence] -->|calls run| Agent\n    subgraph harness [mnemora-harness]\n        Agent[agent.rs<br/>run loop, limits, Events] --> Step[step.rs<br/>run_step, Collected]\n        Step -->|thread + mpsc| ProvTrait[provider.rs<br/>Provider trait, StreamEvent]\n        Agent --> Ctl[Control<br/>stop / skip flags]\n        Agent --> Msg[Message, Call]\n    end\n    ProvTrait -.implemented by.-> LLM[LLM Providers<br/>OpenAI-compat, Anthropic, envelope]\n    Agent -.Tool calls.-> AIMod\n    Agent -->|Event stream| AIMod\n```\n\n| File | Responsibility |\n|---|---|\n| `provider.rs` | `Provider` trait, `Request`, `ToolDef`, `ToolProtocol`, `StreamEvent`, `StopReason`, `Failure` |\n| `step.rs` | `run_step` (one Provider request on its own thread), `Answer`, private `Collected` accumulator |\n| `agent.rs` | `run` loop, `ToolHost`, `Reply`, `Cited`, `Event`, `Outcome`, `StepRecord`, private `Finished`/`Tally`, limits and fixed notes |\n\n## The Provider contract (`provider.rs`)\n\nA Provider is an adapter: wire format lives inside it, the loop does not care. It **never throws**; each Step ends with exactly one `StreamEvent::Done` or `StreamEvent::Failed`, and raw error text stays inside the Provider.\n\n`StreamEvent` variants:\n\n- `TextDelta(String)` – a piece of reply text, in order.\n- `Call(Call)` – a complete Tool call.\n- `Sources(Vec<String>)` – ids the answer lists as sources (envelope Providers only).\n- `Correction(String)` – the reply broke the protocol; this is what the Model is told. It precedes `Done` and the text is not an answer.\n- `Done(StopReason)` – `Stop`, `Length` (output limit hit) or `Aborted`.\n- `Failed(Failure)` – the Step failed.\n\n`Failure` is a snake_case serialisable (specta `Type`) enum: `NoProvider`, `Unreachable`, `Timeout`, `KeyRejected`, `RateLimited`, `ModelUnavailable`, `ModelCannotUseTools`, `BadResponse`, `TooLong`, `Interrupted`, `Offline`, `Unexpected`. The AI Module turns these into one plain sentence for the person.\n\n`ToolProtocol` says how Tools reach the Model: `None` (no Tools), `Native` (service tool calls: OpenAI-compatible, Anthropic, OpenRouter) or `Envelope` (every reply is a JSON envelope, used by the Local AI Wrapper). `Provider::stream` receives a `halt` callback, checked between pieces; once true it ends with `Done(Aborted)` keeping the text so far.\n\n## One Step (`step.rs`)\n\n`run_step(provider, request, halt, on_text)` spawns the Provider on a **detached thread** and reads its events from an `mpsc` channel, polling every 25 ms so it can notice `halt`.\n\n```mermaid\nsequenceDiagram\n    participant L as agent::run\n    participant S as run_step\n    participant T as Provider thread\n    L->>S: request, halt, on_text\n    S->>T: spawn stream(request)\n    loop until Done/Failed\n        T-->>S: StreamEvent\n        S-->>L: on_text(delta)\n    end\n    alt Done(stop)\n        S-->>L: Ok(Answer)\n    else Failed(f)\n        S-->>L: Err(f)\n    else halt() while waiting\n        S-->>L: Ok(Answer{stop: Aborted})\n    else channel closed without Done\n        S-->>L: Err(BadResponse)\n    end\n```\n\nKey behaviours (all covered by the unit tests in the file):\n\n- Deltas are accumulated by `Collected` into `Answer { text, stop, calls, sources, correction }`.\n- A blocking Provider (one long HTTP call) cannot hold the Run: when `halt` fires the Step ends `Aborted` with what it has, and anything the thread sends later is dropped with the channel.\n- A failure drops partial text and returns `Err(Failure)`.\n- A stream that ends without `Done` is `BadResponse`, so an early stop cannot pass for an answer.\n\n## The agent loop (`agent.rs`)\n\n`run(provider, system, messages, host, control, steer, emit) -> Outcome` loops Step by Step. A Step whose reply makes Tool calls runs them one by one and the next Step follows; the Step with no calls is the answer. Mistakes the Model can fix are sent back as **correction turns**, never shown as failures.\n\n### Collaborators\n\n- `ToolHost` (implemented by the AI Module): `specs()` lists Tools (empty if the Provider cannot call Tools), `call(name, args) -> Reply` never fails (a refusal is a `Reply` with `is_error`), and `check_answer(text, sources)` validates citations, returning `Err(correction)` if the answer cites something no Tool returned.\n- `Control` (stop/skip flags): `ended()`, `skipped()`, `begin_step()`, `halts_step()`. A *stop* ends the Run; a *skip* (\"Send now\") only ends the current Step.\n- `steer` hands over notes the person queued during the Run; `emit` receives every `Event` in order.\n\n### Limits\n\n| Constant | Value | Effect |\n|---|---|---|\n| `MAX_REQUESTS` | 12 | Model requests per Run; the last gets no Tools and `FINAL_NOTE` |\n| `MAX_CALLS_PER_STEP` | 8 | Extra calls are refused with `TOO_MANY` |\n| `MAX_PROMPT_BYTES` | 100 000 | Larger request ends the Run as `Failure::TooLong` |\n| `MAX_REPEATS` | 3 | Steps in a row where every call repeats an earlier one; then Tools are withheld and `CLOSE_NOTE` is appended |\n| `MAX_INVALID_STEPS` | 3 | Steps in a row with unknown/badly-formed calls, invalid replies or rejected citations; then `Failure::BadResponse` |\n\n### Control flow\n\n```mermaid\nflowchart TD\n    A[Loop start] --> B{control.ended?}\n    B -- yes --> S1[Outcome::Stopped]\n    B -- no --> C[Build Request<br/>last: FINAL_NOTE, no tools<br/>closing: CLOSE_NOTE, no tools]\n    C --> D{request over 100 KB?}\n    D -- yes --> F1[Failed TooLong]\n    D -- no --> E[emit StepStarted, run_step]\n    E -->|Err| F2[Stopped if ended, else Failed]\n    E -->|Ok| G{Aborted or ended?}\n    G -- yes --> H[keep_halted: save text,<br/>answer calls without running]\n    H --> H2{stop, or last request?}\n    H2 -- yes --> S1\n    H2 -- no, skip --> N[deliver notes] --> A\n    G -- no --> I{correction?}\n    I -- yes --> J[emit Correction, push to branch,<br/>invalid_streak++] --> A\n    I -- no --> K{no calls, or last with text?}\n    K -- yes --> L[finish]\n    L --> Ans[Answered]\n    L --> Cor[Corrected: invalid_streak++]\n    L --> Ste[Steered: note appended]\n    L --> Fai[Failed BadResponse]\n    K -- no --> M[run_step_calls: save Step,<br/>run calls in order, deliver notes,<br/>update streaks] --> A\n```\n\n### Events and outcomes\n\n`Event` is the loop's only output channel: `StepStarted`, `TextDelta`, `StepEnded(StepRecord)`, `ToolStarted`, `ToolEnded { arguments, reply }`, `Correction`, and `Steered` (a person's note became a question in the branch). `StepRecord` carries text, calls, stop reason, `budget_forced` (the last Step, so the answer gets a budget note) and listed `sources`.\n\n`Outcome` is `Answered`, `Stopped` (what was written is kept) or `Failed(Failure)`. The private `Finished` enum (`Answered`, `Corrected`, `Steered`, `Failed`) records where an answer-shaped Step went.\n\n### How calls are run (`run_calls`)\n\nFor each call the loop emits `ToolStarted`, then picks a result:\n\n1. **Blocked** – `CUT_OFF` (reply hit `Length`), `NO_TOOLS_NOW` (Tools withheld), `NOT_RUN_STOPPED` or `NOT_RUN_SKIPPED`.\n2. **Over the cap** – index ≥ 8 gets `TOO_MANY`.\n3. **Repeat** – same name and arguments as an earlier call gets a refusal naming the earlier observation id (e.g. `e2`) and counts toward `repeats`.\n4. **Otherwise** `host.call(...)`. Valid results are remembered in `ran`; invalid ones set `Tally.invalid`.\n\nEvery result is pushed as `Message::Tool` and emitted as `ToolEnded`, so the Model always sees a result for each call it made.\n\n### Answer acceptance (`finish`)\n\n- Empty/whitespace text → `Failed(BadResponse)`.\n- `host.check_answer` failing → on the last request a failure; otherwise the Step is kept, a correction is sent and the loop continues (`Corrected`).\n- A queued note → the answer is kept as an ordinary Step, the note is added as a user message and the Model is asked again (`Steered`).\n- Otherwise the final `StepEnded` is emitted (with `budget_forced` if it was the last request) and the Run is `Answered`.\n\n### Steering and stopping\n\nNotes are delivered after a Step's Tools finish, or after a skipped/non-answer Step (`deliver`). A stopped Step is saved even when empty so the thread can show it was stopped; a skipped Step is saved as a normal finished Step and the Run continues. On the answer-only request a skip also ends the Run since no request is left for the note.\n\n## Integration\n\n```mermaid\ngraph LR\n    UI[Frontend] -->|ai_run_start / steer / abort| Cmd[AI Assistant Commands]\n    Cmd --> AIRun[AI Module run.rs]\n    AIRun -->|run| Harness\n    Harness -->|Provider::stream| Prov[LLM Providers]\n    Harness -->|ToolHost::call| Tools[AI Module tools: list/read/search<br/>Todo + Journal]\n    Harness -->|Event| AIRun -->|persist entries, emit AiChangedEvent| UI\n```\n\nThe AI Module persists each `Event` as conversation entries and tool-call activity; see [AI Module](AI_Module.md). Behavioural tests of the loop with a real database are described in [AI Run Engine Tests](../Backend_Integration_Test_Suites/AI_Run_Engine_Tests.md). The frontend consumes the results in [AI Conversation and Runs](../AI_Assistant_Frontend/AI_Conversation_and_Runs.md).\n\n## Design notes\n\n- **Provider isolation:** a thread plus channel per Step makes stop latency independent of the network call.\n- **Determinism:** limits and notes are constants, so the same scripted replies produce the same Run (a `ScriptedProvider` is used in tests).\n- **Model-fixable errors stay private:** bad arguments, repeats, over-long batches and uncited sources become Tool results or correction turns; only exhausted budgets or persistent invalid replies surface as `Failure`.\n", "AI_Assistant_Backend/LLM_Providers.md": "# LLM_Providers\n\nThe `mnemora-providers` crate (`crates/providers`) holds the wire adapters that let the AI Module talk to real language-model services. It speaks the OpenAI-compatible chat format over HTTP(S), turns replies and errors into the vocabulary of the [Agent Harness](Agent_Harness.md) (`Provider`, `StreamEvent`, `Failure`, `StopReason`), and enforces which addresses a Provider may use. The crate only depends on `mnemora-harness`, `serde_json` and `ureq` (`crates/providers/Cargo.toml`).\n\nReal Providers are never called from tests (ADR 0018). The `testing` cargo feature exposes an in-process fake HTTP server so command-layer tests run a real adapter against the real wire protocol.\n\nRelated modules: [AI_Module](AI_Module.md) (stores providers, keys and runs), [Agent_Harness](Agent_Harness.md) (the Run loop that drives a `Provider`), and [AI_Assistant_Commands](../Tauri_Host_and_Command_Layer/AI_Assistant_Commands.md) (the `ai_provider_*` and `ai_run_*` commands). Tests: [AI_Data_and_Provider_Tests](../Backend_Integration_Test_Suites/AI_Data_and_Provider_Tests.md) and [AI_Run_Engine_Tests](../Backend_Integration_Test_Suites/AI_Run_Engine_Tests.md).\n\n## Architecture\n\n```mermaid\ngraph TD\n    AI[AI Module / command layer] -->|address.check| ADDR[address.rs]\n    AI -->|constructs| COMPAT[compat.rs CompatProvider]\n    COMPAT -->|implements| HP[harness::Provider]\n    COMPAT --> OAI[openai.rs wire format]\n    COMPAT --> CLIENT[client.rs Client]\n    ENV[envelope.rs JSON envelope] --> OAI\n    CLIENT -->|ureq + rustls| NET[(HTTP/S service)]\n    TEST[testing.rs FakeServer] -.feature testing.-> CLIENT\n    OAI --> HF[harness::Failure / StopReason / Message / ToolDef]\n```\n\n| File | Role |\n|---|---|\n| `address.rs` | Validates a Provider address. |\n| `client.rs` | Shared blocking `ureq` client, timeouts, transport-error mapping. |\n| `openai.rs` | Pure functions for the OpenAI chat format: request body, SSE parsing, model list, status mapping. |\n| `compat.rs` | `CompatProvider`, the streaming native-tool-call adapter. |\n| `envelope.rs` | The JSON envelope protocol for Models without native Tool calls. |\n| `testing.rs` | Loopback fake server (feature `testing`). |\n\n## Address policy (`address.rs`)\n\n`check(raw)` trims the text and any trailing `/`, parses it as a URI and returns the cleaned string or an `AddressError`:\n\n- `Invalid`: no host or scheme, or the address carries a query.\n- `UnsupportedScheme`: anything but `http`/`https`.\n- `PlainHttpNotAllowed`: `http` to a host that is not local.\n\n`https` is accepted anywhere. Plain `http` is accepted only for loopback, private and link-local IPv4, Tailscale's CGNAT `100.64.0.0/10`, IPv6 loopback, unique-local `fc00::/7` and link-local `fe80::/10`, plus `localhost`, `.local` and `.ts.net` names. This guarantees an API key is never sent unencrypted across the internet. The tests also assert shared fixture behaviour with the browser mock (see [IPC_Bridge_and_Core_Mocks](../IPC_Bridge_and_Browser_Mocks/IPC_Bridge_and_Core_Mocks.md)).\n\n## HTTP client (`client.rs`)\n\n`Client` wraps a `ureq::Agent` on the rustls stack (no OpenSSL). `Options` sets the reply timeout (default `REPLY_TIMEOUT` 120 s; connect timeout fixed at 10 s) and optional custom roots (tests only, for a self-signed server). HTTP statuses are not errors (`http_status_as_error(false)`), so adapters can read the body to classify them.\n\nMethods: `post_json` (bearer key), `post_with` (custom headers, e.g. a vendor's key and version headers), `get`, `get_with`. `read_body` reads a reply up to 16 MiB. `transport_failure` maps transport errors to a harness `Failure` and drops the error text:\n\n| ureq error | Failure |\n|---|---|\n| Timeout | `Timeout` |\n| HostNotFound | `Offline` |\n| ConnectionFailed, Io, Tls, Rustls | `Unreachable` |\n| Protocol, LargeResponseHeader | `BadResponse` |\n| other | `Unexpected` |\n\n## OpenAI wire format (`openai.rs`)\n\n- `chat_body(request, stream)` builds the request. The system prompt goes first when non-empty; assistant tool calls become `tool_calls` (Gemini's `thought_signature` is echoed back under `extra_content.google`); tool results become `role: tool`. No `tools` key is sent when none are offered, and no output limit is sent. `function_tool` converts a `ToolDef` into a function schema.\n- `sse_events(line)` parses one `data:` line into `SseEvent`s: `Text`, `ToolDelta` (with an optional `index`, since Gemini's parallel calls have none), `Finish(StopReason)`, `Done`. An `error` object in the stream is `Failure::Unexpected`; its text is discarded.\n- `parse_answer` reads a whole (non-streamed) reply. A reply that finished with tool calls is rejected as `BadResponse`.\n- `parse_model_ids` reads `GET /models`.\n- `status_failure(status, body, Endpoint)` maps HTTP statuses. `Endpoint` (`Chat` or `Models`) matters because a 404 means `ModelUnavailable` only on chat.\n\n| Status | Failure |\n|---|---|\n| 400 mentioning \"tool\" | `ModelCannotUseTools` |\n| 400 mentioning context / too long, 413 | `TooLong` |\n| 401, 403 | `KeyRejected` |\n| 404 (chat) | `ModelUnavailable` |\n| 408, 504 | `Timeout` |\n| 429, 500, 502, 503, 529 | `RateLimited` |\n| other | `Unexpected` |\n\nFinish reasons `stop`, `tool_calls` and `function_call` all map to `StopReason::Stop`; `length` maps to `Length`; anything else (content filters) is `BadResponse`.\n\n## CompatProvider (`compat.rs`)\n\n`CompatProvider` implements `harness::Provider` with `ToolProtocol::Native`. It serves OpenAI-compatible endpoints (custom address, key optional) and OpenRouter (fixed address, key, and a price cap supplied through `with_extra`, which merges fields into each chat body). `list_models()` calls `GET {address}/models`, which also serves as the connection test.\n\n```mermaid\nsequenceDiagram\n    participant H as Harness Run\n    participant C as CompatProvider\n    participant S as Service\n    H->>C: stream(request, halt, emit)\n    C->>S: POST /chat/completions (stream: true)\n    alt non-2xx\n        S-->>C: status + body\n        C-->>H: Failed(status_failure)\n    else 2xx\n        loop each SSE line\n            S-->>C: data: {...}\n            C-->>H: TextDelta\n            C->>C: Calls.piece (assemble tool call)\n            C->>C: halt()? then Done(Aborted)\n        end\n        S-->>C: [DONE] / end of stream\n        C-->>H: Call* then Done(stop)\n    end\n```\n\nKey behaviours:\n\n- **Halting.** `halt()` is checked before the request and on every line; when set, the stream ends with `Done(Aborted)` and partially read calls are dropped.\n- **Tool-call assembly.** `Calls::piece` joins chunks: an indexed piece continues the call that index is filling; a piece without an index continues the latest call only if it has no id, or repeats the latest call's id. This handles Gemini sending parallel calls with ids but no indexes.\n- **Finish.** An answer counts only once a finish reason arrived (otherwise `BadResponse`). Each call must have a name; a missing id becomes `call-{n}` and empty arguments become `{}`. Calls are emitted only at the end, followed by `Done`.\n- **Mid-stream read errors.** `stream_failure` maps `TimedOut` to `Timeout` and anything else to `Interrupted`.\n- Neither raw replies nor service error text are kept.\n\n## JSON envelope (`envelope.rs`)\n\nFor Providers without native Tool calls, every Step is one JSON object with exactly four keys: `action` (`tools` or `finish`), `calls` (up to 8, each `{name, arguments}` with `arguments` as JSON text), `answer`, and `sources` (up to 32 ids). `response_format(finish_only)` produces the strict `json_schema` sent with the request; with no Tools only `finish` is allowed and `maxItems` for calls is 0. `instructions(tools)` produces the system-prompt tail, and `turns(messages)` renders history as plain user/assistant turns, with tool results rendered as `Result of <name>:` user messages.\n\n`parse(content, tools_offered, next_id)` strips a BOM or code fence, validates the shape, and returns `Parsed`:\n\n```mermaid\nflowchart TD\n    A[reply text] --> B{one JSON object with 4 typed keys?}\n    B -- no --> C[Correction SHAPE]\n    B -- yes --> D{action}\n    D -- tools --> E{tools offered, no answer/sources, 1..8 calls, args are JSON object under 8000 bytes?}\n    E -- yes --> F[Parsed::Calls]\n    E -- no --> G[Correction]\n    D -- finish --> H{no calls, non-empty answer, at most 32 sources?}\n    H -- yes --> I[Parsed::Answer]\n    H -- no --> G\n    D -- other --> C\n```\n\nA protocol violation is not an error: `Correction(&'static str)` is a message the Model reads before answering again, so the Run continues. The Run loop that counts consecutive invalid replies lives in the [Agent_Harness](Agent_Harness.md).\n\n## Testing support (`testing.rs`)\n\n`FakeServer::start(respond)` binds a loopback port, records every request as a `Seen` (method, path, authorization, headers, body), and answers with a `Canned` reply built by `Canned::json`, `Canned::sse` or `.delayed(..)`. `address()` returns `http://127.0.0.1:port/v1`, which passes the address policy. `closed_address()` returns an address with nothing listening, to test `Unreachable`. The `reason` helper supplies HTTP status phrases for the raw response. Unit tests in `openai.rs` use fixtures under `crates/providers/tests/fixtures/`.\n\n## Error flow summary\n\n```mermaid\ngraph LR\n    T[transport error] -->|transport_failure| F[harness::Failure]\n    S[HTTP status] -->|status_failure| F\n    M[mid-stream IO] -->|stream_failure| F\n    P[bad JSON / no finish] --> F\n    F --> R[Run ends with a kind the person can read]\n```\n\nFailure kinds are surfaced to the user through the [AI_Module](AI_Module.md) and the frontend ([AI_Providers_and_Models](../AI_Assistant_Frontend/AI_Providers_and_Models.md)).\n", "AI_Assistant_Backend.md": "# AI Assistant Backend\n\nThe AI Assistant Backend is the Rust side of Mnemora's AI assistant. It answers a person's question by running an agent loop. The Model can call read-only **Tools** over Todo and Journal data, and the reply is streamed back and saved as part of a **Conversation**. It is split into three crates:\n\n| Crate | Role | Documentation |\n|---|---|---|\n| `mnemora-ai` (`crates/ai`) | Owns Conversations, entries, Branches, Saved questions, Providers and API keys. It also owns the Run orchestration, the Tools, and the sync of conversation data. | [AI Module](AI_Assistant_Backend/AI_Module.md) |\n| `mnemora-harness` (`crates/harness`) | Holds the dependency-light agent loop, the `Provider` contract, the `ToolHost` contract and the Run limits. It knows nothing about HTTP or SQLite. | [Agent Harness](AI_Assistant_Backend/Agent_Harness.md) |\n| `mnemora-providers` (`crates/providers`) | Holds the wire adapters. These cover the OpenAI-compatible format (also used for OpenRouter), the JSON envelope for Models without native Tool calls, the address policy and the HTTP client. | [LLM Providers](AI_Assistant_Backend/LLM_Providers.md) |\n\nThe AI Module never writes Journal or Task data. It is off by default (`default_enabled = false`). Only Conversations, entries and Saved questions are synced. Providers, keys, usage and the visible Branch stay on the device.\n\n## Architecture\n\n```mermaid\ngraph TD\n    UI[AI Assistant Frontend] --> Cmd[Tauri AI commands]\n    Cmd --> AI\n\n    subgraph AI [mnemora-ai]\n        Run[run.rs: begin / execute / Recorder]\n        Tools[tools.rs: Toolbox]\n        Conv[conversations, saved, store]\n        Svc[service + provider + keys]\n        Sync[sync log / sync_apply]\n    end\n\n    subgraph H [mnemora-harness]\n        Loop[agent::run loop and limits]\n        Step[step::run_step]\n        PT[Provider trait, StreamEvent, Failure]\n        TH[ToolHost trait]\n    end\n\n    subgraph P [mnemora-providers]\n        Compat[CompatProvider]\n        Env[envelope]\n        Addr[address policy]\n        Cli[ureq client]\n    end\n\n    Run --> Loop\n    Loop --> Step --> PT\n    Loop -->|ToolHost::call| Tools\n    Tools -.implements.-> TH\n    Tools --> Data[(Todo and Journal data)]\n    Svc --> Addr\n    Svc -->|build| Compat\n    Compat -.implements.-> PT\n    Compat --> Env\n    Compat --> Cli --> Net[(LLM service)]\n    Loop -->|Event stream| Run\n    Run --> Conv --> DB[(SQLite)]\n    Conv --> Sync\n```\n\n### Run flow\n\n```mermaid\nsequenceDiagram\n    participant C as Tauri command\n    participant A as AI Module (run.rs)\n    participant H as Harness (agent::run)\n    participant P as Provider adapter\n    participant T as Toolbox\n    C->>A: begin (save question, model_change)\n    C->>A: execute\n    A->>H: run(system, messages, Toolbox, Control, steering)\n    loop Steps (at most 12 requests)\n        H->>P: stream(request, halt)\n        P-->>H: text deltas, tool calls, Done or Failed\n        H->>T: call(name, args)\n        T-->>H: Reply (refusals are data)\n        H-->>A: Event\n        A->>A: save entry, emit RunEvent\n    end\n    H-->>A: Outcome (Answered, Stopped or Failed)\n    A-->>C: RunEnded\n```\n\n## How the pieces fit\n\n- **Run orchestration.** `mnemora-ai` writes the question in one transaction, then drives the harness. It saves each harness `Event` as an insert-only entry in a tree, which gives Branches for Try again and Edit. The database lock is never held while streaming or running a Tool.\n- **Agent loop.** The harness chains Steps and Tool calls. It enforces limits on requests, calls per Step, prompt size, repeated calls and invalid replies. Mistakes the Model can fix become correction turns instead of failures. A stop ends the Run, and \"Send now\" ends only the current Step.\n- **Provider isolation.** Each Step runs on its own thread, so stopping does not wait on the network. Adapters turn HTTP status and transport errors into harness `Failure` kinds. The AI Module then turns those into one plain sentence for the person, and provider error text is never shown.\n- **Providers and keys.** The Provider kinds are Local AI Wrapper, OpenAI-compatible, Anthropic and OpenRouter. Keys are kept in an owner-only file outside the database. Plain `http` is allowed only for local and private addresses, so a key never crosses the internet unencrypted. Paid OpenRouter models need `allow_paid`.\n- **Citations.** `Toolbox::check_answer` rejects any citation of an id that no Tool returned. This triggers a correction turn.\n\n## Related documentation\n\n- Commands that call this backend: [AI Assistant Commands](Tauri_Host_and_Command_Layer/AI_Assistant_Commands.md)\n- UI: [AI Assistant Frontend](AI_Assistant_Frontend.md)\n- Sync of conversation data: [Sync Replication Engine](Sync_Replication_Engine.md)\n- Tests: [AI Run Engine Tests](Backend_Integration_Test_Suites/AI_Run_Engine_Tests.md), [AI Data and Provider Tests](Backend_Integration_Test_Suites/AI_Data_and_Provider_Tests.md)", "AI_Assistant_Frontend/AI_Branches_History_and_Saved.md": "# AI Branches, History and Saved\n\nThis module is the part of the AI frontend (`src/modules/ai/`) that handles everything around a Conversation other than the live Run: choosing which **Branch** is shown, browsing the **history** of Conversations, managing **Saved questions**, and the small accessibility and touch helpers those screens share. It is a thin, mostly pure layer: it calls the generated Tauri IPC commands, keeps the TanStack Query cache fresh, and holds the testable logic (grouping, pager arithmetic, focus return) away from the Svelte components.\n\nFor the live run, answers, and activity, see [AI Conversation and Runs](AI_Conversation_and_Runs.md). For providers and the model picker, see [AI Providers and Models](AI_Providers_and_Models.md). The backend that stores this data is described in [AI Module](../AI_Assistant_Backend/AI_Module.md) and the command wrappers in [AI Assistant Commands](../Tauri_Host_and_Command_Layer/AI_Assistant_Commands.md).\n\n## Components at a glance\n\n| File | Exports | Role |\n|---|---|---|\n| `branch-actions.ts` | `branchFromEarlier`, `showBranch` | IPC calls that change which Branch is shown |\n| `branch-pager.ts` | `pagerLabel`, `pagerStep`, `pagerFocusAfterShow` | Pure pager maths and focus rules |\n| `queries.ts` | `aiKeys`, `conversationOptions`, `historyOptions`, `modelsOptions`, `savedOptions`, `providersOptions`, `usageOptions` | TanStack Query definitions and cache keys |\n| `history.ts` | `groupConversations`, `groupOf`, `shortDate`, `updatedAt` | Date grouping of the history list |\n| `saved-actions.ts` | `saveQuestion`, `renameSaved`, `moveSaved`, `deleteSaved` | Saved question mutations with refresh and Undo |\n| `focus.ts` | `returnFocus` | Restores focus when an overlay closes |\n| `long-press.ts` | `pressMovedTooFar`, `LONG_PRESS_MS` | Phone long-press detection on a question |\n| `keys.test.ts` | – | Guards the AI Module's bare-key claims against other Modules |\n\n## Architecture\n\n```mermaid\ngraph TD\n    UI[Svelte components<br/>conversation, history, saved] --> BA[branch-actions.ts]\n    UI --> BP[branch-pager.ts]\n    UI --> HI[history.ts]\n    UI --> SA[saved-actions.ts]\n    UI --> FO[focus.ts]\n    UI --> LP[long-press.ts]\n    UI --> Q[queries.ts]\n    BA --> IPC[lib/ipc/bindings commands]\n    SA --> IPC\n    Q --> IPC\n    BA --> QC[queryClient]\n    SA --> QC\n    SA --> Toast[lib/ui/toast notifyUndo]\n    SA --> SO[saved-order moveNeighbours]\n    Q -.keys.-> QC\n    IPC --> Host[Tauri AI commands]\n    Host --> Backend[crates/ai]\n```\n\nAll server state lives in the backend; the frontend never stores a Branch or a Saved question locally. After each mutation the relevant query keys are invalidated and the components re-render from the cache.\n\n## Query keys and options (`queries.ts`)\n\nEvery AI query key starts with `'ai'`, so one invalidation can refresh everything. `aiKeys` defines:\n\n- `all` – `['ai']`\n- `history` – `['ai','conversations']`; the infinite history queries append the search text, so invalidating this prefix refreshes every search together\n- `saved`, `providers`, `usage`\n- `conversation(id)` and `models(providerId)`\n\nNotable behaviour:\n\n- `conversationOptions(id)` loads a Conversation with its entries (`aiConversationGet`). It is refreshed when a Run saves an entry or ends.\n- `historyOptions(query)` is an infinite query over `aiConversationList(query, offset, HISTORY_PAGE)`. `HISTORY_PAGE` is 30. The next offset is the sum of items loaded so far, and only exists while the server reports `more`. Search matches titles only (the backend decides this; see [AI Data and Provider Tests](../Backend_Integration_Test_Suites/AI_Data_and_Provider_Tests.md)).\n- `savedOptions` lists Saved questions in their stored order.\n- `modelsOptions(providerId)` fetches the full model list once, with infinite `staleTime`/`gcTime` and no retry; a `failure` in the reply is thrown as an `Error` with the backend's one-sentence message. It is used by the provider UI.\n\n## Branches\n\nA Conversation is a tree of questions and answers. Editing a question or trying again adds a sibling question; the shown **Branch** is the path through the tree that the screen displays and that the next question continues. The shown Branch is device-local and writes nothing to the change log, so it is never synced (verified in `ai_branching_tests`).\n\n```mermaid\nsequenceDiagram\n    participant C as Component\n    participant A as branch-actions\n    participant I as IPC command\n    participant Q as queryClient\n    C->>A: showBranch(conv, question, position)\n    A->>I: aiConversationShowBranch\n    I-->>A: ok\n    A->>Q: invalidate conversation(conv)\n    Q-->>C: refetched Branch\n    C->>A: branchFromEarlier(conv, answer)\n    A->>I: aiConversationSetLeaf\n    A->>Q: invalidate conversation(conv) and history\n```\n\n- `branchFromEarlier(conversationId, answerId)` sets the leaf to an earlier answer. The next question continues from it, and the later Branch stays in the Conversation. It invalidates both the Conversation and the history (the order and `updated_at` may change). The invalidations are fire-and-forget (`void`), only the command is awaited.\n- `showBranch(conversationId, questionId, position)` shows the Branch of the question at a 1-based `position` among the siblings of `questionId`. Only the Conversation query is invalidated.\n\nBoth use `unwrap`, so a failed command rejects with a typed error for the caller to surface.\n\n### Pager (`branch-pager.ts`)\n\nPure functions, so they can be tested without a DOM:\n\n- `pagerLabel(index, count)` → `\"Question 2 of 3\"` (1-based).\n- `pagerStep(index, count, 'previous'|'next')` → the new 1-based position, or `null` at either end or with no siblings.\n- `pagerFocusAfterShow(pressed, enabled)` → keeps focus on the pressed arrow while it is still enabled, otherwise moves it to the other arrow, otherwise `null`. This prevents focus falling to the body when the user pages to an end.\n\nThe usual flow is: `pagerStep` computes the target, `showBranch` applies it, then `pagerFocusAfterShow` decides where focus lands after the refetch.\n\n## History (`history.ts`)\n\n`groupConversations(items, now)` splits a newest-first list of `ConversationSummary` into labelled sections, keeping their order and dropping empty ones.\n\n| Group | Label | Rule (whole local days before `now`) |\n|---|---|---|\n| `today` | Today | ≤ 0 (a time ahead of now counts as today) |\n| `yesterday` | Yesterday | 1 |\n| `previous7` | Previous 7 days | 2–7 |\n| `earlier` | Earlier | > 7 |\n\nDay differences use local midnight and `Math.round`, which absorbs the 23- and 25-hour days around a clock change. `updatedAt` treats the nullable `updated_at` binding as `0`. `shortDate` formats a row's date as `Oct 18` (en-US). `history.test.ts` uses local noon to stay clear of clock changes.\n\n## Saved questions (`saved-actions.ts`)\n\nEvery action awaits the IPC command, then invalidates `aiKeys.saved`.\n\n| Function | Command | Notes |\n|---|---|---|\n| `saveQuestion(text)` | `aiSavedCreate` | Appends to the end; returns the `SavedQuestion` |\n| `renameSaved(id, text)` | `aiSavedUpdate` | Changes the text |\n| `moveSaved(list, id, direction)` | `aiSavedReorder(id, afterId, beforeId)` | `moveNeighbours` (from `saved-order`) computes the two neighbours; returns early when the move is impossible at an end |\n| `deleteSaved(saved)` | `aiSavedDelete` | Deletes at once and shows an Undo toast (`notifyUndo`) that calls `aiSavedRestore` and refreshes; restore puts it back in its place |\n\nReordering sends neighbour ids rather than an index, which lets the backend place the item between two keys and converge across devices (see [AI Module](../AI_Assistant_Backend/AI_Module.md) and the `ai_sync_tests` cases on saved-question order).\n\n```mermaid\nflowchart LR\n    A[User deletes saved question] --> B[aiSavedDelete]\n    B --> C[invalidate ai/saved]\n    C --> D[Toast: Saved question deleted - Undo]\n    D -- Undo --> E[aiSavedRestore]\n    E --> C\n```\n\n## Accessibility and touch helpers\n\n- `returnFocus(opener, fallback?)` focuses the opener if it is still connected, else the fallback (the question box). A closed Sheet, Popover or Dialog must never leave focus on the body. The `Focusable` interface keeps it testable without a DOM (`focus.test.ts`).\n- `pressMovedTooFar(from, to)` is true when a press drifted more than 10 px, so it is a scroll or swipe and not a hold. `LONG_PRESS_MS` (500 ms) is how long a finger rests on a question before its Edit control shows on phones.\n\n## Key-claim guard (`keys.test.ts`)\n\nThe test builds the enabled-module registry with only `aiManifest` and checks that:\n\n- `A` opens AI everywhere except `/todo`, where `G` then `A` is the All view;\n- `C` and `/` are AI keys only on `/ai`, keeping their Journal and search meanings elsewhere;\n- no other Module uses those keys on the AI page.\n\nThe list of other Modules' keys is hard-coded in the test (the registry needs the router), so it must be updated when another manifest changes its bare keys. See [Shell and Navigation](../Frontend_Platform_and_Shell/Shell_and_Navigation.md) for `bareKeyFor`.\n\n## Integration summary\n\n- **Upstream:** generated `commands` from `lib/ipc/bindings`, `unwrap`, the shared `queryClient`, and `notifyUndo` from `lib/ui/toast` (see [IPC Bridge and Core Mocks](../IPC_Bridge_and_Browser_Mocks/IPC_Bridge_and_Core_Mocks.md) for browser mocks of these commands).\n- **Downstream:** the AI Svelte screens, which also use [AI Conversation and Runs](AI_Conversation_and_Runs.md) for live state.\n- **Behaviour tests:** branching, history, and saved behaviour is verified end to end in [AI Data and Provider Tests](../Backend_Integration_Test_Suites/AI_Data_and_Provider_Tests.md).\n", "AI_Assistant_Frontend/AI_Conversation_and_Runs.md": "# AI_Conversation_and_Runs\n\nThe pure-TypeScript logic behind the AI page's conversation thread. It turns the run events streamed from the Rust backend into live, in-memory Run state. It also turns saved conversation entries into the things the thread shows: activity lines, failure banners, \"branch from earlier\" choices, source previews, queued notes and the end-of-run announcement. All files are under `src/modules/ai/`.\n\nThe module holds no persistence of its own. Saved Conversations come from Rust through the IPC `commands` in `src/lib/ipc/bindings`. This module only folds events and derives view data from them. Svelte components elsewhere in the AI frontend render the results.\n\nRelated pages:\n- [AI_Assistant_Frontend](../AI_Assistant_Frontend.md) is the parent module.\n- [AI_Branches_History_and_Saved](AI_Branches_History_and_Saved.md) covers branch pager, history and saved questions.\n- [AI_Providers_and_Models](AI_Providers_and_Models.md) covers `Choice`, which `SentQuestion` extends.\n- [AI_Assistant_Commands](../Tauri_Host_and_Command_Layer/AI_Assistant_Commands.md) covers the Tauri commands and the run events they emit.\n- [Agent_Harness](../AI_Assistant_Backend/Agent_Harness.md) and [AI_Module](../AI_Assistant_Backend/AI_Module.md) cover the backend that produces the events.\n- [IPC_Bridge_and_Core_Mocks](../IPC_Bridge_and_Browser_Mocks/IPC_Bridge_and_Core_Mocks.md) covers the event bridge and the browser mocks.\n\n## Architecture\n\n```mermaid\ngraph TD\n  Rust[Rust AI run engine] -- AiRunEvent --> Bridge[IPC event bridge]\n  Bridge --> Live[LiveRunStore: liveRuns]\n  Live --> RS[run-state.ts: applyRunEvent]\n  Live --> QS[queue-state.ts]\n  RS --> UI[AI page components]\n  QS --> UI\n  Saved[(Saved Conversation: EntryView[])] --> Act[activity.ts]\n  Saved --> Ans[answers.ts]\n  Ans --> Earlier[earlier-answers.ts]\n  Act --> Earlier\n  Saved --> RS\n  Act --> UI\n  Earlier --> UI\n  Fail[failure-banner.ts] --> UI\n  Ann[announce.ts] --> UI\n  Src[source-excerpt.ts] -- journalPages / todoTask --> Rust\n  Copy[copy.ts] -- aiConversationMarkdown --> Rust\n  Req[ai-requests.svelte.ts] --> UI\n  Ctx[local-context.ts] --> UI\n```\n\n## Components\n\n### Live Run state\n\n| Component | File | Role |\n|---|---|---|\n| `applyRunEvent` and selectors | `run-state.ts` | Pure reducer from `AiRunEvent` into `LiveRuns` (keyed by run id). It has selectors: `answeringIn`, `failedIn`, `bannerRuns`, `lastQuestionId`, `runsUnder`, `unplacedRuns`. |\n| `LiveRunStore` / `liveRuns` | `live.svelte.ts` | A Svelte 5 `$state` singleton holding `runs`, `sent` (the questions this page sent, kept for \"Try again\") and `queued` (notes per Conversation). Methods: `apply`, `remember`, `dismiss`, `dropNote`, `clear`. |\n| queue helpers | `queue-state.ts` | `setQueued`, `dropQueued` and `recalledText`. Notes taken back are joined one per line. |\n| `announcementFor` | `announce.ts` | One sentence for the polite live region when a Run ends: complete, stopped, or failed with a message. Streamed text is never announced token by token. |\n| `failureBanner` | `failure-banner.ts` | Maps each `Failure` kind to a tone (`danger` or `warning`), a short title and an ordered list of actions (`retry`, `change_model`, `change_provider`, `branch_from_earlier`, `new_conversation`). The sentence under the title comes from Rust. |\n\n`applyRunEvent` rules:\n- `runStarted` creates the Run and drops that Conversation's earlier failed Runs, so stale banners go away.\n- `textDelta` appends to the current Step's text.\n- `stepStarted` resets the text, because each Step's text starts afresh.\n- `toolStarted` appends a step with a null summary; `toolEnded` fills in the summary and error flag by call id.\n- `entrySaved` with kind `user` records `questionId`, which places the Run under its question.\n- `runEnded` with `answered` or `stopped` removes the Run, because the saved Conversation now holds the text. `runEnded` with `failed` keeps the Run with its `{kind, message}`.\n- `queueChanged` is handled by `LiveRunStore.apply` before it reaches the reducer, so it is not a Run.\n\n```mermaid\nstateDiagram-v2\n  [*] --> Answering: runStarted\n  Answering --> Answering: textDelta / stepStarted / toolStarted / toolEnded\n  Answering --> Answering: entrySaved(user) sets questionId\n  Answering --> [*]: runEnded answered or stopped\n  Answering --> Failed: runEnded failed\n  Failed --> [*]: new runStarted in same Conversation, or dismiss\n```\n\nA failed Run's banner shows only while its `questionId` equals the last question of the shown Branch (`bannerRuns` with `lastQuestionId`). Moving to another question or Branch hides it.\n\n### Thread derivations from saved entries\n\n| Function | File | Purpose |\n|---|---|---|\n| `stepsByQuestion` | `activity.ts` | Groups `tool_result` entries under the question they follow, as `ActivityStep` (`name`, `summary`, `isError`). |\n| `runningLabel` / `completedLabel` | `activity.ts` | Activity line text, for example \"Reading your journal and tasks… · 2 steps done\" and \"Completed 3 steps\". |\n| `openHref` / `sourceModule` | `activity.ts` | Deep link for a cited `Source` (`/todo?task=<id>` or `/journal/<date>`) and the label \"Todo\" or \"Journal\". |\n| `withoutCitations` | `activity.ts` | Strips `[uuid]` markers from answer text. The Sources chips stand for them. |\n| `questionOfAnswers` / `questionsByAnswer` | `answers.ts` | Maps each answer to the last question before it. Try again, Edit and Save this question use it. |\n| `earlierAnswers` / `excerpt` | `earlier-answers.ts` | Rows for the \"Branch from earlier\" picker. Tool-calling Steps are skipped. A stopped answer is marked `stopped`. Answers are cut to 120 characters and questions to 160. |\n| `loadSource` / `firstLines` | `source-excerpt.ts` | Preview of a cited item (3 lines, 240 characters) through the existing Journal page read and Todo task read. A missing item rejects with \"That Entry no longer exists\", or with the Todo module's own error. A `SourceReader` can be injected for tests. |\n\n### Page-level helpers\n\n- `AiRequests` / `aiRequests` (`ai-requests.svelte.ts`) holds one pending request (`'composer' | 'history' | 'new'`) from keys or palette actions. `request` sets it and `take` returns and clears it. An action that navigates to the AI page first still lands after the page mounts.\n- `copyAsMarkdown` (`copy.ts`) calls `commands.aiConversationMarkdown` and writes the result to the clipboard. The Rust side builds the text. It toasts success or failure.\n- `localContext` (`local-context.ts`) builds the `LocalContext` sent with a question: local date, weekday, time zone and week start. The backend tells the model the date and time zone from it.\n\n## Data flow of a question\n\n```mermaid\nsequenceDiagram\n  participant U as Person\n  participant P as AI page\n  participant S as liveRuns\n  participant R as Rust run engine\n  U->>P: ask\n  P->>R: aiRunStart(text, choice, localContext)\n  P->>S: remember(runId, SentQuestion)\n  R-->>S: runStarted, entrySaved(user), stepStarted\n  R-->>S: textDelta / toolStarted / toolEnded\n  S-->>P: live text and steps (runsUnder question)\n  R-->>S: runEnded\n  alt answered or stopped\n    S->>S: drop Run\n    P->>R: refetch Conversation (saved entries)\n    P->>U: announcementFor(outcome)\n  else failed\n    S->>S: keep failure\n    P->>U: failureBanner(kind) + Rust sentence\n  end\n```\n\n## Design notes\n\n- Live state is kept in memory only. A reload forgets Runs, and the saved Conversation is the record.\n- Reducers and selectors are pure functions, which makes them easy to unit test. The `*.test.ts` files cover `run-state`, `queue-state`, `answers`, `earlier-answers` and `source-excerpt`. One `source-excerpt` test runs against the browser mocks `createJournalMock` and `createTodoMock`.\n- User-facing wording for failures comes from Rust. The TypeScript titles are short labels that must not repeat the start of that sentence.\n", "AI_Assistant_Frontend/AI_Providers_and_Models.md": "# AI Providers and Models\n\nThe **AI_Providers_and_Models** module is the part of the [AI Assistant Frontend](../AI_Assistant_Frontend.md) that decides *which Provider and Model answer a question* and *how a Provider is described, created and edited*. It is a set of small, pure TypeScript helpers wi
