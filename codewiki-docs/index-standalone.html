he tests are in `src-tauri/src/`. They call the real Tauri commands (`ai_*`, `todo_*`) through the mock runtime (`TestApp`, ADR 0009). They don't call the internal crates directly.\n\nEach test checks two things: what the command returns, and what ends up in SQLite, including `change_log` and the FTS index. No test uses the network or a real Model. AI tests use either a `ScriptedProvider` or the real wire adapters against a loopback `FakeServer`.\n\nThe module has three suites:\n\n| Suite | Scope |\n|---|---|\n| [AI_Run_Engine_Tests](Backend_Integration_Test_Suites/AI_Run_Engine_Tests.md) | The AI Run loop: the tracer bullet, the six read-only Tools, run control (stop, steer, send-now, backgrounding), and the wire adapters (Wrapper, OpenAI-compatible, Anthropic, OpenRouter). |\n| [AI_Data_and_Provider_Tests](Backend_Integration_Test_Suites/AI_Data_and_Provider_Tests.md) | The data around a Run: Branches, Conversations, Providers and keys, Saved questions, and AI sync across two devices. |\n| [todo_sheet_tests](Backend_Integration_Test_Suites/todo_sheet_tests.md) | The Todo Task sheet rules: Priority, Won't do, open steps, editing sessions, delete/restore/purge, Comments and History. |\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph Suites[\"Backend_Integration_Test_Suites (src-tauri/src)\"]\n        RUN[AI_Run_Engine_Tests<br/>tracer, tools, run_control, wire]\n        DATA[AI_Data_and_Provider_Tests<br/>branching, conversations, provider, saved, sync]\n        TODO[todo_sheet_tests]\n    end\n    DATA -->|reuses helpers: ask, get, install, until_end| RUN\n    RUN --> TA[test_support::TestApp]\n    DATA --> TA\n    TODO --> TA\n    TA --> CMD[Tauri commands<br/>ai.rs, todo.rs]\n    CMD --> AI[mnemora_ai]\n    CMD --> TD[mnemora_todo]\n    AI --> H[mnemora_harness<br/>ScriptedProvider]\n    AI --> P[mnemora_providers<br/>adapters + FakeServer]\n    AI --> DB[(SQLite)]\n    TD --> DB\n    DB --> CL[change_log / FTS]\n    DATA -->|Cluster of two devices| SYNC[Sync engine]\n    FX[(src/lib/ipc/fixtures/*.json)] -.shared with browser mocks.-> RUN\n    FX -.-> DATA\n```\n\n### Test strategy\n\n```mermaid\nsequenceDiagram\n    participant T as Test\n    participant A as TestApp (mock runtime)\n    participant C as Tauri command\n    participant S as ScriptedProvider / FakeServer\n    participant D as SQLite\n    T->>A: install provider, seed data\n    T->>C: invoke ai_run_start / todo_task_update ...\n    C->>S: model request (AI tests only)\n    S-->>C: scripted reply or canned HTTP\n    C->>D: write entries, change_log\n    C-->>T: result JSON / AiRunEvent stream\n    T->>D: assert state (with_db, ai_conversation_get)\n```\n\nKey conventions:\n- **Shared helpers.** `ai_tracer_tests` owns `ask`, `get`, `install`, `until_end`, `label` and `local`. `AI_Data_and_Provider_Tests` reuses them, so changing their signatures affects that suite too.\n- **Shared fixtures.** JSON files in `src/lib/ipc/fixtures/` (such as `ai-title.json` and `ai-history.json`) are run by both the Rust tests and the browser mocks. This keeps the two implementations consistent.\n- **Refused commands write nothing.** Refusals use the error codes `validation` and `not_found`, and the tests check `change_log` is unchanged.\n- **Frozen clock.** `TestApp` can freeze the clock, so ordering is tested against `change_log` sequence rather than wall time.\n\n## Core component documentation\n\n- [AI_Run_Engine_Tests](Backend_Integration_Test_Suites/AI_Run_Engine_Tests.md)\n- [AI_Data_and_Provider_Tests](Backend_Integration_Test_Suites/AI_Data_and_Provider_Tests.md)\n- [todo_sheet_tests](Backend_Integration_Test_Suites/todo_sheet_tests.md)\n\nThe code under test is covered in the AI_Assistant_Commands, Todo_Domain_Service, AI_Module, Agent_Harness, LLM_Providers, Todo_Tasks_and_Lists and Sync_Replication_Engine documentation.", "Build,_Tooling_and_Packaging/Build_and_Config.md": "# Build_and_Config\n\nRepo-root build orchestration, lint/format configuration and helper scripts for Mnemora. It covers the `Makefile`, the Cargo and pnpm workspace manifests, style/lint configs and the shell scripts under `scripts/`. It does not cover the Tauri crate build (`src-tauri/Cargo.toml`, `build.rs`, Gradle files); see [Build_and_Packaging](Build_and_Packaging.md). It also does not cover Vite and TypeScript configuration; see [frontend_build_config](frontend_build_config.md). The parent page is [Build, Tooling and Packaging](../Build,_Tooling_and_Packaging.md).\n\n## Purpose\n\n- Give developers one entry point (`make <target>`) for dev, build, test, lint, format, icons and bindings.\n- Keep builds inside the limits of an 8 GB dev machine. `CARGO_BUILD_JOBS=2` is set, incremental compilation is off, and Gradle runs without a daemon and with a capped heap.\n- Pin every dependency exactly, and enforce one lint/format policy across Rust and TypeScript.\n- Provide local signing for macOS and Android without paid developer accounts.\n\n## Architecture\n\n```mermaid\ngraph TD\n  Make[Makefile] --> WithEnv[scripts/with-env.sh]\n  Make --> Sign[scripts/signing-env.sh]\n  Make --> Colors[scripts/check-colors.sh]\n  Make --> Icons[scripts/make-icons.sh]\n  Make --> Setup[setup: setup-android.sh + setup-signing.sh]\n  WithEnv --> DevMjs[scripts/dev.mjs]\n  WithEnv --> Cargo[cargo / cargo tauri]\n  WithEnv --> Pnpm[pnpm: vitest, biome, svelte-check]\n  WithEnv --> Gradle[gradlew / adb]\n  Cargo --> WS[Cargo.toml workspace]\n  WS --> Lints[clippy.toml + rustfmt.toml]\n  Pnpm --> PkgJson[package.json + pnpm-workspace.yaml]\n  Pnpm --> Biome[biome.json]\n  Setup --> EnvLocal[.env.local]\n  Setup --> Keychain[(macOS Keychain / ~/.mnemora keystore)]\n  Sign --> Keychain\n```\n\n## Makefile targets (`Makefile`)\n\nLong-running commands go through `$(RUN)`, which is `./scripts/with-env.sh`. The default goal is `help`, which lists every target that has a `##` comment.\n\n| Target | Action |\n|---|---|\n| `dev` | `node scripts/dev.mjs $(ARGS)`: Vite plus a key menu, using Production data. |\n| `sandbox` | The same with `--sandbox`: separate Sandbox data and the SANDBOX badge. |\n| `build` | Evaluates `signing-env.sh mac`, then `cargo tauri build` (`.app`/`.dmg`). |\n| `android-dev` | `dev.mjs --sandbox --android`: runs on a USB phone with Sandbox data. |\n| `android` | Unsets `MNEMORA_ANDROID_SANDBOX`, loads Android signing env, builds a signed arm64 release APK, finds the newest non-unsigned release APK and runs `adb install -r`. |\n| `android-sandbox` | Debug Sandbox APK (`--features sandbox`, `MNEMORA_ANDROID_SANDBOX=1`), installed with `adb`. |\n| `android-test` | Gradle `:app:testDebugUnitTest` with `--max-workers=2`, then `gradlew --stop`. It is kept out of `make test` because Gradle is heavy. |\n| `test` | `cargo test --workspace` plus `pnpm vitest run --passWithNoTests`. |\n| `lint` | `clippy -D warnings`, `cargo fmt --check`, `check-colors.sh`, `biome check`, `svelte-check`. |\n| `fmt` | `cargo fmt --all` and `biome check --write`. |\n| `icons` | Runs `scripts/make-icons.sh`. |\n| `bindings` | `cargo test -p mnemora-app regenerate_bindings -- --ignored` regenerates `src/lib/ipc/bindings.ts` without launching the app. |\n| `trim` | Deletes incremental dirs, docs and Gradle outputs but keeps compiled deps. |\n| `clean-heavy` | Asks first, then deletes `target`, `node_modules`, `dist` and the Android build dirs. |\n| `setup` | Runs `setup-android.sh` and `setup-signing.sh`. It modifies the system, so read the scripts first. |\n\nThe dev port, 47821, is shared by `vite.config.ts` and `src-tauri/tauri.conf.json`. See [frontend_build_config](frontend_build_config.md).\n\n### Typical flow\n\n```mermaid\nsequenceDiagram\n  participant Dev\n  participant Make\n  participant Sign as signing-env.sh\n  participant Env as with-env.sh\n  participant Tauri as cargo tauri\n  Dev->>Make: make build\n  Make->>Sign: eval \"$(signing-env.sh mac)\"\n  Sign-->>Make: export APPLE_SIGNING_IDENTITY (if set up)\n  Make->>Env: cargo tauri build\n  Env->>Env: CARGO_BUILD_JOBS=2, source .env.local\n  Env->>Tauri: run as child\n  Tauri-->>Dev: .app / .dmg\n  Env->>Env: on exit/INT/TERM kill descendant tree\n```\n\n## Scripts\n\n- **`scripts/with-env.sh`**: changes to the repo root and exports `CARGO_BUILD_JOBS=2`. It sources the git-ignored `.env.local` with `set -a`, runs the command in the background with stdin kept attached (needed for the Android device prompt) and waits for it. A trap on EXIT, INT and TERM runs `kill_tree`, a recursive `pgrep -P` walk, then a `KILL` after 1 s. This stops stray vite, cargo or gradle processes from lingering.\n- **`scripts/signing-env.sh mac|android`**: prints `export` lines for use with `eval`. For `mac` it unlocks the `mnemora-signing.keychain-db` and sets `APPLE_SIGNING_IDENTITY=\"Mnemora Dev\"`. For `android` it sets `MNEMORA_KEYSTORE_PATH`, `MNEMORA_KEYSTORE_PASSWORD` and `MNEMORA_KEY_ALIAS`. Secrets come from the login Keychain and nothing is written to disk. It prints nothing if signing is not set up, which gives an unsigned build.\n- **`scripts/setup-signing.sh`**: idempotent one-time setup.\n  - On macOS it creates a dedicated keychain and a self-signed `Mnemora Dev` code-signing certificate. It uses Apple's LibreSSL because Homebrew OpenSSL 3 produces PKCS12 files that `security import` rejects.\n  - It creates `~/.mnemora/release.keystore` (RSA 2048, 10000 days) and never overwrites an existing one, because losing or replacing it makes installed apps un-upgradeable.\n  - It writes a password-free `src-tauri/gen/android/keystore.properties` for Gradle. Gradle takes the password from `MNEMORA_KEYSTORE_PASSWORD`.\n- **`scripts/setup-android.sh`**: installs the latest NDK through the Homebrew `sdkmanager`.\n  - It prunes the NDK to an arm64-only Rust toolchain, from roughly 2.9 GB to 0.5 GB.\n  - It removes the emulator and build-tools 35.0.0.\n  - It adds the `aarch64-linux-android` target and removes the other Android targets.\n  - It writes a managed block into `.env.local` (`ANDROID_HOME`, `NDK_HOME`, `JAVA_HOME`, `GRADLE_OPTS`) and tunes `gradle.properties` for low memory (no daemon, no parallel, `-Xmx1536m`).\n  - It needs `--yes` or an interactive confirmation.\n- **`scripts/make-icons.sh`**: renders icons with `cargo tauri icon`. It does not use `qlmanage`, which paints an opaque white background.\n  - From `app-icon.svg` it produces the desktop and iOS icons.\n  - From `app-icon-sandbox.svg` it produces the Sandbox Mac icons.\n  - From `app-icon-fullbleed.svg` it produces the Windows icons, the favicon and the apple-touch-icon.\n  - It copies the Android adaptive-icon vector XML, including the Sandbox variant, into `gen/android/.../res`.\n- **`scripts/check-colors.sh`**: greps `src/` for hex, `rgb(a)`, `hsl(a)` and `oklch` literals in `.svelte`, `.ts` and `.css` files. It excludes `tokens.css`, `AppMark.svelte`, tests and `bindings.ts`. It exits 1 on a hit. This enforces the \"tokens only\" rule from the UI system.\n\n## Rust workspace (`Cargo.toml`)\n\n- Workspace members: `core`, `journal`, `todo`, `sync`, `harness`, `providers`, `ai` and `src-tauri`. Edition 2024, resolver 3, rust-version 1.90, version 0.2.0, unpublished.\n- Every dependency is pinned with `=` in `[workspace.dependencies]`. Tauri stays on 2.x (`=2.12.4`), and `tauri-specta` and `specta` must be the same rc. `rusqlite` is bundled, with backup, functions and hooks. TLS is rustls with the `ring` provider, which avoids cmake/NASM and cross-builds for Android. Other pinned crates cover pairing (spake2, mdns-sd), three-way text merge (`similar`), HTTP (`ureq` with rustls) and JNI (`jni`, Android only). Which crates use which is documented in their own module pages, for example [Sync_Replication_Engine](../Sync_Replication_Engine.md) and [AI_Assistant_Backend](../AI_Assistant_Backend.md).\n- Lints:\n  - `unsafe_code = deny` and `missing_docs = warn`.\n  - clippy `all = deny`, `pedantic = warn`, and `unwrap_used` / `expect_used` set to `deny`.\n  - A few noisy pedantic lints are allowed.\n- `clippy.toml` allows `unwrap` and `expect` in tests.\n- `rustfmt.toml`: edition 2024, width 100, Unix newlines, field-init and try shorthand. Import grouping is kept by hand because the grouping options are nightly-only.\n- Profiles:\n  - Dev uses line-tables-only debug info, no incremental compilation, and no debug info for dependencies.\n  - Release uses `opt-level = \"s\"`, no LTO, `codegen-units = 16`, `strip` and `panic = \"abort\"`.\n  - `release.build-override` keeps `strip = false`. Stripping proc-macros breaks macOS release builds with E0463.\n\n## Frontend tooling\n\n- `package.json` (pnpm 11.20.0, ESM, private) defines scripts `dev` (vite), `dev:menu` (`scripts/dev.mjs`), `build` (vite build), `check` (svelte-check), `lint` (biome) and `test` (vitest). All dependency versions are exact. The stack is Svelte 5, Vite 8, Tailwind 4, TanStack Query and Virtual, CodeMirror 6, bits-ui, sv-router and the Tauri API.\n- `pnpm-workspace.yaml` exempts two CodeMirror/Lezer versions from the minimum release-age policy. It also overrides `@codemirror/view` and `@lezer/markdown` so only one copy of each is loaded, because CodeMirror breaks with duplicate view/state versions. See [Markdown_Editor](../Design_System_and_UI_Components/Markdown_Editor.md).\n- `biome.json` (2.5.15) uses 2-space indent, line width 100, single quotes and the recommended rules (except `noImportantStyles`), and enables Tailwind directive parsing. It ignores `dist`, `node_modules`, `src-tauri`, `crates`, `docs`, `target`, `.claude`, generated `bindings.ts` and `*.svelte`. Svelte files are checked by `svelte-check`.\n- `.editorconfig`: UTF-8, LF, final newline, trimmed whitespace, 2-space indent. Rust files use 4 spaces, the Makefile uses tabs, and Markdown keeps trailing whitespace.\n\n## Relationships\n\n- `make bindings` and `make test` depend on the Tauri host crate; see [Tauri_Host_and_Command_Layer](../Tauri_Host_and_Command_Layer.md) and [IPC_Bridge_and_Browser_Mocks](../IPC_Bridge_and_Browser_Mocks.md).\n- The Android targets rely on the generated Gradle project described in [Build_and_Packaging](Build_and_Packaging.md) and on the app code in [Android_and_Home-Screen_Widget_Platform](../Android_and_Home-Screen_Widget_Platform.md).\n- `check-colors.sh` guards [Design_System_and_UI_Components](../Design_System_and_UI_Components.md).\n\n## Maintenance notes\n\n- Adding a Rust crate means adding it to `members` and to `[workspace.dependencies]`, with exact pins.\n- Adding a make target needs a `## description` comment and a name matching `[a-z-]+` for `help` to list it.\n- Never re-create the Android keystore. Run `make setup` only after reading the scripts, since it modifies the NDK and the system keychains.\n", "Build,_Tooling_and_Packaging/Build_and_Packaging.md": "# Build and Packaging\n\nThis module covers how the Rust/Tauri shell crate (`src-tauri`) is built and packaged for desktop and Android. It consists of:\n\n- the `mnemora-app` crate manifest (`src-tauri/Cargo.toml`) and its Tauri build script (`src-tauri/build.rs`);\n- the generated Android Gradle project under `src-tauri/gen/android` (app module, root build, `buildSrc` Rust plugin, settings).\n\nWorkspace-level configuration (root `Cargo.toml`, `Makefile`, `package.json`, lint/format config, helper scripts) is documented in [Build_and_Config](Build_and_Config.md). The Vite and TypeScript setup is in [frontend_build_config](frontend_build_config.md). The code that is packaged is described in [Tauri_Host_and_Command_Layer](../Tauri_Host_and_Command_Layer.md) and [Android_and_Home-Screen_Widget_Platform](../Android_and_Home-Screen_Widget_Platform.md).\n\n## Architecture\n\n```mermaid\ngraph TD\n    Make[Makefile targets<br/>build / android / android-sandbox] --> CargoTauri[cargo tauri build / android build]\n    CargoTauri --> AppCrate[src-tauri/Cargo.toml<br/>mnemora-app]\n    AppCrate --> BuildRs[build.rs<br/>tauri_build::build]\n    AppCrate --> Crates[mnemora-core, journal, todo,<br/>sync, ai, harness]\n    CargoTauri -->|android| Gradle[src-tauri/gen/android]\n    Gradle --> AppGradle[app/build.gradle.kts]\n    Gradle --> BuildSrc[buildSrc: RustPlugin + BuildTask]\n    BuildSrc -->|cargo tauri android android-studio-script| CargoTauri\n    BuildSrc --> JniLibs[arm64-v8a .so -> merge JniLibFolders]\n    AppGradle --> APK[Debug / signed release APK]\n```\n\n## The `mnemora-app` crate (`src-tauri/Cargo.toml`)\n\n- **Thin shell**: its description states that it is wiring only; logic lives in the workspace crates (`mnemora-core`, `-journal`, `-todo`, `-sync`, `-ai`, `-harness`). Package metadata (version, edition, rust-version, license, publish) and lints are inherited from the workspace root.\n- **Crate types**: the lib is named `mnemora_lib` with `staticlib`, `cdylib` and `rlib`. The `_lib` suffix avoids a Windows lib/bin name clash; `cdylib` is what Android loads as a JNI library; `staticlib` serves mobile targets.\n- **Feature `sandbox`**: selects `Environment::Sandbox` (separate data, identifier and badge). It is passed by `make android-sandbox` (`--features sandbox`) and mirrors the Gradle `isSandbox` flag.\n- **Tauri features**: `wry`, `compression`, `common-controls-v6`, `dynamic-acl`, `x11`. Plugins: `tauri-plugin-opener`; IPC typing through `tauri-specta`/`specta`/`specta-typescript` (used by `make bindings`).\n- **Android-only dependency**: `jni` under `cfg(target_os = \"android\")` for the widget and sync-power bridges.\n- **Dev-dependencies**: Tauri `test` feature (mock runtime), `mnemora-providers` with `testing` (fake wrapper), `tempfile`, and `tokio` for real loopback socket tests. None reach release builds.\n\n## Build script (`src-tauri/build.rs`)\n\n`main` calls `tauri_build::build()`, which generates the context and capability schemas. It first emits `cargo:rerun-if-changed=icons`, because `generate_context!()` embeds icons at compile time but tauri-build does not track them; without it `make icons` would leave the old icon in the binary.\n\n## Android Gradle project (`src-tauri/gen/android`)\n\n| File | Role |\n|---|---|\n| `settings.gradle` | Includes `:app` and applies the Tauri-generated `tauri.settings.gradle`. |\n| `build.gradle.kts` (root) | Buildscript classpath: Android Gradle Plugin 8.13.0, Kotlin plugin 1.9.25; Google and Maven Central repos; a `clean` task. |\n| `buildSrc/build.gradle.kts` | `kotlin-dsl` project registering the plugin id `rust` → `RustPlugin`. |\n| `buildSrc/.../RustPlugin.kt` | Creates the `rust` extension (`rootDirRel`), product flavors, and per-profile Rust build tasks. |\n| `buildSrc/.../BuildTask.kt` | Gradle task that runs `cargo tauri android android-studio-script` with `--target` (and `--release`, `-v`/`-vv` per log level); on Windows retries `cargo.exe/.cmd/.bat`. |\n| `app/build.gradle.kts` | Application configuration, Sandbox variant, signing, dependencies. |\n\n### Rust-to-Gradle wiring\n\n```mermaid\nsequenceDiagram\n    participant G as Gradle (app)\n    participant P as RustPlugin\n    participant T as BuildTask\n    participant C as cargo tauri\n    G->>P: apply plugin \"rust\"\n    P->>P: flavors \"universal\" + \"arm64\" (abi arm64-v8a)\n    P->>P: create rustBuildUniversal{Debug,Release}\n    G->>T: rustBuildArm64{Debug,Release} (before merge*JniLibFolders)\n    T->>C: cargo tauri android android-studio-script --target aarch64 [--release]\n    C-->>G: libmnemora_lib.so in jniLibs\n```\n\n`RustPlugin` defaults to arm64 only (`abiList=arm64-v8a`, `archList=arm64`, `targetList=aarch64`), overridable with Gradle properties `abiList`, `archList`, `targetList`. For each of `debug`/`release` it creates `rustBuildUniversal<Profile>` and a per-arch `rustBuild<Arch><Profile>` task, and makes the `merge…JniLibFolders` tasks depend on them. arm64-only keeps builds fast and the NDK pruned (see `scripts/setup-android.sh` in [Build_and_Config](Build_and_Config.md)).\n\n### App module (`app/build.gradle.kts`)\n\n- **Identity**: namespace and `applicationId` `com.hemang.mnemora`; `compileSdk`/`targetSdk` 36, `minSdk` 26. `versionCode`/`versionName` come from `tauri.properties`.\n- **Sandbox vs Production**: `isSandbox` is true when env `MNEMORA_ANDROID_SANDBOX=1` or property `mnemora.sandbox=true`. Sandbox gets `applicationIdSuffix \".sandbox\"`, label \"Mnemora Sandbox\", the `ic_launcher_sandbox` icon, a `BuildConfig.SANDBOX` flag, and widget resources (`todo_widget_label`, `todo_widget_tag_text`, `todo_widget_tag_fill`) so it installs beside Production and is visibly distinct.\n- **Build types**: debug allows cleartext traffic (dev server), is debuggable with JNI debug and keeps arm64 debug symbols. Release disables R8 minification (heaviest Gradle step; app code is almost all Rust).\n- **Signing**: `keystore.properties` (path/alias, no secrets) plus `MNEMORA_KEYSTORE_PASSWORD` from the environment, exported by `make android` via `scripts/signing-env.sh` from the macOS Keychain. A release build without them fails with a message pointing to `make setup` (`scripts/setup-signing.sh`).\n- **Dependencies**: androidx webkit, appcompat, activity-ktx, lifecycle-process, Material; JUnit and `org.json` (real implementation for widget parsing in local tests) for `make android-test`.\n- Applies Tauri-generated `tauri.build.gradle.kts` and sets `rust { rootDirRel = \"../../../\" }` (repo root).\n\n## Build flows\n\n```mermaid\nflowchart LR\n    A[make build] --> B[signing-env.sh mac] --> C[cargo tauri build] --> D[.app / .dmg]\n    E[make android] --> F[signing-env.sh android] --> G[cargo tauri android build --target aarch64 --apk] --> H[adb install signed APK]\n    I[make android-sandbox] --> J[MNEMORA_ANDROID_SANDBOX=1<br/>--debug --features sandbox] --> K[adb install debug APK]\n```\n\nNote the symmetry: Rust's `sandbox` Cargo feature and Gradle's `isSandbox` must both be set for a Sandbox Android build; `make android` explicitly unsets `MNEMORA_ANDROID_SANDBOX` so Production is never built as Sandbox.\n\n## Source artifacts\n\n`src-tauri/Cargo.toml`, `src-tauri/build.rs`, `src-tauri/gen/android/{settings.gradle, build.gradle.kts, app/build.gradle.kts, buildSrc/build.gradle.kts, buildSrc/src/main/java/com/hemang/mnemora/kotlin/{RustPlugin,BuildTask}.kt}`; orchestrated by the root `Makefile` and workspace `Cargo.toml` (see [Build_and_Config](Build_and_Config.md)).\n", "Build,_Tooling_and_Packaging/frontend_build_config.md": "# frontend_build_config\n\nThe `frontend_build_config` module holds the two files that configure how the Svelte 5 + TypeScript frontend is compiled, type-checked and served: `vite.config.ts` (bundler and dev server) and `tsconfig.json` (TypeScript compiler options). Together they define the frontend toolchain that [Tauri](../Tauri_Host_and_Command_Layer.md) wraps on desktop and Android.\n\nIt is a child of [Build, Tooling and Packaging](../Build,_Tooling_and_Packaging.md). Sibling pages: [Build_and_Config](Build_and_Config.md) (Makefile, package.json, Biome, scripts) and [Build_and_Packaging](Build_and_Packaging.md) (Cargo/Gradle/Rust build).\n\n## Components\n\n| File | Role |\n|---|---|\n| `vite.config.ts` | Vite plugins, dev-server port and HMR, file watching, production build target |\n| `tsconfig.json` | Strict TypeScript settings extending `@tsconfig/svelte`; used by `svelte-check` and editors |\n\n## Architecture\n\n```mermaid\ngraph TD\n    pkg[\"package.json scripts<br/>dev / build / check / test\"] --> vite[\"vite.config.ts\"]\n    pkg --> tsc[\"tsconfig.json\"]\n    vite --> tw[\"@tailwindcss/vite\"]\n    vite --> icons[\"unplugin-icons<br/>compiler: svelte\"]\n    vite --> svelte[\"@sveltejs/vite-plugin-svelte\"]\n    tsc --> base[\"@tsconfig/svelte\"]\n    tsc -. includes .-> vite\n    vite --> dist[\"dist/ bundle<br/>target safari15\"]\n    dist --> tauri[\"Tauri webview\"]\n    tauriconf[\"src-tauri/tauri.conf.json devUrl\"] -. same port .-> vite\n```\n\n## vite.config.ts\n\n**Plugins** (order matters): `tailwindcss()` (Tailwind v4), `Icons({ compiler: 'svelte' })` (icons such as `@iconify-json/lucide` imported as Svelte components), then `svelte()`.\n\n**Settings**\n- `clearScreen: false` – keeps Rust compiler errors visible when Vite runs under `cargo tauri dev`.\n- `envPrefix: ['VITE_', 'TAURI_']` – only these env vars are exposed to client code.\n- `server.port: 47821` with `strictPort: true` – fails rather than choosing another port, because Tauri's `devUrl` must match. The comment in the file notes the value is duplicated in `scripts/dev/config.mjs` and `devUrl` in `src-tauri/tauri.conf.json`; **keep all three equal**.\n- `server.host` – `TAURI_DEV_HOST` (set by `cargo tauri android dev`) or `false`. When set, HMR uses WebSocket on that host at port `47822`, so a phone can reach the dev server.\n- `server.watch.ignored` – `src-tauri/`, `crates/` and `target/` are excluded so Rust rebuilds don't trigger frontend reloads.\n- `build.target: 'safari15'` – the lowest webview engine targeted (macOS WKWebView / older system webviews); `sourcemap: false`.\n\n```mermaid\nflowchart LR\n    A[cargo tauri android dev] -->|sets TAURI_DEV_HOST| B{host set?}\n    B -- yes --> C[listen on host, HMR ws :47822]\n    B -- no --> D[localhost only :47821]\n```\n\n## tsconfig.json\n\n- Extends `@tsconfig/svelte/tsconfig.json`.\n- `target: ES2022`, `module: ESNext`, `moduleResolution: bundler` (matches Vite).\n- Strictness: `strict`, `noUncheckedIndexedAccess` (indexed reads include `undefined`), `noImplicitOverride`.\n- `verbatimModuleSyntax` – type-only imports must use `import type`.\n- `skipLibCheck: true`.\n- `include`: `src/**/*.ts`, `src/**/*.svelte`, and `vite.config.ts`, so the config itself is type-checked.\n\n## How it is used\n\nScripts in `package.json`: `dev` → `vite`, `build` → `vite build`, `check` → `svelte-check --tsconfig ./tsconfig.json`, `test` → `vitest run` (Vitest reads the Vite config). Makefile targets (`make dev`, `make build`, `make test`, `make lint`) in [Build_and_Config](Build_and_Config.md) call these. The built bundle is consumed by the Tauri host described in [Build_and_Packaging](Build_and_Packaging.md). Source it compiles lives in [Frontend_Platform_and_Shell](../Frontend_Platform_and_Shell.md) and [Design_System_and_UI_Components](../Design_System_and_UI_Components.md).\n\n## Maintenance notes\n\n- Changing the dev port requires editing three places (see above).\n- Raising or lowering `build.target` affects which webviews can run the app, including Android System WebView.\n- Add new top-level TS files outside `src/` to `tsconfig.json` `include` if they should be type-checked.\n", "Build,_Tooling_and_Packaging.md": "# Build, Tooling and Packaging\n\n## Purpose\n\nThis module covers how Mnemora is built, checked and packaged. It has three parts:\n\n- **Developer entry points and workspace policy.** A single `make <target>` interface, the Cargo and pnpm workspaces with exact version pins, the lint and format rules, and the helper scripts, including local macOS and Android signing. All of it is tuned for an 8 GB dev machine (`CARGO_BUILD_JOBS=2`, no incremental builds, arm64-only Android).\n- **Shell crate and Android packaging.** The `mnemora-app` crate manifest, its Tauri `build.rs`, and the generated Android Gradle project. The Gradle project includes a Rust plugin that calls `cargo tauri`, plus the Sandbox and Production variants and release signing.\n- **Frontend toolchain.** The Vite config (plugins, dev port 47821, HMR, build target `safari15`) and the strict TypeScript config for the Svelte 5 frontend.\n\n## Architecture\n\n```mermaid\ngraph TD\n  Make[Makefile + scripts/*] --> BC[Build_and_Config]\n  Make --> FE[frontend_build_config<br/>vite.config.ts / tsconfig.json]\n  Make --> BP[Build_and_Packaging<br/>src-tauri Cargo + Gradle]\n  BC -->|workspace manifests, lint, signing env| BP\n  FE -->|dist bundle / dev server| Tauri[Tauri webview]\n  BP --> Tauri\n  BP --> Out[.app / .dmg / signed APK]\n```\n\nThe root `Makefile` goes through `scripts/with-env.sh`, which sets the build environment and kills child processes on exit. It starts the frontend and Rust builds, and `cargo tauri` ties them together. The Vite dev server port (47821) must match `devUrl` in `tauri.conf.json` and `scripts/dev/config.mjs`.\n\n```mermaid\nflowchart LR\n  A[make build] --> B[signing-env.sh mac] --> C[cargo tauri build<br/>runs vite build] --> D[.app / .dmg]\n  E[make android] --> F[signing-env.sh android] --> G[cargo tauri android build<br/>Gradle RustPlugin] --> H[signed arm64 APK]\n  I[make sandbox / android-sandbox] --> J[sandbox feature + isSandbox flag]\n```\n\nFor a Sandbox Android build, both the Rust `sandbox` feature and Gradle's `isSandbox` flag must be set. This lets the Sandbox install alongside Production.\n\n## Core components\n\n| Component | Scope | Documentation |\n|---|---|---|\n| Build_and_Config | `Makefile`, `scripts/`, workspace `Cargo.toml`, `package.json`, `biome.json`, `rustfmt.toml`, `clippy.toml`, signing and setup | [Build_and_Config](Build,_Tooling_and_Packaging/Build_and_Config.md) |\n| Build_and_Packaging | `src-tauri/Cargo.toml`, `build.rs`, Android Gradle project, `buildSrc` Rust plugin | [Build_and_Packaging](Build,_Tooling_and_Packaging/Build_and_Packaging.md) |\n| frontend_build_config | `vite.config.ts`, `tsconfig.json` | [frontend_build_config](Build,_Tooling_and_Packaging/frontend_build_config.md) |", "Core_Foundation.md": "# Core_Foundation\n\n`mnemora-core` (`crates/core`) is the dependency-free base of the Rust backend. It holds the contracts and shared infrastructure that every feature crate builds on: the `Module` trait, per-Module SQLite migrations and backups, typed Settings, the app-wide change log, the sync contract, editing holds, fractional ordering keys, search query parsing, text folding, the read-only AI `Tool` contract and small utilities.\n\nThe central rule: **Modules never import each other.** They share only what lives here, plus the event bus. The Sync crate likewise never imports a Module; it reads the contract in `syncable.rs`. See [Sync_Replication_Engine](Sync_Replication_Engine.md), [Domain_Modules_(Todo_and_Journal)](Domain_Modules_(Todo_and_Journal).md), [AI_Assistant_Backend](AI_Assistant_Backend.md) and [Tauri_Host_and_Command_Layer](Tauri_Host_and_Command_Layer.md) for the consumers.\n\nDependencies (`crates/core/Cargo.toml`): `rusqlite`, `rusqlite_migration`, `serde`/`serde_json`, `specta` (TypeScript binding generation), `thiserror`, `toml`, `tracing*`, `uuid`. Workspace lints apply.\n\n> Only part of the crate is shown in the provided components. Files such as `hlc`, `device`, `events`, `error` and `db/mod` are referenced below but their source is not documented here.\n\n## Architecture\n\n```mermaid\ngraph TD\n    Module[\"module.rs: Module trait + CoreModule\"]\n    Migrate[\"db/migrate.rs: per-Module migrations\"]\n    Backup[\"db/backup.rs: backups\"]\n    Settings[\"settings/: registry, store, sync\"]\n    Changelog[\"changelog.rs: change log\"]\n    Syncable[\"syncable.rs: sync contract\"]\n    Editing[\"editing.rs: holds\"]\n    Tool[\"tool.rs: AI Tool contract\"]\n    Order[\"order.rs: fractional keys\"]\n    Search[\"search/query.rs + text.rs\"]\n    Util[\"util.rs: ids, time\"]\n\n    Module --> Migrate\n    Module --> Settings\n    Module --> Syncable\n    Module --> Tool\n    Module --> Changelog\n    Migrate --> Backup\n    Settings --> Changelog\n    Settings --> Syncable\n    Changelog --> Syncable\n    Changelog --> Util\n    Backup --> Util\n    Search --> Text[\"text.rs: fold\"]\n```\n\n## The Module contract (`module.rs`)\n\n`Module` is the compile-time interface every feature implements. Only `id`, `migrations` and `register_settings` are required; the rest have defaults, so a Module opts in to each capability.\n\n| Method | Purpose |\n|---|---|\n| `id` | Stable id: Settings key prefix and migration namespace |\n| `default_enabled` | On until switched off (default) or off until opted in (Sync) |\n| `migrations` | Independently versioned schema |\n| `register_settings` | Declares keys, defaults, validators |\n| `sync_entities` | Entities and field classes it syncs (none by default) |\n| `apply_remote` | Applies winning remote field values through its own repository; not a new local change |\n| `settle_remote` | Post-apply rules that record ordinary local changes (e.g. Todo List name clash) |\n| `holdings` | Counts for the first-merge preview |\n| `tools` | Read-only AI Tools |\n| `backfill_log` | Brings pre-log rows into the change log, idempotently |\n| `on_startup` | One-time work after all migrations |\n\n`CoreModule` (id `core`) owns the `settings`, `change_log`, `device_clock` and `editing_sessions` tables via seven migrations. Its `on_startup` first sets the device id in the clock (so later writes are stamped), clears editing holds, and moves look-and-feel preferences into the device file. It registers the app-wide Preferences (theme, density, text size, reduce motion, display name, time/date format, week start, phone tabs, disabled/optional Modules). Theme, density, text size, reduce motion and phone tabs are **Device settings**.\n\n## Migrations and backups\n\n`db/migrate.rs` gives each Module its own version counter in `_module_migrations`. `rusqlite_migration` only has one counter (`PRAGMA user_version`), so it is lent to one Module at a time and always reset to 0, even when a step fails.\n\n```mermaid\nsequenceDiagram\n    participant App\n    participant M as migrate::run\n    participant B as backup\n    App->>M: run(conn, modules, backup_dir)\n    M->>M: plan() pending steps per Module\n    alt existing data and pending steps\n        M->>B: create_backup(from, to)\n    end\n    loop each pending Module\n        M->>M: apply(): to_latest, record version\n    end\n    M-->>App: MigrationReport{backup, applied}\n```\n\n- `MigrationReport` lists the backup path (if any) and `(module, from, to)` per Module that moved. A fresh database is not backed up.\n- A database newer than the app is refused with `ErrorCode::Database`.\n- `is_current` answers \"are all Modules current?\" without writing, using a scratch in-memory connection; the Todo widget uses it because it must never migrate.\n- `versions` exposes per-Module versions for the Sync handshake.\n\n`db/backup.rs` uses the SQLite online-backup API (safe with open connections). Files are written as `.partial` then renamed, named `<compact_utc>-<from>-to-<to>.db`. `backup_now` is the user-requested backup; `backup_for_pairing` is taken before merging with another device. `rotate` keeps the newest `KEEP_BACKUPS` (5) of **each kind** (migration/manual and pairing), so frequent pairings never evict migration backups.\n\n## Settings (`settings/`)\n\n- **Registry** (`schema.rs`): `SettingsRegistry` maps `module.key` to `SettingDef` (default, validator, `device` flag). Duplicate registration is logged and the first wins. `validate` offers `boolean`, `one_of`, `text(max)` (counts characters, not bytes) and `string_list`. `JsonValue` exists only so specta can type arbitrary JSON.\n- **Store** (`mod.rs`): `SettingsStore::save_batch` validates every change first, then writes shared rows in one transaction, each followed by a change-log record, then writes Device settings to `device.toml`, and finally publishes one `SettingsChanged` per Module. `get_all` overlays stored values on defaults, ignoring unknown or invalid rows. `SettingsChange` is the IPC request type. `save_if_unset` pins a value at upgrade time without validating or announcing.\n- **Device settings** live in the device file, are never change-logged and never synced.\n- **Sync** (`sync.rs`): entity `setting`, id `module.key`, one `value` field (newest write per key wins). `apply` accepts a remote value only for a registered, non-device key whose validator passes; `backfill` logs pre-existing shared Preferences stamped with their own `updated_at`.\n\n## The change log (`changelog.rs`)\n\nAn append-mostly log of full JSON snapshots (ADR 0008) used for Task History and Sync. Each record carries origin device, hybrid logical clock (`hlc_ms`, `hlc_counter`), local `seq`, `origin_seq`, `fields` (only what changed), `prev` (the replaced values, for three-way text merge) and `seen` (for deletes). Snapshots hold user content and must never be logged.\n\n```mermaid\nflowchart LR\n    W[Entity write] --> R[\"record(change)\"]\n    R --> T[hlc::tick]\n    R --> CF[\"changed_fields: diff vs latest snapshot + session history\"]\n    CF --> S[\"seen_by_delete (deletes only)\"]\n    S --> I[\"INSERT ... ON CONFLICT(entity,id,session) DO UPDATE\"]\n    Remote[Remote record] --> RR[\"record_remote: observe_tick, keep origin seq and clock\"]\n    Old[Pre-log rows] --> BF[\"backfill: create or diff-update\"]\n    BF --> I\n```\n\nKey behaviours:\n- A **session id** collapses an editing session into one record per entity; a `create` stays a `create`. Every rewrite still ticks, since peers fetch by sequence.\n- A session's rewrite keeps its earlier claimed fields only while the value is still the one it left, so it never re-stamps another device's later change as its own.\n- `backfill` is deterministic and idempotent: no record means `create`; a differing record means an `update` of just the differing non-derived fields; matching rows write nothing. Stamps use the row's own time (never later than now) and are raised only to sort after the entity's newest record and after the first record of anything it refers to (a Task after its List).\n- `read` returns an entity's records ordered by clock, then device and origin sequence, the same order on every device; unreadable snapshots are skipped so a screen never fails to load. `creator` returns the device holding the earliest `create`.\n\n## The sync contract (`syncable.rs`)\n\nModules describe what syncs; Sync consumes only this.\n\n- `FieldClass`: `Text` (three-way merge, clash raises a Conflict), `Value` (newest wins), `Order` (newest wins, reported apart), `Derived` (recomputed locally, never sent).\n- `SyncField` constructors (`text`, `value`, `order`, `derived`, `in_group`). Fields in a **group** are never split: a change to one sends all, and a receiver takes the whole group or none.\n- `SyncEntity` has `field`, `members`; `entity_of` looks one up by change-log name.\n- `wire_fields` picks the travelling fields of a record, dropping derived ones and, for locally made records, completing groups from the snapshot.\n- `RemoteChange`, `Applied`, `Settled`, `Holdings` and `SyncEvent` (TaskToInbox, TaskDeleted, EntryDeleted, ListsMerged, ConflictRaised, ConflictAutoResolved, SettingChanged, DeviceRenamed) carry data and reports between the engine and Modules.\n\n## Editing holds (`editing.rs`)\n\nWhile a person types, the editor takes a **hold** on an entity field (or `WHOLE`, `\"*\"`) and renews it. Sync stores remote changes for held fields apart and applies them on release. Holds are leases that lapse after `LEASE_MS` (120 s) so a vanished editor cannot block sync; `clear` runs at every start. The table is local and never synced. See [Sync_Replication_Engine](Sync_Replication_Engine.md) for the engine side.\n\n## Ordering keys (`order.rs`)\n\nFractional-index keys (ADR 0012) are base-62 strings read as fractions in (0, 1) and compared bytewise. `key_between` finds a key strictly between two others; `key_after` appends compactly. Canonical keys never end in `0` (`canonical` trims trailing zeros, so legacy keys still compare correctly). A move rewrites one row and never renumbers. Used by Todo Tasks and Lists and by AI Saved questions.\n\n## Search and text helpers\n\n- `search/query.rs`: `parse` turns user input into `Term::Word` (prefix match) and `Term::Phrase` (quoted), folded. `exact_match` / `expand_match` build an FTS5 `MATCH` string where every token is double-quoted, so no FTS syntax can be injected. `expand_match` adds whole-word \"near\" alternatives (typo or vocabulary suggestions) as `OR` groups.\n- `text.rs`: `fold_char` / `fold` lowercase and strip accents and combining marks, matching the search tokenizer's diacritic removal. Also used for List-name clash detection.\n\n## The Tool contract (`tool.rs`)\n\nA read-only capability a Module offers the AI (ADR 0002 amendment, ADR 0018). A `Tool` has a `Spec` (name `module_verb`, parameters with `Kind` of Text, Integer, Date, Flag or Choice) and `run(conn, args, calendar) -> Output`. `check` validates raw model arguments (unknown keys, missing required, wrong kinds produce sentences the model reads). `json_schema` generates the native tool-call schema with `additionalProperties: false`. `Output` carries body, summary, cited `Item`s and an error flag. Results are capped by `RESULT_CAP` (16 KB) via `fit_rows`; `cut` truncates on a char boundary. `count` and `number` convert between `i64` arguments and `usize` counts safely; `is_enabled` derives Module enablement from the two Preference lists. Consumers: [AI_Assistant_Backend](AI_Assistant_Backend.md) and the Todo/Journal tools in [Domain_Modules_(Todo_and_Journal)](Domain_Modules_(Todo_and_Journal).md).\n\n## Utilities (`util.rs`)\n\n`new_id` (UUIDv7, time-ordered), `now_ms`, and `compact_utc` (sortable `YYYYMMDDTHHMMSSmmm`, hand-rolled civil-date conversion to avoid a date-time dependency), used for backup names.\n\n## How it fits the system\n\n```mermaid\ngraph LR\n    Core[Core_Foundation]\n    Todo[Todo / Journal crates] --> Core\n    AI[AI crates] --> Core\n    Sync[Sync crate] --> Core\n    Host[src-tauri host] --> Core\n    Host -->|registers Modules, runs migrations| Core\n```\n\nThe Tauri host registers all Modules, runs `migrate::run` then each `on_startup`, and exposes Settings and backup commands (see [Tauri_Host_and_Command_Layer](Tauri_Host_and_Command_Layer.md)). Build configuration is covered in [Build,_Tooling_and_Packaging](Build,_Tooling_and_Packaging.md).\n", "Design_System_and_UI_Components/Markdown_Editor.md": "# Markdown_Editor\n\nThe Markdown editor is the writing surface behind the Journal's entries and Todo's task notes and comments. It lives in `src/lib/ui/markdown/` and has two halves:\n\n1. **A CodeMirror 6 editor** (`editor-core.ts`) that edits plain Markdown text in place. Syntax marks stay visible but faded, and the text is styled so that writing and reading look alike.\n2. **A set of pure text helpers**: `auto-pair`, `format`, `list-keys`, `slash`, `shortcuts`, `paste-html`, `edit` and `tasks`. Each takes a document string and a selection and returns an `Edit`. They have no CodeMirror dependency, so they are unit-tested directly.\n\nA third piece, the read-side parser (`ast.ts`, `inline.ts`), turns Markdown into a safe, data-only tree for display.\n\nThe files this page covers directly are listed under *Component reference*. Helpers that appear here only as imports (`ast.ts`, `edit.ts`, `tasks.ts`, `theme.ts`, `format.ts`, `list-keys.ts`, `slash.ts`, `shortcuts.ts`, `auto-pair.ts`) are described from how they are used and tested. Their source was not part of the inputs for this page.\n\nSibling modules: [UI_Widgets_and_Interaction](UI_Widgets_and_Interaction.md) and [UI_When_Picker](UI_When_Picker.md). For consumers, see [Journal_Frontend](../Journal_Frontend.md) and [Todo_Frontend](../Todo_Frontend.md). The app-wide UI rules are in `docs/design/ui-system.md`.\n\n## Architecture\n\n```mermaid\ngraph TD\n    Host[\"MarkdownEditor (Svelte component)\"] -->|dynamic import| Core[\"editor-core.ts<br/>createEditor\"]\n    Core --> Syntax[\"syntax.ts<br/>markdownExtensions\"]\n    Core --> Deco[\"decorations.ts<br/>markdownDecorations\"]\n    Core --> Check[\"checklist.ts<br/>checklistBoxes (optional)\"]\n    Core --> Theme[\"theme.ts<br/>editorTheme\"]\n    Core --> Pair[\"auto-pair.ts\"]\n    Core --> Fmt[\"format.ts\"]\n    Core --> LK[\"list-keys.ts\"]\n    Core --> Slash[\"slash.ts\"]\n    Core --> SC[\"shortcuts.ts\"]\n    Core --> Paste[\"paste-html.ts\"]\n    Pair --> Edit[\"edit.ts<br/>Edit / applyEdit\"]\n    Fmt --> Edit\n    LK --> Edit\n    Slash --> Edit\n    Check --> Tasks[\"tasks.ts<br/>toggleTaskLine\"]\n    Syntax -.same tree.-> AST[\"ast.ts<br/>parseMarkdown\"]\n    AST --> Inline[\"inline.ts<br/>parseInlineMarkdown\"]\n```\n\n**Lazy loading.** `editor-core.ts` states that it and all CodeMirror imports are loaded only through a dynamic import, so the editor stays out of the main bundle. The `MarkdownEditor` Svelte component is the host. It owns the toolbar and the slash-menu popup, and it supplies the callbacks in `EditorOptions`.\n\n**Separation of logic and wiring.** Behaviour is in plain functions of the form `(doc, from, to, …) → Edit | null`. `editor-core.ts` only dispatches those edits as CodeMirror transactions. A `null` result means \"do nothing special\", and the default CodeMirror behaviour then runs.\n\n## Core components\n\n### `createEditor(opts): EditorController` (`editor-core.ts`)\n\nBuilds an `EditorView` with this extension stack:\n\n| Extension | Role |\n|---|---|\n| `history()` + `historyKeymap`, `standardKeymap` | undo/redo and base keys |\n| `markdown({ extensions: markdownExtensions, addKeymap: false, completeHTMLTags: false })` | Lezer Markdown parsing with the Journal dialect |\n| `markdownDecorations` | faded marks and styled lines/spans |\n| `checklistBoxes` (only if `opts.checklist`) | clickable checkbox widgets |\n| `EditorView.lineWrapping`, `contentAttributes` | wrapping and `aria-label`, `spellcheck`, `autocapitalize`, and `data-bare` |\n| `placeholder`, `editorTheme` | placeholder text and styling |\n| `Prec.highest(keys)` | custom keymap, which overrides the defaults |\n| `domEvents`, `input` | shortcuts, paste, ⌘-click links, focus/blur, typed-character auto-pairing |\n| `updateListener` | change reporting and slash tracking |\n\n`EditorOptions` is a callback contract: `onchange`, `onfinish` (⌘/Ctrl+Enter), `onescape`, `onfocuschange`, `onslash`, `slashValues` and `onopenlink`. `bare` hides the editor's own focus ring when the container draws it. `checklist` switches between box widgets (Todo notes) and faded `- [ ]` text (Journal).\n\n`EditorController` exposes `setDoc`, `getDoc`, `focus`, `blur`, `run(command)`, `pickSlash`, `setSpellcheck`, `setPopup` (ARIA `aria-controls` / `aria-activedescendant` for the slash listbox) and `destroy`.\n\n**Host vs. editor changes.** `setDoc` dispatches with an `external` annotation. The update listener skips `onchange` when every transaction carries it. This stops the `value` prop from echoing back to the host.\n\n### Key handling\n\n```mermaid\nflowchart TD\n    K[Key pressed] --> Esc{Escape}\n    Esc -->|slash open| CloseSlash[close menu]\n    Esc -->|else| OnEsc[opts.onescape]\n    K --> Mod[Mod-Enter -> onfinish]\n    K --> Arrows{ArrowUp/Down}\n    Arrows -->|slash open| Move[move active item]\n    Arrows -->|else| Default\n    K --> Enter{Enter}\n    Enter -->|slash open| Choose[chooseSlash]\n    Enter -->|collapsed caret| LE[listEnter]\n    LE -->|null| NL[insertNewline]\n    K --> Tab{Tab / Shift-Tab}\n    Tab -->|slash open| Choose\n    Tab --> LI[listIndent; null lets focus move]\n    K --> BS[Backspace: pairBackspace, else markerBackspace]\n```\n\n- **Backspace** first tries `pairBackspace` (deletes an empty `()`, `[]`, ` `` `, `****` pair), then `markerBackspace` (removes a list, quote or heading marker when the caret sits right after it).\n- **Tab** returns `false` when `listIndent` gives `null`, so focus moves normally away from non-list text.\n- **Formatting shortcuts** go through `resolveEditorShortcut(event, mac)`. It uses physical key codes (`KeyB`, `Digit8`). It never mixes Meta and Ctrl, and it leaves shell shortcuts such as ⌘1 or ⌘N alone. ⌘K with no selection returns `false`, so the app palette opens.\n- **⌘⇧V (Ctrl+Shift+V off macOS)** sets a `plainPaste` flag for 500 ms. The next paste then skips HTML conversion.\n\n### Slash menu\n\n`trackSlash` runs after each document or selection change:\n\n1. If the menu is closed and a single typed `/` was inserted (`input.type`) where `canOpenSlash` allows it, the menu opens at that position. `canOpenSlash` allows the start of the text, the start of a line, or after whitespace. It does not allow `and/or` or `https://`.\n2. If the menu is open, its anchor position is mapped through the changes. `slashQuery` returns the text typed after the slash, or `null` (for example after a space) to close it. A changed query resets the active index to 0.\n3. `emitSlash` computes `filterSlash(query)` and the caret's viewport rectangle, then calls `opts.onslash`. If there are no matches, the menu closes.\n\n`applySlash` turns the chosen item into an `Edit`. A block item at the start of a line takes the line. Mid-line it starts a new line. A marker-only line (`- /h1`) is replaced, not nested. The divider and code block place the caret sensibly. Date and time items insert text from `slashValues()`. Items are listed in the order `h1 h2 h3 bullet numbered task quote divider code date time`. Filtering matches word prefixes of labels and keywords, ignoring case.\n\n### Auto-pairing (`auto-pair.ts`, tested in `auto-pair.test.ts`)\n\nCalled from `EditorView.inputHandler`, and skipped during IME composition or for multi-character input.\n\n- `(`, `[` and `` ` `` close with the caret between the pair. They do not close in front of a word, and a backtick does not close after a word.\n- A second `*` turns `*|*` into `**|**`. A single `*` stays plain.\n- Three backticks stay three, so a code fence can be typed.\n- Quotes, `_` and `{` never pair.\n- With a selection, `(`, `[`, `` ` `` and `*` wrap it and keep it selected. Typing `*` twice makes the text bold. Other characters replace the selection as usual.\n- Typing `)`, `]`, a closing backtick or closing `**` steps over an existing closer. A `*` that would open a new span is not swallowed.\n\n### Formatting (`format.ts`, tested in `format.test.ts`)\n\n- `toggleInline(doc, from, to, mark)` handles `**`, `*`, `` ` ``, `~~` and `==`. It wraps and keeps the words selected, unwraps when the marks sit just outside the selection, keeps marks tight around words, and ignores whitespace-only selections. Italic and bold stack to `***x***` and can be removed independently.\n- `toggleBlock(doc, from, to, kind)` handles `h1`–`h3`, `bullet`, `numbered`, `task` and `quote`. It replaces another block prefix, toggles off when every line already has the prefix, numbers lines while skipping blank ones, and keeps list indent but not for headings. A selection ending at a line start leaves that line alone. The caret lands after the marker on empty lines.\n- `blockKind(line)` names a line's prefix. Headings beyond level 3 are `null`.\n- `makeLink` needs a non-blank selection. It selects the `url` placeholder, or, when the selection looks like a URL, it makes `[](url)` with the caret in the label. `linkTemplate` inserts `[text](url)` and is used from the toolbar when nothing is selected.\n\n### List keys (`list-keys.ts`, tested in `list-keys.test.ts`)\n\n- `listEnter` continues bullets with the same marker character and indent, counts up numbered items (`9)` → `10)`), and continues checklists with a fresh `[ ]` even after a ticked item. It moves text after the caret into the new item. An empty item ends the list, and an empty nested item lifts one level first. On other lines, or with the caret inside the marker, it returns `null`.\n- `listIndent` nests by the marker width and lifts with Shift+Tab, never past the margin. It affects only list lines in the selection and returns `null` away from lists.\n- `markerBackspace` is described under *Key handling*.\n\n### Syntax and decorations\n\n**`syntax.ts`** defines the shared dialect: `Strikethrough`, `TaskList`, `Autolink` and a custom `Highlight` (`==text==`). The `Highlight` extension is written like `Strikethrough` and rejects `===` and spaced `==`. Tables are deliberately not enabled. `markdownParser` is the same configuration for non-editor use, so the editor and the read view see the same tree.\n\n**`decorations.ts`** exports the `markdownDecorations` `StateField`. `build(state)` walks the syntax tree and produces a `DecorationSet`:\n\n- Marks (`EmphasisMark`, `HeaderMark`, `QuoteMark`, `ListMark`, `TaskMarker`, `LinkMark`, `CodeMark`, …) get `cm-md-mark`, which stays visible but faded.\n- Spans get styling classes: `cm-md-strong`, `cm-md-em`, `cm-md-del`, `md-mark` and `md-code`. Link labels and bare URLs get `md-link`. The address inside `[a](url)` is faded.\n- Lines get classes. Headings 1–3 get `md-hd md-hN`, blockquote lines get `md-q cm-md-quote`, and fenced code gets `cm-md-code` with `-first` and `-last` markers.\n- Read-view rhythm: `cm-md-gap` goes on the last line of a block that is directly followed by another block. `cm-md-blank` goes on blank lines between blocks, but not inside fences and not trailing ones.\n\nSeveral classes (`md-hd`, `md-q`, `md-code`, `md-link`, `md-mark`) are shared with the read view. The state field rebuilds only when the document or the syntax tree changes. `ensureSyntaxTree(state, length, 100)` waits up to 100 ms and falls back to the current partial tree.\n\n**`checklist.ts`** exports `checklistBoxes`, a second `StateField`. For each `TaskMarker` whose `ListMark` precedes it, `build` replaces the range from the list mark to the end of the marker with a `BoxWidget`.\n\n- `BoxWidget.toDOM` creates a `span.md-cb.cm-md-cb` with `role=\"checkbox\"` and `aria-checked`, and an inline tick SVG when checked.\n- `BoxWidget.eq` compares the checked state, so unchanged boxes are not re-rendered.\n- `BoxWidget.ignoreEvent` returns `true`, so CodeMirror leaves widget events to the widget.\n- `mousedown` calls `preventDefault()`, so the editor keeps focus and its caret. It then calls `toggleAt`, which uses `toggleTaskLine` from `tasks.ts` to change one line with `userEvent: 'input.tick'`. The click is therefore an ordinary undoable edit.\n- The field also provides `atomicRanges`, so the cursor and Backspace treat the box as one piece.\n\n### Rich paste (`paste-html.ts`)\n\n`isRichHtml(html)` is true only when the clipboard has semantic tags (`a`, `strong`, `b`, `em`, `code`, `pre`, `h1`–`h6`, lists, `blockquote`, `hr`, …). Plain wrappers like `span` and `div` paste as plain text. `htmlToMarkdown` then runs a small tolerant tokenizer. It has no DOM and no dependencies, and it never renders the HTML.\n\n- It skips `script`, `style`, `head`, `svg` and similar elements, and decodes a small set of entities.\n- It handles Google Docs' `<b style=\"font-weight:normal\">` wrapper. Inline styles for bold, italic and line-through are honoured.\n- It wraps marks tightly, keeping surrounding spaces outside them.\n- Headings are capped at level 3. It converts lists (with nesting and `start`), quotes, `pre` blocks to fences, and `hr` to `---`.\n- Links with unsafe schemes lose their href and keep the text. Only `http(s)`, `mailto` and `tel` are linked, and `)` in a href is escaped as `%29`.\n- Images are dropped, and checkbox inputs become `[x]` or `[ ]`.\n\n`inlineNode` is the per-node inline converter that the exported function uses.\n\n### Read-side parsing (`ast.ts`, `inline.ts`)\n\n`parseMarkdown(src): Block[]` returns data only, with block nodes `p`, `h` (1–3), `quote`, `list`, `code` and `hr`, and inline nodes `text`, `strong`, `em`, `del`, `mark`, `code` and `link`. The tests in `ast.test.ts` fix its behaviour:\n\n- Single newlines stay inside one paragraph.\n- Headings deeper than 3, tables, raw HTML and images stay as plain text.\n- Spaced `==` is not a highlight.\n- Links allow markdown, bare and angle forms, and unsafe schemes such as `javascript:` stay text.\n- Lists carry `ordered`, `start` and, for checklist items, `task: { checked, line }`. The line number lets the view toggle the right source line.\n- Nested list items keep their own list.\n- No `html` field exists in the output, so there is nothing to inject.\n\n`parseInlineMarkdown(src)` (`inline.ts`) is the single-line variant for Task titles and comments. `escapeLine` puts a backslash before anything that would start a block (`#`, `>`, `-`, `1.`, fences, `<`, rules, link references), so only inline syntax is read. It is applied to every line. Strikethrough and highlight are put back as plain text (`plainDeletions`), and neighbouring text nodes are merged. If the result still contains non-paragraph blocks, the whole source is returned as one text node.\n\n## Data flow\n\n```mermaid\nsequenceDiagram\n    participant U as User\n    participant CM as CodeMirror view\n    participant H as Pure helper\n    participant Host as MarkdownEditor (host)\n    U->>CM: key / typed char / paste\n    CM->>H: (doc, from, to, input)\n    H-->>CM: Edit {changes, selection?} or null\n    CM->>CM: dispatch(userEvent, scrollIntoView)\n    CM->>Host: updateListener -> onchange(text)\n    CM->>Host: trackSlash -> onslash(state)\n    Host->>CM: setDoc(text) [external annotation, no echo]\n```\n\n`apply()` converts an `Edit` to a transaction. The edit's selection is already in post-change coordinates, which `EditorSelection.single` expects. Each transaction carries a `userEvent` label (`input.format`, `input.slash`, `input.type`, `delete.backward`, `input.paste`, `input.tick`) that the slash tracker and history can use.\n\n## Safety and accessibility notes\n\n- Links open only when ⌘-click (Ctrl off macOS) lands on a `Link`, `Autolink` or `URL` node whose address matches `^(https?:|mailto:|tel:)`. `opts.onopenlink` receives the href, and the host decides how to open it.\n- Neither the read-side parser nor the paste converter ever produces HTML.\n- The editor sets an `aria-label` and `aria-controls`/`aria-activedescendant` while the slash menu is open.\n- Web fonts change line metrics, so the editor calls `requestMeasure()` once `document.fonts.ready` resolves.\n\n## Testing\n\nAll tests are Vitest unit tests that sit beside their sources and need no browser. The pure helpers are tested as `(doc, selection) → doc`, with the `applyEdit` helper from `edit.ts` applying the result. `decorations.test.ts` builds a real `EditorState` with the markdown language and reads the decoration set back to assert classes per line and per span.\n\n| Test file | Covers |\n|---|---|\n| `ast.test.ts` | block and inline parsing, link safety, no-HTML guarantee |\n| `inline.test.ts` | single-line parsing and block-syntax escaping |\n| `auto-pair.test.ts` | pairing, wrapping, step-over, pair-Backspace |\n| `format.test.ts` | inline/block toggles, `blockKind`, links, caret placement |\n| `list-keys.test.ts` | Enter, indent and marker-Backspace |\n| `slash.test.ts` | menu opening, query, filtering, applying items |\n| `shortcuts.test.ts` | mapping of key events to commands, plain-paste shortcut |\n| `decorations.test.ts` | fade, span, line and rhythm classes |\n\n## Component reference\n\n| Component | File | Purpose |\n|---|---|---|\n| `createEditor` | `editor-core.ts` | builds the CodeMirror editor and its controller |\n| `build` | `decorations.ts` | computes Markdown decorations |\n| `build`, `BoxWidget.eq`, `BoxWidget.ignoreEvent`, `BoxWidget.toDOM` | `checklist.ts` | checklist box widgets |\n| `parse` | `syntax.ts` | Journal Markdown dialect (`markdownExtensions`, `markdownParser`) |\n| `escapeLine` | `inline.ts` | neutralises block syntax for single-line text |\n| `inlineNode` | `paste-html.ts` | per-node HTML-to-Markdown conversion |\n| `para`, `text`, `type`, `block`, `inline`, `enter`, `key`, `pick`, `decorate` | `*.test.ts` | test helpers |\n", "Design_System_and_UI_Components/UI_When_Picker.md": "# UI_When_Picker\n\nThe When picker is the date-and-repeat chooser used to set a Task's Due date and repeat rule. This module holds its pure logic, with no DOM and no Svelte. There are two files:\n\n- `src/lib/ui/when-grid.ts` is the calendar model: a rolling five-week grid, the quick days, and date labels.\n- `src/lib/ui/when-repeat.ts` is the repeat-rule engine: validation, stepping, previews, presets and labels.\n\nBecause both files are pure, they are unit-tested directly. `when-repeat.test.ts` also runs the shared recurrence fixtures.\n\nThe widgets that render the picker belong to [UI_Widgets_and_Interaction](UI_Widgets_and_Interaction.md). The generic calendar helpers in `./calendar` (`addDays`, `parseYmd`, `formatYmd`, `weekdayLabels`, `WeekStart`) are documented there too. The rule type `RepeatRule` comes from the generated IPC bindings, covered in [IPC_Bridge_and_Core_Mocks](../IPC_Bridge_and_Browser_Mocks/IPC_Bridge_and_Core_Mocks.md).\n\n## Architecture\n\n```mermaid\ngraph TD\n  Calendar[\"calendar.ts<br/>addDays, parseYmd, formatYmd, weekdayLabels\"]\n  Grid[\"when-grid.ts<br/>buildGrid, pageForDate, quickDays, dayText\"]\n  Repeat[\"when-repeat.ts<br/>stepDate, preview, datesBetween, presets\"]\n  Bindings[\"ipc/bindings.ts<br/>RepeatRule\"]\n  Fixtures[\"ipc/fixtures/recurrence-rules.json\"]\n  Rust[\"crates/todo recurrence.rs<br/>(Rust engine)\"]\n  Test[\"when-repeat.test.ts\"]\n  Picker[\"When picker UI / Todo module / browser mock\"]\n\n  Grid --> Calendar\n  Repeat --> Calendar\n  Repeat --> Grid\n  Repeat --> Bindings\n  Test --> Repeat\n  Test --> Fixtures\n  Rust -. same fixtures .-> Fixtures\n  Picker --> Grid\n  Picker --> Repeat\n```\n\n`when-repeat.ts` imports `weekdayOf` and `monthShort` from `when-grid.ts`, so the dependency runs one way. A date is always a zoneless `YYYY-MM-DD` string. Comparison is lexicographic, and arithmetic goes through UTC `Date` objects to avoid DST problems.\n\n## when-grid.ts: the calendar model\n\n### Rolling grid\n\n`buildGrid(today, weekStart, page)` returns a `GridModel`:\n\n| Field | Meaning |\n|---|---|\n| `weekdays` | Seven single-letter headings, in the order set by the Week start Preference |\n| `cells` | 35 `GridCell`s (`GRID_WEEKS = 5`), each with `date`, `day`, `past`, `today` and `monthLabel` |\n| `start` / `end` | First and last day shown |\n| `heading` | \"October 2026\", \"Oct – Nov 2026\" or \"Dec 2026 – Jan 2027\" |\n| `canGoBack` | False on page 0, because nothing before this week is shown |\n\n- **Page 0** starts at the first day of the current week, so the grid is a rolling window, not a month view. Each ‹ › press moves 35 days. Negative or fractional pages are clamped to `max(0, floor(page))`.\n- **Past days** are flagged `past` and are not pickable.\n- **Month changes** are shown by `monthLabel`, which is set only on the 1st of a month.\n- `pageForDate(date, today, weekStart)` returns the page that contains a date. Today and anything earlier map to page 0.\n\n### Quick days\n\n`quickDays` returns four `QuickDay`s, each with a weekday `hint` such as \"Wed\":\n\n- `today`\n- `tomorrow`\n- `weekend`: today if it is Saturday or Sunday, otherwise the coming Saturday.\n- `next_week`: the first day of next week, which depends on the Week start Preference.\n\n### Helpers\n\n`daysBetween`, `weekdayOf` (0 is Sunday), `weekdayShort`, `monthShort` and `weekStartOf` are exported. `dayText(date, today)` gives \"Fri 23 Oct\", and adds the year when it differs from today's year. It is used in chips and sentences.\n\n## when-repeat.ts: the repeat engine\n\nThis file is a TypeScript copy of the Rust engine in `crates/todo/src/recurrence.rs`. It exists for the picker and the browser mock. Both implementations are kept in step by the shared `recurrence-rules.json` fixtures. See [Todo_Tasks_and_Lists](../Domain_Modules_(Todo_and_Journal)/Todo_Tasks_and_Lists.md) for the backend side, and [IPC_Todo_Mocks](../IPC_Bridge_and_Browser_Mocks/IPC_Todo_Mocks.md) for the mock that relies on this copy.\n\n### Rule shape\n\nA `RepeatRule` is `{ freq: 'day'|'week'|'month'|'year', every, days, mode }`.\n\n- `every` runs from 1 to 99 (`MAX_EVERY`).\n- `mode` is `fixed`, which counts from the Due date, or `after`, which counts from the day the task is done.\n- `days` is a weekday bitmask for week rules, with Sunday as bit 0 (`WEEKDAYS_MASK` is Monday to Friday). For month and year rules it is the day of the month.\n\n### Validation and normalisation\n\n- `ruleProblem(rule)` returns the same wording Rust uses, or `null`. Weekdays combined with `after` mode are rejected.\n- `settleRule` keeps `days` only where it means something: week rules, and fixed month or year rules.\n- `anchoredOn(rule, due)` pins a fixed month or year rule to the day of the month of its Due date.\n- `afterAllowed(rule)` is false when specific weekdays are chosen. The UI uses it to hide \"from the day it's done\".\n\n### Date computation\n\n```mermaid\nflowchart LR\n  R[rule + date] --> S[stepDate]\n  S -->|day| D[+every days]\n  S -->|week, no days| W[+7*every]\n  S -->|week, with days| WD[next chosen weekday in this Mon-Sun week, else week every weeks on]\n  S -->|month/year| M[add months/years, clamp to month end]\n  S --> N{\"> year 9999?\"}\n  N -->|yes| Null[null]\n  S --> P[preview: next 3 dates]\n  S --> B[datesBetween: rings on calendar]\n  S --> X[nextDue: after done or skip missed]\n```\n\n- `stepDate` returns the date one step after `date`, strictly later, or `null` past year 9999. Month-end overflow is clamped, so a rule on the 31st lands on the 28th, 29th or 30th in shorter months. Weeks run Monday to Sunday here, which only matters for \"every N weeks\" with chosen weekdays.\n- `firstMatch(rule, today)` returns the first day on or after today that the rule lands on. Only weekday rules move it later.\n- `nextDue(rule, due, today)` returns where a completed task goes. In `after` mode it steps from today. In `fixed` mode it steps from the Due date and skips any dates that are already past.\n- `preview(rule, from, count = 3)` feeds the picker's \"Next:\" line.\n- `datesBetween(rule, from, start, to)` feeds the rings on the calendar. It is capped at 4000 iterations.\n\n### Labels and presets\n\n- `repeatLabel` gives short text such as \"Every 3 days after done\", \"Every weekday\" or \"Every 2 weeks on Mon, Thu\".\n- `ordinal(n)` gives \"1st\", \"2nd\", \"11th\" and so on.\n- `repeatPresets(date)` returns eight presets worded for the date: every day, every 2/3/4 days, every weekday, \"Weekly on Wednesday\", \"Monthly on the 21st\", and \"Yearly on 21 Oct\".\n- `presetKey(rule)` identifies which preset a rule is, ignoring `mode`, or returns `null` for a custom rule. `repeatPresets` and `presetKey` round-trip, and a test enforces that.\n\n## Testing\n\n`src/lib/ui/when-repeat.test.ts` has two parts:\n\n1. **Shared fixtures.** Each case in `recurrence-rules.json` has an `op`: `first_match`, `next_due`, `preview` or `invalid`. Cases are converted to the wire shape with `wire()`: weekdays become a bitmask and `anchor` becomes the day of month. The same file runs against the Rust engine, which is how the two engines are kept honest.\n2. **Unit tests** cover settling, anchoring, the year-9999 limit, `afterAllowed`, mask ordering, `datesBetween` windows, labels, ordinals, and preset wording and recognition.\n\n## Usage in the system\n\nThe picker UI and the Todo frontend ([Todo_Views_Navigation_and_Interaction](../Todo_Frontend/Todo_Views_Navigation_and_Interaction.md), [Todo_Quick_Capture_and_Editing](../Todo_Frontend/Todo_Quick_Capture_and_Editing.md)) call these functions to render the grid, the quick choices, repeat chips and previews. Authoritative validation and scheduling happen in Rust. The TypeScript copy only mirrors them so the UI and the browser mock behave the same without a round trip.\n", "Design_System_and_UI_Components/UI_Widgets_and_Interaction.md": "# UI Widgets and Interaction\n\n`UI_Widgets_and_Interaction` is the set of small, framework-light helpers under `src/lib/ui/` that sit behind Mnemora's Svelte UI Components (Calendar, DatePicker, CodeInput, Tooltip, Sheet, CommandPalette, ResizablePanes, PageHeader, virtual lists, AutoTextarea). Almost all of it is **pure logic**: date maths, digit-box editing rules, scroll maths, hit-testing of words. The Svelte Components stay thin and call these functions, so the behaviour can be unit-tested with Vitest without a DOM.\n\nTwo files hold module-level state: `pointer-held.ts`, `tooltip-gate.ts` and `tab-handoff.ts` keep small singletons, and `page-header.svelte.ts` holds a Svelte 5 rune store.\n\nRelated pages: [Design_System_and_UI_Components](../Design_System_and_UI_Components.md), [UI_When_Picker](UI_When_Picker.md), [Markdown_Editor](Markdown_Editor.md). Gesture helpers imported from `../swipe` are documented in [App_Bootstrap_and_Platform_Utilities](../Frontend_Platform_and_Shell/App_Bootstrap_and_Platform_Utilities.md); the router/shell that consumes `PageHeaderState` is in [Shell_and_Navigation](../Frontend_Platform_and_Shell/Shell_and_Navigation.md).\n\n## Architecture\n\n```mermaid\ngraph TD\n  subgraph Components[Svelte Components in src/lib/ui]\n    Cal[Calendar / DatePicker]\n    Code[CodeInput]\n    Tip[Tooltip]\n    Sheet[Sheet]\n    Pal[CommandPalette]\n    Panes[ResizablePanes]\n    Tabs[Tabs]\n    PH[PageHeader]\n    VL[Virtual list]\n    Auto[AutoTextarea]\n    Emo[EmojiPicker]\n    Hi[Marked / highlighted text]\n  end\n  Cal --> calendar[calendar.ts]\n  Code --> codeinput[code-input.ts]\n  Tip --> tg[tooltip-gate.ts]\n  Sheet --> ss[sheet-swipe.ts] --> swipe[../swipe]\n  Pal --> pf[palette-filter]\n  Panes --> pm[pane-math.ts]\n  Tabs --> th[tab-handoff.ts]\n  PH --> phs[page-header.svelte.ts]\n  VL --> pr[pinned-row.ts]\n  VL --> sa[scroll-anchor.ts]\n  Auto --> ate[auto-textarea-enter.ts]\n  Emo --> emoji[emoji.ts]\n  Hi --> mw[mark-words.ts]\n  Menu[Long-press menus] --> ph[pointer-held.ts]\n```\n\n## Components\n\n### Calendar maths — `calendar.ts`\nDates are zone-less `YYYY-MM-DD` strings; all arithmetic goes through UTC `Date`s so DST never shifts a day.\n- `monthGrid(month, weekStart)` returns exactly 42 `GridDay`s (six weeks) so the Calendar never changes height; `inMonth` flags neighbouring-month days.\n- `moveFocus(date, key, weekStart)` implements the ARIA grid keys (arrows ±1/±7 days, Home/End to week edges, PageUp/PageDown by month with the day clamped to the month's last day). It returns `null` for other keys.\n- `pickRange(range, date)` is the range state machine: first pick sets `from`; second completes (an earlier day swaps ends; the same day gives a one-day range); a third pick starts over. `inRange` is inclusive and treats a half-chosen range as `from` only.\n- Helpers: `addDays`, `shiftMonth`, `shiftMonthKeepingDay`, `weekdayLabels`, `formatYmd`, `parseYmd`.\n\nThe task-specific \"When\" grid built on top of this lives in [UI_When_Picker](UI_When_Picker.md).\n\n### Pairing code entry — `code-input.ts`\nPure rules for CodeInput, one box per digit, `CODE_LENGTH = 8` (the sync pairing code; see [Sync_Devices_and_Pairing](../Sync_Frontend/Sync_Devices_and_Pairing.md)).\n- `typeInto` — digits land from the box index (never after a gap) and focus moves past them; non-digits are dropped.\n- `backspaceAt` — clears the box, or the previous one if empty.\n- `pasteInto` — fills from the first box; `null` when the paste has no digits.\n- `newlyTyped` — resolves the browser appending/prepending a character into an already filled box.\n- `boxes` — the per-box display strings.\nEach edit returns a `CodeEdit { value, focus }`.\n\n### Words in text — `mark-words.ts`\n- `markPieces(texts, marks)` cuts marked words (e.g. the recognised date/repeat/`#List` words of a task title) out of several text nodes. Only the **last whole-word, case-insensitive** occurrence is marked; overlapping marks are dropped; joining pieces reproduces the text. Used by the quick-capture UI ([Todo_Quick_Capture_and_Editing](../Todo_Frontend/Todo_Quick_Capture_and_Editing.md)) and conflict views.\n- `litPieces(text, lit)` tints whole words whose accent-folded, lower-cased form (`foldWord`) is in a set of search-matched words; used by search results ([Journal_Search](../Journal_Frontend/Journal_Search.md), [Todo_Views_Navigation_and_Interaction](../Todo_Frontend/Todo_Views_Navigation_and_Interaction.md)).\n\n### Emoji — `emoji.ts`\n`CURATED_EMOJI` (48 area-of-life emoji, eight per row) and `firstEmoji(text)`, which uses `Intl.Segmenter` (falling back to code points) to extract the first whole grapheme (skin tones, ZWJ sequences, flags) matching `Extended_Pictographic`/`Regional_Indicator`. Used for list emoji.\n\n### Text input — `auto-textarea-enter.ts`\n`enterBreaksLine({shiftKey, multiline, enterBreaks})`: Enter inserts a line break if `enterBreaks` is set (AI composer on a phone, where a round button sends) or if the field is `multiline` and Shift is held.\n\n### Layout and scrolling\n- `pane-math.ts`: ResizablePanes works in px but paneforge in percent. `paneLimits` converts px bounds to percent; `draggedWidth` returns the user's dragged width, or `null` when the reported size is within `ECHO_TOLERANCE_PX` (1.5 px) of the width we asked for (our own echo). Used with [Shell sidebar layout](../Frontend_Platform_and_Shell/Shell_and_Navigation.md).\n- `pinned-row.ts`: `pinnedRow(rows, scrollTop, isSticky, height)` chooses which sticky row (e.g. a Journal Page header) is pinned and the negative `offset` by which the next sticky row pushes it up.\n- `scroll-anchor.ts`: `anchoredScrollTop(anchor, keys, startOf)` keeps the row being read in place when rows are added above it; `null` when the row is gone or did not move.\n- `page-header.svelte.ts`: `PageHeaderState` (singleton `pageHeader`) holds the current header entry (`title`, `icon`, `hue`, `actions`, `heading`), the pinned `phoneBar` snippet and the build `env`. `set(entry)` and `setPhoneBar(bar)` return release functions that only clear if the caller is still the owner, so a newer page is never wiped by an older page's teardown.\n\n### Touch and pointer behaviour\n- `sheet-swipe.ts`: `sheetSwipe(panel, onclose, reduceMotion)` attaches touch listeners so a bottom sheet follows the finger (transform only) and closes on a long pull or flick via `sheetShouldClose`. A pull starts in the top 32 px grip, or anywhere when scrolled to top and not on inputs/`.cm-editor`/`[data-no-sheet-swipe]`. Touch (not pointer) events are used so `preventDefault` can stop page scroll. Returns a cleanup.\n- `pointer-held.ts`: global capture-phase counter of pressed pointers. `afterRelease(fn, beatMs=120)` runs `fn` after all pointers lift (so a long-press-opened menu ignores the still-resting finger); returns a cancel.\n- `tooltip-gate.ts`: `trackPointerType` records the last input kind. `tooltipAllowedNow` blocks tooltips after touch/pen; `focusOpenAllowedFor(trigger)` allows focus-opened tooltips only for `:focus-visible` after a key press; `shownShortcut` hides shortcut hints on phones.\n- `tab-handoff.ts`: when each tab is a route, Tabs remounts and loses focus. `noteTabChange` increments a pending counter (valid for `HANDOFF_MS` = 1500 ms); each new mount calls `claimTabFocus` once to take focus. Counting supports fast arrow-key presses that outrun routing.\n\n### Command palette filtering\n`palette-filter.test.ts` specifies `visibleItems(items, typed)`: with empty input show plain items and no query items; otherwise keep plain items whose label contains every typed word (any case) and append `queryLabel(q)` items using the trimmed text.\n\n## Data flow example: tooltip decision\n\n```mermaid\nsequenceDiagram\n  participant U as User\n  participant W as window listeners\n  participant T as Tooltip\n  U->>W: pointerdown / keydown (capture)\n  W->>W: lastPointerType / lastInputWasKeyboard\n  U->>T: hover or focus trigger\n  T->>W: tooltipAllowedNow() / focusOpenAllowedFor(trigger)\n  W-->>T: allow or suppress\n```\n\n## Testing\nCo-located Vitest files (`mark-words.test.ts`, `pinned-row.test.ts`, `palette-filter.test.ts`) exercise the pure functions directly, e.g. \"joining pieces gives the text back\" and \"the next Page header pushes the pinned one up\". Design rules (tokens, `bits-ui` only imported inside `src/lib/ui`) are in `docs/design/ui-system.md`.\n", "Design_System_and_UI_Components.md": "# Design_System_and_UI_Components\n\n## Purpose\n\nThis module is the shared UI layer of Mnemora. It lives in `src/lib/ui/` and holds the Svelte Components and the logic behind them. The Journal, Todo, AI and Sync frontends all build on it. Feature code uses these Components and tokens and never imports `bits-ui` directly. The rules are in `docs/design/ui-system.md`.\n\nThe module follows one design principle. Behaviour lives in pure, DOM-free TypeScript functions, and the Svelte Components stay thin wrappers around them. This lets Vitest unit-test the behaviour without a browser. It has three parts:\n\n- **Interaction widgets and helpers.** Calendar maths, pairing-code entry, tooltip and long-press gating, sheet swipe, pane sizing, sticky rows, scroll anchoring, word highlighting, emoji and the page-header store.\n- **The When picker.** The Due-date grid and the repeat-rule engine for Tasks.\n- **The Markdown editor.** A lazily loaded CodeMirror 6 editor, pure text-edit helpers, and a safe read-side Markdown parser.\n\n## Architecture\n\n```mermaid\ngraph TD\n  Feature[\"Feature frontends<br/>Journal / Todo / AI / Sync / Shell\"]\n  subgraph UI[\"src/lib/ui\"]\n    Widgets[\"UI_Widgets_and_Interaction<br/>Calendar, CodeInput, Tooltip, Sheet,<br/>Panes, PageHeader, virtual lists\"]\n    When[\"UI_When_Picker<br/>when-grid.ts, when-repeat.ts\"]\n    MD[\"Markdown_Editor<br/>CodeMirror 6 + pure edit helpers + parser\"]\n  end\n  Feature --> Widgets\n  Feature --> When\n  Feature --> MD\n  When -->|uses calendar helpers| Widgets\n  Widgets --> Swipe[\"lib/swipe (gestures)\"]\n  When --> Bindings[\"IPC bindings: RepeatRule\"]\n  When -. same fixtures .-> Rust[\"crates/todo recurrence.rs\"]\n```\n\n```mermaid\ngraph LR\n  Svelte[\"Thin Svelte Component\"] --> Pure[\"Pure function<br/>(state, input) -> result / Edit\"]\n  Pure --> Test[\"Vitest unit tests (no DOM)\"]\n  Svelte --> Engine[\"Optional engine<br/>(CodeMirror view)\"]\n  Engine --> Pure\n```\n\nKey points:\n\n- **Dependencies run one way.** `when-repeat.ts` imports from `when-grid.ts`. Both build on `calendar.ts`.\n- **Dates are zone-less `YYYY-MM-DD` strings.** Arithmetic goes through UTC, so DST never shifts a day.\n- **The TypeScript recurrence engine mirrors the Rust one.** Both run the shared `recurrence-rules.json` fixtures. This keeps the picker and the browser mock consistent with the backend.\n- **The editor is loaded on demand.** The `MarkdownEditor` Svelte component dynamic-imports `editor-core.ts`, so CodeMirror stays out of the main bundle. Editing helpers return an `Edit`, or `null` to fall back to default behaviour. The editor only dispatches them as transactions.\n- **Output is never HTML.** The read-side parser and the paste converter produce data only, and unsafe link schemes stay as text.\n\n## Child modules\n\n| Module | Scope | Documentation |\n|---|---|---|\n| UI_Widgets_and_Interaction | Calendar and DatePicker maths, CodeInput rules, tooltip and pointer gating, sheet swipe, pane math, sticky rows, scroll anchor, mark-words, emoji, `PageHeaderState` | [UI_Widgets_and_Interaction](Design_System_and_UI_Components/UI_Widgets_and_Interaction.md) |\n| UI_When_Picker | Rolling five-week date grid, quick days, repeat-rule validation, stepping, previews, presets and labels | [UI_When_Picker](Design_System_and_UI_Components/UI_When_Picker.md) |\n| Markdown_Editor | `createEditor`, slash menu, auto-pairing, formatting, list keys, decorations, checklist boxes, rich paste, `parseMarkdown` and `parseInlineMarkdown` | [Markdown_Editor](Design_System_and_UI_Components/Markdown_Editor.md) |\n\n## Related modules\n\n- Consumers: Journal_Frontend, Todo_Frontend and Shell_and_Navigation.\n- The `RepeatRule` type and mocks come from IPC_Bridge_and_Core_Mocks and IPC_Todo_Mocks.\n- The backend recurrence engine is in Todo_Tasks_and_Lists.", "Domain_Modules_(Todo_and_Journal
