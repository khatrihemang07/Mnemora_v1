minimumReleaseAgeExclude:
  - '@codemirror/view@6.43.15'
  - '@lezer/markdown@1.8.1'
# One copy of each: CodeMirror breaks when two versions of view/state are loaded, and the
# release-age policy would otherwise resolve transitive ranges to the previous patch.
overrides:
  '@codemirror/view': 6.43.15
  '@lezer/markdown': 1.8.1
