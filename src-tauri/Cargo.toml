[package]
name = "mnemora-app"
description = "Mnemora desktop and mobile shell (thin: wiring only, logic lives in mnemora-core)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# `_lib` suffix avoids a Windows name clash between the lib and bin outputs.
name = "mnemora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Selects Environment::Sandbox (separate data, identifier and badge).
sandbox = []
# Compiles the Sandbox seed (`ai_seed`, run by `examples/seed_sandbox.rs`). Not part of the app.
seed = []

[build-dependencies]
tauri-build.workspace = true

[dependencies]
mnemora-core.workspace = true
mnemora-journal.workspace = true
mnemora-todo.workspace = true
mnemora-sync.workspace = true
mnemora-ai.workspace = true
mnemora-harness.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri = { workspace = true, features = ["wry", "compression", "common-controls-v6", "dynamic-acl", "x11"] }
tauri-plugin-opener.workspace = true
tauri-specta.workspace = true
tracing.workspace = true
whoami.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true

[dev-dependencies]
# `test` adds the mock runtime used by the command-layer test harness; tests only, never in a release build.
tauri = { workspace = true, features = ["test"] }
# The in-process fake Wrapper the AI command tests point a real adapter at.
mnemora-providers = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# Pairing tests run real loopback sockets on a Tokio runtime.
tokio = { workspace = true, features = ["macros", "rt", "time", "net"] }

[lints]
workspace = true
