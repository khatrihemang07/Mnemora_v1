<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Mnemora Sandbox</title>
  <!-- Sandbox variant of app-icon.svg (blue tile, orange band); macOS/Linux/iOS master: 824px tile on the 1024 grid (100px margin) per Apple's icon template. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3b5bdb"/>
      <stop offset="1" stop-color="#74c0fc"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  <rect x="100" y="780" width="824" height="144" fill="#e48e26" clip-path="url(#tile)"/>
  <!-- Spiral: semicircles growing by 7 units per half-turn, drawn on a 100-unit grid. -->
  <path transform="translate(142 142) scale(7.4)" fill="none" stroke="#2a1608" stroke-width="6.5" stroke-linecap="round"
        d="M46 53.5A11 11 0 0 0 68 53.5A18 18 0 0 0 32 53.5A25 25 0 0 0 82 53.5A32 32 0 0 0 18 53.5"/>
</svg>
